      ${P.rows.length?`<div class="tbl-wrap" style="margin-top:10px;max-height:220px"><table class="t"><thead><tr>${groups.length>1?'<th>EMIS</th>':''}${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
        ${P.rows.slice(0,8).map(r=>`<tr>${groups.length>1?`<td>${esc(r['EMIS Code'])}</td>`:''}${cols.map(c=>`<td class="small">${esc(c==='Class'?CLASS_LABEL(r.Class):c==='Male'?r.Boys:c==='Female'?r.Girls:r[c]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
        ${P.rows.length>8?`<div class="small muted">…and ${P.rows.length-8} more</div>`:''}`:''}
      ${school&&DECL[mod]&&P.rows.length?declHTML(mod,'im'):''}
      ${list&&P.rows.length?`<div class="checks" style="margin-top:10px"><label><input type="radio" name="imMode" value="replace" checked> Replace the current list with this file (recommended)</label><label><input type="radio" name="imMode" value="add"> Add to the current list</label></div>`:''}`;
    P.groups=groups.filter(e=>!unknown.some(u=>u.e===e)); $('#imGo').textContent='Import';
    $('#imGo').disabled=!P.rows.length||!P.groups.length;
  };
  $('#imGo').onclick=async()=>{
    const b=$('#imGo'); const replace=!list||($('[name=imMode]:checked')||{}).value!=='add'; let done=0, last=null, declared;
    $('#imErr').textContent='';
    if(school&&DECL[mod]){
      declared=readDecl('im'); if(!declared){ $('#imErr').textContent='Type your totals in the “Confirm your totals” boxes (use 0 if none).'; return; }
      const mine=replace?P.rows:(S.rec[mod]||[]).concat(P.rows), diff=declDiff(mod,declared,enteredOf(mod,mine));
      if(diff.length&&!P.forced){ P.forced=true; $('#imErr').innerHTML=`<div class="banner bad" style="margin-top:10px;color:var(--text)"><b>⚠ Your totals do not match the file</b><ul style="margin:6px 0 0 18px;padding:0">${diff.map(x=>`<li>${x}</li>`).join('')}</ul><div class="small">Fix the file and choose it again, or click <b>Import anyway</b> — the difference will show on your receipt.</div></div>`; b.textContent='Import anyway'; return; }
    }
    b.disabled=true;
    try{
      for(const e of P.groups){
        b.innerHTML=`<span class="spin"></span> Saving ${++done} of ${P.groups.length}…`;
        const rows=P.byEmis[e].map(r=>Object.assign({},r,{Year:S.year||CONFIG.YEAR}));
        const res=await api('recSaveMany',{module:mod, rows, replace, declared, period:mod==='Enrolment'?(S.enPeriod||curPeriod()):undefined});
        if(res&&res.receipt) last=res.receipt;
        else if(FORMS[mod]&&(school||P.groups.length===1)) last=await api('recSubmit',{module:mod, emis:e, declared});
      }
      await recLoad(mod,true); if(mod==='Enrolment'&&S.data) S.data.enrolment=(S.rec.Enrolment||[]).filter(r=>periodOf(r)===curPeriod());
      if(last) (S.receipts=S.receipts||[]).push(last);
      closeModal(); S.rerender&&await S.rerender();
      if(last) showReceipt(last); else toast(`${P.rows.length} row(s) imported for ${P.groups.length} school(s).`);
    }catch(e){ $('#imErr').textContent=e.message; b.disabled=false; b.textContent='Import'; }
  };
}

/* ============================== DECLARED TOTALS ==============================
   When a head submits, they type the totals from the school's own records (register, staff records).
   The portal compares them with what was entered and prints the result on the receipt. */
const DECL = {
  Enrolment:  { keys:[['Boys','Boys'],['Girls','Girls']], from:'your class attendance registers' },
  SchoolStaff:{ keys:[['Teaching','Teaching staff'],['Non-teaching','Non-teaching staff']], from:'your staff records / nominal roll — not from the list you typed' },
  BECE:       { keys:[['Boys','Boys (male candidates)'],['Girls','Girls (female candidates)']], from:'your BECE registration list' }
};
function enteredOf(mod, rows){
  if(mod==='Enrolment') return { Boys:sum(rows,'Boys'), Girls:sum(rows,'Girls') };
  if(mod==='SchoolStaff') return { Teaching:rows.filter(r=>r.Category==='Teaching').length, 'Non-teaching':rows.filter(r=>r.Category==='Non-teaching').length };
  if(mod==='BECE') return { Boys:rows.filter(r=>r.Sex==='Male').length, Girls:rows.filter(r=>r.Sex==='Female').length };
  return {};
}
const declHTML = (mod, p, vals={}) => `<div class="decl"><div class="decl-h">✍️ <b>Confirm your totals</b> <span class="small muted">— count them from ${esc(DECL[mod].from)}.</span></div>
  <div class="decl-g">${DECL[mod].keys.map(([k,l])=>`<div><label class="f">${esc(l)}</label><input class="inp big" type="number" min="0" step="1" inputmode="numeric" data-decl="${p}" data-k="${esc(k)}" value="${esc(vals[k]??'')}"></div>`).join('')}</div></div>`;
function readDecl(p){
  const o={}; let ok=true;
  $$(`[data-decl="${p}"]`).forEach(i=>{ const v=i.value.trim(); if(v===''||!Number.isInteger(Number(v))||Number(v)<0) ok=false; else o[i.dataset.k]=Number(v); });
  return ok?o:null;
}
const declDiff = (mod, d, e) => DECL[mod].keys.filter(([k])=>Number(d[k])!==Number(e[k]||0)).map(([k,l])=>`${l}: you counted <b>${d[k]}</b>, but <b>${e[k]||0}</b> ${mod==='SchoolStaff'?'are on the list':'were entered'}`);
// school only: ask for the totals, warn on a difference, then run go(declared)
function askDecl(mod, entered, go){
  openModal(`<h3>Before you submit</h3><p class="muted small">The portal checks that every ${mod==='SchoolStaff'?'staff member':mod==='BECE'?'candidate':'learner'} has been entered. Type the totals from ${esc(DECL[mod].from)}.</p>
    ${declHTML(mod,'ad')}<div id="adOut"></div><div class="err" id="adErr"></div>
    <div class="modal-actions" id="adAct"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="adGo">Check &amp; submit</button></div>`);
  let forced=false;
  $('#adGo').onclick=async()=>{
    const d=readDecl('ad'); $('#adErr').textContent='';
    if(!d){ $('#adErr').textContent='Type every total (use 0 if none).'; return; }
    const diff=declDiff(mod,d,entered);
    if(diff.length&&!forced){
      forced=true;
      $('#adOut').innerHTML=`<div class="banner bad" style="margin-top:12px"><b>⚠ The numbers do not match</b><ul style="margin:6px 0 0 18px;padding:0">${diff.map(x=>`<li>${x}</li>`).join('')}</ul>
        <div class="small" style="margin-top:6px">Go back and add the missing records (or remove the extra ones). If your count is right as it is, you can still submit — the difference will show on your receipt.</div></div>`;
      $('#adGo').textContent='Submit anyway'; $('#adGo').classList.remove('primary');
      const back=document.createElement('button'); back.className='btn primary'; back.textContent='Go back and fix'; back.onclick=closeModal; $('#adAct').appendChild(back);
      return;
    }
    $('#adGo').disabled=true; $('#adGo').innerHTML='<span class="spin"></span> Submitting…';
    closeModal(); await go(d);
  };
}
function checkLine(r){

/* ============================== DATA CHECKS ==============================
   Signals that a school's figures may be incomplete or wrong. Used on the staff "Data checks" page
   and, for one school, as a "Please check" box on the school's own tabs. */
const CHK_AREA = { decl:'Declared totals', enrol:'Enrolment', staff:'Staff list' };
const CHK_MISSING = ['Staff ID','Date of Birth','Gender','Rank','Category'];
function computeChecks(schools, opt={}){
  const by=new Map(schools.map(s=>[String(s['EMIS Code']),s])), out=[];
  const add=(e,area,sev,issue,detail)=>{ const s=by.get(String(e)); if(s) out.push({s,area,sev,issue,detail}); };
  // 1. declared totals on the latest receipt
  if(!opt.skipDecl){
    const latest={};
    (S.receipts||[]).forEach(r=>{ if(!DECL[r.Module]) return; if(r.Module==='Enrolment'&&r.Period&&r.Period!==curPeriod()) return;
      const k=r['EMIS Code']+'|'+r.Module; if(!latest[k]||String(r['Submitted At'])>String(latest[k]['Submitted At'])) latest[k]=r; });
    Object.values(latest).forEach(r=>{ if(r.Check&&r.Check!=='OK') add(r['EMIS Code'],'decl','red',`${FORMS[r.Module]}: head's count differs`,`${r.Check} · receipt ${r['Receipt No']}, ${fmtDate(r['Submitted At'])}`); });
  }
  // 2. enrolment: change since the last count, missing classes, very large classes
  const EN=(S.rec.Enrolment||[]).filter(r=>by.has(String(r['EMIS Code'])));
  const P=PERIODS(), ci=P.indexOf(curPeriod());
  const enrolByE={};
  EN.forEach(r=>{ const e=String(r['EMIS Code']); ((enrolByE[e]=enrolByE[e]||{})[periodOf(r)]=enrolByE[e][periodOf(r)]||[]).push(r); });
  Object.entries(enrolByE).forEach(([e,per])=>{
    const now=per[curPeriod()]; if(!now) return;
    const T=rows=>rows.reduce((a,r)=>a+num(r.Boys)+num(r.Girls),0);
    const prevP=P.slice(0,ci).reverse().find(p=>per[p]);
    if(prevP){
      const a=T(per[prevP]), b=T(now);
      if(a&&Math.abs(b-a)>=10&&Math.abs(b-a)/a>=0.2) add(e,'enrol','amber','Big change since the last count',`${prevP}: ${a.toLocaleString()} → ${curPeriod()}: ${b.toLocaleString()} (${b>a?'+':''}${Math.round((b-a)/a*100)}%)`);
      const cls=c=>rows=>rows.filter(r=>r.Class===c).reduce((x,r)=>x+num(r.Boys)+num(r.Girls),0);
      const gone=[...new Set(per[prevP].map(r=>r.Class))].filter(c=>cls(c)(per[prevP])>0&&!cls(c)(now));
      if(gone.length) add(e,'enrol','amber','Class missing this count',gone.map(c=>`${CLASS_LABEL(c)} (had ${cls(c)(per[prevP])})`).join(', '));
    }
    const big=now.filter(r=>num(r.Boys)+num(r.Girls)>90);
    if(big.length) add(e,'enrol','amber','Very large class',big.map(r=>`${CLASS_LABEL(r.Class)}${r.Stream?' '+r.Stream:''}: ${num(r.Boys)+num(r.Girls)}`).join(', ')+' — check for a typing error or a stream not entered');
  });
  // 3. staff: duplicates, missing details, pupil–teacher ratio
  const ST=(S.rec.SchoolStaff||[]).filter(r=>by.has(String(r['EMIS Code'])));
  const ids={};
  (S.rec.SchoolStaff||[]).forEach(r=>{ const id=String(r['Staff ID']||'').replace(/\s/g,'').toUpperCase(); if(id) (ids[id]=ids[id]||[]).push(r); });
  Object.entries(ids).forEach(([id,list])=>{ if(list.length<2) return;
    const schs=[...new Set(list.map(r=>String(r['EMIS Code'])))];
    if(schs.length===1) add(schs[0],'staff','red','Same Staff ID entered twice',`${id}: ${list.map(r=>r['Full Name']).join(', ')}`);
    else schs.forEach(e=>add(e,'staff','red','Staff ID also listed at another school',`${id} (${list.find(r=>String(r['EMIS Code'])===e)['Full Name']}) is also at ${list.filter(r=>String(r['EMIS Code'])!==e).map(r=>r['School Name']||r['EMIS Code']).join(', ')}`)); });
  const stBy={}; ST.forEach(r=>(stBy[r['EMIS Code']]=stBy[r['EMIS Code']]||[]).push(r));
  Object.entries(stBy).forEach(([e,list])=>{
    const names={}; list.forEach(r=>{ const n=String(r['Full Name']||'').toLowerCase().replace(/[^a-z]/g,''); if(n) names[n]=(names[n]||0)+1; });
    const dn=Object.keys(names).filter(n=>names[n]>1); if(dn.length) add(e,'staff','amber','Same name entered twice',list.filter(r=>dn.includes(String(r['Full Name']||'').toLowerCase().replace(/[^a-z]/g,''))).map(r=>r['Full Name']).filter((v,i,a)=>a.indexOf(v)===i).join(', '));
    const miss=CHK_MISSING.map(k=>[k,list.filter(r=>!String(r[k]||'').trim()).length]).filter(x=>x[1]);
    if(miss.length) add(e,'staff','amber','Missing staff details',miss.map(([k,n])=>`${n} without ${k==='Category'?'Teaching / Non-teaching':k}`).join(', '));
    const teach=list.filter(r=>r.Category==='Teaching').length, en=(enrolByE[e]||{})[curPeriod()];
    const learners=en?en.reduce((a,r)=>a+num(r.Boys)+num(r.Girls),0):0;
    if(learners&&!teach) add(e,'staff','amber','No teaching staff on the list',`${learners.toLocaleString()} learners enrolled but no staff marked Teaching`);
    else if(learners&&teach&&learners/teach>70) add(e,'staff','amber','Very high pupil–teacher ratio',`${learners.toLocaleString()} learners ÷ ${teach} teaching staff = ${Math.round(learners/teach)} — are some teachers missing?`);
  });
  // staff count on the last two staff-list receipts
  const rc={}; (S.receipts||[]).filter(r=>r.Module==='SchoolStaff'&&by.has(String(r['EMIS Code']))).forEach(r=>(rc[r['EMIS Code']]=rc[r['EMIS Code']]||[]).push(r));
  Object.entries(rc).forEach(([e,list])=>{ if(list.length<2) return; list.sort((a,b)=>String(a['Submitted At']).localeCompare(String(b['Submitted At'])));
    const n=r=>Number((parseSummary(r).find(x=>x[0]==='Total staff')||[])[1])||0, a=n(list[list.length-2]), b=n(list[list.length-1]);
    if(a&&Math.abs(b-a)>=3&&Math.abs(b-a)/a>=0.25) add(e,'staff','amber','Staff count changed a lot',`${a} on ${fmtDate(list[list.length-2]['Submitted At'])} → ${b} on ${fmtDate(list[list.length-1]['Submitted At'])}`); });
  return out;
}
// school's own tabs: a "please check" box
function myChecks(mod){
  if(S.user.role!=='SCHOOL'||!['Enrolment','SchoolStaff'].includes(mod)) return '';
  const area=mod==='Enrolment'?'enrol':'staff';
  const list=computeChecks([{'EMIS Code':S.user.emis,'School Name':S.user.name,Circuit:S.user.circuit}],{skipDecl:true}).filter(x=>x.area===area);
  return list.length?`<div class="banner bad" style="margin:12px 0"><b>⚠ Please check before you submit</b><ul style="margin:6px 0 0 18px;padding:0">${list.map(x=>`<li><b>${esc(x.issue)}</b> — ${esc(x.detail)}</li>`).join('')}</ul></div>`:'';
}
function vChecks(){

  (async()=>{ $('#view').innerHTML='<div class="loading"><span class="spin"></span> Checking every school…</div>';
    try{ await Promise.all([recLoad('Enrolment'),recLoad('SchoolStaff'),loadReceipts()]); }catch(e){ if(S.tab==='checks') showErr(e, vChecks); return; }
    if(S.tab==='checks') drawChecks(); })();
}
function drawChecks(){
  S.rerender=drawChecks;
  const all=computeChecks(scoped().active), f=S.chkArea||'all';
  const list=all.filter(x=>f==='all'||x.area===f).sort((a,b)=>(a.sev==='red'?0:1)-(b.sev==='red'?0:1)||canonCircuit(a.s.Circuit).localeCompare(canonCircuit(b.s.Circuit))||String(a.s['School Name']).localeCompare(b.s['School Name']));
  const nS=new Set(all.map(x=>x.s['EMIS Code'])).size, cur=curPeriod();
  const R=(S.receipts||[]).filter(r=>DECL[r.Module]&&(r.Module!=='Enrolment'||!r.Period||r.Period===cur));
  const latest={}; R.forEach(r=>{ const k=r['EMIS Code']+'|'+r.Module; if(!latest[k]||String(r['Submitted At'])>String(latest[k]['Submitted At'])) latest[k]=r; });
  const L=Object.values(latest), withD=L.filter(r=>r.Check), okD=L.filter(r=>r.Check==='OK');
  const k=(key,l,v,sub)=>`<button type="button" class="kpi kbtn ${f===key?'on':''}" data-ca="${key}"><div class="l">${l}</div><div class="v">${v}</div>${sub?`<div class="small muted">${sub}</div>`:''}</button>`;
  $('#view').innerHTML=`<div class="page-h"><div><h2>Data checks</h2><p>Signs that a school's figures may be incomplete or wrong · ${esc(cur)} · ${scopeText()}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="ckW">Copy list for WhatsApp</button><button class="btn" id="ckE">Export List</button><button class="btn" onclick="Promise.all([recLoad('Enrolment',true),recLoad('SchoolStaff',true),loadReceipts(true)]).then(drawChecks)">Refresh</button></div></div>
    <div class="kpis" style="grid-template-columns:repeat(5,1fr)">
      ${k('all','All issues',all.length,`${nS} school${nS===1?'':'s'}`)}
      ${k('decl','Head\'s count differs',all.filter(x=>x.area==='decl').length,`${okD.length} of ${withD.length} declared returns match`)}
      ${k('enrol','Enrolment',all.filter(x=>x.area==='enrol').length,'changes, missing or large classes')}
      ${k('staff','Staff list',all.filter(x=>x.area==='staff').length,'duplicates, missing details, PTR')}

const okDate = (d,m,y) => { const D=+d, M=+m, Y=+y; if(!D||!M||!Y) return false; const t=new Date(Y,M-1,D); return t.getMonth()===M-1&&t.getDate()===D; };
function ofCheck(sec){

  secs.forEach(S=>S.f.forEach(f=>{ if(f.sep||f.ro||!ofVisible(f)) return;
    if(f.d){ const [a,b,c]=dHs(f.d).map(h=>v[h]); const any=[a,b,c].some(x=>x!==''&&x!=null);
      if(f.req&&!any) err(dHs(f.d)[0],`${f.lab} is required.`); else if(any&&!okDate(a,b,c)) err(dHs(f.d)[0],`${f.lab}: choose a day, month and year that exist.`); return; }
    const x=String(v[f.h]??'').trim();
    if(f.req&&!x){ err(f.h,`${ofLabel(f.h)} is required.`); return; }
    if(f.t==='sel'&&x&&!ofOpts(f).some(o=>String(o)===x)) err(f.h,`${ofLabel(f.h)}: choose from the list.`); }));
  const on=k=>!sec||OF_SECTIONS.find(s=>s.k===sec).f.some(f=>f.h===k||(f.d&&dHs(f.d).includes(k)));
  const g=k=>String(v[k]??'').trim();
  if(on('Ghana Card Number')&&g('Ghana Card Number')&&!/^GHA-\d{9}-\d$/.test(g('Ghana Card Number').toUpperCase())) err('Ghana Card Number','Ghana Card Number must look like GHA-123456789-0 (15 characters).');
  ['Telephone Number','Emergency Contact Number'].forEach(k=>{ if(on(k)&&g(k)&&!/^0\d{9}$/.test(g(k))) err(k,`${k} must be 10 digits starting with 0, e.g. 0244123456.`); });
  if(on('Emergency Contact Number')&&g('Emergency Contact Number')&&g('Emergency Contact Number')===g('Telephone Number')) err('Emergency Contact Number','The emergency number must be different from your own number.');
  if(on('Email Address')&&g('Email Address')){ const em=g('Email Address'), dom=(em.split('@')[1]||'').toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(em)) err('Email Address','This e-mail address is not complete.');
    else if(EMAIL_TYPO[dom]) warn('Email Address',`Did you mean @${EMAIL_TYPO[dom]}?`); }
  if(on('NTC Registration Number')&&g('NTC Registration Number')){ const n=g('NTC Registration Number').toUpperCase();
    if(!n.startsWith('PT/')) err('NTC Registration Number','NTC number must start with PT/, e.g. PT/00001/20.'); else if(!/^PT\/\d{5}\/\d{2}$/.test(n)) warn('NTC Registration Number','Usual format is PT/00001/20 — please check.'); }

  const by=+v['Birth - Year'], fy=+v['First Appointment - Year'], py=+v['Posted to Present Station - Year'], ry=+v['Date on Current Rank - Year'], now=new Date().getFullYear();
  if(on('Birth - Year')&&by&&(now-by<18)) err('Birth - Day','Check your year of birth (age under 18).');
  if(on('Birth - Year')&&by&&(now-by>CONFIG.RETIRE_AGE)) warn('Birth - Day',`Your year of birth gives an age above ${CONFIG.RETIRE_AGE} — please check.`);
  if(on('First Appointment - Year')&&by&&fy&&fy<by+18) err('First Appointment - Day','First appointment is before age 18 — check the year.');
  if(on('Posted to Present Station - Year')&&fy&&py&&py<fy) err('Posted to Present Station - Day','You cannot be posted here before your first appointment.');
  if(on('Date on Current Rank - Year')&&fy&&ry&&ry<fy) err('Date on Current Rank - Day','The date on your rank is before your first appointment.');

  UNI_N.forEach((n,i)=>{ if(i>=OF.unis||!on(`${n} University/Polytechnic`)) return; const has=[`${n} University/Polytechnic`,`${n} - Qualification Level`,`${n} - Qualification Name`].some(k=>g(k));
    if(has){ if(!g(`${n} University/Polytechnic`)) err(`${n} University/Polytechnic`,'Name the university / polytechnic.'); if(!g(`${n} - Qualification Level`)) err(`${n} - Qualification Level`,'Choose the qualification level.'); } });
  return {E,W};
}

    if(m&&/<f[ >]/.test(m[2]||'')){ const f=(m[2].match(/<f[\s\S]*?<\/f>|<f[^>]*\/>/)||[''])[0]; cell=`<c r="${ref}"${attrs}${has?' t="str"':''}>${f}${has?`<v>${xmlEsc(val)}</v>`:''}</c>`; }
    else if(!has) cell=`<c r="${ref}"${attrs}/>`;
    else cell=isNum?`<c r="${ref}"${attrs}><v>${val}</v></c>`:`<c r="${ref}"${attrs} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(val)}</t></is></c>`;
    rowXml=m?rowXml.replace(m[0],cell):rowXml.replace('</row>',cell+'</row>');
  });
  return rowXml;
}
function fillRows(xml, rowsVals){ // rowsVals: {rowNumber: {col: value}}
  return xml.replace(/<row\b[^>]*\br="(\d+)"[^>]*?(?:\/>|>[\s\S]*?<\/row>)/g,(m,r)=>{ const vals=rowsVals[r]; if(!vals) return m;
    if(m.endsWith('/>')) m=m.slice(0,-2)+'></row>'; return setCells(m,r,vals); });
}
const ofCellVal = (h,v) => { if(v===''||v==null) return ''; if(OF_NUM(h)&&/^\d+$/.test(String(v))) return +v; return String(v); };
async function officersXlsxFromTemplate(tpl, records, office){
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',()=>window.JSZip);
  const zip=await JSZip.loadAsync(tpl.data,{base64:true});
  const wbx=await zip.file('xl/workbook.xml').async('string'), rels=await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const pathOf=name=>{ const sh=[...wbx.matchAll(/<sheet\b[^>]*\/>/g)].map(x=>x[0]).find(t=>new RegExp(`name="${name}"`).test(t)); if(!sh) return null;
    const id=(sh.match(/r:id="([^"]+)"/)||[])[1]; const rel=[...rels.matchAll(/<Relationship\b[^>]*\/>/g)].map(x=>x[0]).find(t=>t.includes(`Id="${id}"`));
    const tg=(rel.match(/Target="([^"]+)"/)||[])[1]; return tg.startsWith('/')?tg.slice(1):'xl/'+tg; };
  const pO=pathOf('OFFICERS'), pD=pathOf('OFFICE DETAILS');
  if(!pO) throw new Error('The attached template has no OFFICERS sheet.');
  if(records.length>300) throw new Error('The template has room for 300 officers only.');
  const H=OFFDATA.H, rowsVals={};
  records.forEach((rec,i)=>{ const o={}; H.forEach((h,j)=>{ let v=rec[h]; if((v===''||v==null)&&office&&office[h]!=null) v=office[h]; o[colLetter(j)]=ofCellVal(h,v); }); rowsVals[i+2]=o; });
  zip.file(pO, fillRows(await zip.file(pO).async('string'), rowsVals));
  if(pD&&office){ const od={4:{C:office['Academic Year']},5:{C:office['Academic Term']},6:{C:office['Region']},7:{C:office['MMDA']},8:{C:office['MMDEO Status']},9:{C:office['MMDEO EMIS Code']||''},10:{C:office['MMDEO GhanaPost GPS']||''}};
    zip.file(pD, fillRows(await zip.file(pD).async('string'), od)); }
  let w=wbx; if(/<calcPr\b/.test(w)) w=w.replace(/<calcPr\b([^>]*?)\s*(\/?)>/,(m,at,sl)=>`<calcPr${at.replace(/\s*fullCalcOnLoad="[^"]*"/,'')} fullCalcOnLoad="1"${sl}>`); else w=w.replace(/(<\/definedNames>|<\/sheets>)(?![\s\S]*<\/definedNames>)/,'$1<calcPr fullCalcOnLoad="1"/>');
  zip.file('xl/workbook.xml', w);
  return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function officersXlsxPlain(records, office){
  const H=OFFDATA.H, wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Office details',''],...Object.entries(office||{})]), 'OFFICE DETAILS');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([H,...records.map(r=>H.map(h=>ofCellVal(h,(r[h]===''||r[h]==null)&&office?office[h]??'':r[h])))]), 'OFFICERS');
  return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function downloadOfficers(records, office, name){
  let tpl=null; try{ const t=await api('publicTabTemplate',{module:'Officers'}); if(t&&!t.none) tpl=t; }catch(e){}
  let blob;
  if(tpl){ try{ blob=await officersXlsxFromTemplate(tpl, records, office); }catch(e){ console.error(e); toast('The regional template could not be filled ('+e.message+') — a plain Excel copy was made instead.',true); } }
  if(!blob){ if(!window.XLSX) throw new Error('The Excel tools did not load. Check your internet connection and refresh.'); blob=officersXlsxPlain(records, office); }
  saveBlob(blob, name); toast('Downloaded '+name);
}

const ICON_SCHOOL = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M10 21v-5h4v5"/></svg>';
const LEVEL_COLOR = { Nursery:'#7a6a12', KG:'#2a78d6', Primary:'#d4741c', JHS:'#1a9c6e', SHS:'#b0337a' };
const STATUS_COLOR = { Accepted:'#1f7a52', Submitted:'#c58a12', Rejected:'#b8322a' };
const FLAG_LABEL = { nocircuit:'No circuit', badcircuit:'Circuit name not recognised', nolevel:'No level', nophone:'No phone number', never:'Never signed in', inactive:'Inactive', nosid:'No head Staff ID (head cannot sign in)' };

const isActive = s => String(s.Active).toLowerCase()!=='no';
const OWN = s => { const o=String(s.Ownership||'').toLowerCase(); return /priv/.test(o)?'Private':/pub|gov/.test(o)?'Public':''; };
function canonCircuit(c){ const t=String(c||'').trim().replace(/\s+circuit$/i,''); if(!t) return ''; return CONFIG.CIRCUITS.find(x=>x.toLowerCase()===t.toLowerCase())||t; }
// read the levels from whatever is typed in the Level column: "KG/Primary/JHS", "Basic (KG, Primary & JHS)", "Basic", "JHS only", "SHS"…
function parseLevels(LV){ const x=String(LV||'').toLowerCase(), o=[];
  if(/creche|nursery|pre-?school/.test(x)) o.push('Nursery');
  if(/\bkg\b|kindergarten|\bk\.g\b/.test(x)) o.push('KG');
  if(/primary|\blp\b|\bup\b/.test(x)) o.push('Primary');
  if(/\bjhs\b|\bjss\b|junior\s*high/.test(x)) o.push('JHS');
  if(/\bshs\b|\bsss\b|\bshts?\b|senior\s*high|second\s*cycle/.test(x)) o.push('SHS');
  if(!o.length&&/\bbasic\b/.test(x)) o.push('KG','Primary','JHS');   // a "Basic" school runs KG, Primary and JHS
  return o; }
function levelsOf(s){ return parseLevels(s.Level); }
function flagsOf(s){
  const f=[], c=canonCircuit(s.Circuit);
  if(!c) f.push('nocircuit'); else if(!CONFIG.CIRCUITS.includes(c)) f.push('badcircuit');
  if(!levelsOf(s).length) f.push('nolevel');
  if(!String(s.Phone||'').trim()) f.push('nophone');
  if(!s['Last Login']) f.push('never');
  if(!isActive(s)) f.push('inactive');
  if(s['Sign In']==='No head Staff ID') f.push('nosid');
  return f;
}

  if(S.user.role==='CIRCUIT_SUPERVISOR') return [canonCircuit(S.user.circuit)];
  const extra=[...new Set(S.data.schools.map(s=>canonCircuit(s.Circuit)).filter(c=>c&&!CONFIG.CIRCUITS.includes(c)))].sort();
  return [...CONFIG.CIRCUITS, ...extra];
}

const hasOwnership = () => S.data.schools.some(s=>OWN(s));

/* ---- chart pieces ---- */
function donut(segs, center, note){
  const tot=segs.reduce((a,s)=>a+s.n,0), R=42, C=2*Math.PI*R, live=segs.filter(s=>s.n), gap=live.length>1?2:0; let off=0;
  const arcs = tot ? live.map(s=>{ const len=s.n/tot*C;
      const a=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${Math.max(len-gap,.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${esc(s.k)}: ${s.n} (${Math.round(s.n/tot*100)}%)</title></circle>`;
      off+=len; return a; }).join('')
    : `<circle r="${R}" cx="60" cy="60" fill="none" stroke="#ecebe4" stroke-width="16"/>`;
  return `<div class="donut"><svg viewBox="0 0 120 120" width="136" height="136" role="img" aria-label="${esc(segs.map(s=>s.k+' '+s.n).join(', '))}">${arcs}<text x="60" y="61" text-anchor="middle" dominant-baseline="middle" class="dv" style="font-size:${String(center).length>6?15:String(center).length>4?18:24}px">${esc(center)}</text></svg>
    <div class="dleg">${segs.map(s=>`<div class="dl"><i style="background:${s.c}"></i><span>${esc(s.k)}</span><b>${s.n.toLocaleString()} <span class="muted">(${tot?Math.round(s.n/tot*100):0}%)</span></b></div>`).join('')}
    ${note?`<div class="small muted" style="margin-top:6px">${note}</div>`:''}</div></div>`;
}
function barList(rows, color){
  const max=Math.max(1,...rows.map(r=>r.n));
  return `<div class="blist">${rows.map(r=>`<div class="br" title="${esc(r.k)}: ${r.n}"><span class="bk">${esc(r.k)}</span><span class="bt"><i style="width:${r.n/max*100}%;background:${color||'var(--indigo)'}"></i></span><b>${r.n.toLocaleString()}</b></div>`).join('')}</div>`;
}
const attn = (n,label,go) => `<button type="button" class="att" data-go="${go}"><span class="cnt ${n?'bad':'ok'}">${n.toLocaleString()}</span><span>${label}</span><span class="muted" style="margin-left:auto">›</span></button>`;

  const lv=LEVELS.map(L=>({k:LEVEL_LABEL[L]||L, n:sc.active.filter(s=>levelsOf(s).includes(L)).length, c:LEVEL_COLOR[L]}));
  const st=[{k:'Accepted',n:sc.subs.filter(s=>s.Status==='Accepted').length,c:STATUS_COLOR.Accepted},{k:'Awaiting review',n:awaiting,c:STATUS_COLOR.Submitted},{k:'Returned to school',n:returned,c:STATUS_COLOR.Rejected}];
  const byC=circuits().map(c=>({k:c,n:sc.schools.filter(s=>canonCircuit(s.Circuit)===c).length})).sort((a,b)=>b.n-a.n);

      <div class="kpi"><div class="l">Awaiting review</div><div class="v" style="color:${awaiting?'var(--amber)':'inherit'}">${awaiting}</div></div>
    </div>
    <div class="g3">
      <div class="card accent"><div class="card-b">${secT('Schools by level')}<div style="margin-top:14px">${donut(lv, sc.active.length, 'A basic school is counted once for each level it runs.')}</div></div></div>
      <div class="card accent"><div class="card-b">${secT('Enrolment by sex')}<div style="margin-top:14px">${donut([{k:'Boys',n:EA.B,c:'#2a78d6'},{k:'Girls',n:EA.G,c:'#b0337a'}], EA.T.toLocaleString(), `${S.year||CONFIG.YEAR} · ${erep}/${sc.active.length} schools reported`)}</div></div></div>
      <div class="card accent"><div class="card-b">${secT('Files by review status')}<div style="margin-top:14px">${donut(st, sc.subs.length)}</div></div></div>
    </div>
    <div class="g2">
      <div class="card"><div class="card-b"><div class="cap">Schools by circuit</div><div class="small muted" style="margin-bottom:12px">Selected circuits, largest first</div>${barList(byC)}</div></div>
      <div class="card"><div class="card-b"><div class="cap">Needs attention</div><div class="small muted" style="margin-bottom:12px">Tap a row to see the detail</div>
        ${attn(awaiting,'Files awaiting review','subs:Submitted')}
        ${attn(returned,'Files returned to schools for correction','subs:Rejected')}
        ${attn(missing,'Schools yet to submit for open requests','comp')}
        ${attn(open.filter(isOverdue).length,'Open requests past their deadline',can.manage(S.user.role)?'tasks':'comp')}
        ${attn(sc.active.length-erep,'Schools yet to report enrolment ('+esc(S.year||CONFIG.YEAR)+')','enrol')}
        ${attn(neverActive,'Schools that have never signed in','schools:never')}
        ${attn(fl('nocircuit'),'Schools flagged: No circuit','schools:nocircuit')}
        ${attn(fl('badcircuit'),'Schools flagged: Circuit name not recognised','schools:badcircuit')}
        ${attn(fl('nolevel'),'Schools flagged: No level','schools:nolevel')}
        ${attn(fl('nophone'),'Schools flagged: No phone number','schools:nophone')}
      </div></div>
    </div>`;

function homeCirc(sc, open){
  const rows=circuits().map(c=>{
    const sch=sc.active.filter(s=>canonCircuit(s.Circuit)===c), set=new Set(sch.map(s=>String(s['EMIS Code'])));
    const subs=sc.subs.filter(x=>set.has(String(x['EMIS Code'])));
    let tot=0, done=0; open.forEach(t=>{ const p=taskProgress(t,c); tot+=p.total; done+=p.done; });
    return { c, n:sch.length, lv:LEVELS.map(L=>sch.filter(s=>levelsOf(s).includes(L)).length), signed:sch.filter(s=>s['Last Login']).length,
             files:subs.length, wait:subs.filter(x=>x.Status==='Submitted').length, rate:tot?Math.round(done/tot*100):null };
  });
  const T=rows.reduce((a,r)=>({n:a.n+r.n,lv:a.lv.map((v,i)=>v+r.lv[i]),signed:a.signed+r.signed,files:a.files+r.files,wait:a.wait+r.wait}),{n:0,lv:[0,0,0,0],signed:0,files:0,wait:0});
  const rate=r=>r==null?'<span class="muted">—</span>':`<div style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><span class="bar" style="width:90px"><i style="width:${r}%;background:${r>=80?'var(--green)':r>=50?'var(--teal)':'var(--red)'}"></i></span><b>${r}%</b></div>`;
  return `<div class="card accent"><div class="card-h"><h3>Circuit comparison</h3><span class="small muted">Active schools · submission rate = schools that submitted ÷ schools asked, across open requests</span></div>
    <div class="tbl-wrap"><table class="t"><thead><tr><th>Circuit</th><th class="num">Schools</th>${LEVELS.map(L=>`<th class="num">${L}</th>`).join('')}<th class="num">Signed in</th><th class="num">Files</th><th class="num">Awaiting review</th><th class="num">Submission rate</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><b>${esc(r.c)}</b></td><td class="num">${r.n}</td>${r.lv.map(v=>`<td class="num">${v}</td>`).join('')}<td class="num">${r.signed}/${r.n}</td><td class="num">${r.files}</td><td class="num">${r.wait?`<span class="pill amber">${r.wait}</span>`:0}</td><td class="num">${rate(r.rate)}</td></tr>`).join('')}
    <tr style="background:#faf8f3"><td><b>Total</b></td><td class="num"><b>${T.n}</b></td>${T.lv.map(v=>`<td class="num"><b>${v}</b></td>`).join('')}<td class="num"><b>${T.signed}/${T.n}</b></td><td class="num"><b>${T.files}</b></td><td class="num"><b>${T.wait}</b></td><td></td></tr>
    </tbody></table></div></div>`;
}

    ${open.length?open.map(t=>{ const p=taskProgress(t), pct=p.total?Math.round(p.done/p.total*100):0, di=dueInfo(t);
      return `<div class="prog-row"><div><b>${esc(t.Title)}</b><div class="small muted"><span class="pill ${di.cls}">${esc(di.text)}</span> ${p.pending?`· ${p.pending} awaiting review`:''}</div></div>
        <div><div class="bar"><i style="width:${pct}%"></i></div><div class="small muted" style="margin-top:4px">${p.done} of ${p.total} schools · ${pct}%</div></div>
        <div><button class="btn sm" data-go="comp:${esc(t['Task ID'])}">${p.total-p.done} not submitted →</button></div></div>`; }).join(''):'<div class="empty">No open requests.'+(can.manage(S.user.role)?' Create one under <b>Requests</b>.':'')+'</div>'}

    <div class="tbl-wrap"><table class="t"><thead><tr><th>Circuit</th>${open.map(t=>`<th class="num" title="${esc(t.Title)}">${esc(t.Title.length>28?t.Title.slice(0,26)+'…':t.Title)}</th>`).join('')}</tr></thead><tbody>
    ${circ.map(c=>`<tr><td>${esc(c)}</td>${open.map(t=>{ const p=taskProgress(t,c), pct=p.total?Math.round(p.done/p.total*100):null;
      return `<td class="num">${pct==null?'—':`<span style="color:${pct===100?'var(--green)':pct<50?'var(--red)':'inherit'}">${p.done}/${p.total} · ${pct}%</span>`}</td>`; }).join('')}</tr>`).join('')}

  const keys=['nocircuit','badcircuit','nolevel','nophone','nosid','never','inactive'];
  const rows=sc.schools.map(s=>({s,f:flagsOf(s)})).filter(r=>r.f.length);

      ${rows.map(r=>`<tr><td>${esc(r.s['EMIS Code'])}</td><td><b>${esc(r.s['School Name'])}</b></td><td>${esc(r.s.Circuit||'—')}</td>

/* ---- SUBMISSIONS ---- */

  const list = sc.subs.filter(s=>(!f.task||s['Task ID']===f.task)&&(!f.status||s.Status===f.status)
      &&(!f.q||(s['School Name']+' '+s['EMIS Code']+' '+s['File Name']).toLowerCase().includes(f.q.toLowerCase())))

  S._subsList=list;
  $('#view').innerHTML = `
    <div class="card accent"><div class="card-h">${secT('Submissions',`${list.length} file${list.length===1?'':'s'} · ${scopeText()}`)}
      <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">${can.review(r)?'<button class="btn" onclick="checkAllSubs()" title="Run the portal first review on Excel files that have not been checked">🔍 Check new files</button>':''}<button class="btn" onclick="copyReturned()">Copy returned list for WhatsApp</button><button class="btn" onclick="exportSubs()">Export List</button><button class="btn" onclick="loadStaff(true)">Refresh</button></div></div>
    <div class="card-h filters">
      <select class="inp" id="fTask"><option value="">All requests</option>${S.data.tasks.map(t=>`<option value="${esc(t['Task ID'])}" ${f.task===t['Task ID']?'selected':''}>${esc(t.Title)}</option>`).join('')}</select>
      <select class="inp" id="fStat"><option value="">Any status</option>${['Submitted','Accepted','Rejected'].map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${s==='Submitted'?'Awaiting review':s==='Rejected'?'Returned':s}</option>`).join('')}</select>
      <input class="inp" id="fQ" placeholder="Search school, EMIS or file" value="${esc(f.q)}" style="flex:1">
    </div>
    <div class="tbl-wrap">${list.length?`<table class="t"><thead><tr><th>Uploaded</th><th>School</th><th>Circuit</th><th>Request</th><th>File</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(s=>{ const t=taskById(s['Task ID']); const e=s['File Type']||extOf(s['File Name']); return `<tr>
        <td class="small">${fmtDT(s['Submitted At'])}${isLate(s,t)?'<br><span class="pill amber">late</span>':''}</td>
        <td><b>${esc(s['School Name'])}</b><div class="small muted">${esc(s['EMIS Code'])}</div></td>
        <td>${esc(canonCircuit(s.Circuit))}</td>
        <td class="small">${esc(s['Task Title'])}</td>
        <td><div style="display:flex;gap:8px;align-items:center"><div class="ficon ${kindOf(e)}" style="width:30px;height:30px;font-size:10px">${esc(e.slice(0,4))}</div><div><div style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(s['File Name'])}">${esc(s['File Name'])}</div><div class="small muted">${fmtSize(s['Size KB'])}${s.Note?' · “'+esc(s.Note)+'”':''}</div>${s['Auto Check']?`<a href="#" class="nolink" onclick="acView('${esc(s['Submission ID'])}');return false">${acPill(s['Auto Check'],acSev(s['Auto Check']))}</a>`:''}</div></div></td>
        <td>${pill(s.Status)}${Number(s.Resubmitted)?` <span class="pill blue" title="Replaced ${esc(s['Previous File']||'')}">↻ corrected${Number(s.Resubmitted)>1?' ×'+Number(s.Resubmitted):''}</span>`:''}${s.Remark?`<div class="small muted" style="max-width:220px" title="${esc(s.Remark)}">${esc(String(s.Remark).split('\n')[0].slice(0,110))}${String(s.Remark).length>110||/\n/.test(s.Remark)?' …':''}</div>`:''}${Number(s.Resubmitted)&&s['Previous Remark']&&s.Status==='Submitted'?`<div class="small muted" style="max-width:220px">Was returned: ${esc(s['Previous Remark'])}</div>`:''}${s.Reviewer?`<div class="small muted">by ${esc(s.Reviewer)}</div>`:''}</td>
        <td><div class="fact"><button class="btn sm" onclick="dl('${esc(s['Submission ID'])}')">Download</button>${can.review(r)&&isXl(s)?`<button class="btn sm" onclick="checkSub('${esc(s['Submission ID'])}')" title="Portal first review: check the file for errors">🔍 Check</button>`:''}${can.manage(r)&&isXl(s)?`<button class="btn sm" onclick="fillTabModal('${esc(s['Submission ID'])}')" title="Read this file into a tab">📊 Fill tab</button>`:''}
          ${can.review(r)?`${s.Status!=='Accepted'?`<button class="btn sm ok" onclick="reviewModal('${esc(s['Submission ID'])}','Accepted')">Accept</button>`:''}${s.Status!=='Rejected'?`<button class="btn sm danger" onclick="reviewModal('${esc(s['Submission ID'])}','Rejected')">Return</button>`:''}`:''}</div></td></tr>`; }).join('')}

function liveSearch(sel, fn){
  const q=$(sel); if(!q) return;
  q.oninput=()=>{ clearTimeout(S._qt); S._qt=setTimeout(()=>{ fn(q.value); const n=$(sel); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },300); };
}
function exportSubs(){
  csv([['Uploaded','EMIS Code','School','Circuit','Level','Request','File','Size KB','Status','Reviewer','Remark','Note'],
    ...(S._subsList||[]).map(s=>[fmtDT(s['Submitted At']),s['EMIS Code'],s['School Name'],canonCircuit(s.Circuit),s.Level,s['Task Title'],s['File Name'],s['Size KB'],s.Status,s.Reviewer,s.Remark,s.Note])], 'submissions.csv');
}
function copyReturned(){
  const sc=scoped(), list=sc.subs.filter(s=>s.Status==='Rejected'&&!sc.subs.some(x=>x['Task ID']===s['Task ID']&&x['EMIS Code']===s['EMIS Code']&&String(x['Submitted At'])>String(s['Submitted At'])));
  if(!list.length) return toast('No returned files are waiting for correction.');
  copyText(returnMsg(list), `${list.length} returned file(s) copied — paste into WhatsApp.`);
}
/* ---- portal first review from the Submissions page ---- */
async function runCheck(sub){
  const f=await api('download',{id:sub['Submission ID']}), t=taskById(sub['Task ID'])||{};
  const res=autoCheck(await xlRead(new File([b64ToBlob(f.data,f.mime)], f.name||sub['File Name'])), {emis:String(sub['EMIS Code']), mod:t['Fills Tab']});
  const remarks=res.remarks.join('\n');
  await api('saveAutoCheck',{id:sub['Submission ID'], check:res.check, remarks});
  Object.assign(sub,{'Auto Check':res.check,'Auto Remarks':remarks}); return res;
}
async function checkSub(id){
  const sub=S.data.submissions.find(x=>x['Submission ID']===id); toast('Checking '+sub['File Name']+'…');
  try{ await runCheck(sub); renderStaff(); acView(id); }catch(e){ toast(e.message,true); }
}
function acView(id){
  const s=S.data.submissions.find(x=>x['Submission ID']===id), rv=can.review(S.user.role);
  openModal(`<h3>Portal first review</h3><p class="muted small"><b>${esc(s['School Name'])}</b> · ${esc(s['File Name'])} · ${fmtDT(s['Submitted At'])}</p>
    ${acBox({check:s['Auto Check'],remarks:String(s['Auto Remarks']||'').split('\n').filter(Boolean)})}
    <p class="small muted">The portal checks the template, the fixed drop-down values (year, term, MMDA), every drop-down column, ID formats, phone numbers, e-mails, duplicates and dates. You make the final decision.</p>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button>${rv&&isXl(s)?`<button class="btn" onclick="checkSub('${esc(id)}')">🔍 Check again</button>`:''}
      ${rv&&s.Status!=='Rejected'?`<button class="btn danger" onclick="reviewModal('${esc(id)}','Rejected')">Return to school</button>`:''}${rv&&s.Status!=='Accepted'?`<button class="btn primary" onclick="reviewModal('${esc(id)}','Accepted')">Accept</button>`:''}</div>`);
}
async function checkAllSubs(){
  const list=scoped().subs.filter(s=>isXl(s)&&!s['Auto Check']&&s.Status==='Submitted');
  if(!list.length) return toast('Every new Excel file has already been checked.');
  let n=0; for(const s of list){ toast(`Checking ${++n} of ${list.length}: ${s['School Name']}…`); try{ await runCheck(s); }catch(e){ Object.assign(s,{'Auto Check':'Could not read'}); } }
  renderStaff(); toast(`${list.length} file(s) checked. Click a 🔍 badge to see the findings.`);
}
function returnMsg(list){
  const by={}; list.forEach(s=>(by[s['School Name']]=by[s['School Name']]||[]).push(s));
  return `*Files returned for correction*\n\n`+Object.keys(by).sort().map(n=>`*${n}* (EMIS ${by[n][0]['EMIS Code']})\n`+by[n].map(s=>`• ${s['Task Title']||''}: ${s['File Name']}\n  ➜ ${s.Remark||'see the portal'}`).join('\n')).join('\n\n')
    +`\n\nCorrect the file and upload it again here (no password needed):\n${baseUrl()}?status=1`;
}
function copyText(txt, ok){ navigator.clipboard.writeText(txt).then(()=>toast(ok||'Copied — paste it into WhatsApp.'),()=>openModal(`<h3>Copy this message</h3><textarea class="inp" rows="12">${esc(txt)}</textarea><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`)); }
function returnMsgModal(sub){
  const txt=returnMsg([sub]), sch=(S.data.schools||[]).find(x=>String(x['EMIS Code'])===String(sub['EMIS Code']))||{};
  const ph=String(sch['Head Phone']||sch.Phone||'').replace(/\D/g,''), wa=ph?'233'+ph.replace(/^233/,'').replace(/^0/,''):'';
  openModal(`<h3>File returned — tell the head</h3><p class="muted small">Heads who don't sign in will not see this unless you tell them. Send this message (it includes a link where they can see the reason and upload a corrected file).</p>
    <textarea class="inp" rows="9" readonly>${esc(txt)}</textarea>
    <div class="modal-actions">${wa?`<a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(txt)}">Open WhatsApp to ${esc(sch['Head Phone']||sch.Phone)}</a>`:''}<button class="btn" id="rmC">Copy message</button><button class="btn primary" onclick="closeModal()">Done</button></div>`);
  $('#rmC').onclick=()=>copyText(txt);
}
function reviewModal(id, status){
  const s=S.data.submissions.find(x=>x['Submission ID']===id), acc=status==='Accepted';
  const acL=String(s['Auto Remarks']||'').split('\n').filter(Boolean), acIssues=acL.filter(x=>/^[❗•]/.test(x));
  openModal(`<h3>${acc?'Accept file':s.Status==='Accepted'?'Reopen and return file':'Return file to school'}</h3>
    <p class="muted"><b>${esc(s['School Name'])}</b> · ${esc(s['File Name'])}</p>
    ${!acc&&s.Status==='Accepted'?`<div class="banner bad" style="margin-bottom:10px">This file was <b>accepted</b>${s['Reviewed At']?' on '+fmtDate(s['Reviewed At']):''}. Returning it reopens it: the school is asked to send a corrected file, which will <b>replace</b> this one${(taskById(s['Task ID'])||{})['Fills Tab']?' and refill the tab':''}. Small errors can instead be corrected directly in the data tab (Edit).</div>`:''}
    ${s['Auto Check']?acBox({check:s['Auto Check'],remarks:acL}):''}
    ${!acc&&acIssues.length?`<label class="checks" style="margin:6px 0"><input type="checkbox" id="rvAc" checked> Add the portal's findings (${acIssues.length}) to the message to the school</label>`:''}
    <label class="f">${acc?'Comment (optional)':'What should the school correct?'}</label>
    <textarea class="inp" id="rvr" rows="3" placeholder="${acc?'e.g. Well done':'e.g. Enrolment totals for P4 do not add up. Correct and re-upload.'}"></textarea>
    <div class="err" id="rverr"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="rvb">${acc?'Accept':'Return to school'}</button></div>`);
  $('#rvb').onclick = async () => {
    let remark=$('#rvr').value.trim();
    const withAc=!acc&&$('#rvAc')&&$('#rvAc').checked;
    if(!acc && !remark && !withAc){ $('#rverr').textContent='Please tell the school what to fix.'; return; }
    if(withAc) remark=(remark?remark+'\n\n':'')+'Portal check found:\n'+acIssues.map(x=>x.replace(/^❗\s*/,'• ')).join('\n');
    $('#rvb').disabled=true;
    try{ await api('review',{id,status,remark}); Object.assign(s,{Status:status,Remark:remark,Reviewer:S.user.name,'Reviewed At':new Date().toISOString()}); closeModal(); renderStaff(); if(acc) toast('File accepted.'); else returnMsgModal(s); }
    catch(e){ $('#rverr').textContent=e.message; $('#rvb').disabled=false; }
  };
}

/* ---- WHO HAS SUBMITTED ---- */
function vComp(){
  const d=S.data, c=S.comp;
  if(!c.task || !taskById(c.task)){ const o=d.tasks.find(t=>t.Status==='Open')||d.tasks[0]; c.task=o?o['Task ID']:''; }
  const t=taskById(c.task);
  if(!t){ $('#view').innerHTML='<div class="card empty">No requests yet.</div>'; return; }
  const p=taskProgress(t);
  const rows=p.rows.filter(r=>!c.missing||!r.m.length).sort((a,b)=>canonCircuit(a.s.Circuit).localeCompare(canonCircuit(b.s.Circuit))||String(a.s['School Name']).localeCompare(b.s['School Name']));
  S._compRows=rows;
  $('#view').innerHTML=`
    <div class="card accent"><div class="card-h">${secT('Who has submitted',`${p.done} of ${p.total} schools have submitted · ${scopeText()}`)}

function copyDefaulters(){
  const t=taskById(S.comp.task); const miss=taskProgress(t).rows.filter(r=>!r.m.length);

  const txt=`*${t.Title}* — schools yet to submit (${miss.length})${t['Due Date']?'\nDeadline: '+fmtDate(t['Due Date']):''}\n\n`+Object.keys(byC).sort().map(c=>`_${c} Circuit_\n`+byC[c].sort().map((n,i)=>`${i+1}. ${n}`).join('\n')).join('\n\n');
  navigator.clipboard.writeText(txt).then(()=>toast('List copied. Paste it into WhatsApp.'),()=>{ openModal(`<h3>Copy this list</h3><textarea class="inp" rows="14">${esc(txt)}</textarea><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`); });

function exportComp(){
  const t=taskById(S.comp.task);
  csv([['EMIS Code','School','Circuit','Level','Head','Phone','Files','Status','Last upload'],...(S._compRows||[]).map(r=>[r.s['EMIS Code'],r.s['School Name'],canonCircuit(r.s.Circuit),r.s.Level,r.s['Head Name'],r.s.Phone,r.m.length,r.st,r.last?fmtDT(r.last):''])], `${t.Title.replace(/\W+/g,'_')}_status.csv`);

function taskModal(id){
  const t=id?taskById(id):{Levels:'All','Allowed Types':'excel,pdf',Status:'Open','Max Files':''};
  const lv=String(t.Levels||'All').split(',').map(x=>x.trim()); const ty=typeList(t['Allowed Types']);
  openModal(`<h3>${id?'Edit request':'New submission request'}</h3>
    <form id="tf">
      <label class="f">Title</label><input class="inp" id="tTitle" value="${esc(t.Title||'')}" placeholder="e.g. Term 1 SBA Assessment Records" required>
      <label class="f">Instructions to schools</label><textarea class="inp" id="tDesc" rows="3" placeholder="What exactly should be uploaded?">${esc(t.Description||'')}</textarea>
      <label class="f">Which schools?</label>
      <div class="checks"><label><input type="checkbox" value="All" data-lv ${lv.includes('All')?'checked':''}> All schools</label>${LEVELS.map(l=>`<label><input type="checkbox" value="${l}" data-lv ${lv.includes(l)?'checked':''}> ${l}</label>`).join('')}</div>
      <label class="f">Accepted file types</label>
      <div class="checks">${Object.keys(TYPE_LABEL).map(k=>`<label><input type="checkbox" value="${k}" data-ty ${ty.includes(k)?'checked':''}> ${TYPE_LABEL[k]}</label>`).join('')}</div>
      <div class="grid2">
        <div><label class="f">Deadline</label><input class="inp" type="date" id="tDue" value="${esc(t['Due Date']||'')}"></div>
        <div><label class="f">Max files per school</label><input class="inp" type="number" min="0" id="tMax" value="${esc(t['Max Files']||'')}" placeholder="No limit"></div>
      </div>
      <label class="f">Status</label><select class="inp" id="tStat"><option ${t.Status==='Open'?'selected':''}>Open</option><option ${t.Status==='Closed'?'selected':''}>Closed</option></select>
      <label class="f">When a school uploads its file, also fill this tab</label>
      <select class="inp" id="tFill"><option value="">— No, just keep the file —</option>${Object.keys(FORMS).filter(k=>XL[k]).map(k=>`<option value="${k}" ${t['Fills Tab']===k?'selected':''}>${esc(FORMS[k])}</option>`).join('')}</select>
      <div class="small muted">Schools must upload the Excel template for that tab (yours from Tasks ▸ Official Excel templates, or the portal's).</div>
      <label class="f">Template for schools to download <span class="muted small">(optional — e.g. the blank Excel workbook)</span></label>
      ${t['Template Name']?`<div class="small" style="margin-bottom:6px">Current: <b>${esc(t['Template Name'])}</b> <label style="margin-left:10px"><input type="checkbox" id="tRm"> remove it</label></div>`:''}
      <input type="file" class="inp" id="tTpl">
      <div class="err" id="terr"></div>
      <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="tb">${id?'Save changes':'Create request'}</button></div>
    </form>`);
  $$('[data-lv]').forEach(c=>c.onchange=()=>{ if(c.value==='All'&&c.checked) $$('[data-lv]').forEach(x=>{ if(x!==c) x.checked=false; }); else if(c.checked) $('[data-lv][value="All"]').checked=false; });
  $$('[data-ty]').forEach(c=>c.onchange=()=>{ if(c.value==='any'&&c.checked) $$('[data-ty]').forEach(x=>{ if(x!==c) x.checked=false; }); else if(c.checked) $('[data-ty][value="any"]').checked=false; });
  $('#tf').onsubmit=async e=>{
    e.preventDefault();
    const levels=$$('[data-lv]:checked').map(x=>x.value), types=$$('[data-ty]:checked').map(x=>x.value);
    if(!levels.length){ $('#terr').textContent='Choose which schools must submit.'; return; }
    if(!types.length){ $('#terr').textContent='Choose at least one file type.'; return; }
    $('#tb').disabled=true;
    const tf=$('#tTpl').files[0];
    if(tf&&tf.size>CONFIG.MAX_FILE_MB*1048576){ $('#terr').textContent='The template is larger than '+CONFIG.MAX_FILE_MB+' MB.'; $('#tb').disabled=false; return; }
    $('#tb').innerHTML='<span class="spin"></span> Saving…';
    try{ const template=tf?{name:tf.name, mime:tf.type, data:await readB64(tf)}:null;
      await api('saveTask',{task:{'Task ID':id||'',Title:$('#tTitle').value,Description:$('#tDesc').value,Levels:levels.join(','),'Allowed Types':types.join(','),'Due Date':$('#tDue').value,'Max Files':$('#tMax').value,Status:$('#tStat').value,'Fills Tab':$('#tFill').value}, template, removeTemplate:!!($('#tRm')&&$('#tRm').checked)});
      closeModal(); toast(id?'Request updated.':'Request created — schools can now upload.'); loadStaff(true); }
    catch(err){ $('#terr').textContent=err.message; $('#tb').disabled=false; $('#tb').textContent=id?'Save changes':'Create request'; }
  };
}
async function toggleTask(id){
  const t=taskById(id);
  try{ await api('saveTask',{task:Object.assign({},t,{Status:t.Status==='Open'?'Closed':'Open'})}); toast(t.Status==='Open'?'Request closed. Schools can no longer upload.':'Request reopened.'); loadStaff(true); }catch(e){ toast(e.message,true); }

  return scoped().schools.filter(s=>(!D.circuit||canonCircuit(s.Circuit)===D.circuit)&&(!D.level||levelsOf(s).includes(D.level))
      &&(!D.flag||flagsOf(s).includes(D.flag))&&(!q||(s['School Name']+' '+s['EMIS Code']+' '+s['Head Name']+' '+s.Circuit).toLowerCase().includes(q)))
    .sort((a,b)=>canonCircuit(a.Circuit).localeCompare(canonCircuit(b.Circuit))||String(a['School Name']).localeCompare(b['School Name']));
}

async function showPw(kind, id, name){
  openModal(`<h3>Password</h3><p class="muted"><b>${esc(name)}</b> · ${esc(id)}</p><div class="temp" id="pwBox"><span class="spin"></span></div><p class="small muted" id="pwNote"></p>

  try{ const r=await api('revealPassword',{kind,id});
    if(!r.password){ $('#pwBox').textContent='—'; $('#pwNote').textContent='Not available: this password was set before password viewing was switched on. Use Reset password to issue a new one.'; return; }
    $('#pwBox').textContent=r.password; $('#pwNote').textContent=(r.mustChange?'This is a temporary password — they will be asked to change it at next sign-in. ':'This is the password they chose. ')+'This look-up has been recorded in the Activity log.';
    $('#pwCopy').disabled=false; $('#pwCopy').onclick=()=>navigator.clipboard.writeText(`${CONFIG.APP_NAME}\nLogin: ${id}\nPassword: ${r.password}\n${baseUrl()}`).then(()=>toast('Copied.'));
  }catch(e){ closeModal(); toast(e.message,true); }
}

    <div class="grid2"><div><label class="f">Head's name</label><input class="inp" id="sH" value="${esc(s['Head Name']||'')}"></div>

      <div><label class="f">Active</label><select class="inp" id="sA"><option ${isActive(s)?'selected':''}>Yes</option><option ${isActive(s)?'':'selected'}>No</option></select></div></div>
    <div class="err" id="serr"></div>
    <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="sb">Save</button></div></form>`);
  $('#sf').onsubmit=async e=>{
    e.preventDefault();

    $('#sb').disabled=true;

function resetPw(kind, id, name){

      Object.keys(map).forEach(k=>{ if(map[k]===undefined) return; const nv=String(map[k]||'').trim(), ov=String(r[k]||''); if(nv!==ov){ LEAD.push({'Changed At':iso(Date.now()),'Changed By':s.name,'EMIS Code':r['EMIS Code'],'School Name':r['School Name'],Field:k,'Old Value':ov,'New Value':nv}); r[k]=nv; n++; if(k==='Head Staff ID'){ r.pw=null; r.pinSet=false; r.must=false; r.newHead=true; } } }); const pc=!!r.newHead; delete r.newHead; return {changed:n,pinCleared:pc}; },
    leadershipHistory:()=>cp(LEAD),
    publicUpdates:()=>({ today:ymd(Date.now()), updates:cp(REC.Updates.filter(u=>u['Show on Login']==='Yes'&&u.Audience!=='Staff only'&&(!u['End Date']||u['End Date']>=ymd(Date.now())))), tasks:A.publicTasks() }),
    staffData:req=>{ const s=need(req,['ADMIN','EMIS_OFFICER','CIRCUIT_SUPERVISOR','DIRECTOR']);
      const o={tasks:cp(tasks),schools:schools.filter(x=>scope(s,x)).map(strip),submissions:cp(subs.filter(x=>scope(s,x))),enrolment:cp(REC.Enrolment.filter(x=>x.Year===YR&&x.Period===CUR&&scope(s,x))),year:YR,period:CUR,periods:PER,office:cp(OFFICE)}; if(s.role==='ADMIN') o.users=users.map(strip); return o; },
    officerStart:req=>{ const sid=String(req.staffId||'').trim(), id=normSid(sid); if(!id) throw new Error('Enter your Staff ID.');
      const rec=REC.Officers.find(r=>normSid(r['Staff ID'])===id), dir=REC.DirStaff.find(r=>normSid(r['Staff ID'])===id); const dg=v=>String(v||'').replace(/\D/g,'').slice(-9);
      const onFile=rec?dg(rec['Telephone Number']):dir?dg(dir.Phone):''; if(onFile&&dg(req.phone)!==onFile) throw new Error('That phone number does not match the one on record for this Staff ID. Use the number you gave before, or ask the EMIS Officer.');
      const ticket='O'+Math.random().toString(36).slice(2); sess[ticket]={officer:rec?rec['Staff ID']:sid};
      let prefill=null; if(!rec&&dir){ const p=String(dir['Full Name']).split(/\s+/); prefill={'First Name':p[0],Surname:p.length>1?p[p.length-1]:'','Other Names':p.slice(1,-1).join(' '),Sex:dir.Gender,'Telephone Number':dir.Phone,'Current Rank':dir.Rank}; }
      return {ticket,staffId:rec?rec['Staff ID']:sid,record:rec?cp(rec):null,prefill,office:cp(OFFICE)}; },
    officerSubmit:req=>{ const t=sess[req.ticket]; if(!t||!t.officer) throw new Error('This form has expired.'); const d=req.data;
      const o={}; OFFDATA.H.forEach(h=>o[h]=d[h]??''); Object.assign(o,OFFICE,{'Staff ID':t.officer}); const nm=[o['First Name'],o['Other Names'],o.Surname].filter(Boolean).join(' ');
      let rec=REC.Officers.find(r=>normSid(r['Staff ID'])===normSid(t.officer)); const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let tl=''; for(let k=0;k<5;k++) tl+=c[Math.floor(Math.random()*c.length)];
      const no='AAN-'+ymd(Date.now()).slice(2).replace(/-/g,'')+'-'+tl;
      Object.assign(o,{'Receipt No':no,'Times Submitted':(rec?Number(rec['Times Submitted'])||1:0)+1,'Updated By':nm+' (self)','Updated At':iso(Date.now())});
      if(rec) Object.assign(rec,o); else { rec=Object.assign({'Record ID':'OFF'+(rid++),'EMIS Code':''},o); REC.Officers.push(rec); }
      const ds={'Full Name':nm,Gender:o.Sex,'Staff ID':t.officer,Rank:o['Current Rank'],Category:/non/i.test(o['Staff Status'])?'Non-teaching':'Teaching','Unit / Schedule':[o.Unit,o['Main Schedule']].filter(Boolean).join(' · '),Phone:o['Telephone Number']};
      const dr=REC.DirStaff.find(r=>normSid(r['Staff ID'])===normSid(t.officer)); if(dr) Object.assign(dr,ds); else REC.DirStaff.push(Object.assign({'Record ID':'DIR'+(rid++),'EMIS Code':''},ds));
      const r={'Receipt No':no,Module:'Officers',Form:'Education officers data',Year:YR,Period:'','EMIS Code':OFFICE['MMDEO EMIS Code'],'School Name':'Asante Akyem North Municipal Education Directorate',Circuit:'','Submitted By':nm+' (Staff ID '+t.officer+')',Role:'OFFICER','Submitted At':iso(Date.now()),Records:1,
        Summary:JSON.stringify([['Officer',nm],['Staff ID',t.officer],['Unit',o.Unit||'—'],['Schedule',o['Main Schedule']||'—'],['Current rank',o['Current Rank']||'—']])}; RCPT.push(r); return {receipt:cp(r),record:cp(rec)}; },
    saveAutoCheck:req=>{ need(req,['ADMIN','EMIS_OFFICER','CIRCUIT_SUPERVISOR']); const r=subs.find(x=>x['Submission ID']===req.id); if(!r) throw new Error('File not found.'); r['Auto Check']=req.check; r['Auto Remarks']=req.remarks; return true; },
    review:req=>{ const s=need(req,['ADMIN','EMIS_OFFICER','CIRCUIT_SUPERVISOR']); const r=subs.find(x=>x['Submission ID']===req.id); if(!r||!scope(s,r)) throw new Error('File not found.');
      Object.assign(r,{Status:req.status,Remark:req.remark||'',Reviewer:s.name,'Reviewed At':iso(Date.now())}); return true; },
    saveTask:req=>{ const s=need(req,['ADMIN','EMIS_OFFICER']); const t=req.task; if(!String(t.Title||'').trim()) throw new Error('Give the request a title.');
      t['Fills Tab']=FORMS[t['Fills Tab']]?t['Fills Tab']:'';
      const tp=req.template&&req.template.data?{'Template Name':req.template.name,'Template File ID':'tpl'}:req.removeTemplate?{'Template Name':'','Template File ID':''}:null;
      if(tp&&tp['Template Name']&&t['Task ID']) TPL[t['Task ID']]={name:req.template.name,mime:req.template.mime,data:req.template.data};
      const data={'Fills Tab':t['Fills Tab']||'',Title:t.Title.trim(),Description:t.Description||'',Levels:t.Levels||'All','Allowed Types':t['Allowed Types']||'any','Max Files':Number(t['Max Files'])||0,'Due Date':t['Due Date']||'',Status:t.Status};
      if(tp) Object.assign(data,tp);
      const ex=tasks.find(x=>x['Task ID']===t['Task ID']); if(ex){ Object.assign(ex,data); subs.forEach(x=>{ if(x['Task ID']===ex['Task ID']) x['Task Title']=data.Title; }); return ex['Task ID']; }
      const id='T'+Date.now().toString().slice(-8); tasks.push(Object.assign({'Task ID':id,'Created By':s.name,'Created At':iso(Date.now())},data)); return id; },
    taskFolder:()=>({url:'#'}),
    saveSchool:req=>{ need(req,['ADMIN','EMIS_OFFICER']); const x=req.school; if(!x['EMIS Code']||!x['School Name']) throw new Error('EMIS code and school name are required.');
      const clash=schools.find(s=>s['EMIS Code']===x['EMIS Code']);
      if(x.originalEmis){ const r=schools.find(s=>s['EMIS Code']===x.originalEmis); if(clash&&clash!==r) throw new Error('Another school already uses that EMIS code.'); ['EMIS Code','School Name','Level','Circuit','Head Name','Phone','Active'].forEach(k=>r[k]=x[k]); return {}; }
      if(clash) throw new Error('EMIS code already exists.'); const pw=tmp(); schools.push(Object.assign({pw,must:true,'Last Login':''},x)); return {tempPassword:pw}; },
    saveUser:req=>{ need(req,['ADMIN']); const x=req.user; x.Email=String(x.Email).toLowerCase(); if(!x.Email||!x['Full Name']) throw new Error('Email and full name are required.');
      if(x.Role==='CIRCUIT_SUPERVISOR'&&!x.Circuit) throw new Error('Circuit supervisors need a circuit.');
      if(x.originalEmail){ const r=users.find(u=>u.Email===x.originalEmail); ['Email','Full Name','Role','Circuit','Phone','Active'].forEach(k=>r[k]=x[k]); return {}; }
      if(users.some(u=>u.Email===x.Email)) throw new Error('That email is already used.'); const pw=tmp(); users.push(Object.assign({pw,must:true},x)); return {tempPassword:pw}; },
    resetPassword:req=>{ need(req,['ADMIN','EMIS_OFFICER']); const r=req.kind==='school'?schools.find(s=>s['EMIS Code']===req.id):users.find(u=>u.Email===req.id); const pw=tmp(); r.pw=pw; r.must=true; return {tempPassword:pw}; }
  };
  return { call: body => new Promise(res => setTimeout(() => {
    try{ const fn=A[body.action]; if(!fn) throw new Error('Unknown action.'); res({ok:true,data:fn(body)}); }
    catch(e){ res({ok:false,error:e.message}); } }, 220)) };
})();

/* ------------------------------ start ------------------------------ */
function applyDeep(){
  if(!S.deep) return;
  if(S.user.role==='SCHOOL') S.tab=S.deep; else S.tab=STAFF_TAB_OF[S.deep]||'home';
  S.deep=null; try{ history.replaceState(null,'',baseUrl()); }catch(e){}
}
(function start(){
  const qp=new URLSearchParams(location.search); S.deep=qp.get('tab'); S.verify=qp.get('receipt');
  if(qp.has('officer')){ try{ history.replaceState(null,'',baseUrl()); }catch(e){} S.token=null; renderLogin(); openOfficerForm(); return; }
  if(qp.has('status')){ try{ history.replaceState(null,'',baseUrl()); }catch(e){} S.token=null; renderLogin(); statusModal(); return; }
  if(qp.has('submit')){ const id=qp.get('submit'); try{ history.replaceState(null,'',baseUrl()); }catch(e){} S.token=null; renderLogin(); openWizard(id||''); return; }
  const saved = DEMO ? null : load('fp_session');   // demo data resets on reload, so demo sessions do too
  if(saved && saved.token && !S.verify){ S.token=saved.token; S.user=saved.user; S.mustChange=saved.mustChange; S.mustSetPin=!!saved.mustSetPin; if(S.deep) applyDeep(); boot(); }
  else renderLogin();
})();
</script>
