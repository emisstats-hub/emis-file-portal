<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GES Data Submission Portal · Asante Akyem North</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#0d2f2a; --navy2:#14453d; --teal:#1a9c7a; --teal-bg:#dff4ec; --indigo:#4f46e5; --gold:#d4a52b; --gold2:#f3e2b3;
  --bg:#f5f4ef; --card:#fff; --line:#e6e1d6; --text:#1c2433; --muted:#5f6b7d;
  --green:#1f7a52; --green-bg:#e3f4ec; --red:#b8322a; --red-bg:#fbe7e5;
  --amber:#9a6412; --amber-bg:#fdf0d8; --blue:#23579a; --blue-bg:#e5eefa; --grey:#5f6b7d; --grey-bg:#eef0f3;
  --radius:12px; --shadow:0 1px 2px rgba(19,33,63,.06),0 4px 16px rgba(19,33,63,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hidden{display:none!important}

/* ---------- buttons, inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cfc7b6}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1405}
.btn.danger{color:var(--red)}
.btn.ok{color:var(--green)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.inp{width:100%;border:1px solid #d9d3c5;border-radius:10px;padding:11px 13px;background:#fff;outline:none}
.inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(19,33,63,.1)}
select.inp{padding:9px 12px}
.pw-wrap{position:relative}
.pw-wrap .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--muted);padding:6px}

/* ---------- pills ---------- */
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.pill.grey{background:var(--grey-bg);color:var(--grey)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:12px;color:var(--muted);margin:2px 4px 2px 0;background:#fff}

/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-hero{background:radial-gradient(circle at 10% 5%,#1d5c50 0,transparent 45%),var(--navy);color:#e8ecf5;padding:56px 72px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-hero::after{content:"";position:absolute;right:-160px;bottom:-160px;width:420px;height:420px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 60px rgba(255,255,255,.02)}
.brand-line{font-family:"Source Serif 4",serif;font-size:20px;color:#c7cfe0}
.brand-line b{color:var(--gold);font-weight:600}
.hero-text h1{font-size:54px;line-height:1.1;color:#fff}
.hero-text h1 em{font-style:normal;color:var(--gold)}
.hero-text p{max-width:470px;font-size:17px;color:#c7cfe0;margin-top:22px}
.hero-text p b{color:var(--gold)}
.hero-foot{font-size:14px;color:#aab4c9}
.hero-foot .caps{letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:8px;font-family:"Source Serif 4",serif}
.auth-main{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-card{width:100%;max-width:520px}
.auth-card h2{font-size:36px;margin-bottom:16px}
.note{border:1px solid #efe6cf;background:#fbf7ec;border-radius:12px;padding:12px 16px;color:var(--muted);font-size:14px}
.note b{color:var(--amber)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;border:1px solid var(--line);border-radius:12px;padding:5px;margin:22px 0 4px;background:#fff}
.seg button{border:0;background:none;padding:11px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.auth-card .submit{width:100%;justify-content:center;padding:14px;font-size:16px;margin-top:22px;border-radius:11px}
.help{font-size:13px;color:var(--muted);text-align:right;margin-top:8px}
.err{color:var(--red);font-size:14px;margin-top:12px;min-height:20px}
.demo{margin-top:22px;border:1px dashed #cdbf98;border-radius:12px;padding:12px 16px;font-size:13px;background:#fffdf6}
.demo table{border-collapse:collapse;width:100%;margin-top:6px}
.demo td{padding:3px 6px 3px 0;vertical-align:top}
.demo code{background:#f3eee0;padding:1px 5px;border-radius:4px;cursor:pointer}
.fab{position:fixed;right:24px;bottom:24px;z-index:20;box-shadow:0 8px 24px rgba(212,165,43,.35);border-radius:14px;padding:13px 22px;font-size:16px}
.pop{position:fixed;right:24px;bottom:86px;z-index:21;width:min(420px,calc(100vw - 32px));background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(19,33,63,.2);padding:18px;max-height:70vh;overflow:auto}
.pop h3{font-family:Inter,sans-serif;font-size:18px}
.pop .item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.pop .item b{display:block}

/* ---------- side menu, profile, chips ---------- */
.hamb{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;width:42px;height:42px;border-radius:11px;font-size:20px;cursor:pointer;flex:none}
.ybadge{display:flex;align-items:center;background:#fff;border-radius:12px;padding:6px 4px;font-weight:700;font-size:14px;white-space:nowrap}
.ybadge span{padding:0 10px}.ybadge span+span{border-left:1px solid var(--line)}
.yb-y{color:#4338ca}.yb-t{color:var(--green)}.yb-m{color:var(--amber)}
.avwrap{position:relative}
.avatar{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:#13213f;color:var(--gold);font-family:"Source Serif 4",serif;font-weight:700;cursor:pointer}
.avmenu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;color:var(--text);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.2);min-width:230px;padding:6px;z-index:40}
.avmenu .avh{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;flex-direction:column}
.avmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:15px}
.avmenu button:hover{background:#f4f6f5}.avmenu .danger{color:var(--red)}
.drawer-bg{position:fixed;inset:0;background:rgba(10,16,30,.45);backdrop-filter:blur(2px);z-index:45}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(330px,88vw);background:#13213f;color:#e8ecf5;z-index:46;transform:translateX(-102%);transition:transform .22s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dr-h{padding:24px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.dr-h b{display:block;font-family:"Source Serif 4",serif;font-size:22px}.dr-h span{color:var(--gold);font-size:14px}
.dr-list{flex:1;overflow:auto;padding:12px}
.dr-i{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:inherit;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left}
.dr-i:hover,.dr-g.on>.dr-i{background:rgba(255,255,255,.08)}
.dr-ic{width:24px;text-align:center}.dr-car{margin-left:auto;transition:.2s}
.dr-g.open .dr-car{transform:rotate(90deg)}
.dr-sub{display:none;margin:2px 0 6px 34px;border-left:1px solid rgba(255,255,255,.12)}
.dr-g.open .dr-sub{display:block}
.dr-sub button{display:block;width:100%;text-align:left;border:0;background:none;color:#c7cfe0;font:inherit;padding:8px 14px;cursor:pointer;border-radius:8px}
.dr-sub button:hover{color:#fff;background:rgba(255,255,255,.06)}
.dr-f{padding:16px;border-top:1px solid rgba(255,255,255,.08)}
.dr-f .btn{background:#2a1520;border-color:#5b2333;color:#ffb4b4;justify-content:center}
.chips-wrap{max-width:1320px;margin:14px auto 0;padding:0 24px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips .cap{margin-right:6px}
.chip-t{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px}
.chip-t.on{background:linear-gradient(135deg,#4f46e5,#6d63e8);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.xlbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.job p{margin:8px 0 14px}
/* ---------- quick submission ---------- */
.quick-cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;cursor:pointer;margin-bottom:22px;padding:16px 18px;border-radius:16px;
  background:linear-gradient(135deg,#f6d77a,var(--gold));color:#1b1405;box-shadow:0 10px 26px rgba(212,165,43,.35);font:inherit}
.quick-cta:hover{filter:brightness(1.03)}
.quick-cta .qi{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.55);display:grid;place-items:center;font-size:22px;flex:none}
.quick-cta b{display:block;font-size:17px}
.quick-cta .small{display:block;color:#4a3a10}
.quick-cta .qgo{margin-left:auto;font-size:28px;font-weight:700}
.modal-card.wiz{max-width:760px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:-4px 0 18px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--muted)}
.step span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--grey-bg)}
.step.on span{background:var(--navy);color:#fff}
.step.done span{background:var(--green);color:#fff}
.step.on small{color:var(--text);font-weight:700}
.qlist{display:grid;gap:10px;max-height:52vh;overflow:auto;padding:2px}
.qcard{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.qcard.sel{cursor:pointer}
.qcard.sel:hover,.qcard.sel:focus{border-color:var(--teal);background:#f6fcf9;outline:none}
.qcard .qt{font-size:17px}
.qcard .qgo{margin-left:auto;color:var(--teal);font-weight:700}
.inp.big{padding:13px 14px;font-size:17px}
.btn.big{padding:12px 20px;font-size:16px}
.drop.big{display:block;padding:30px 18px;border-width:2.5px}
.rc-sum div.str{grid-column:1/-1}
.rc-sum div.str b{font-size:14px;word-break:break-all}
/* ---------- enrolment editor & wide table ---------- */
.eh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#egrid tr.cls-first td{border-top:2px solid var(--line)}
#egrid .gin{width:86px}
.wide-wrap{max-height:70vh;overflow:auto}
.wide-t{font-size:13px}
.wide-t th,.wide-t td{padding:7px 8px;white-space:nowrap}
.wide-t th.grp{text-align:center;border-left:1px solid var(--line);background:#f1f6f3;color:var(--text)}
.wide-t thead tr:first-child th{position:sticky;top:0;z-index:2}
.wide-t thead tr:nth-child(2) th{position:sticky;top:33px;z-index:2}
.wide-t .stick{position:sticky;left:0;background:#fff;z-index:1;min-width:190px;white-space:normal;box-shadow:1px 0 0 var(--line)}
.wide-t thead .stick{z-index:3;background:#faf8f3}
.wide-t td.tcol{background:#f7faf8;border-right:1px solid var(--line)}
.wide-t tfoot td{background:#faf8f3;border-top:2px solid var(--line);position:sticky;bottom:0}
/* ---------- receipts ---------- */
.receipt{border:1px solid var(--line);border-radius:14px;padding:20px;background:#fff;position:relative;overflow:hidden}
.receipt::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--gold),#6d63e8,var(--teal))}
.rc-h{display:flex;gap:12px;align-items:center}
.rc-h .mk{width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.rc-title{margin-top:16px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rc-no{font-family:ui-monospace,monospace;font-size:24px;font-weight:700;letter-spacing:.05em;color:var(--navy)}
.rc-t{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.rc-t td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.rc-t td:first-child{color:var(--muted);width:130px}
.rc-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:14px}
.rc-sum div{background:#f6f9f7;border:1px solid #e1ece6;border-radius:10px;padding:8px 10px}
.rc-sum span{display:block;font-size:12px;color:var(--muted)}
.rc-sum b{font-size:18px}
.rc-link{word-break:break-all;color:var(--text)}
.banner.ok{background:#e9f7f0;border-color:#b9e2cd;color:#155f40}
.banner.bad{background:var(--red-bg);border-color:#f0c2bd;color:var(--red)}
.kbtn{text-align:left;cursor:pointer;font:inherit;color:inherit}
.kbtn.on{border-color:var(--teal);box-shadow:inset 0 3px 0 var(--teal);background:#f3fbf8}
@media print{
  body *{visibility:hidden}
  #receipt,#receipt *{visibility:visible}
  #receipt{position:absolute;left:0;top:0;width:100%;border:0}
  .modal{position:static;background:none}
}
/* ---------- notices, modules ---------- */
.auth-col{width:100%;max-width:520px}
.notices{margin-top:26px;border:1px solid var(--line);background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.nb-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);background:#f7fbf9}
.nb-tabs{margin-left:auto;display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.nb-tabs button{border:0;background:none;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.nb-tabs button.on{background:var(--navy);color:#fff}
.nb-list{max-height:260px;overflow:auto}
.nb-i{padding:11px 14px;border-bottom:1px solid #f0ece2}
.nb-i:last-child{border-bottom:0}
.nb-t{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.upd{display:flex;gap:14px;align-items:flex-start;padding:14px 20px;border-bottom:1px solid #f0ece2}
.upd:last-child{border-bottom:0}
.grid-t .gin{width:96px;text-align:right;padding:7px 9px;border-radius:8px;margin-left:auto;display:block}
.grid-t tfoot td{background:#faf8f3;border-top:2px solid var(--line)}
.modal-card.wide{max-width:820px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:18px}
.g3 .donut{gap:16px}
.g3 .donut svg{width:118px;height:118px}
.nav-row{max-width:1320px;margin:0 auto;padding:0 0 10px}
.nav-row .nav{flex-wrap:wrap;overflow:visible}
/* ---------- app shell ---------- */
.top{background:var(--navy);color:#fff;padding:0 20px;position:sticky;top:0;z-index:30}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:62px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Source Serif 4",serif;font-size:16px;white-space:nowrap}
.logo .mk{width:34px;height:34px;border-radius:9px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:11px;font-family:Inter}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;color:#cfe3dd;font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.nav button:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav button.on{background:var(--teal);color:#fff}
.nav .nb{background:#e0443a;color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:inline-grid;place-items:center}
.right{display:flex;align-items:center;gap:8px;margin-left:auto}
.scope-badge{background:#fff;color:var(--text);border-radius:10px;padding:5px 12px;line-height:1.2;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.scope-badge small{display:block;font-size:10px;letter-spacing:.08em;color:var(--teal);font-weight:700;text-transform:uppercase}
.scope-badge b{font-size:13px}
.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.scopebar-wrap{max-width:1320px;margin:18px auto 0;padding:0 24px}
.scopebar{background:linear-gradient(90deg,#d6eefb,#def5ec);border:1px solid #a9d7ea;border-radius:16px;padding:10px}
.scope-in{background:rgba(255,255,255,.8);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:#8a8f99;display:inline-block;flex:none}
.serif{font-family:"Source Serif 4",serif;font-size:17px}
.scope-dd{position:relative}
.scope-btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid #8fd8bf;background:#fff;border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:14px}
.scope-btn .cnt{background:var(--teal);color:#fff;border-radius:999px;padding:0 8px;font-size:12px;font-weight:700}
.scope-btn .car{color:var(--muted)}
.scope-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:25;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(13,47,42,.18);padding:8px;min-width:270px}
.scope-menu label{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.scope-menu label:hover{background:#f2f8f5}
.sm-h{display:flex;justify-content:space-between;padding:4px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.lnk{border:0;background:none;color:var(--teal);font-weight:700;cursor:pointer;padding:0;font-size:13px}
.own{display:flex;align-items:center;gap:2px;margin-left:auto;background:#fff;border-radius:999px;padding:4px;border:1px solid var(--line)}
.own .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px;font-weight:700}
.own button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.own button.on{background:var(--navy2);color:#fff}
.subtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px;font-weight:600;cursor:pointer;font-size:14px}
.subtabs button.on{background:linear-gradient(90deg,var(--navy2),var(--teal));color:#fff;border-color:transparent}
.card.accent{position:relative;overflow:hidden}
.card.accent::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--gold),#6d63e8,var(--teal))}
.sec-t{display:flex;align-items:center;gap:8px;font-family:"Source Serif 4",serif;font-size:19px;font-weight:700}
.cap{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.donut{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.donut .dv{font-family:"Source Serif 4",serif;font-size:24px;font-weight:700;fill:var(--text)}
.dleg{flex:1;min-width:180px}
.dl{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px}
.dl i{width:10px;height:10px;border-radius:50%;flex:none}
.dl b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.blist{max-height:320px;overflow:auto;padding-right:6px}
.br{display:grid;grid-template-columns:150px 1fr 48px;gap:12px;align-items:center;padding:5px 0;font-size:13px}
.bk{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:9px;background:#ecebf3;border-radius:9px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:9px;min-width:6px}
.br b{text-align:right;font-variant-numeric:tabular-nums}
.att{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;margin-bottom:8px;cursor:pointer;text-align:left;font-size:14px}
.att:hover{border-color:#a9d9c8;background:#fbfdfc}
.att .cnt{min-width:42px;text-align:center;border-radius:999px;font-weight:700;font-size:12px;padding:2px 8px}
.cnt.bad{background:var(--red-bg);color:var(--red)} .cnt.ok{background:var(--green-bg);color:var(--green)}
.hero{display:inline-flex;gap:16px;align-items:center;border:1px solid #dcd9f6;background:linear-gradient(135deg,#f6f5ff,#fff);border-radius:14px;padding:18px 24px;box-shadow:inset 0 3px 0 #6d63e8}
.hero .ic{width:52px;height:52px;border-radius:12px;background:#5b54e0;color:#fff;display:grid;place-items:center}
.hero .n{font-family:"Source Serif 4",serif;font-size:34px;font-weight:700;color:#4b45c6;line-height:1}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:12px}
.cc{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;cursor:pointer;box-shadow:inset 0 3px 0 var(--teal);text-align:left;font:inherit;color:inherit}
.cc:hover{border-color:#a9d9c8}
.cc.on{border-color:var(--teal);background:#f1fbf7}
.cc .top2{display:flex;justify-content:space-between;align-items:center}
.cc .ic{width:40px;height:40px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center}
.cc .n{font-family:"Source Serif 4",serif;font-size:28px;font-weight:700}
.cc .chip2{display:inline-block;background:var(--teal-bg);color:#0f6a50;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin:12px 0 10px}
.cc .bar i{background:var(--teal)}
.banner{background:#fdf2e3;border:1px solid #f0d6ad;color:#7a4d0e;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:500}
.banner a{color:inherit;font-weight:700}
.wrap{max-width:1320px;margin:0 auto;padding:20px 24px 40px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h h2{font-size:28px}
.page-h p{margin:4px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-size:30px;font-weight:700;font-family:"Source Serif 4",serif;margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-family:Inter,sans-serif;font-size:16px}
.card-b{padding:18px 20px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- school task cards ---------- */
.tasks{display:grid;gap:18px}
.task-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.task-top h3{font-family:Inter,sans-serif;font-size:18px}
.task-desc{color:var(--muted);margin:8px 0 10px;white-space:pre-line}
.files{border-top:1px solid var(--line);margin-top:14px}
.file{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f0ece2}
.file:last-child{border-bottom:0}
.ficon{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;text-transform:uppercase}
.ficon.excel{background:#e3f4ec;color:#1f7a52}.ficon.pdf{background:#fbe7e5;color:#b8322a}.ficon.image{background:#efe7fb;color:#6b3fb0}
.ficon.word{background:#e5eefa;color:#23579a}.ficon.other{background:var(--grey-bg);color:var(--grey)}
.fmeta{flex:1;min-width:0}
.fmeta .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta .s{font-size:12px;color:var(--muted)}
.remark{font-size:13px;color:var(--red);margin-top:2px}
.fact{display:flex;gap:6px;flex-wrap:wrap}
.drop{margin-top:14px;border:2px dashed #d7cfbd;border-radius:12px;padding:18px;text-align:center;background:#fcfbf7;cursor:pointer;transition:.15s}
.drop.over{border-color:var(--gold);background:#fff8e6}
.drop b{color:var(--navy)}
.queue{margin-top:10px;font-size:14px}
.queue .q{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dotted var(--line)}
.up-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.up-row input{flex:1;min-width:200px}

/* ---------- tables ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters .inp{width:auto;min-width:150px}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:#faf8f3;white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid #f0ece2;vertical-align:top}
table.t tr:hover td{background:#fcfbf7}
.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:36px;text-align:center;color:var(--muted)}
.bar{height:9px;background:#eeeae0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px}
.prog-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid #f0ece2}
.prog-row:last-child{border-bottom:0}

/* ---------- modal & toast ---------- */
.modal{position:fixed;inset:0;background:rgba(15,22,40,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal-card{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-card h3{font-size:22px;margin-bottom:4px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;gap:6px;align-items:center;font-size:14px}
.temp{font-family:ui-monospace,monospace;font-size:24px;letter-spacing:.12em;background:#fbf7ec;border:1px solid #efe6cf;border-radius:10px;padding:12px;text-align:center;margin:14px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;z-index:60;transition:.25s;max-width:90vw;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.bad{background:var(--red)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:60px;text-align:center;color:var(--muted)}

table.t th.num{text-align:right}

}

/* PIN, declared totals, data checks */

.pin-h{display:flex;gap:12px;align-items:center;margin-bottom:12px}.pin-ic{font-size:30px;width:52px;height:52px;border-radius:14px;background:#fff6dc;display:grid;place-items:center}

.qrole{margin-top:12px}

.quick-cta.alt{background:#fff;border:1px solid var(--line);color:var(--text);margin-top:-6px}

.stlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}

a.nolink{text-decoration:none;display:inline-block;margin-top:4px}
.remark{white-space:pre-line}

.lvtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.lvtab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit;color:inherit}
.lvtab b{font-size:15px}.lvtab span{font-size:13px;color:var(--muted)}.lvtab i{font-style:normal;font-weight:700;color:var(--text);font-size:17px}

@media (max-width:760px){.lvtabs{grid-template-columns:1fr 1fr}}

.of-steps{grid-template-columns:repeat(7,1fr)}.of-steps small{font-size:11px}

table.rt.sm{margin-top:6px}.rt-tot td{background:#faf8f3;font-weight:700}
.inp.bad{border-color:var(--red)!important;background:#fff6f5}

.rt-cr{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.rt-crh{display:flex;align-items:center;justify-content:space-between;gap:10px}.rt-crh .inp{width:110px}

@media (max-width:640px){ .rt-steps small{display:none} .rt-prog{grid-template-columns:110px 1fr 46px} }

/* ---------- sign-in page polish ---------- */
.brand-line{display:flex;align-items:center;gap:12px}
.crest{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#f6d77a,var(--gold));color:#1b1405;font:800 13px/1 Inter,system-ui,sans-serif;letter-spacing:.04em;box-shadow:0 6px 18px rgba(212,165,43,.35)}
.hello{color:#9fd8c4;font-size:14px;letter-spacing:.02em;margin-bottom:14px}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hs{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 14px;min-width:120px}
.hs b{display:block;font-size:22px;color:#fff;font-family:"Source Serif 4",serif}.hs span{font-size:12.5px;color:#b8c3d6}
.hs.new{border-color:rgba(246,215,122,.6);background:rgba(246,215,122,.12)}.hs.new b{color:var(--gold)}
.hs.hot{border-color:rgba(255,140,120,.6);background:rgba(255,120,100,.12)}.hs.hot b{color:#ffb4a6}
.how{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:10px;max-width:470px}
.how li{display:flex;gap:12px;align-items:center}.how li span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(26,156,110,.25);color:#7fe0b9;font-weight:700;flex:none}
.how li b{color:#fff;font-size:15px}.how li small{display:block;color:#aab4c9;font-size:13px}
.help-wa{display:inline-block;margin-top:20px;color:#bff0dc;border:1px solid rgba(127,224,185,.4);border-radius:999px;padding:8px 14px;text-decoration:none;font-size:14px}.help-wa:hover{background:rgba(127,224,185,.12)}
.kab{margin-top:14px;font-size:12px;letter-spacing:.08em;color:#8fa0bd;text-transform:uppercase}.kab b{color:#e8ecf5;letter-spacing:.04em}
.auth-foot{margin-top:18px;text-align:center;font-size:12.5px;color:var(--muted)}.kab2 b{color:var(--navy)}
/* coloured action cards: each its own colour on hover / touch */
.quick-cta{--cta:#d4a52b;transition:transform .15s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease;position:relative}
.quick-cta .qgo{transition:transform .2s ease}
.quick-cta:hover,.quick-cta:focus-visible{transform:translateY(-2px);outline:none}
.quick-cta:hover .qgo,.quick-cta:focus-visible .qgo{transform:translateX(4px)}
.quick-cta:active{transform:scale(.985)}
.quick-cta.c-gold:hover,.quick-cta.c-gold:focus-visible{box-shadow:0 14px 32px rgba(212,165,43,.5);filter:saturate(1.15)}
.quick-cta.alt.c-indigo{--cta:#4f46e5}.quick-cta.alt.c-teal{--cta:#0f8f72}.quick-cta.alt.c-rose{--cta:#d1495b}
.quick-cta.alt:hover,.quick-cta.alt:focus-visible{border-color:var(--cta);box-shadow:0 12px 28px color-mix(in srgb,var(--cta) 22%,transparent);background:color-mix(in srgb,var(--cta) 6%,#fff)}
.quick-cta.alt:hover .qi,.quick-cta.alt:focus-visible .qi{background:var(--cta);color:#fff}
.quick-cta.alt:hover b,.quick-cta.alt:focus-visible b,.quick-cta.alt:hover .qgo{color:var(--cta)}
.quick-cta.alt .qi{transition:background .2s ease,color .2s ease}
/* NEW badge that blinks */
.newb{display:inline-block;font:800 10.5px/1 Inter,system-ui,sans-serif;letter-spacing:.06em;color:#fff;background:#e5484d;border-radius:999px;padding:4px 8px;margin-left:6px;vertical-align:middle;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(229,72,77,.55)}50%{opacity:.55;box-shadow:0 0 0 6px rgba(229,72,77,0)}}
.nb-i.clk{cursor:pointer;transition:background .15s ease}.nb-i.clk:hover,.nb-i.clk:focus-visible{background:#fff8e6;outline:none}
.nb-i.is-new{border-left:4px solid #e5484d}
/* sign-in tabs and button */
.login-seg button{transition:background .2s ease,color .2s ease}
.login-seg button:not(.on):hover{background:#eef6f2;color:var(--text)}
.login-seg button[data-k="school"].on{background:linear-gradient(135deg,#0f8f72,#1a9c6e)}
.login-seg button[data-k="staff"].on{background:linear-gradient(135deg,#4f46e5,#6d63e8)}
#lbtn{transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
#lbtn:hover{background:linear-gradient(135deg,var(--navy2),#1a9c6e);box-shadow:0 10px 24px rgba(15,60,50,.3)}
#lbtn:active{transform:scale(.99)}
.fab{transition:transform .15s ease,box-shadow .2s ease}.fab:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 14px 30px rgba(212,165,43,.5)}
@media (prefers-reduced-motion:reduce){ .newb{animation:none} .quick-cta,.fab,#lbtn{transition:none} }
@media (max-width:860px){ .how,.hero-stats{display:none} }

.cta-grid .quick-cta.alt .small{font-size:12.5px;line-height:1.35}
.cta-grid .quick-cta.alt .qgo{font-size:22px}

  .hero-text p{font-size:15px;margin-top:10px}

  .auth-hero .notices{flex:1;min-height:150px;display:flex;flex-direction:column}
  .auth-hero .nb-list{max-height:none;flex:1;min-height:0;overflow:auto}
  .auth-hero .how{display:none}
  .help-wa{margin-top:12px;align-self:flex-start}
  .hero-foot{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}.hero-foot .caps,.kab{margin-top:0}
  .auth-main{align-items:flex-start;padding:28px 28px}
  .auth-col{max-width:580px}
  .auth-card h2{font-size:28px;margin-bottom:10px}
}
@media (min-width:861px) and (max-height:760px){ .hero-text p{display:none} }
/* ---------- help assistant ---------- */
.hb-btn{position:fixed;left:20px;bottom:20px;z-index:45;display:flex;align-items:center;gap:8px;border:0;cursor:pointer;background:var(--navy);color:#fff;font:700 15px/1 Inter,system-ui,sans-serif;padding:13px 18px;border-radius:999px;box-shadow:0 10px 26px rgba(15,40,35,.35);transition:transform .15s ease,box-shadow .2s ease}
.hb-btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(15,40,35,.45)}
.hb-btn.on{background:#0f8f72}
.hb-dot{width:9px;height:9px;border-radius:50%;background:#39d98a;box-shadow:0 0 0 0 rgba(57,217,138,.6);animation:hbp 2s infinite}
@keyframes hbp{0%{box-shadow:0 0 0 0 rgba(57,217,138,.6)}70%{box-shadow:0 0 0 8px rgba(57,217,138,0)}100%{box-shadow:0 0 0 0 rgba(57,217,138,0)}}
.hb-panel{position:fixed;left:20px;bottom:78px;z-index:46;width:380px;max-width:calc(100vw - 32px);height:min(600px,calc(100vh - 110px));background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(10,30,25,.35);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.hb-panel.hidden{display:none}
.hb-h{display:flex;gap:10px;align-items:center;padding:12px 14px;background:linear-gradient(135deg,var(--navy),#145a4a);color:#fff}
.hb-h .small{color:#bfe6d8}.hb-av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:18px}
.hb-x{margin-left:auto;background:none;border:0;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px}.hb-x:hover{background:rgba(255,255,255,.15)}
.hb-msgs{flex:1;overflow:auto;padding:12px;background:#f6f8f7;display:flex;flex-direction:column;gap:10px}
.hb-m{display:flex;flex-direction:column;max-width:92%}
.hb-m.me{align-self:flex-end}.hb-m.me .hb-b{background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.hb-b{background:#fff;border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:4px;padding:9px 12px;font-size:14px;line-height:1.5}
.hb-m.me .hb-b{border:0}
.hb-b ul,.hb-b ol{margin:6px 0 4px 18px;padding:0}.hb-b li{margin:3px 0}
.hb-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hb-chips button{border:1px solid #bfe0d4;background:#fff;color:#0f6b55;border-radius:999px;padding:6px 11px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.hb-chips button:hover{background:#0f8f72;color:#fff;border-color:#0f8f72}
.hb-act{display:inline-block;margin:8px 6px 0 0;border:0;background:#0f8f72;color:#fff;border-radius:10px;padding:8px 12px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none}
.hb-act:hover{filter:brightness(1.08)}
.hb-sch{background:#eef7f3;border-radius:10px;padding:6px 9px;margin-bottom:8px;font-size:13px}
.hb-file{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:#fff}
.hb-file.bad{border-color:#f2b8b5;background:#fff7f6}
.hb-why{margin-top:6px;font-size:13.5px}
.hb-in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);background:#fff}
.hb-in .inp{flex:1;margin:0}.hb-in .btn{padding:0 14px}
@media (max-width:600px){ .hb-btn .hb-l{display:none} .hb-btn{padding:13px 15px} .hb-panel{left:8px;right:8px;width:auto;bottom:74px;height:calc(100vh - 96px)} }
@media print{ .hb-btn,.hb-panel{display:none!important} }
.crest-img{width:52px;height:52px;padding:0;background:#fff;border-radius:50%;object-fit:contain;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.mk-img{background:#fff!important;border-radius:50%!important;object-fit:contain;padding:0}
.logo .mk-img{width:38px;height:38px}.rc-h .mk-img{width:46px;height:46px}
.rt-xl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:linear-gradient(135deg,#fff8e1,#fdf0c4);border:1px solid #f0d27a;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.rt-xlb{cursor:pointer;white-space:nowrap}
#modalCard.xwide{max-width:min(1400px,96vw)}
.t.sm td,.t.sm th{padding:6px 6px;vertical-align:top}.inp.sm{padding:6px 8px;font-size:13px;min-width:90px}
</style>

/* ------------------------------ helpers ------------------------------ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(d){ if(!d) return '—'; const x=new Date(d); return isNaN(x)?esc(d):x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDT(d){ if(!d) return '—'; const x=new Date(d); return isNaN(x)?esc(d):x.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function fmtSize(kb){ kb=Number(kb)||0; return kb>=1024?(kb/1024).toFixed(1)+' MB':Math.max(1,Math.round(kb))+' KB'; }
const extOf = n => (String(n).toLowerCase().match(/\.([a-z0-9]+)$/)||[,''])[1];
function kindOf(e){ for(const k of ['excel','pdf','image','word']) if(TYPE_MAP[k].includes(e)) return k; return 'other'; }
function typeList(t){ return String(t||'any').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean); }
function allowedExts(t){ const l=typeList(t); if(!l.length||l.includes('any')) return null; return l.flatMap(k=>TYPE_MAP[k]||[]); }
function levelsMatch(tl, sl){ const t=String(tl||'All').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean); if(!t.length||t.includes('all')) return true; const L=parseLevels(sl).map(x=>x.toLowerCase()); return !L.length||L.some(x=>t.includes(x)); }
function dueInfo(t){
  if(t.Status!=='Open') return {cls:'grey',text:'Closed'};
  if(!t['Due Date']) return {cls:'blue',text:'No deadline'};
  const d=new Date(t['Due Date']+'T23:59:59'); const days=Math.ceil((d-new Date())/864e5);
  if(days<0) return {cls:'red',text:`Overdue · was due ${fmtDate(t['Due Date'])}`};
  if(days<=1) return {cls:'amber',text:days===0?'Due today':'Due tomorrow'};
  if(days<=5) return {cls:'amber',text:`Due in ${days} days`};
  return {cls:'blue',text:'Due '+fmtDate(t['Due Date'])};
}
function agg(subs){ if(!subs.length) return 'Not submitted'; if(subs.some(s=>s.Status==='Rejected')) return 'Rejected'; if(subs.every(s=>s.Status==='Accepted')) return 'Accepted'; return 'Submitted'; }
const PILL = {'Not submitted':'grey','Submitted':'blue','Accepted':'green','Rejected':'red','Open':'green','Closed':'grey','Yes':'green','No':'grey'};
const pill = s => `<span class="pill ${PILL[s]||'grey'}">${esc(s==='Submitted'?'Awaiting review':s)}</span>`;
const isLate = (sub, task) => task && task['Due Date'] && new Date(sub['Submitted At']) > new Date(task['Due Date']+'T23:59:59');
const can = { manage: r => ['ADMIN','EMIS_OFFICER'].includes(r), review: r => ['ADMIN','EMIS_OFFICER','CIRCUIT_SUPERVISOR'].includes(r) };

function toast(msg, bad){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':''); clearTimeout(t._h); t._h=setTimeout(()=>t.className='toast',3200); }
function openModal(html){ $('#modalCard').innerHTML=html; $('#modal').classList.remove('hidden'); const f=$('#modalCard input,#modalCard textarea,#modalCard select'); if(f) f.focus(); }
function closeModal(){ $('#modal').classList.add('hidden'); $('#modalCard').innerHTML=''; $('#modalCard').className='modal-card'; }
$('#modal').addEventListener('mousedown', e => { if(e.target.id==='modal' && !S.mustChange && !S.mustSetPin) closeModal(); });
function store(k,v){ try{ v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(sessionStorage.getItem(k)); }catch(e){ return null; } }
function csv(rows, name){
  const txt = rows.map(r=>r.map(v=>{ v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\n');
  saveBlob(new Blob(['﻿'+txt],{type:'text/csv'}), name);
}
function saveBlob(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); }
function b64ToBlob(b64, mime){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime||'application/octet-stream'}); }
const readB64 = file => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(new Error('Could not read '+file.name)); r.readAsDataURL(file); });

/* ------------------------------ API ------------------------------ */
async function api(action, payload={}){
  const body = Object.assign({ action, token:S.token }, payload);
  let j;
  if(DEMO){ j = await Mock.call(body); }
  else {
    let res, txt='';
    try{ res = await fetch(CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), cache:'no-store' }); txt = await res.text(); }
    catch(e){ throw new Error('Could not reach the server. Check your internet connection and try again.'); }
    try{ j = JSON.parse(txt); }
    catch(e){ console.error('['+action+'] server reply:', txt); throw new Error(`The server sent an unexpected reply to “${action}”. Make sure the latest Code.gs is deployed as a new version.`); }
  }
  if(!j || !j.ok){
    if(j && j.error==='SESSION_EXPIRED'){ signOut(true); throw new Error('Your session expired. Please sign in again.'); }
    if(j && j.error==='SET_PIN'){ S.mustSetPin=true; setPinModal(); throw new Error('Choose your PIN first.'); }
    throw new Error((j&&j.error)||'Something went wrong.');
  }
  if(!('data' in j)) { console.error('['+action+'] reply without data:', j); throw new Error(`The server returned no data for “${action}”. Make sure the latest Code.gs is deployed as a new version.`); }
  return j.data;
}

// error box with a Try again button (keeps the real message so problems can be reported)
function showErr(e, retry){

function signOut(silent){
  if(S.token && !silent) api('logout').catch(()=>{});
  S.token=null; S.user=null; S.data=null; S.rec={}; S.tq={}; S.receipts=null; S.scope=null; S.own='all'; S.dir.sel.clear(); S.home=null; S.mustChange=false; S.mustSetPin=false; store('fp_session',null); closeModal(); renderLogin();
}

function changePwModal(forced){
  const P=S.user&&S.user.role==='SCHOOL'?'PIN':'password';
  openModal(`<h3>${forced?'Set a new '+P:'Change '+P}</h3>
    <p class="muted small">${forced?`You signed in with a temporary password. Choose your own ${P} to continue.`:`At least 6 characters${P==='PIN'?', not your Staff ID':''}.`}</p>
    <form id="cpf">
      <label class="f">Current ${P}</label><input class="inp" type="password" id="cp0" required>
      <label class="f">New ${P}</label><input class="inp" type="password" id="cp1" minlength="6" required>
      <label class="f">Type the new ${P} again</label><input class="inp" type="password" id="cp2" minlength="6" required>
      <div class="err" id="cperr"></div>
      <div class="modal-actions">${forced?'<button type="button" class="btn" onclick="signOut()">Sign out</button>':'<button type="button" class="btn" onclick="closeModal()">Cancel</button>'}<button class="btn primary" id="cpb">Save ${P}</button></div>
    </form>`);
  $('#cpf').onsubmit = async e => {
    e.preventDefault();
    if($('#cp1').value!==$('#cp2').value){ $('#cperr').textContent='The new passwords do not match.'; return; }
    $('#cpb').disabled=true;
    try{ await api('changePassword',{oldPassword:$('#cp0').value,newPassword:$('#cp1').value}); S.mustChange=false; store('fp_session',{token:S.token,user:S.user,mustChange:false}); closeModal(); toast(P==='PIN'?'PIN changed.':'Password changed.'); }
    catch(err){ $('#cperr').textContent=err.message; $('#cpb').disabled=false; }
  };
}

async function boot(){
  if(!S.token) return renderLogin();
  if(S.mustSetPin) return setPinModal();
  const fab=$('#qFab'); if(fab) fab.remove(); helpBot(S.user.role==='SCHOOL');
  if(S.user.role==='SCHOOL'){ if(!allTabs().some(t=>t[0]===S.tab)) S.tab='files'; $('#app').innerHTML=shell(null,false); wireTabs(); renderChips(); await loadSchool(); bgUpdates(); }
  else { await loadStaff(); }
  if(S.mustChange) changePwModal(true);
}

 * school phone — looks up the school's files: why one was returned, and how to sign in.        */
const HB = { open:false, log:[], wait:null, built:false };

function hbContactHTML(){ return hbPhone()?`<a class="hb-act" target="_blank" rel="noopener" href="${hbWa()}">💬 WhatsApp the EMIS Office · ${esc(hbPhone())}</a>`:'<span class="small muted">Call or visit the Municipal EMIS Office.</span>'; }
function helpBot(show){
  let b=$('#hbBtn');
  if(!show){ if(b) b.remove(); const p=$('#hbPanel'); if(p) p.remove(); HB.open=false; return; }
  if(b) return;
  b=document.createElement('button'); b.id='hbBtn'; b.type='button'; b.className='hb-btn'; b.setAttribute('aria-label','Help assistant');
  b.innerHTML='<span class="hb-dot"></span>💬 <span class="hb-l">Need help?</span>'; b.onclick=()=>hbToggle(); document.body.appendChild(b);
  const p=document.createElement('div'); p.id='hbPanel'; p.className='hb-panel hidden'; p.setAttribute('role','dialog'); p.setAttribute('aria-label','Help assistant');
  p.innerHTML=`<div class="hb-h"><div class="hb-av">🤖</div><div><b>Portal Help</b><div class="small">Answers in seconds · EMIS Office</div></div><button type="button" class="hb-x" aria-label="Close">✕</button></div>
    <div class="hb-msgs" id="hbMsgs" aria-live="polite"></div>
    <form class="hb-in" id="hbForm" autocomplete="off"><input id="hbText" class="inp" placeholder="Type your question…" maxlength="300"><button class="btn primary" aria-label="Send">➤</button></form>`;
  document.body.appendChild(p);
  $('.hb-x',p).onclick=()=>hbToggle(false);
  $('#hbForm').onsubmit=e=>{ e.preventDefault(); const t=$('#hbText').value.trim(); if(!t) return; $('#hbText').value=''; hbHear(t); };
  if(HB.log.length) hbDraw();
}
function hbToggle(on){ HB.open=on==null?!HB.open:on; const p=$('#hbPanel'); if(!p) return; p.classList.toggle('hidden',!HB.open); $('#hbBtn').classList.toggle('on',HB.open);
  if(HB.open&&!HB.log.length) hbHello(); if(HB.open) setTimeout(()=>{ const t=$('#hbText'); if(t&&innerWidth>700) t.focus(); },50); }
function openHelp(topic){ hbToggle(true); if(topic) hbRun(topic); }
// messages
function hbBot(html, chips){ HB.log.push({who:'bot',html,chips:chips||[]}); hbDraw(); }
function hbUser(text){ HB.log.push({who:'me',html:esc(text),chips:[]}); hbDraw(); }
function hbDraw(){
  const el=$('#hbMsgs'); if(!el) return; const last=HB.log.length-1;
  el.innerHTML=HB.log.map((m,i)=>`<div class="hb-m ${m.who}"><div class="hb-b">${m.html}</div>${i===last&&m.chips.length?`<div class="hb-chips">${m.chips.map(([l,k])=>`<button type="button" data-hb="${esc(k)}">${esc(l)}</button>`).join('')}</div>`:''}</div>`).join('');
  $$('[data-hb]',el).forEach(b=>b.onclick=()=>{ hbUser(b.textContent); hbRun(b.dataset.hb); });
  $$('[data-hbdo]',el).forEach(b=>b.onclick=()=>hbDo(b.dataset.hbdo, b.dataset));
  el.scrollTop=el.scrollHeight;
}

function hbHello(){
  const h=new Date().getHours(), g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';

function hbBtn(label, act, data){ return `<button type="button" class="hb-act" data-hbdo="${act}" ${Object.entries(data||{}).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')}>${label}</button>`; }
function hbDo(act, d){
  const out=()=>{ if(innerWidth<700) hbToggle(false); };

  if(act==='forgot'){ out(); if(hbSchool()) changePwModal(); else forgotPinModal(); }

  if(act==='offform'){ out(); openOfficerForm(); }

];
function hbRun(k){
  if(k==='menu') return hbBot('What else can I help with?', HB_MAIN());
  if(k.startsWith('chk:')) return hbAsk(k.slice(4));
  if(k.startsWith('other:')){ HB.wait={step:'emis', then:k.slice(6)}; return hbBot('Type the other school\'s <b>EMIS code</b>.'); }
  const t=HB_TOPICS.find(x=>x.k===k); if(t) t.run();
}
function hbHear(text){
  hbUser(text);
  if(HB.wait) return hbAnswerWait(text);
  const q=text.toLowerCase();
  if(/^\d{6,12}$/.test(q.replace(/\s/g,''))){ HB.wait={step:'phone', then:'returned', emis:q.replace(/\s/g,'')}; return hbBot('Thanks. Now type the <b>school phone number</b> the EMIS Office has.'); }
  if(/regional|enrol(l)?ment (and|&) school/.test(q)) return HB_TOPICS.find(t=>t.k==='regional').run();
  // the most specific topic wins: count matching words
  const scored=HB_TOPICS.map(t=>({t,n:(q.match(new RegExp(t.w.source,'g'))||[]).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  if(scored.length) return scored[0].t.run();
  hbBot(`Sorry, I didn't understand that. Try different words, or pick one of these:`, HB_MAIN().concat([['Talk to the EMIS Office','contact']]).filter((x,i,a)=>a.findIndex(y=>y[1]===x[1])===i));
}
// ---- look up the school (EMIS code + phone) ----
function hbAsk(then){
  const me=qwMe();
  if(me.emis&&me.phone){ HB.wait=null; hbBot(`Checking EMIS <b>${esc(me.emis)}</b>… <span class="spin"></span>`); return hbLookup(me.emis, me.phone, then); }
  HB.wait={step:'emis', then}; hbBot('I can check that for you. Type your school\'s <b>EMIS code</b>.');
}
function hbAnswerWait(text){
  const w=HB.wait, v=text.trim();
  if(/^(cancel|stop|menu|back)$/i.test(v)){ HB.wait=null; return hbRun('menu'); }
  if(w.step==='emis'){ const e=v.replace(/\s/g,''); if(!/^\d{5,12}$/.test(e)) return hbBot('An EMIS code is a number, e.g. 60101001. Type it again (or type <b>cancel</b>).');
    w.emis=e; w.step='phone'; return hbBot('Thanks. Now the <b>school phone number</b> the EMIS Office has (e.g. 0244123456).'); }
  if(w.step==='phone'){ const p=v.replace(/\s/g,''); if(!/^\+?\d{9,13}$/.test(p)) return hbBot('Type the phone number as digits, e.g. 0244123456 (or type <b>cancel</b>).');
    HB.wait=null; hbBot('Checking… <span class="spin"></span>'); return hbLookup(w.emis, p, w.then); }
}
async function hbLookup(emis, phone, then){
  let r;
  try{ r=await api('quickStatus',{emis,phone}); qwRemember(Object.assign(qwMe(),{emis,phone})); }
  catch(e){ HB.log.pop(); try{ const me=qwMe(); if(me.emis===emis){ delete me.phone; qwRemember(me); } }catch(x){}
    return hbBot(`⚠ ${esc(e.message)}`, [['Try again','chk:'+then],['Talk to the EMIS Office','contact']]); }
  HB.log.pop();
  const head=`<div class="hb-sch">🏫 <b>${esc(r.school)}</b> · ${esc(canonCircuit(r.circuit))} · EMIS ${esc(r.emis)}</div>`;
  const other=[['Use another school','other:'+then]];
  if(then==='signin'){
    const how={pin:`Your school has a <b>PIN</b>. Sign in with EMIS code <b>${esc(r.emis)}</b> and that PIN. Forgot it? Set a new one with the head's Staff ID and the school phone.`,
      staffid:`This is your <b>first sign-in</b>: type EMIS code <b>${esc(r.emis)}</b> and the head teacher's <b>Staff ID</b> as the PIN. The portal then asks you to choose your own PIN.`,
      password:`Your school still uses the <b>password</b> the EMIS Office gave. Sign in with it, then choose a PIN — or set a PIN now with the head's Staff ID and the school phone.`,
      none:`The EMIS Office does not have the head teacher's <b>Staff ID</b> yet, so you can't sign in. Use <b>Submit a file — no password needed</b> once, choose "I am the head teacher" and type your Staff ID. After that, sign in with EMIS code + Staff ID.`}[r.canSignIn]||'';
    return hbBot(head+how+'<br>'+(r.canSignIn==='none'?hbBtn('⬆ Submit a file','wizard'):hbBtn('🔐 Sign in now','signin',{emis:r.emis})+(r.canSignIn!=='staffid'?hbBtn('🔑 Set a new PIN','forgot'):'')), other.concat([['Back to questions','menu']]));
  }
  hbFiles(head, r.files||[], other);
}
function hbFiles(head, files, extraChips){
  const F=files.slice().sort((a,b)=>String(b['Submitted At']).localeCompare(String(a['Submitted At'])));
  const fixed=f=>F.some(x=>x['Task ID']===f['Task ID']&&String(x['Submitted At'])>String(f['Submitted At']));
  const ret=F.filter(f=>f.Status==='Rejected'&&!fixed(f)), wait=F.filter(f=>f.Status==='Submitted'), acc=F.filter(f=>f.Status==='Accepted');
  if(!F.length) return hbBot(head+'Your school has not sent any files yet.<br>'+hbBtn('⬆ Submit a file','wizard'), (extraChips||[]).concat([["What's open now?",'open']]));
  let h=head;
  if(ret.length){ h+=`<b style="color:var(--red)">${ret.length} file${ret.length>1?'s were':' was'} returned for correction:</b>`;
    h+=ret.map(f=>`<div class="hb-file bad"><b>${esc(f['Task Title']||'Request')}</b><div class="small">${esc(f['File Name'])} · sent ${fmtDate(f['Submitted At'])}</div>
      <div class="hb-why">📝 <b>Reason:</b> ${f.Remark?esc(f.Remark):'No reason was written — ask the EMIS Office.'}</div>
      ${f['Auto Remarks']?`<details class="small"><summary>Portal first review (${esc(f['Auto Check']||'')})</summary>${String(f['Auto Remarks']).split('\n').filter(Boolean).slice(0,8).map(x=>`<div>${esc(x)}</div>`).join('')}</details>`:f['Auto Check']?`<div class="small muted">Portal first review: ${esc(f['Auto Check'])}</div>`:''}
      ${f.Open===false?'<div class="small muted">This request is closed — contact the EMIS Office.</div>':hbSchool()?hbBtn('⬆ Upload the corrected file','files'):hbBtn('⬆ Upload the corrected file','wizard',{task:f['Task ID'],rid:f['Submission ID']||''})}</div>`).join('');
    h+=`<div class="small muted" style="margin-top:6px">Correct the same Excel file, save it, then upload it — it <b>replaces</b> the returned one.</div>`; }
  else h+='✅ <b>No file is waiting for correction.</b>';
  h+=`<div class="small" style="margin-top:8px">Other files: <b>${acc.length}</b> accepted · <b>${wait.length}</b> awaiting review.</div>`;
  hbBot(h, (ret.length?[['Fix errors in my Excel','excel']]:[]).concat(extraChips||[],[['Back to questions','menu']]));
}
function hbReturnedSignedIn(){
  const subs=(S.home&&S.home.submissions)||[], tasks=(S.home&&S.home.tasks)||[];
  const files=subs.map(s=>Object.assign({},s,{'Task Title':s['Task Title']||((tasks.find(t=>t['Task ID']===s['Task ID'])||{}).Title||''),Open:((tasks.find(t=>t['Task ID']===s['Task ID'])||{}).Status==='Open')}));
  hbFiles(`<div class="hb-sch">🏫 <b>${esc(S.user.name)}</b></div>`, files);
}
async function hbOpen(){
  hbBot('Looking… <span class="spin"></span>');
  let T; try{ T=hbSchool()&&S.home?S.home.tasks.filter(t=>t.Status==='Open'):await api('publicTasks'); }catch(e){ HB.log.pop(); return hbBot('⚠ '+esc(e.message)); }
  HB.log.pop();
  if(!T.length) return hbBot('Nothing is open for submission right now. 🎉', [['Back to questions','menu']]);
  T=T.slice().sort((a,b)=>String(a['Due Date']||'9').localeCompare(String(b['Due Date']||'9')));
  hbBot(`<b>${T.length} open request${T.length>1?'s':''}</b>, nearest deadline first:`+T.map(t=>{ const d=dueInfo(Object.assign({Status:'Open'},t));
    return `<div class="hb-file"><b>${esc(t.Title)}</b><div class="small">${esc(d.text)}${t.Ownership&&t.Ownership!=='All'?' · '+esc(t.Ownership)+' schools only':''}${t.Levels&&t.Levels!=='All'?' · '+esc(t.Levels):''}</div>
      ${hbSchool()?'':hbBtn(taskKind(t)==='upload'?'⬆ Submit':'📝 Open the form','wizard',{task:t['Task ID']})}</div>`; }).join(''), [['How do I submit?','submit'],['Back to questions','menu']]);
}

const LP_MMDA = 'Asante Akim North Municipal';
const LP = { step:0, info:null, d:{}, receipt:null, editing:false, editId:null };
const LP_STEPS = ['Your circuit','School','Review','Receipt'];
const LP_FIELDS = [['Location','Location of school'],['ICT Centre','ICT centre'],['Electricity','Access to electricity'],['Internet','Internet connectivity'],['Data Packages','Internet data packages provided by Government']];
const lpStaff = () => !!(S.token&&S.user&&can.manage(S.user.role));
const lpSiso = () => !!(S.token&&S.user&&S.user.role==='CIRCUIT_SUPERVISOR');
function openPioneerForm(circuit){
  Object.assign(LP,{step:0, info:null, d:{}, receipt:null, err:'', circuit:circuit||'', editing:false, editId:null});
  openModal('<div id="lpfw"></div>'); $('#modalCard').classList.add('wide','wiz'); drawLp();
  if(lpSiso()||(lpStaff()&&circuit)) lpStart({circuit:lpSiso()?S.user.circuit:circuit});
}
async function lpStart(q){
  try{ LP.info=await api('pioneerStart',q); LP.step=1; LP.editing=!LP.info.entries.length; LP.editId=null; LP.d={}; drawLp(); return true; }
  catch(err){ const e=$('#lpErr'); if(e) e.textContent=err.message; else { LP.err=err.message; drawLp(); } return false; }
}
const lpCan = () => LP.info&&(LP.info.staff||LP.info.entries.length<LP.info.allowed);
function lpCheck(){ const d=LP.d, E=[], t=k=>String(d[k]??'').trim();
  if(!/^\d{5,}$/.test(t('EMIS Code'))) E.push(['EMIS Code','EMIS code: numbers only, at least 5 digits.']);
  if(!t('School Name')) E.push(['School Name','Type the name of the school.']);
  ['Basic 1','Basic 2','Basic 3'].forEach(k=>{ if(!/^\d+$/.test(t(k))) E.push([k,`${k}: type the number of learners (0 if none).`]); else if(+t(k)>400) E.push([k,`${k}: ${t(k)} learners — please check.`]); });
  LP_FIELDS.forEach(([k,l])=>{ if(!t(k)) E.push([k,`${l}: choose from the list.`]); });
  if(!t('Head Name')) E.push(['Head Name','Type the headteacher\'s name.']);
  if(!/^0\d{9}$/.test(phone10(t('Head Phone')))) E.push(['Head Phone','Headteacher\'s phone: 10 digits starting with 0, e.g. 0244123456.']);
  const dup=LP.info.entries.find(x=>String(x['EMIS Code'])===t('EMIS Code')&&x['Record ID']!==LP.editId); if(dup) E.push(['EMIS Code','This school is already on your circuit\'s list — edit it instead.']);
  return E; }
const lpTotal = d => ['Basic 1','Basic 2','Basic 3'].reduce((a,k)=>a+(Number(d[k])||0),0);
function lpPick(emis){ const s=(LP.info.schools||[]).find(x=>x.emis===emis); if(!s){ LP.d={_other:true}; return; }
  LP.d={ _other:false, 'EMIS Code':s.emis, 'School Name':s.name, 'Head Name':s.head||'', 'Head Phone':phone10(s.phone)||'',
    Location:/peri/i.test(s.locality)?'Peri-urban':/urban/i.test(s.locality)?'Urban':/rural/i.test(s.locality)?'Rural':'',
    'Basic 1':s.b1?String(s.b1):'', 'Basic 2':s.b2?String(s.b2):'', 'Basic 3':s.b3?String(s.b3):'', _pre:!!(s.b1||s.b2||s.b3) }; }
function lpEdit(id){ const ex=LP.info.entries.find(x=>x['Record ID']===id); if(!ex) return;
  LP.d={ 'EMIS Code':String(ex['EMIS Code']), 'School Name':ex['School Name'], Location:ex.Location, 'Basic 1':String(ex['Basic 1']), 'Basic 2':String(ex['Basic 2']), 'Basic 3':String(ex['Basic 3']),
    'ICT Centre':ex['ICT Centre'], Electricity:ex.Electricity, Internet:ex.Internet, 'Data Packages':ex['Data Packages'], 'Head Name':ex['Head Name'], 'Head Phone':String(ex['Head Phone']||'') };
  LP.d._other=!LP.info.schools.some(s=>s.emis===String(ex['EMIS Code'])); LP.editId=id; LP.editing=true; }
function drawLp(){
  const el=$('#lpfw'); if(!el) return; const st=LP.step, me=qwMe(), I=LP.info, O=(I&&I.opts)||{};
  const steps=`<div class="steps">${LP_STEPS.map((l,i)=>`<div class="step ${i<st?'done':i===st?'on':''}"><span>${i<st?'✓':i+1}</span><small>${l}</small></div>`).join('')}</div>`;
  let body='';
  if(st===0&&(lpSiso()||(lpStaff()&&LP.circuit))) body=LP.err?`<div class="banner bad">${esc(LP.err)}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`:'<div class="loading"><span class="spin"></span> Opening…</div>';
  else if(st===0) body=`<h3>Learning Pioneers — schools from your circuit</h3>
    <p class="muted">Request from the Ashanti Regional Education Directorate. Only the <b>SISO</b> of each circuit fills this form, using their phone number or Staff ID. Each circuit proposes <b>one</b> basic school that meets the Learning Pioneers criteria${lpStaff()?'':' (the EMIS Office can allow more)'}.</p>
    <form id="lp0"><div class="grid2"><div><label class="f">Your circuit *</label><select class="inp big" id="lpC" required><option value="">— choose —</option>${CONFIG.CIRCUITS.map(c=>`<option ${(LP.circuit||me.lpCircuit)===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      ${lpStaff()?`<div class="small muted" style="align-self:end">Signed in as ${esc(S.user.name)} — filling for the circuit's SISO.</div>`:`<div><label class="f">Your full name (SISO) *</label><input class="inp big" id="lpN" value="${esc(me.lpName||'')}" required></div>
      <div><label class="f">Your phone number <b>or</b> Staff ID *</label><input class="inp big" id="lpP" value="${esc(me.lpPhone||'')}" placeholder="e.g. 0244123456 or 123456" required><div class="small muted">Any phone number the EMIS Office has for you, or your GES Staff ID.</div></div>`}</div>
      <div class="err" id="lpErr"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Close</button><button class="btn primary big" id="lpGo">Continue ›</button></div></form>`;
  else if(st===1&&!LP.editing){ const E=I.entries;
    body=`<h3>${esc(I.circuit)} Circuit — your schools</h3>
      <div class="banner ${E.length>=I.allowed?'ok':''}" style="margin-bottom:10px">${E.length} of ${I.allowed} school${I.allowed>1?'s':''} sent${I.staff?' · as EMIS Office you can add more':E.length>=I.allowed?' · to propose another school, ask the EMIS Office to allow it':''}.</div>
      ${E.map(x=>`<div class="hb-file" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:200px"><b>${esc(x['School Name'])}</b><div class="small muted">EMIS ${esc(x['EMIS Code'])} · B1–B3: ${x.Total} learners · ${esc(x['Head Name']||'')}${x['Updated At']?' · sent '+fmtDT(x['Updated At']):''}</div></div>
        <button type="button" class="btn sm" data-lpe="${esc(x['Record ID'])}">Edit</button><button type="button" class="btn sm danger" data-lpx="${esc(x['Record ID'])}">Remove</button></div>`).join('')}
      <div class="err" id="lpErr"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Close</button>${lpCan()?'<button type="button" class="btn primary big" id="lpAdd">＋ Add a school</button>':''}</div>`; }
  else if(st===1){ const d=LP.d, sel=d._other?'__other':d['EMIS Code']||'';
    const opt=(k)=>`<select class="inp" data-lp="${k}"><option value="">— choose —</option>${(O[k]||[]).map(x=>`<option ${d[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
    body=`<h3>${LP.editId?'Edit the school':'The school'} — ${esc(I.circuit)} Circuit</h3>
      <label class="f">Choose the school *</label><select class="inp big" id="lpS"><option value="">— choose a school in ${esc(I.circuit)} —</option>${(I.schools||[]).map(s=>`<option value="${esc(s.emis)}" ${sel===s.emis?'selected':''}>${esc(s.name)} · ${esc(s.emis)}</option>`).join('')}<option value="__other" ${sel==='__other'?'selected':''}>Another school (type its details)</option></select>
      ${sel?`<div class="grid2" style="margin-top:6px">
        <div><label class="f">Name of MMDA</label><input class="inp" value="${esc(LP_MMDA)}" disabled></div>
        <div><label class="f">School EMIS code *</label><input class="inp" data-lp="EMIS Code" inputmode="numeric" value="${esc(d['EMIS Code']||'')}" ${d._other?'':'readonly'}><div class="of-err" data-le="EMIS Code"></div></div>
        <div style="grid-column:1/-1"><label class="f">Name of school *</label><input class="inp" data-lp="School Name" value="${esc(d['School Name']||'')}" ${d._other?'':'readonly'}><div class="of-err" data-le="School Name"></div></div>

// download: the Region's LEARNING PIONEERS template (10 rows at most)
async function downloadPioneers(rows){
  if(!rows.length){ toast('No school has been submitted yet.',true); return; }
  if(rows.length>10) toast('The Region allows 10 schools — only the first 10 are written. Remove some first.',true);
  const L={sheet:'SCHOOLS', hRow:3, dataStart:5, lastCol:15, xsheet:new Set()};
  const out=rows.slice(0,10).map(r=>{ const n=k=>Number(r[k])||0, v=[r.MMDA||LP_MMDA, String(r['EMIS Code']), r['School Name'], r.Location, n('Basic 1'), n('Basic 2'), n('Basic 3'), n('Basic 1')+n('Basic 2')+n('Basic 3'),
    r['ICT Centre'], r.Electricity, r.Internet, r['Data Packages'], r['Head Name'], phone10(r['Head Phone']), 'COMPLETE']; const o={}; v.forEach((x,j)=>o[j]=x); return o; });
  const blob=await writeTemplate(LP_TPL, L, out); const name=`LEARNING_PIONEERS_SCHOOLS_Asante_Akim_North_${todayStr()}.xlsx`;
  saveBlob(blob, name); logExport('Learning Pioneers schools','Regional Education Office',out.length,out.length); toast('Downloaded '+name);
}

function lpLookupOne(emis, existing){
  const sch=S.data.schools.find(s=>String(s['EMIS Code']).trim()===emis);
  const ret=(S.rec.SchoolReturn||[]).filter(r=>String(r['EMIS Code']).trim()===emis).sort((a,b)=>String(b['Updated At']||'').localeCompare(String(a['Updated At']||'')))[0];
  let A={}, P={}; try{ A=ret?JSON.parse(ret.Answers||'{}'):{}; P=ret?JSON.parse(ret.Profile||'{}'):{}; }catch(e){}
  const enr=(S.rec.Enrolment||[]).filter(r=>String(r['EMIS Code']).trim()===emis&&periodOf(r)===curPeriod());
  const cnt=c=>enr.filter(r=>r.Class===c).reduce((a,r)=>a+(Number(r.Boys)||0)+(Number(r.Girls)||0),0);
  const fromRet=r=>A['C'+r]!==undefined||A['D'+r]!==undefined?(Number(A['C'+r])||0)+(Number(A['D'+r])||0):'';
  const o={ emis, found:!!sch, src:{}, d:{} }, d=o.d, src=o.src;
  d['EMIS Code']=emis; d['School Name']=sch?sch['School Name']:''; o.circuit=sch?canonCircuit(sch.Circuit):'';
  [['Basic 1','B1',37],['Basic 2','B2',38],['Basic 3','B3',39]].forEach(([k,c,r])=>{ const e=cnt(c);
    if(e){ d[k]=String(e); src[k]='Enrolment'; } else if(fromRet(r)!==''){ d[k]=String(fromRet(r)); src[k]='Regional form'; } else d[k]=''; });
  const loc=String((sch&&sch.Locality)||P.Locality||'');
  d.Location=/peri/i.test(loc)?'Peri-urban':/urban/i.test(loc)?'Urban':/rural/i.test(loc)?'Rural':''; if(d.Location) src.Location=sch&&sch.Locality?'List of Schools':'Regional form';
  const ict=String(A.C141||''); if(/^no/i.test(ict)){ d['ICT Centre']='No ICT centre'; src['ICT Centre']='Regional form'; } else if(/^yes/i.test(ict)){ d['ICT Centre']=''; o.hint={'ICT Centre':'Regional form says it has an ICT lab — choose which “Yes”'}; }
  const el=String(A.C147||''); if(/^yes/i.test(el)){ d.Electricity='Yes - the school has access to electricity'; src.Electricity='Regional form'; } else if(/^no/i.test(el)){ d.Electricity='No - the school has no access to electricity'; src.Electricity='Regional form'; }
  d.Internet=''; d['Data Packages']='';
  d['Head Name']=(sch&&sch['Head Name'])||A.C17&&''||''; if(d['Head Name']) src['Head Name']='List of Schools';
  d['Head Phone']=phone10((sch&&(sch['Head Phone']||sch.Phone))||''); if(d['Head Phone']) src['Head Phone']='List of Schools';
  const ex=existing.find(x=>String(x['EMIS Code']).trim()===emis); if(ex){ o.exists=ex; ['Internet','Data Packages','ICT Centre','Electricity','Location'].forEach(k=>{ if(!d[k]&&ex[k]){ d[k]=ex[k]; src[k]='Already sent'; } }); }
  return o;
}

async function loadSchool(){

const pending = {};
function wireUpload(t){
  const id=t['Task ID'], drop=$(`[data-drop="${id}"]`); if(!drop) return;
  const inp=$(`[data-inp="${id}"]`), ex=allowedExts(t['Allowed Types']);
  pending[id]=[];
  const add = files => {
    for(const f of files){
      const e=extOf(f.name);
      if(ex && !ex.includes(e)){ toast(`${f.name}: .${e} files are not accepted here.`, true); continue; }
      if(f.size > CONFIG.MAX_FILE_MB*1048576){ toast(`${f.name} is larger than ${CONFIG.MAX_FILE_MB} MB.`, true); continue; }
      if(!f.size){ toast(`${f.name} is empty.`, true); continue; }
      pending[id].push(f);
      if(/\.(xlsx|xlsm|xls|csv)$/i.test(f.name)) autoCheckFile(f,{emis:S.user.emis, mod:primaryFill(t)}).then(r=>{ f._ac=r; if(pending[id].includes(f)) drawQueue(id); }); else f._ac=null;
    }
    drawQueue(id);
  };
  drop.onclick = () => inp.click();
  inp.onchange = () => { add(inp.files); inp.value=''; };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); add(e.dataTransfer.files); };
  $(`[data-go="${id}"]`).onclick = () => doUpload(t);
}
function drawQueue(id){
  const q=pending[id];
  $(`[data-q="${id}"]`).innerHTML = q.map((f,i)=>`<div class="q"><span>${esc(f.name)} <span class="muted">(${fmtSize(f.size/1024)})</span></span><span data-st="${id}-${i}"><a href="#" onclick="pending['${id}'].splice(${i},1);drawQueue('${id}');return false">remove</a></span></div>${f._ac?acBox(f._ac,'Portal check of this file'):''}`).join('');
  $(`[data-up="${id}"]`).classList.toggle('hidden', !q.length);
}
async function doUpload(t){
  const id=t['Task ID'], q=pending[id], btn=$(`[data-go="${id}"]`), note=$(`[data-note="${id}"]`).value;
  if(!q.length) return;

async function runFills(t, files, emis, ticket, name){
  const fills=fillsOf(t).filter(m=>m==='SchoolReturn'||XL[m]); if(!fills.length) return null;
  const xls=files.filter(f=>/\.(xlsx|xlsm|xls|csv)$/i.test(f.name)); if(!xls.length) return null;
  const wbs=[]; for(const f of xls){ try{ wbs.push(await xlRead(f)); }catch(e){} }
  if(!wbs.length) return {parts:[{err:'The Excel file could not be opened.'}]};
  const parts=[];
  for(const m of fills){
    try{
      if(m==='SchoolReturn'){
        const wb=wbs.find(w=>w.Sheets.FORM)||wbs[0]; const A=retFromWorkbook(wb);
        const r=await api('returnSubmit', ticket?{qticket:ticket, answers:A, name}:{answers:A, name});
        parts.push({mod:m, n:r.enrolmentRows||0, tabs:r.tabs||{}}); if(!ticket&&r.receipt) (S.receipts=S.receipts||[]).push(r.receipt); continue; }
      let P=null, err=null; for(const wb of wbs){ try{ P=xlParse(m, wb, emis, !ticket); break; }catch(e){ err=e; } }
      if(!P) throw err||new Error('The '+(FORMS[m]||m)+' headings were not found.');
      if(!P.rows.length){ parts.push({mod:m, err:'No rows for your school were found in the file.'+(P.errors[0]?' '+P.errors[0]:'')}); continue; }
      const rows=P.rows.map(x=>Object.assign({},x,{Year:S.year||CONFIG.YEAR}));
      if(ticket){ const r=await api('quickImport',{ticket, module:m, rows}); parts.push({mod:m, n:r.count, errs:P.errors, rows:P.rows}); }
      else { await api('recSaveMany',{module:m, replace:true, rows:rows.map(r=>Object.assign(r,{'EMIS Code':emis}))}); delete S.rec[m];
        try{ const rc=await api('recSubmit',{module:m}); (S.receipts=S.receipts||[]).push(rc); }catch(e){}
        parts.push({mod:m, n:P.rows.length, errs:P.errors, rows:P.rows}); }
    }catch(e){ parts.push({mod:m, err:e.message}); }
  }
  return {parts};
}

function fillAllModal(taskId){
  const t=taskById(taskId), def=t['Fills Tab']&&XL[t['Fills Tab']]?t['Fills Tab']:'SchoolStaff';
  const latest={}; S.data.submissions.filter(s=>s['Task ID']===taskId&&isXl(s)&&s.Status!=='Rejected').forEach(s=>{ const e=String(s['EMIS Code']); if(!latest[e]||String(s['Submitted At'])>String(latest[e]['Submitted At'])) latest[e]=s; });
  const list=Object.values(latest).sort((a,b)=>String(a['School Name']).localeCompare(b['School Name']));
  openModal(`<h3>Fill a tab from all files</h3><p class="muted small"><b>${esc(t.Title)}</b> · ${list.length} school(s) sent an Excel file (returned files are left out). Each school's latest file replaces that school's list.</p>
    <label class="f">Fill this tab</label><select class="inp" id="faM">${FILLABLE().map(k=>`<option value="${k}" ${k===def?'selected':''}>${esc(FORMS[k])}</option>`).join('')}</select>

      ${list.map((s,i)=>`<tr><td><b>${esc(s['School Name'])}</b><div class="small muted">${esc(s['EMIS Code'])}</div></td><td class="small">${esc(s['File Name'])}</td><td class="small" id="fa${i}">—</td></tr>`).join('')}</tbody></table></div>
    <div class="err" id="faErr"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" id="faGo" ${list.length?'':'disabled'}>Fill ${list.length} school(s)</button></div>`);
  $('#modalCard').classList.add('wide');
  $('#faGo').onclick=async()=>{
    const b=$('#faGo'), mod=$('#faM').value; b.disabled=true; let ok=0, n=0;
    let have=new Set(); if($('#faSkip').checked){ try{ await recLoad(mod,true); have=new Set((S.rec[mod]||[]).map(r=>String(r['EMIS Code']))); }catch(e){} }
    for(let i=0;i<list.length;i++){ const s=list[i], c=$('#fa'+i); b.innerHTML=`<span class="spin"></span> ${i+1} of ${list.length}…`;
      if(have.has(String(s['EMIS Code']))){ c.innerHTML='<span class="muted">already filled — skipped</span>'; continue; }
      c.innerHTML='<span class="spin"></span>';
      try{ const P=await subToRows(s, mod); if(!P.rows.length) throw new Error('no rows found'+(P.errors[0]?' — '+P.errors[0]:''));
        await saveFromSub(s, mod, P); ok++; n+=P.rows.length; c.innerHTML=`<span style="color:var(--green)">✓ ${P.rows.length} record(s)</span>${P.errors.length?` <span class="muted">· ${P.errors.length} skipped</span>`:''}`; }
      catch(e){ c.innerHTML=`<span style="color:var(--red)">✗ ${esc(e.message)}</span>`; } }
    b.textContent='Done'; b.onclick=()=>{ closeModal(); renderStaff(); }; b.disabled=false;
    toast(`${ok} school(s) filled · ${n} record(s) saved to ${FORMS[mod]}.`);
  };
}

async function recLoad(mod, force){
  if(!force && S.rec[mod] && !(mod==='Enrolment'&&S._enPartial)) return S.rec[mod];
  const r=await api('recList', mod==='Enrolment'?{module:mod, period:'all'}:{module:mod});
  if(!r || !Array.isArray(r.rows)){ console.error('recList '+mod+' reply:', r); throw new Error(`The ${(MODS[mod]||{}).label||mod} data could not be loaded (unexpected server reply). Make sure the latest Code.gs is deployed as a new version.`); }
  if(mod==='Enrolment'){ r.rows.forEach(x=>{ x.Class=canonClass(x.Class); x.Level=(CLASSES.find(c=>c[0]===x.Class)||[])[1]||x.Level; }); S._enPartial=false; }
  S.rec[mod]=r.rows; S.year=r.year; if(r.period){ S.period=r.period; S.periods=r.periods; } return r.rows;
}

  const list=q?rows.filter(r=>cols.map(c=>r[c.k]).concat([r['School Name'],r['Circuit'],r['EMIS Code']]).join(' ').toLowerCase().includes(q)):rows;
  S['_t_'+key]=list;

      ${list.slice(0,opts.limit||100).map(r=>`<tr>${cols.map(c=>`<td class="${c.num?'num':''} ${c.small?'small':''}">${c.v?c.v(r):cell(c.k,r)}</td>`).join('')}

async function loadNotices(){
  const el=$('#notices'); if(!el) return;
  try{
    const r=await api('publicUpdates');
    const items=r.updates.map(u=>({st:updState(u), type:u.Type||'Notice', title:u.Title, msg:u.Message, s:u['Start Date'], e:u['End Date']}))
      .concat(r.tasks.map(t=>({st:'Ongoing', type:taskKind(t)==='upload'?'File request':'Online form', own:t.Ownership&&t.Ownership!=='All'?t.Ownership:'', title:t.Title, msg:taskKind(t)==='upload'?'Tap to submit now — no password needed.':'Tap to fill the form online — no password needed.', e:t['Due Date'], id:t['Task ID'], isNew:t['Created At']&&Date.now()-new Date(t['Created At'])<7*864e5})))
      .filter(x=>x.st!=='Past');
    S._notices=items; drawNotices(); drawHeroStats(r.tasks||[]);
  }catch(e){ el.innerHTML=''; }

function drawHeroStats(tasks){
  const el=$('#heroStats'), nb=$('#newReq'); const nNew=tasks.filter(t=>t['Created At']&&Date.now()-new Date(t['Created At'])<7*864e5).length;
  if(nb){ nb.textContent=nNew?`${nNew} new`:''; nb.classList.toggle('hidden',!nNew); }
  if(!el) return; const due=tasks.map(t=>t['Due Date']).filter(d=>d&&d>=todayStr()).sort()[0];
  const days=due?Math.ceil((new Date(due+'T23:59:59')-new Date())/864e5):null;
  el.innerHTML=`<div class="hs"><b>${tasks.length}</b><span>open request${tasks.length===1?'':'s'}</span></div>${nNew?`<div class="hs new"><b>${nNew}</b><span>new this week</span></div>`:''}${due?`<div class="hs ${days<=3?'hot':''}"><b>${days<=0?'Today':days===1?'1 day':days+' days'}</b><span>to the next deadline · ${fmtDate(due)}</span></div>`:''}`;
}
function drawNotices(){
  const el=$('#notices'); if(!el||!S._notices) return;
  const tab=S.noticeTab||'Ongoing', on=S._notices.filter(x=>x.st==='Ongoing'), up=S._notices.filter(x=>x.st==='Upcoming');
  const list=(tab==='Ongoing'?on:up).sort((a,b)=>(b.isNew?1:0)-(a.isNew?1:0)||String(tab==='Ongoing'?a.e||'9':a.s).localeCompare(String(tab==='Ongoing'?b.e||'9':b.s)));
  el.innerHTML=`<div class="nb-h"><b>🔔 What's happening</b><div class="nb-tabs"><button type="button" data-nt="Ongoing" class="${tab==='Ongoing'?'on':''}">Ongoing (${on.length})</button><button type="button" data-nt="Upcoming" class="${tab==='Upcoming'?'on':''}">Yet to start (${up.length})</button></div></div>
    <div class="nb-list">${list.length?list.map(x=>`<div class="nb-i ${x.id?'clk':''} ${x.isNew?'is-new':''}" ${x.id?`data-qid="${esc(x.id)}" role="button" tabindex="0"`:''}><div class="nb-t">${x.isNew?'<span class="newb">NEW</span>':''}<span class="pill ${x.type==='File request'||x.type==='Online form'||x.type==='Deadline'?'amber':x.type==='Meeting'||x.type==='Training'?'blue':'green'}">${esc(x.type)}</span>${x.own?`<span class="pill grey">${esc(x.own)} schools</span>`:''}
        <span class="small muted">${tab==='Upcoming'?'Starts '+fmtDate(x.s):x.e?'Ends '+fmtDate(x.e):'Ongoing'}</span></div><b>${esc(x.title)}</b>${x.msg?`<div class="small muted clamp">${esc(x.msg)}</div>`:''}</div>`).join('')

  $$('[data-nt]',el).forEach(b=>b.onclick=()=>{ S.noticeTab=b.dataset.nt; drawNotices(); });
