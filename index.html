      const id='S'+(seq++); subs.push({'Submission ID':id,'Task ID':t['Task ID'],'Task Title':t.Title,'EMIS Code':s.emis,'School Name':s.name,Circuit:s.circuit,Level:s.level,'File Name':req.fileName,'File Type':e,'Size KB':Math.round(req.data.length*0.75/1024*10)/10,Note:req.note||'','Submitted By':s.head,'Submitted At':iso(Date.now()),Status:'Submitted',Reviewer:'','Reviewed At':'',Remark:''});
      files[id]={data:req.data,mime:req.mimeType}; return true; },
    deleteMySubmission:req=>{ const s=need(req,['SCHOOL']); const i=subs.findIndex(x=>x['Submission ID']===req.id&&x['EMIS Code']===s.emis);
      if(i<0) throw new Error('File not found.'); if(subs[i].Status==='Accepted') throw new Error('Accepted files cannot be deleted.'); subs.splice(i,1); return true; },
    download:req=>{ const s=need(req); const r=subs.find(x=>x['Submission ID']===req.id); if(!r||!scope(s,r)) throw new Error('File not found.');
      const f=files[r['Submission ID']]; return {name:r['File Name'],mime:f.mime,data:f.data}; },
    recList:req=>{ const s=need(req), m=req.module, sc=MODSCOPE[m]; if(!sc) throw new Error('Unknown data tab.'); let rows=REC[m];
      if(s.role==='SCHOOL'){ if(m==='DirStaff') throw new Error('Not available to schools.'); rows= m==='Updates'?rows.filter(r=>r.Audience!=='Staff only'):rows.filter(r=>r['EMIS Code']===s.emis); }
      else { if(m==='Updates') rows=rows.filter(r=>r.Audience!=='Schools only'); if(s.role==='CIRCUIT_SUPERVISOR'&&sc!=='dir') rows=rows.filter(r=>!r['EMIS Code']||r.Circuit===s.circuit); }
      if(KEYS[m]||m==='BECE') rows=rows.filter(r=>r.Year===YR); if(m==='Enrolment'&&req.period!=='all') rows=rows.filter(r=>r.Period===(req.period||CUR));
      return {rows:cp(rows),year:YR,period:CUR,periods:PER}; },
    setPeriod:req=>{ need(req,['ADMIN','EMIS_OFFICER']); if(!PER.includes(req.period)) throw new Error('Unknown enrolment round.'); CUR=req.period; return {year:YR,period:CUR,periods:PER}; },
    revealPassword:req=>{ need(req,['ADMIN']); const r=req.kind==='staff'?users.find(u=>u.Email===req.id):schools.find(x=>x['EMIS Code']===req.id); if(!r) throw new Error('Account not found.'); return {password:r.pw,mustChange:!!r.must}; },
    revealAll:req=>{ need(req,['ADMIN']); return req.kind==='staff'?users.map(u=>({login:u.Email,name:u['Full Name'],circuit:u.Circuit,role:u.Role,password:u.pw,mustChange:!!u.must})):schools.map(x=>({login:x['EMIS Code'],name:x['School Name'],circuit:x.Circuit,role:'',password:x.pw,mustChange:!!x.must})); },
    recSave:req=>A._save(req,[req.row])[0],
    recSaveMany:req=>{ const s=need(req); const emis=s.role==='SCHOOL'?s.emis:String((req.rows[0]||{})['EMIS Code']||'');
      if(req.module==='Enrolment'&&req.replace&&emis){ const p=s.role==='SCHOOL'?CUR:(req.period||CUR); REC.Enrolment=REC.Enrolment.filter(r=>!(r['EMIS Code']===emis&&r.Year===YR&&r.Period===p)); req.rows.forEach(r=>{ r.Period=p; delete r['Record ID']; }); }
      const out=A._save(req,req.rows);
      return {count:out.length, receipt:KEYS[req.module]&&emis?cp(mkReceipt(s.head||s.name,req.module,schools.find(x=>x['EMIS Code']===emis),Date.now())):null}; },
    recSubmit:req=>{ const s=need(req); if(!FORMS[req.module]) throw new Error('No receipt for this tab.'); const emis=s.role==='SCHOOL'?s.emis:req.emis;
      if(s.role!=='SCHOOL'&&!['ADMIN','EMIS_OFFICER'].includes(s.role)) throw new Error('No permission.'); return cp(mkReceipt(s.head||s.name,req.module,schools.find(x=>x['EMIS Code']===emis),Date.now(),req.none)); },
    receiptList:req=>{ const s=need(req); return cp(RCPT.filter(r=>s.role==='SCHOOL'?r['EMIS Code']===s.emis:s.role==='CIRCUIT_SUPERVISOR'?r.Circuit===s.circuit:true)); },
    publicReceipt:req=>{ const r=RCPT.find(x=>x['Receipt No'].toUpperCase()===String(req.no||'').trim().toUpperCase()); if(!r) throw new Error('No receipt with that number was found.'); const o=cp(r); delete o['Submitted By']; delete o.Role; return o; },
    _save:(req,list)=>{ const s=need(req), m=req.module, sc=MODSCOPE[m], mgr=['ADMIN','EMIS_OFFICER'].includes(s.role);
      if(s.role==='SCHOOL'){ if(sc!=='school'&&m!=='Projects') throw new Error('Only the Directorate can edit this.'); } else if(!mgr) throw new Error('You can view this data but not change it.');
      return list.map(row=>{ const o=Object.assign({},row); const emis=s.role==='SCHOOL'?s.emis:(sc==='dir'?'':String(row['EMIS Code']||''));
        if(sc==='school'&&!emis) throw new Error('Choose the school.');
        const sch=emis?schools.find(x=>x['EMIS Code']===emis):null; if(emis&&!sch) throw new Error('School not found.');
        Object.assign(o,{'EMIS Code':emis,'School Name':sch?sch['School Name']:'',Circuit:sch?sch.Circuit:'','Updated By':s.name,'Updated At':iso(Date.now())});
        if(m==='BECE'){ o.Year=o.Year||YR; if(o.Sex) o.Sex=/^f/i.test(o.Sex)?'Female':'Male'; }
        if(m==='Enrolment'){ o.Period=s.role==='SCHOOL'?CUR:(o.Period||CUR); o.Stream=String(o.Stream||'').toUpperCase(); }
        if(KEYS[m]){ o.Year=o.Year||YR; if(m==='Enrolment') o.Level=CL[o.Class]||''; o.Total=KEYS[m][1].reduce((a,k)=>a+(Number(o[k])||0),0); }
        let ex=o['Record ID']&&REC[m].find(r=>r['Record ID']===o['Record ID']);
        if(!ex&&KEYS[m]) ex=REC[m].find(r=>r['EMIS Code']===emis&&(KEYS[m][2]||['Year',KEYS[m][0]]).every(k=>String(r[k]||'')===String(o[k]||'')));
        if(ex){ Object.assign(ex,o,{'Record ID':ex['Record ID']}); return cp(ex); }
        o['Record ID']=m.slice(0,3).toUpperCase()+(rid++); REC[m].push(o); return cp(o); }); },
    recDelete:req=>{ const s=need(req); const i=REC[req.module].findIndex(r=>r['Record ID']===req.id); if(i<0) throw new Error('Record not found.');
      if(s.role==='SCHOOL'&&REC[req.module][i]['EMIS Code']!==s.emis) throw new Error('Record not found.'); if(s.role!=='SCHOOL'&&!['ADMIN','EMIS_OFFICER'].includes(s.role)) throw new Error('No permission.');
      REC[req.module].splice(i,1); return true; },
    publicUpdates:()=>({ today:ymd(Date.now()), updates:cp(REC.Updates.filter(u=>u['Show on Login']==='Yes'&&u.Audience!=='Staff only'&&(!u['End Date']||u['End Date']>=ymd(Date.now())))), tasks:A.publicTasks() }),
    staffData:req=>{ const s=need(req,['ADMIN','EMIS_OFFICER','CIRCUIT_SUPERVISOR','DIRECTOR']);
      const o={tasks:cp(tasks),schools:schools.filter(x=>scope(s,x)).map(strip),submissions:cp(subs.filter(x=>scope(s,x))),enrolment:cp(REC.Enrolment.filter(x=>x.Year===YR&&x.Period===CUR&&scope(s,x))),year:YR,period:CUR,periods:PER}; if(s.role==='ADMIN') o.users=users.map(strip); return o; },
    review:req=>{ const s=need(req,['ADMIN','EMIS_OFFICER','CIRCUIT_SUPERVISOR']); const r=subs.find(x=>x['Submission ID']===req.id); if(!r||!scope(s,r)) throw new Error('File not found.');
      Object.assign(r,{Status:req.status,Remark:req.remark||'',Reviewer:s.name,'Reviewed At':iso(Date.now())}); return true; },
    saveTask:req=>{ const s=need(req,['ADMIN','EMIS_OFFICER']); const t=req.task; if(!String(t.Title||'').trim()) throw new Error('Give the request a title.');
      const data={Title:t.Title.trim(),Description:t.Description||'',Levels:t.Levels||'All','Allowed Types':t['Allowed Types']||'any','Max Files':Number(t['Max Files'])||0,'Due Date':t['Due Date']||'',Status:t.Status};
      const ex=tasks.find(x=>x['Task ID']===t['Task ID']); if(ex){ Object.assign(ex,data); subs.forEach(x=>{ if(x['Task ID']===ex['Task ID']) x['Task Title']=data.Title; }); return ex['Task ID']; }
      const id='T'+Date.now().toString().slice(-8); tasks.push(Object.assign({'Task ID':id,'Created By':s.name,'Created At':iso(Date.now())},data)); return id; },
    taskFolder:()=>({url:'#'}),
    saveSchool:req=>{ need(req,['ADMIN','EMIS_OFFICER']); const x=req.school; if(!x['EMIS Code']||!x['School Name']) throw new Error('EMIS code and school name are required.');
      const clash=schools.find(s=>s['EMIS Code']===x['EMIS Code']);
      if(x.originalEmis){ const r=schools.find(s=>s['EMIS Code']===x.originalEmis); if(clash&&clash!==r) throw new Error('Another school already uses that EMIS code.'); ['EMIS Code','School Name','Level','Circuit','Head Name','Phone','Active'].forEach(k=>r[k]=x[k]); return {}; }
      if(clash) throw new Error('EMIS code already exists.'); const pw=tmp(); schools.push(Object.assign({pw,must:true,'Last Login':''},x)); return {tempPassword:pw}; },
    saveUser:req=>{ need(req,['ADMIN']); const x=req.user; x.Email=String(x.Email).toLowerCase(); if(!x.Email||!x['Full Name']) throw new Error('Email and full name are required.');
      if(x.Role==='CIRCUIT_SUPERVISOR'&&!x.Circuit) throw new Error('Circuit supervisors need a circuit.');
      if(x.originalEmail){ const r=users.find(u=>u.Email===x.originalEmail); ['Email','Full Name','Role','Circuit','Phone','Active'].forEach(k=>r[k]=x[k]); return {}; }
      if(users.some(u=>u.Email===x.Email)) throw new Error('That email is already used.'); const pw=tmp(); users.push(Object.assign({pw,must:true},x)); return {tempPassword:pw}; },
    resetPassword:req=>{ need(req,['ADMIN','EMIS_OFFICER']); const r=req.kind==='school'?schools.find(s=>s['EMIS Code']===req.id):users.find(u=>u.Email===req.id); const pw=tmp(); r.pw=pw; r.must=true; return {tempPassword:pw}; }
  };
  return { call: body => new Promise(res => setTimeout(() => {
    try{ const fn=A[body.action]; if(!fn) throw new Error('Unknown action.'); res({ok:true,data:fn(body)}); }
    catch(e){ res({ok:false,error:e.message}); } }, 220)) };
})();

/* ------------------------------ start ------------------------------ */
function applyDeep(){
  if(!S.deep) return;
  if(S.user.role==='SCHOOL') S.tab=S.deep; else S.tab=STAFF_TAB_OF[S.deep]||'home';
  S.deep=null; try{ history.replaceState(null,'',baseUrl()); }catch(e){}
}
(function start(){
  const qp=new URLSearchParams(location.search); S.deep=qp.get('tab'); S.verify=qp.get('receipt');
  const saved = DEMO ? null : load('fp_session');   // demo data resets on reload, so demo sessions do too
  if(saved && saved.token && !S.verify){ S.token=saved.token; S.user=saved.user; S.mustChange=saved.mustChange; if(S.deep) applyDeep(); boot(); }
  else renderLogin();
})();
</script>
