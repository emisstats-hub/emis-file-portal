function enrolAgg(rows){ const o={B:sum(rows,'Boys'),G:sum(rows,'Girls')}; o.T=o.B+o.G; return o; }
const gpi = a => a.B?(a.G/a.B).toFixed(2):'—';
const OLD_CLASS = {P1:'B1',P2:'B2',P3:'B3',P4:'B4',P5:'B5',P6:'B6',JHS1:'B7',JHS2:'B8',JHS3:'B9'};
const canonClass = c => OLD_CLASS[c]||c;
const classOrder = c => { const i=CLASSES.findIndex(x=>x[0]===c); return i<0?99:i; };
const curPeriod = () => S.period||(S.periods||CONFIG.ENROL_PERIODS)[0];
const periodOf = r => r.Period||(S.periods||CONFIG.ENROL_PERIODS)[0];
// enrolment for the current collection round (used by Home, Staff PTR, Classrooms)
const enrolNow = () => scopedRecs('Enrolment').filter(r=>periodOf(r)===curPeriod());
const PERIODS = () => S.periods||CONFIG.ENROL_PERIODS;

/* ---- editor (schools, and Admin/EMIS Officer on a school's behalf) ---- */
function enrolStart(sch, period){
  const mine=(S.rec.Enrolment||[]).filter(r=>String(r['EMIS Code'])===String(sch.emis)&&periodOf(r)===period);
  let rows=mine.map(r=>({Class:r.Class, Stream:r.Stream||'', Boys:r.Boys, Girls:r.Girls}));
  if(!rows.length){ const lv=levelsOf({Level:sch.Level}); rows=CLASSES.filter(([,l])=>lv.length?lv.includes(l):l!=='Nursery'&&l!=='SHS').map(([c])=>({Class:c,Stream:'',Boys:'',Girls:''})); }
  return rows.sort((a,b)=>classOrder(a.Class)-classOrder(b.Class)||String(a.Stream).localeCompare(String(b.Stream)));
}
function enrolEditorHTML(sch, period){
  const E=S.eEdit, rows=E.rows, idx=PERIODS().indexOf(period);
  const prev=PERIODS().slice(0,idx).reverse().find(p=>(S.rec.Enrolment||[]).some(r=>String(r['EMIS Code'])===String(sch.emis)&&periodOf(r)===p));
  const mine=(S.rec.Enrolment||[]).filter(r=>String(r['EMIS Code'])===String(sch.emis)&&periodOf(r)===period);
  const last=mine.map(r=>r['Updated At']).filter(Boolean).sort().pop();
  const lastBy=last&&mine.find(r=>r['Updated At']===last)['Updated By'];
  const missing=CLASSES.filter(([c])=>!rows.some(r=>r.Class===c));
  const hasNursery=rows.some(r=>CLASSES.find(x=>x[0]===r.Class)?.[1]==='Nursery');
  let html=`<div class="eh"><span class="pill blue">${esc(S.year||CONFIG.YEAR)}</span><span class="pill amber">Round: ${esc(period)}</span>
      ${prev&&!mine.length?`<button class="btn sm" id="eCopy">Copy figures from “${esc(prev)}”</button>`:''}
      <span style="margin-left:auto"></span>
      ${!hasNursery?`<button class="btn sm" id="eNur">＋ Creche / Nursery classes</button>`:''}
      <select class="inp" id="eAdd" style="width:auto;padding:6px 10px"><option value="">＋ Add a class…</option>${missing.map(([c])=>`<option value="${c}">${esc(CLASS_LABEL(c))}</option>`).join('')}</select></div>
    <div class="tbl-wrap"><table class="t grid-t" id="egrid"><thead><tr><th>Class</th><th>Stream</th><th class="num">Male</th><th class="num">Female</th><th class="num">Total</th><th></th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const first=i===0||rows[i-1].Class!==r.Class, lastOfClass=i===rows.length-1||rows[i+1].Class!==r.Class, multi=rows.filter(x=>x.Class===r.Class).length>1;
    html+=`<tr data-i="${i}" class="${first?'cls-first':''}"><td>${first?`<b>${esc(CLASS_LABEL(r.Class))}</b><div class="small muted">${esc((CLASSES.find(x=>x[0]===r.Class)||[])[1]||'')}</div>`:''}</td>
      <td>${multi?`<input class="inp gin" style="width:64px;text-align:center" data-k="Stream" value="${esc(r.Stream)}" maxlength="3" aria-label="Stream">`:'<span class="muted small">single</span>'}</td>
      <td class="num"><input type="number" min="0" step="1" inputmode="numeric" class="inp gin" data-k="Boys" value="${esc(r.Boys)}" placeholder="0" aria-label="${esc(CLASS_LABEL(r.Class)+' '+r.Stream+' boys')}"></td>
      <td class="num"><input type="number" min="0" step="1" inputmode="numeric" class="inp gin" data-k="Girls" value="${esc(r.Girls)}" placeholder="0" aria-label="${esc(CLASS_LABEL(r.Class)+' '+r.Stream+' girls')}"></td>
      <td class="num"><b class="gt">0</b></td>
      <td style="white-space:nowrap">${lastOfClass?`<button class="btn sm" data-addst="${esc(r.Class)}" title="Split this class into streams A, B, …">＋ Stream</button>`:''}<button class="btn sm danger" data-rm="${i}" title="Remove">✕</button></td></tr>`;
  });
  html+=`</tbody><tfoot><tr><td colspan="2"><b>Total</b> <span class="small muted">(${new Set(rows.map(r=>r.Class)).size} classes · ${rows.length} streams/rows)</span></td><td class="num"><b id="eB">0</b></td><td class="num"><b id="eG">0</b></td><td class="num"><b id="eT">0</b></td><td></td></tr></tfoot></table></div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap"><span class="small muted">${last?`Last saved ${fmtDT(last)} by ${esc(lastBy)}`:`Not filled in yet for ${esc(period)}.`}</span><span style="margin-left:auto"></span>
      ${canEdit('Enrolment')?`<button class="btn primary" id="eSave">Save &amp; get receipt</button>`:''}</div>`;
  return html;
}
function wireEnrolEditor(sch, period, host, after){
  const E=S.eEdit, read=()=>$$('#egrid tbody tr').forEach(tr=>{ const r=E.rows[+tr.dataset.i]; $$('.gin',tr).forEach(i=>r[i.dataset.k]=i.dataset.k==='Stream'?i.value.toUpperCase().trim():i.value); });
  const redraw=()=>{ host.innerHTML=enrolEditorHTML(sch,period); wireEnrolEditor(sch,period,host,after); };
  const calc=()=>{ let B=0,G=0; $$('#egrid tbody tr').forEach(tr=>{ const b=num($('[data-k=Boys]',tr).value), g=num($('[data-k=Girls]',tr).value); B+=b; G+=g; $('.gt',tr).textContent=(b+g).toLocaleString(); });
    $('#eB').textContent=B.toLocaleString(); $('#eG').textContent=G.toLocaleString(); $('#eT').textContent=(B+G).toLocaleString(); };
  $$('#egrid .gin').forEach(i=>i.oninput=calc); calc();
  $$('[data-addst]').forEach(b=>b.onclick=()=>{ read(); const c=b.dataset.addst, same=E.rows.filter(r=>r.Class===c);
    if(same.length===1&&!same[0].Stream) same[0].Stream='A';
    const used=same.map(r=>r.Stream); const next='ABCDEFGH'.split('').find(x=>!used.includes(x))||String(same.length+1);
    const at=E.rows.lastIndexOf(same[same.length-1]); E.rows.splice(at+1,0,{Class:c,Stream:next,Boys:'',Girls:''}); redraw(); });
  $$('[data-rm]').forEach(b=>b.onclick=()=>{ read(); const r=E.rows[+b.dataset.rm]; E.rows.splice(+b.dataset.rm,1);
    const left=E.rows.filter(x=>x.Class===r.Class); if(left.length===1) left[0].Stream=''; redraw(); });
  const add=cs=>{ read(); cs.forEach(c=>{ if(!E.rows.some(r=>r.Class===c)) E.rows.push({Class:c,Stream:'',Boys:'',Girls:''}); }); E.rows.sort((a,b)=>classOrder(a.Class)-classOrder(b.Class)||String(a.Stream).localeCompare(String(b.Stream))); redraw(); };
  if($('#eNur')) $('#eNur').onclick=()=>add(['CRECHE','N1','N2']);
  $('#eAdd').onchange=e=>{ if(e.target.value) add([e.target.value]); };
  if($('#eCopy')) $('#eCopy').onclick=()=>{ const idx=PERIODS().indexOf(period); const prev=PERIODS().slice(0,idx).reverse().find(p=>(S.rec.Enrolment||[]).some(r=>String(r['EMIS Code'])===String(sch.emis)&&periodOf(r)===p));
    E.rows=enrolStart(sch,prev); redraw(); toast('Figures copied from '+prev+'. Check and correct them, then save.'); };
  const sv=$('#eSave'); if(!sv) return;
  sv.onclick=async()=>{
    read();
    const rows=E.rows.filter(r=>r.Class);
    for(const c of new Set(rows.map(r=>r.Class))){ const st=rows.filter(r=>r.Class===c);
      if(st.length>1){ st.forEach((r,i)=>{ if(!r.Stream) r.Stream='ABCDEFGH'[i]; }); if(new Set(st.map(r=>r.Stream)).size<st.length){ toast(`${CLASS_LABEL(c)}: each stream needs a different letter.`,true); return; } } }
    if(rows.some(r=>[r.Boys,r.Girls].some(v=>v!==''&&(Number(v)<0||!Number.isInteger(Number(v)))))){ toast('Use whole numbers of zero or more.',true); return; }
    const doSave=async declared=>{
    sv.disabled=true; sv.innerHTML='<span class="spin"></span> Saving…';
    try{
      const res=await api('recSaveMany',{module:'Enrolment',replace:true,period,declared,rows:rows.map(r=>({'EMIS Code':sch.emis,Year:S.year||CONFIG.YEAR,Period:period,Class:r.Class,Stream:r.Stream,Boys:num(r.Boys),Girls:num(r.Girls)}))});
      await recLoad('Enrolment',true); if(S.data) S.data.enrolment=(S.rec.Enrolment||[]).filter(r=>periodOf(r)===curPeriod());
      if(res&&res.receipt) (S.receipts=S.receipts||[]).push(res.receipt);
      S.eEdit=null; if(after) await after(); if(res&&res.receipt) showReceipt(res.receipt); else toast('Enrolment saved.');
    }catch(e){ toast(e.message,true); sv.disabled=false; sv.textContent='Save & get receipt'; }
    };
    if(S.user.role==='SCHOOL'&&rows.some(r=>num(r.Boys)+num(r.Girls)>0)) askDecl('Enrolment', enteredOf('Enrolment',rows.map(r=>({Boys:num(r.Boys),Girls:num(r.Girls)}))), doSave);
    else doSave();
  };
}
function enrolModal(emis, period){
  const s=S.data.schools.find(x=>String(x['EMIS Code'])===String(emis)); if(!s) return;
  const sch={emis:String(s['EMIS Code']), Level:s.Level, name:s['School Name']};
  period=period||curPeriod();
  S.eEdit={rows:enrolStart(sch,period)};
  openModal(`<h3>Enrolment — ${esc(sch.name)}</h3><p class="muted small">${esc(canonCircuit(s.Circuit))} Circuit</p><div id="eHost"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`);
  $('#modalCard').classList.add('wide');
  const host=$('#eHost'); host.innerHTML=enrolEditorHTML(sch,period); wireEnrolEditor(sch,period,host,()=>{ closeModal(); S.rerender&&S.rerender(); });
}
function enrolDetail(emis, period){
  const s=S.data.schools.find(x=>String(x['EMIS Code'])===String(emis)); if(!s) return;
  const rows=(S.rec.Enrolment||[]).filter(r=>String(r['EMIS Code'])===String(emis)&&periodOf(r)===period).sort((a,b)=>classOrder(a.Class)-classOrder(b.Class)||String(a.Stream).localeCompare(String(b.Stream)));
  const A=enrolAgg(rows), m=can.manage(S.user.role);
  openModal(`<h3>${esc(s['School Name'])}</h3><p class="muted small">EMIS ${esc(s['EMIS Code'])} · ${esc(canonCircuit(s.Circuit))} Circuit · ${esc(period)}</p>
    ${rows.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>Class</th><th>Stream</th><th class="num">Male</th><th class="num">Female</th><th class="num">Total</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr><td>${i===0||rows[i-1].Class!==r.Class?`<b>${esc(CLASS_LABEL(r.Class))}</b>`:''}</td><td>${esc(r.Stream||'—')}</td><td class="num">${num(r.Boys)}</td><td class="num">${num(r.Girls)}</td><td class="num"><b>${num(r.Boys)+num(r.Girls)}</b></td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="2"><b>Total</b></td><td class="num"><b>${A.B}</b></td><td class="num"><b>${A.G}</b></td><td class="num"><b>${A.T}</b></td></tr></tfoot></table></div>`
      :'<div class="empty">This school has not reported enrolment for this round.</div>'}
    <div class="modal-actions">${m?`<button class="btn" id="edEdit">Edit</button>`:''}<button class="btn primary" onclick="closeModal()">Close</button></div>`);
  $('#modalCard').classList.add('wide');
  if($('#edEdit')) $('#edEdit').onclick=()=>enrolModal(emis, period);
}

/* ---- staff by level (KG / Primary / JHS) ---- */
const SLEVELS = [['KG','KG'],['Primary','Primary'],['JHS','JHS'],['Head','Headteachers'],['None','Not stated / whole school']];
function staffLevel(r){
  const lt=String(r['Level Taught']||''), x=lt||String(r['Class / Subject / Schedule']||'')+' '+String(r['Classes Taught']||'');
  if(/head\s*teacher/i.test(lt)) return 'Head';
  if(/\bKG|kinder|nursery|creche/i.test(x)) return 'KG';
  if(/\bJHS|basic\s*[789]\b|\bB[789]\b|\bjs\s*[123]/i.test(x)) return 'JHS';
  if(/primary|basic\s*[1-6]\b|\bB[1-6]\b|\bP[1-6]\b|class\s*[1-6]\b/i.test(x)) return 'Primary';
  return 'None';
}
function levelTable(rows){
  const isT=r=>r.Category==='Teaching';
  const L=SLEVELS.map(([k,l])=>{ const a=rows.filter(r=>staffLevel(r)===k), t=a.filter(isT), n=a.filter(r=>!isT(r));
    return {k,l,tm:t.filter(r=>r.Gender==='Male').length,tf:t.filter(r=>r.Gender==='Female').length,t:t.length,nm:n.filter(r=>r.Gender==='Male').length,nf:n.filter(r=>r.Gender==='Female').length,n:n.length,all:a.length}; }).filter(x=>x.all||['KG','Primary','JHS'].includes(x.k));
  const T=L.reduce((a,x)=>{ ['tm','tf','t','nm','nf','n','all'].forEach(k=>a[k]+=x[k]); return a; },{tm:0,tf:0,t:0,nm:0,nf:0,n:0,all:0});
  return `<div class="tbl-wrap"><table class="t"><thead><tr><th>Level</th><th class="num">Teaching M</th><th class="num">Teaching F</th><th class="num">Teaching</th><th class="num">Non-teaching M</th><th class="num">Non-teaching F</th><th class="num">Non-teaching</th><th class="num">Total</th></tr></thead><tbody>
    ${L.concat([{l:'Total',...T,b:1}]).map(x=>`<tr ${x.b?'style="background:#faf8f3;font-weight:700"':''}><td><b>${esc(x.l)}</b></td><td class="num">${x.tm}</td><td class="num">${x.tf}</td><td class="num"><b>${x.t}</b></td><td class="num">${x.nm}</td><td class="num">${x.nf}</td><td class="num"><b>${x.n}</b></td><td class="num"><b>${x.all}</b></td></tr>`).join('')}</tbody></table></div>`;
}
function levelTabs(rows, cur){
  const isT=r=>r.Category==='Teaching';
  return `<div class="lvtabs">${[['','All levels'],...SLEVELS.slice(0,3)].map(([k,l])=>{ const a=k?rows.filter(r=>staffLevel(r)===k):rows, t=a.filter(isT).length;
    return `<button type="button" class="lvtab ${cur===k?'on':''}" data-lv="${k}"><b>${esc(l)}</b><span><i>${t}</i> teaching</span><span><i>${a.length-t}</i> non-teaching</span></button>`; }).join('')}</div>`;
}

    ${kpis([['Total staff',all.length.toLocaleString()],['Teaching',T.length.toLocaleString()],['Non-teaching',(all.length-T.length).toLocaleString()],['Male',M.length.toLocaleString()],['Female',all.filter(r=>r.Gender==='Female').length.toLocaleString()],['Aged 59+ (retiring soon)',retire.length,retire.length?'var(--amber)':'']])}

function parseDate(v){
  if(!v) return ''; v=String(v).trim(); let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m && +m[2]<=12 && +m[1]<=31) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}

const RET_BANDS = ['Past retirement age','Due this year','Due next year','Due in 2 years'];
Object.assign(PILL, { 'Past retirement age':'red', 'Due this year':'amber', 'Due next year':'blue', 'Due in 2 years':'grey', 'Not registered':'red', 'In progress':'amber' });
function retireInfo(r){
  const d=String(r['Date of Birth']||'').slice(0,10); if(!d) return null;
  const b=new Date(d+'T00:00:00'); if(isNaN(b)) return null;
  const rd=new Date(b); rd.setFullYear(b.getFullYear()+CONFIG.RETIRE_AGE);
  const Y=new Date().getFullYear(), y=rd.getFullYear();
  const k = rd<new Date() ? RET_BANDS[0] : y===Y ? RET_BANDS[1] : y===Y+1 ? RET_BANDS[2] : y===Y+2 ? RET_BANDS[3] : null;
  return { date:rd.toISOString().slice(0,10), k };
}
function vRetire(){
  modView(['SchoolStaff','DirStaff'],()=>{

  const all=sch.concat(dir).map(r=>Object.assign(r,{_ri:retireInfo(r)}));

    <div class="card accent" style="margin-bottom:18px"><div class="card-h">${secT(onlyMiss?`Schools yet to submit: ${FORMS[f]}`:'All schools')}
      <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">${linkBtn(f)}<button class="btn" id="rtW">Copy list for WhatsApp</button><button class="btn" id="rtE">Export List</button></div></div>
      <div class="card-h filters" style="border-bottom:0"><select class="inp" id="rtF">${DFORMS.map(k=>`<option value="${k}" ${f===k?'selected':''}>${esc(FORMS[k])}</option>`).join('')}</select>
        <div class="seg" style="margin:0;grid-template-columns:auto auto"><button type="button" data-rm="1" class="${onlyMiss?'on':''}">Not submitted (${rows.filter(r=>r[f]===null).length})</button><button type="button" data-rm="0" class="${onlyMiss?'':'on'}">All schools (${rows.length})</button></div></div>
      <div class="tbl-wrap">${shown.length?`<table class="t"><thead><tr><th>School</th><th>Circuit</th>${DFORMS.map(k=>`<th>${esc(FORMS[k])}</th>`).join('')}<th class="num">Done</th></tr></thead><tbody>
        ${shown.map(r=>`<tr><td><b>${esc(r.s['School Name'])}</b><div class="small muted">${esc(r.s['EMIS Code'])}${r.s.Phone?' · '+esc(r.s.Phone):''}</div></td><td>${esc(canonCircuit(r.s.Circuit))}</td>
          ${DFORMS.map(k=>`<td class="small">${r[k]==='na'?'<span class="muted">n/a</span>':r[k]?`<a href="#" data-rc="${esc(r[k]['Receipt No'])}" style="color:var(--green);font-weight:600">✓ ${fmtDate(r[k]['Submitted At'])}</a>`:'<span class="pill red">Not submitted</span>'}</td>`).join('')}
          <td class="num"><b>${r.done}/${r.n}</b></td></tr>`).join('')}</tbody></table>`:`<div class="empty">🎉 Every school in scope has submitted ${esc(FORMS[f])}.</div>`}</div></div>

      ${dataTable('rl',R.slice().sort((a,b)=>String(b['Submitted At']).localeCompare(String(a['Submitted At']))),[{k:'Receipt No',v:r=>`<a href="#" data-rc="${esc(r['Receipt No'])}"><b>${esc(r['Receipt No'])}</b></a>`},{k:'Form'},...schoolCols,{k:'Submitted By',small:1},{k:'Submitted At',h:'Date',v:r=>`<span class="small">${fmtDT(r['Submitted At'])}</span>`},{k:'Summary',v:r=>`<span class="small">${parseSummary(r).map(([k,v])=>esc(k)+' '+v).join(' · ')}</span>`}],{limit:100})}</div>`;

  $('#rtW').onclick=()=>{ const miss=rows.filter(r=>r[f]===null); const by={}; miss.forEach(r=>{ const c=canonCircuit(r.s.Circuit)||'—'; (by[c]=by[c]||[]).push(r.s['School Name']); });
    const txt=`*${FORMS[f]} (${S.year||CONFIG.YEAR})* — schools yet to submit (${miss.length})\nForm link: ${formLink(f)}\n\n`+Object.keys(by).sort().map(c=>`_${c} Circuit_\n`+by[c].sort().map((n,i)=>`${i+1}. ${n}`).join('\n')).join('\n\n');

  $('#rcGo').onclick=async()=>{ const no=$('#rcNo').value.trim(); if(!no) return; try{ const r=await api('publicReceipt',{no}); openModal(receiptHTML(r,true)+'<div class="modal-actions"><button class="btn primary" onclick="closeModal()">Close</button></div>'); }catch(e){ toast(e.message,true); } };
}

/* ============================== QUICK SUBMISSION (no sign-in) ==============================
   Step 1 choose the request · Step 2 your details · Step 3 choose the file(s) · Step 4 receipt */
const QW = {};
const QSTEPS = ['Choose what to submit','Your details','Choose your file','Receipt'];
function qwMe(){ try{ return JSON.parse(localStorage.getItem('qw_me')||'{}'); }catch(e){ return {}; } }
function qwRemember(o){ try{ localStorage.setItem('qw_me', JSON.stringify(o)); }catch(e){} }
async function openWizard(taskId, replaceId){
  Object.assign(QW,{replaceId:replaceId||null, step:1, task:null, tasks:null, err:'', ticket:null, info:null, files:[], ids:[], receipt:null, busy:false, decl:{}, imp:null});
  openModal('<div id="qw"></div>'); $('#modalCard').classList.add('wide','wiz'); drawWiz();
  try{ QW.tasks=await api('publicTasks'); }catch(e){ QW.err=e.message; }
  if(taskId&&QW.tasks){ const t=QW.tasks.find(x=>x['Task ID']===taskId); if(t){ if(taskKind(t)!=='upload'){ closeModal(); return taskKind(t)==='form:Officers'?openOfficerForm():openReturnForm(); } QW.task=t; QW.step=2; } }
  drawWiz();
}
async function dlTemplate(taskId){
  toast('Downloading template…');
  try{ const f=await api('publicTemplate',{taskId}); saveBlob(b64ToBlob(f.data,f.mime), f.name); toast('Template downloaded — fill it in, save it, then upload it here.'); }
  catch(e){ toast(e.message,true); }
}
function qTaskCard(t, selectable){
  const d=dueInfo(Object.assign({Status:'Open'},t)), ex=allowedExts(t['Allowed Types']);
  return `<div class="qcard ${selectable?'sel':''}" ${selectable?`data-qt="${esc(t['Task ID'])}" role="button" tabindex="0"`:''}>
    <div style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap"><b class="qt">${esc(t.Title)}</b><span class="pill ${d.cls}">${esc(d.text)}</span></div>
    ${t.Description?`<div class="muted ${selectable?'clamp':''}" style="margin-top:4px;white-space:pre-line">${esc(t.Description)}</div>`:''}
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">${typeList(t['Allowed Types']).map(k=>`<span class="chip">${esc(TYPE_LABEL[k]||k)}</span>`).join('')}
      ${taskKind(t)!=='upload'?`<span class="chip" style="background:#eef3ff;color:#2a4fa8">📝 online form — no file needed</span>`:t['Template Name']||primaryFill(t)?`<button type="button" class="btn sm" data-tpl="${esc(t['Task ID'])}" data-fill="${esc(t['Template Name']?'':primaryFill(t))}">⬇ Download template</button>`:''}
      ${fillsChips(t)?`<span class="chip" style="background:#e9f7f0;color:#155f40">fills ${esc(fillsChips(t))} automatically</span>`:''}
      ${t.Ownership&&t.Ownership!=='All'?`<span class="chip" style="background:#fff4e0;color:#8a5300">${esc(t.Ownership)} schools only</span>`:''}
      ${selectable?'<span class="qgo">Select ›</span>':''}</div></div>`;
}
function drawWiz(){
  const el=$('#qw'); if(!el) return;
  const st=QW.step, steps=`<div class="steps">${QSTEPS.map((l,i)=>`<div class="step ${i+1<st?'done':i+1===st?'on':''}"><span>${i+1<st?'✓':i+1}</span><small>${l}</small></div>`).join('')}</div>`;
  let body='';
  if(st===1){
    body=`<h3>What would you like to submit?</h3><p class="muted">Tap the item the Directorate asked for. If there is a template, download it first, fill it in and save it on your phone or computer.</p>
      ${QW.err?`<div class="banner bad">${esc(QW.err)}</div>`:!QW.tasks?'<div class="loading"><span class="spin"></span></div>'
        :QW.tasks.length?`<div class="qlist">${QW.tasks.map(t=>qTaskCard(t,true)).join('')}</div>`:'<div class="empty">There is nothing to submit right now.</div>'}
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`;
  }
  if(st===2){
    const me=qwMe();
    body=`<h3>Your details</h3><p class="muted">So that we know which school is submitting. No password is needed.</p>${qTaskCard(QW.task,false)}
      <form id="qf" style="margin-top:6px">
        <div class="grid2"><div><label class="f">School EMIS code *</label><input class="inp big" id="qE" inputmode="numeric" autocomplete="off" value="${esc(me.emis||'')}" placeholder="e.g. 1066160034" required></div>
          <div><label class="f">School phone number *</label><input class="inp big" id="qP" inputmode="tel" value="${esc(me.phone||'')}" placeholder="the number the EMIS Office has" required></div>
          <div><label class="f">Your full name *</label><input class="inp big" id="qN" value="${esc(me.name||'')}" required></div>
          <div><label class="f">Your Staff ID *</label><input class="inp big" id="qS" inputmode="numeric" value="${esc(me.staffId||'')}" required></div></div>
        <div class="seg qrole"><button type="button" data-qh="1" class="${me.isHead!==false?'on':''}">I am the head teacher</button><button type="button" data-qh="0" class="${me.isHead===false?'on':''}">I am another staff member</button></div>
        <div class="small muted" style="margin-top:8px">The phone number must match the school's number registered with the Municipal EMIS Office.</div>
        <div class="err" id="qErr"></div>
        <div class="modal-actions"><button type="button" class="btn" id="qBack">‹ Back</button><button class="btn primary big" id="qGo">Continue ›</button></div></form>`;
  }
  if(st===3){
    const t=QW.task, i=QW.info, ex=allowedExts(t['Allowed Types']), max=i.maxFiles;
    body=`<h3>Choose your file</h3>
      <div class="banner ok" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">✓ <span><b>${esc(i.school)}</b> · ${esc(canonCircuit(i.circuit))} Circuit · EMIS ${esc(i.emis)}</span><a href="#" id="qNot" style="margin-left:auto">Not your school?</a></div>
      ${fillsChips(t)?`<div class="banner" style="margin-top:10px">📊 Upload the filled Excel template — the portal will also fill your school's <b>${esc(fillsChips(t))}</b> from it.</div>`:''}
      <div class="muted" style="margin:10px 0">Submitting: <b style="color:var(--text)">${esc(t.Title)}</b>${i.alreadySubmitted&&!(i.files||[]).some(f=>f.status==='Rejected')?` · <span style="color:var(--amber)">your school has already sent ${i.alreadySubmitted} file(s) for this — new files will be added.</span>`:''}</div>
      ${QW.replaceId&&(i.files||[]).some(f=>f.id===QW.replaceId&&f.status!=='Rejected')?`<div class="banner" style="margin-bottom:10px">↻ Your corrected file will <b>replace</b> the file you just sent.</div>`:''}
      ${(i.files||[]).some(f=>f.status==='Rejected')?`<div class="banner bad" style="margin-bottom:10px">↻ Your new file will <b>replace</b> the returned file${(i.files||[]).filter(f=>f.status==='Rejected').length>1?'s':''} below — you don't need to delete anything.</div>`:''}
      ${(i.files||[]).length?`<div class="stlist" style="margin-bottom:10px">${i.files.map(f=>stRow({'File Name':f.name,'Submitted At':f.at,Status:f.status,Remark:f.remark})).join('')}</div>`:''}
      <label class="drop big" id="qDrop"><input type="file" id="qIn" class="hidden" multiple ${ex?`accept="${ex.map(e=>'.'+e).join(',')}"`:''}>
        <div style="font-size:34px">📄</div><b>Tap here to choose your file</b><div class="small muted">or drag it here · ${ex?ex.map(e=>'.'+e).join(' '):'any file'} · up to ${CONFIG.MAX_FILE_MB} MB${max?` · up to ${max} file${max>1?'s':''}`:''}</div></label>
      <div class="queue" id="qQ">${QW.files.map((f,k)=>`<div class="q"><span>📎 ${esc(f.name)} <span class="muted">(${fmtSize(f.size/1024)})</span></span><span id="qs${k}">${QW.busy?'':`<a href="#" data-qrm="${k}">remove</a>`}</span></div>${f._ac===undefined?'':f._ac===null?'':acBox(f._ac,'Portal check of this file')+(f._ac.sev==='red'?'<div class="small" style="color:var(--red);margin:-4px 0 8px">Please correct the file and choose it again (tap “remove”), or submit it anyway — the EMIS Office will see these findings.</div>':'')}${f._ac===undefined&&/\.(xlsx|xlsm|xls|csv)$/i.test(f.name)?'<div class="small muted" style="margin:-2px 0 8px"><span class="spin"></span> Checking the file…</div>':''}`).join('')}</div>
      ${declMod(t)?declHTML(declMod(t),'qw',QW.decl||{}):''}
      <label class="f">Message to the Directorate (optional)</label><input class="inp" id="qNote" value="${esc(QW.note||'')}">
      <div class="err" id="qErr"></div>
      <div class="modal-actions"><button type="button" class="btn" id="qBack" ${QW.busy?'disabled':''}>‹ Back</button><button class="btn primary big" id="qUp" ${QW.files.length&&!QW.busy?'':'disabled'}>⬆ Submit ${QW.files.length>1?QW.files.length+' files':'file'}</button></div>`;
  }
  if(st===4){
    body=`<div class="banner ok" style="font-size:16px;margin-bottom:14px">🎉 <b>Done! Your file has been received.</b> Keep this receipt — print it, save it as PDF or send it on WhatsApp.</div>
      ${fillsReport(QW.imp)}
      ${(QW.bad||[]).map(x=>acBox(x.ac,'Portal first review of '+x.name)+`<div style="margin:-4px 0 14px"><button type="button" class="btn sm primary" data-refix="${esc(x.id)}">⬆ Upload a corrected file now</button> <span class="small muted">It will replace ${esc(x.name)}. Otherwise the EMIS Office will review it with these findings.</span></div>`).join('')}

  };
  if(st===3){
    const ex=allowedExts(QW.task['Allowed Types']);
    const add=list=>{ for(const f of list){ const e=extOf(f.name);
        if(ex&&!ex.includes(e)){ toast(`${f.name}: .${e} files are not accepted for this request.`,true); continue; }

function classCode(v){
  const t=sval(v).toLowerCase().replace(/[\s.]+/g,'');

// find the sheet + header row that best matches the tab, then turn rows into records
function xlParse(mod, wb, forcedEmis, lenient){
  const spec=XL[mod]; let best=null;
  wb.SheetNames.forEach(n=>{ const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
    for(let i=0;i<Math.min(15,a.length);i++){ const h=a[i].map(sval), hs=h.map(nk); const score=spec.hints.filter(x=>hs.includes(nk(x))).length;
      if(score>=2&&(!best||score>best.score)) best={score,sheet:n,h,i,a}; } });
  if(!best) throw new Error(`This file does not look like the ${FORMS[mod]||mod} template — the column headings were not found. Download the template and copy your data into it.`);
  const out={sheet:best.sheet, rows:[], errors:[], byEmis:{}, raw:[], headers:best.h.filter(Boolean), score:best.score};
  best.a.slice(best.i+1).forEach((r,k)=>{
    const row={}; best.h.forEach((hh,j)=>{ if(hh) row[hh]=r[j]; });
    const g=getter(row), line=best.i+k+2;
    let rec; try{ rec=spec.map(g,row); }catch(e){ rec={_err:e.message}; }
    if(!rec) return;
    if(rec._err&&Object.keys(rec).length===1){ out.errors.push(`Row ${line}: ${rec._err}`); return; }
    const em=sval(g('School EMIS Code','EMIS Code','EMIS'));
    const emis=forcedEmis||em;
    if(forcedEmis&&em&&em!==String(forcedEmis)){
      if(lenient){ rec['EMIS Code']=String(forcedEmis); (out._other=out._other||[]).push({rec,line,em,row}); return; }
      out.errors.push(`Row ${line}: belongs to another school (EMIS ${em}) — skipped`); return; }
    if(!emis){ out.errors.push(`Row ${line}: no School EMIS Code`); return; }
    if(rec._err){ out.errors.push(`Row ${line}: ${rec._err}`); delete rec._err; if(mod!=='SchoolStaff') return; }
    rec['EMIS Code']=String(emis); out.rows.push(rec); out.raw.push({line,row}); (out.byEmis[emis]=out.byEmis[emis]||[]).push(rec);
  });
  // a school's own file where EVERY row carries a different EMIS code: the code was mistyped, so keep the rows.
  // If only some rows differ, they belong to other schools and are skipped.
  if(out._other){
    if(!out.rows.length){ out._other.forEach(o=>{ if(o.rec._err){ out.errors.push(`Row ${o.line}: ${o.rec._err}`); delete o.rec._err; } out.rows.push(o.rec); out.raw.push({line:o.line,row:o.row}); (out.byEmis[forcedEmis]=out.byEmis[forcedEmis]||[]).push(o.rec); }); out.warnEmis=out._other.length; }
    else out._other.forEach(o=>out.errors.push(`Row ${o.line}: belongs to another school (EMIS ${o.em}) — skipped`));
    delete out._other;
  }
  return out;
}

function auditStaff(P, ctx){
  const R=[]; const add=(sev,text)=>R.push({sev,text});
  const bag={}; const hit=(key,line,extra)=>{ (bag[key]=bag[key]||{rows:[],ex:new Set()}).rows.push(line); if(extra!=null&&bag[key].ex.size<3) bag[key].ex.add(String(extra)); };
  const cols=STAFF_RULES.cols, L=STAFF_RULES.lists, D=STAFF_RULES.dep;
  const has=h=>P.headers.some(x=>nk(x)===nk(h));
  const seen={'Staff ID':{},'Ghana Card No.':{},'SSNIT No.':{},'NameDOB':{}};
  const thisYear=new Date().getFullYear();
  P.raw.forEach(({line,row})=>{
    const g=getter(row), v=h=>sval(g(h));
    // fixed values (drop-downs that must be one value for this collection)
    if(has('Academic Year')&&v('Academic Year')!==EXPECT['Academic Year']()) hit('year',line,v('Academic Year')||'blank');
    if(has('Term')&&normV(v('Term'))!==normV(EXPECT['Term']())) hit('term',line,v('Term')||'blank');
    if(has('MMDA')&&!MMDA_OK(v('MMDA'))) hit('mmda',line,v('MMDA')||'blank');
    if(has('Region')&&v('Region')&&!/ashanti/i.test(v('Region'))) hit('region',line,v('Region'));
    if(ctx.emis&&has('School EMIS Code')&&v('School EMIS Code')&&v('School EMIS Code')!==String(ctx.emis)) hit('emis',line,v('School EMIS Code'));
    // required
    const noId=has('Staff ID')&&!v('Staff ID')&&!v('Ghana Card No.');
    if(noId) hit('noid',line);
    REQUIRED_STAFF.forEach(h=>{ if(has(h)&&!v(h)&&!(noId&&h==='Ghana Card No.')) hit('req:'+h,line); });
    // drop-down values
    Object.keys(cols).forEach(h=>{ if(['Academic Year','Term','MMDA'].includes(h)) return; const x=v(h); if(!x) return;
      const ok=(L[cols[h]]||[]).some(o=>normV(o)===normV(x)); if(!ok) hit('dd:'+h,line,x); });
    // dependent drop-downs
    const lt=v('Level Taught'), ct=v('Classes Taught');
    if(lt&&ct){ const k='TL_'+lt.replace(/[ \/]/g,'_'); if(D[k]&&!ct.split(/\s*[,;]\s*/).every(c=>D[k].some(o=>normV(o)===normV(c)))) hit('dep:Classes Taught',line,ct); }
    [['Professional Qual Level','Highest Professional Qual'],['Academic Qual Level','Highest Academic Qual']].forEach(([lv,q])=>{ const a=v(lv), b=v(q); if(a&&b){ const k='QT_'+a.replace(/[ \/]/g,'_'); if(D[k]&&!D[k].some(o=>normV(o)===normV(b))) hit('dep:'+q,line,b); } });
    // ID formats
    Object.keys(ID_RULES).forEach(h=>{ let x=v(h); if(!x) return; if(/Phone/.test(h)){ const d=x.replace(/\D/g,''); if(d.length===9&&!x.startsWith('0')){ hit('zero:'+h,line,x); return; } x=d.length===x.replace(/[\s-]/g,'').length?d:x; }
      if(!ID_RULES[h].re.test(x.toUpperCase().replace(/\s/g,''))) hit('id:'+h,line,x); });
    // e-mail
    const em=v('Email Address');
    if(em){ const dom=(em.split('@')[1]||'').toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(em)) hit('mail',line,em);
      else if(EMAIL_TYPO[dom]) hit('mailtypo',line,`${em} → @${EMAIL_TYPO[dom]}`); }
    // duplicates inside the file
    ['Staff ID','Ghana Card No.','SSNIT No.'].forEach(h=>{ const x=v(h).toUpperCase().replace(/\s/g,''); if(!x) return; (seen[h][x]=seen[h][x]||[]).push(line); });
    const nd=normV([v('First Name'),v('Surname'),v('Birth: Year')].join('|')); if(v('First Name')) (seen.NameDOB[nd]=seen.NameDOB[nd]||[]).push(line);
    // dates and logic
    const by=parseInt(v('Birth: Year')), fy=parseInt(v('First Appt: Year')), py=parseInt(v('Posted: Year'));
    const bd=parseInt(v('Birth: Day')), bm=MONTHS.indexOf(normV(v('Birth: Month')));
    if(by&&bm>=0&&bd&&new Date(by,bm,bd).getMonth()!==bm) hit('baddate',line,`${bd} ${v('Birth: Month')} ${by}`);
    if(by){ const age=thisYear-by; if(age<18) hit('young',line,`${by}`); if(age>CONFIG.RETIRE_AGE) hit('old',line,`${by} (age ${age})`); }
    if(by&&fy&&fy<by+18) hit('appt',line,`born ${by}, appointed ${fy}`);
    if(fy&&py&&py<fy) hit('posted',line,`appointed ${fy}, posted ${py}`);
    const st=normV(v('Staff Status')), sc=normV(v('Main Schedule'));
    if(st==='teaching'&&sc==='support staff') hit('logic1',line);
    if(st==='non-teaching'&&sc==='classroom teaching') hit('logic2',line);
    if(sc==='classroom teaching'&&!v('Level Taught')) hit('nolevel',line);
    if(/jhs/i.test(lt)&&sc==='classroom teaching'&&!v('JHS Subjects')) hit('nosubj',line);
    if(normV(v('Has a Disability?'))==='yes'&&!v('Disability Type')) hit('dis',line);
    [['Disability Type','If Other: Specify Disability'],['Area of Specialization','If Other: Specify Area'],['Other Responsibility','If Other: Specify Responsibility'],['Highest Professional Qual','If Other: Specify Prof.'],['Highest Academic Qual','If Other: Specify Acad.']]
      .forEach(([a,b])=>{ if(/^other/i.test(v(a))&&!v(b)) hit('other:'+a,line); });
  });
  Object.entries(seen).forEach(([h,m])=>Object.entries(m).forEach(([x,ls])=>{ if(ls.length>1) hit(h==='NameDOB'?'dupname':'dup:'+h, ls.join(' & '), h==='NameDOB'?null:x); }));
  const T={ year:`Academic Year should be ${EXPECT['Academic Year']()}`, term:`Term should be ${EXPECT['Term']()}`, mmda:'MMDA should be Asante Akim North Municipal', region:'Region should be Ashanti Region',
    emis:`School EMIS Code differs from your school's code (${ctx.emis})`, noid:'no Staff ID and no Ghana Card number', mail:'e-mail address is not valid', mailtypo:'e-mail looks mistyped',
    baddate:'date of birth does not exist', young:'year of birth gives an age under 18', old:`year of birth gives an age over ${CONFIG.RETIRE_AGE} — should this person still be at post?`,
    appt:'first appointment before age 18', posted:'posted to this school before first appointment', logic1:'Staff Status is Teaching but Main Schedule is Support Staff',
    logic2:'Staff Status is Non-Teaching but Main Schedule is Classroom Teaching', nolevel:'Classroom Teaching but Level Taught is empty', nosubj:'JHS teacher without JHS Subjects',
    dis:'Has a Disability = Yes but Disability Type is empty', dupname:'same name and year of birth entered twice' };
  const label=k=>{ if(T[k]) return T[k]; const [a,h]=k.split(/:(.+)/);
    return a==='req'?`${h} is empty`:a==='dd'?`${h}: value not from the drop-down list`:a==='dep'?`${h} does not match the level chosen`:a==='id'?`${h}: wrong format (should be ${ID_RULES[h].eg})`
      :a==='zero'?`${h}: leading 0 missing (format the column as Text)`:a==='dup'?`${h} repeated`:a==='other'?`${h} is “Other” but not specified`:k; };
  const red=k=>/^(year|term|mmda|emis|dup|dupname|noid|baddate)/.test(k)||/^id:(Staff ID|Ghana Card)/.test(k)||/^req:(First Name|Surname|Sex|Staff Status)/.test(k);
  Object.entries(bag).sort((a,b)=>(red(b[0])-red(a[0]))||b[1].rows.length-a[1].rows.length).forEach(([k,o])=>{
    const ex=[...o.ex].filter(Boolean); add(red(k)?'red':'amber', `${label(k)} — row${o.rows.length>1?'s':''} ${rowsList(o.rows)}${ex.length?` (e.g. ${ex.map(x=>'“'+x+'”').join(', ')})`:''}`); });
  return R;
}

function autoCheck(wb, ctx){

    let A; try{ A=retFromWorkbook(wb); }catch(e){ return { check:'Empty template', sev:'red', remarks:[e.message], rows:0, mod:'SchoolReturn' }; }
    const E=retIssues(A), num=k=>Number(A[k])||0, rs=[32,33,37,38,39,40,41,42,46,47,48], tot=rs.reduce((a,r)=>a+num('C'+r)+num('D'+r),0);
    if(ctx.emis&&A.C6&&String(A.C6).trim()!==String(ctx.emis)) E.unshift('The school EMIS code in the form ('+A.C6+') is not your school\'s ('+ctx.emis+').');
    return { check:E.length?E.length+' issue'+(E.length>1?'s':''):'No issues', sev:E.length?'amber':'green', remarks:[`Enrolment ${tot} (boys ${rs.reduce((a,r)=>a+num('C'+r),0)}, girls ${rs.reduce((a,r)=>a+num('D'+r),0)}); permanent classrooms ${num('C102')+num('C103')+num('C104')}.`,...E.slice(0,20).map(x=>'• '+x)], rows:1, mod:'SchoolReturn' };

  let mod=ctx.mod&&XL[ctx.mod]?ctx.mod:null;
  if(!mod){ let best=0; Object.keys(XL).forEach(k=>{ try{ const P=xlParse(k,wb,ctx.emis,true); const sc=P.score||0; if(sc>best){ best=sc; mod=k; } }catch(e){} }); if(best<3) mod=null; }
  const cellsWithData=wb.SheetNames.reduce((a,n)=>a+XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}).flat().filter(x=>String(x).trim()!=='').length,0);
  if(!mod) return { check: cellsWithData<5?'Empty file':'Not checked', sev: cellsWithData<5?'red':'', remarks: cellsWithData<5?['The file is empty.']:[], rows:0 };
  let P; try{ P=xlParse(mod,wb,ctx.emis,true); }
  catch(e){ return { check:'Wrong file', sev:'red', remarks:[`This is not the ${FORMS[mod]||mod} template — the expected column headings were not found. Download the template from the portal and copy the data into it.`], rows:0, mod }; }
  if(!P.rows.length) return { check:'Empty template', sev:'red', remarks:[`The ${FORMS[mod]||mod} template was sent without any ${mod==='SchoolStaff'?'staff':'records'} entered (blank template).`], rows:0, mod };
  let items=[];
  if(mod==='SchoolStaff') items=auditStaff(P, ctx);
  if(mod==='SHSStaff'){ try{ items=auditStaff(P, ctx).filter(i=>!/drop-down|should be/i.test(i.text)); }catch(e){} }
  P.errors.forEach(e=>items.push({sev:'amber',text:e}));
  if(mod==='Enrolment'){ const big=P.rows.filter(r=>r.Boys+r.Girls>90); if(big.length) items.push({sev:'amber',text:`very large class: ${big.map(r=>CLASS_LABEL(r.Class)+(r.Stream?' '+r.Stream:'')+' '+(r.Boys+r.Girls)).join(', ')}`}); }
  const n=items.length, nRed=items.filter(i=>i.sev==='red').length;
  const sum=/Staff$/.test(mod)?(()=>{ const t=P.rows.filter(r=>r.Category==='Teaching').length; return `${P.rows.length} staff (${t} teaching, ${P.rows.length-t} non-teaching)`; })():`${P.rows.length} record(s)`;
  return { check: n?`${n} issue${n>1?'s':''}`:'No issues', sev: nRed?'red':n?'amber':'green', remarks:[sum+'.',...items.map(i=>(i.sev==='red'?'❗ ':'• ')+i.text)], rows:P.rows.length, mod };
}
async function autoCheckFile(file, ctx){
  if(!/\.(xlsx|xlsm|xls|csv)$/i.test(file.name)||!window.XLSX) return null;
  try{ return autoCheck(await xlRead(file), ctx); }catch(e){ return { check:'Could not read', sev:'amber', remarks:['The portal could not open this Excel file: '+e.message], rows:0 }; }
}
const acPill = (c, sev) => c?`<span class="pill ${sev==='red'?'red':sev==='amber'?'amber':sev==='green'?'green':'grey'}" title="Portal first review">🔍 ${esc(c)}</span>`:'';
const acSev = c => !c?'':/wrong|empty|could not/i.test(c)?'red':/no issues/i.test(c)?'green':/issue/i.test(c)?'amber':'';
function acBox(res, heading){
  if(!res||!res.remarks||!res.remarks.length) return '';

async function downloadTabTemplate(mod, emis){

  if(mod==='Officers') return downloadOfficers([], (S.data&&S.data.office)||null, 'EDUCATION_OFFICERS_TEMPLATE.xlsx').catch(e=>toast(e.message,true));

  if(!window.XLSX){ toast('The Excel tools did not load. Check your internet connection and refresh.',true); return; }
  const sch=emis?((S.data&&S.data.schools.find(s=>String(s['EMIS Code'])===String(emis)))||(S.user&&S.user.emis===emis?{'EMIS Code':emis,'School Name':S.user.name,Level:S.user.level}:null)):null;
  const spec=XL[mod], head=['School EMIS Code','School Name',...spec.cols], pre=[sch?sch['EMIS Code']:'', sch?sch['School Name']:''];

  else if(mod==='Furniture') body=FURN_ITEMS.map(i=>[...pre,i,'','','','']);
  else body=Array.from({length:40},()=>[...pre,...spec.cols.map(()=>'')]);
  const ws=XLSX.utils.aoa_to_sheet([head,...body]); ws['!cols']=head.map(h=>({wch:Math.max(12,String(h).length+2)})); ws['!freeze']={xSplit:2,ySplit:1};
  const help=[['HOW TO FILL — '+(FORMS[mod]||mod)],[''],['1. Fill one row per '+({Enrolment:'class or stream',Furniture:'item',SchoolStaff:'staff member'}[mod]||'record')+'.'],['2. Do not change the column headings in row 1.'],
    ['3. Keep the School EMIS Code on every row you fill.'],...(MODS[mod]&&MODS[mod].fields?MODS[mod].fields.filter(f=>f.t==='select').map(f=>[`${f.k}: choose one of — ${f.o.join(', ')}`]):[]),
    ...(mod==='Enrolment'?[['Class: KG 1, KG 2, B1 … B9 (JHS 1–3 = B7–B9), Creche, Nursery 1, Nursery 2. Add a row for each stream (A, B …).']]:[]),
    ['Dates: day/month/year, e.g. 14/03/2011.'],['4. Save the file, then upload it in the portal (Upload filled Excel, or Submit a file).']];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'DATA'); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(help),'HOW TO FILL');
  XLSX.writeFile(wb,`AAN_${(FORMS[mod]||mod).replace(/\W+/g,'_')}_TEMPLATE${sch?'_'+sch['EMIS Code']:''}.xlsx`);
  toast('Template downloaded. Fill it in, save it, then upload it.');
}

/* ============================== DECLARED TOTALS ==============================
   When a head submits, they type the totals from the school's own records (register, staff records).
   The portal compares them with what was entered and prints the result on the receipt. */
const DECL = {
  Enrolment:  { keys:[['Boys','Boys'],['Girls','Girls']], from:'your class attendance registers' },
  SchoolStaff:{ keys:[['Teaching','Teaching staff'],['Non-teaching','Non-teaching staff']], from:'your staff records / nominal roll — not from the list you typed' },
  SHSStaff:   { keys:[['Teaching','Teaching staff'],['Non-teaching','Non-teaching staff']], from:'your staff records / nominal roll — not from the list you typed' },
  BECE:       { keys:[['Boys','Boys (male candidates)'],['Girls','Girls (female candidates)']], from:'your BECE registration list' }
};
function enteredOf(mod, rows){
  if(mod==='Enrolment') return { Boys:sum(rows,'Boys'), Girls:sum(rows,'Girls') };
  if(/Staff$/.test(mod)) return { Teaching:rows.filter(r=>r.Category==='Teaching').length, 'Non-teaching':rows.filter(r=>r.Category==='Non-teaching').length };
  if(mod==='BECE') return { Boys:rows.filter(r=>r.Sex==='Male').length, Girls:rows.filter(r=>r.Sex==='Female').length };
  return {};
}
const declHTML = (mod, p, vals={}) => `<div class="decl"><div class="decl-h">✍️ <b>Confirm your totals</b> <span class="small muted">— count them from ${esc(DECL[mod].from)}.</span></div>
  <div class="decl-g">${DECL[mod].keys.map(([k,l])=>`<div><label class="f">${esc(l)}</label><input class="inp big" type="number" min="0" step="1" inputmode="numeric" data-decl="${p}" data-k="${esc(k)}" value="${esc(vals[k]??'')}"></div>`).join('')}</div></div>`;
function readDecl(p){
  const o={}; let ok=true;
  $$(`[data-decl="${p}"]`).forEach(i=>{ const v=i.value.trim(); if(v===''||!Number.isInteger(Number(v))||Number(v)<0) ok=false; else o[i.dataset.k]=Number(v); });
  return ok?o:null;
}
const declDiff = (mod, d, e) => DECL[mod].keys.filter(([k])=>Number(d[k])!==Number(e[k]||0)).map(([k,l])=>`${l}: you counted <b>${d[k]}</b>, but <b>${e[k]||0}</b> ${mod==='SchoolStaff'?'are on the list':'were entered'}`);
// school only: ask for the totals, warn on a difference, then run go(declared)
function askDecl(mod, entered, go){
  openModal(`<h3>Before you submit</h3><p class="muted small">The portal checks that every ${mod==='SchoolStaff'?'staff member':mod==='BECE'?'candidate':'learner'} has been entered. Type the totals from ${esc(DECL[mod].from)}.</p>
    ${declHTML(mod,'ad')}<div id="adOut"></div><div class="err" id="adErr"></div>
    <div class="modal-actions" id="adAct"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="adGo">Check &amp; submit</button></div>`);

function checkLine(r){

/* ============================== DATA CHECKS ==============================
   Signals that a school's figures may be incomplete or wrong. Used on the staff "Data checks" page
   and, for one school, as a "Please check" box on the school's own tabs. */
const CHK_AREA = { decl:'Declared totals', enrol:'Enrolment', staff:'Staff list' };
const CHK_MISSING = ['Staff ID','Date of Birth','Gender','Rank','Category'];
function computeChecks(schools, opt={}){
  const by=new Map(schools.map(s=>[String(s['EMIS Code']),s])), out=[];
  const add=(e,area,sev,issue,detail)=>{ const s=by.get(String(e)); if(s) out.push({s,area,sev,issue,detail}); };
  // 1. declared totals on the latest receipt
  if(!opt.skipDecl){
    const latest={};
    (S.receipts||[]).forEach(r=>{ if(!DECL[r.Module]) return; if(r.Module==='Enrolment'&&r.Period&&r.Period!==curPeriod()) return;
      const k=r['EMIS Code']+'|'+r.Module; if(!latest[k]||String(r['Submitted At'])>String(latest[k]['Submitted At'])) latest[k]=r; });
    Object.values(latest).forEach(r=>{ if(r.Check&&r.Check!=='OK') add(r['EMIS Code'],'decl','red',`${FORMS[r.Module]}: head's count differs`,`${r.Check} · receipt ${r['Receipt No']}, ${fmtDate(r['Submitted At'])}`); });
  }
  // 2. enrolment: change since the last count, missing classes, very large classes
  const EN=(S.rec.Enrolment||[]).filter(r=>by.has(String(r['EMIS Code'])));
  const P=PERIODS(), ci=P.indexOf(curPeriod());
  const enrolByE={};
  EN.forEach(r=>{ const e=String(r['EMIS Code']); ((enrolByE[e]=enrolByE[e]||{})[periodOf(r)]=enrolByE[e][periodOf(r)]||[]).push(r); });
  Object.entries(enrolByE).forEach(([e,per])=>{
    const now=per[curPeriod()]; if(!now) return;
    const T=rows=>rows.reduce((a,r)=>a+num(r.Boys)+num(r.Girls),0);
    const prevP=P.slice(0,ci).reverse().find(p=>per[p]);
    if(prevP){
      const a=T(per[prevP]), b=T(now);
      if(a&&Math.abs(b-a)>=10&&Math.abs(b-a)/a>=0.2) add(e,'enrol','amber','Big change since the last count',`${prevP}: ${a.toLocaleString()} → ${curPeriod()}: ${b.toLocaleString()} (${b>a?'+':''}${Math.round((b-a)/a*100)}%)`);
      const cls=c=>rows=>rows.filter(r=>r.Class===c).reduce((x,r)=>x+num(r.Boys)+num(r.Girls),0);
      const gone=[...new Set(per[prevP].map(r=>r.Class))].filter(c=>cls(c)(per[prevP])>0&&!cls(c)(now));
      if(gone.length) add(e,'enrol','amber','Class missing this count',gone.map(c=>`${CLASS_LABEL(c)} (had ${cls(c)(per[prevP])})`).join(', '));
    }
    const big=now.filter(r=>num(r.Boys)+num(r.Girls)>90);
    if(big.length) add(e,'enrol','amber','Very large class',big.map(r=>`${CLASS_LABEL(r.Class)}${r.Stream?' '+r.Stream:''}: ${num(r.Boys)+num(r.Girls)}`).join(', ')+' — check for a typing error or a stream not entered');
  });
  // 3. staff: duplicates, missing details, pupil–teacher ratio
  const ST=(S.rec.SchoolStaff||[]).filter(r=>by.has(String(r['EMIS Code'])));
  const ids={};
  (S.rec.SchoolStaff||[]).forEach(r=>{ const id=String(r['Staff ID']||'').replace(/\s/g,'').toUpperCase(); if(id) (ids[id]=ids[id]||[]).push(r); });
  Object.entries(ids).forEach(([id,list])=>{ if(list.length<2) return;
    const schs=[...new Set(list.map(r=>String(r['EMIS Code'])))];
    if(schs.length===1) add(schs[0],'staff','red','Same Staff ID entered twice',`${id}: ${list.map(r=>r['Full Name']).join(', ')}`);
    else schs.forEach(e=>add(e,'staff','red','Staff ID also listed at another school',`${id} (${list.find(r=>String(r['EMIS Code'])===e)['Full Name']}) is also at ${list.filter(r=>String(r['EMIS Code'])!==e).map(r=>r['School Name']||r['EMIS Code']).join(', ')}`)); });
  const stBy={}; ST.forEach(r=>(stBy[r['EMIS Code']]=stBy[r['EMIS Code']]||[]).push(r));
  Object.entries(stBy).forEach(([e,list])=>{
    const names={}; list.forEach(r=>{ const n=String(r['Full Name']||'').toLowerCase().replace(/[^a-z]/g,''); if(n) names[n]=(names[n]||0)+1; });
    const dn=Object.keys(names).filter(n=>names[n]>1); if(dn.length) add(e,'staff','amber','Same name entered twice',list.filter(r=>dn.includes(String(r['Full Name']||'').toLowerCase().replace(/[^a-z]/g,''))).map(r=>r['Full Name']).filter((v,i,a)=>a.indexOf(v)===i).join(', '));
    const miss=CHK_MISSING.map(k=>[k,list.filter(r=>!String(r[k]||'').trim()).length]).filter(x=>x[1]);
    if(miss.length) add(e,'staff','amber','Missing staff details',miss.map(([k,n])=>`${n} without ${k==='Category'?'Teaching / Non-teaching':k}`).join(', '));
    const teach=list.filter(r=>r.Category==='Teaching').length, en=(enrolByE[e]||{})[curPeriod()];
    const learners=en?en.reduce((a,r)=>a+num(r.Boys)+num(r.Girls),0):0;
    if(learners&&!teach) add(e,'staff','amber','No teaching staff on the list',`${learners.toLocaleString()} learners enrolled but no staff marked Teaching`);
    else if(learners&&teach&&learners/teach>70) add(e,'staff','amber','Very high pupil–teacher ratio',`${learners.toLocaleString()} learners ÷ ${teach} teaching staff = ${Math.round(learners/teach)} — are some teachers missing?`);
  });
  // staff count on the last two staff-list receipts
  const rc={}; (S.receipts||[]).filter(r=>r.Module==='SchoolStaff'&&by.has(String(r['EMIS Code']))).forEach(r=>(rc[r['EMIS Code']]=rc[r['EMIS Code']]||[]).push(r));
  Object.entries(rc).forEach(([e,list])=>{ if(list.length<2) return; list.sort((a,b)=>String(a['Submitted At']).localeCompare(String(b['Submitted At'])));
    const n=r=>Number((parseSummary(r).find(x=>x[0]==='Total staff')||[])[1])||0, a=n(list[list.length-2]), b=n(list[list.length-1]);
    if(a&&Math.abs(b-a)>=3&&Math.abs(b-a)/a>=0.25) add(e,'staff','amber','Staff count changed a lot',`${a} on ${fmtDate(list[list.length-2]['Submitted At'])} → ${b} on ${fmtDate(list[list.length-1]['Submitted At'])}`); });
  return out;
}
// school's own tabs: a "please check" box
function myChecks(mod){
  if(S.user.role!=='SCHOOL'||!['Enrolment','SchoolStaff'].includes(mod)) return '';
  const area=mod==='Enrolment'?'enrol':'staff';
  const list=computeChecks([{'EMIS Code':S.user.emis,'School Name':S.user.name,Circuit:S.user.circuit}],{skipDecl:true}).filter(x=>x.area===area);
  return list.length?`<div class="banner bad" style="margin:12px 0"><b>⚠ Please check before you submit</b><ul style="margin:6px 0 0 18px;padding:0">${list.map(x=>`<li><b>${esc(x.issue)}</b> — ${esc(x.detail)}</li>`).join('')}</ul></div>`:'';
}
function vChecks(){
  S.rerender=renderStaff;
  (async()=>{ $('#view').innerHTML='<div class="loading"><span class="spin"></span> Checking every school…</div>';
    try{ await Promise.all([recLoad('Enrolment'),recLoad('SchoolStaff'),loadReceipts()]); }catch(e){ if(S.tab==='checks') showErr(e, vChecks); return; }
    if(S.tab==='checks') drawChecks(); })();
}
function drawChecks(){
  S.rerender=drawChecks;
  const all=computeChecks(scoped().active), f=S.chkArea||'all';
  const list=all.filter(x=>f==='all'||x.area===f).sort((a,b)=>(a.sev==='red'?0:1)-(b.sev==='red'?0:1)||canonCircuit(a.s.Circuit).localeCompare(canonCircuit(b.s.Circuit))||String(a.s['School Name']).localeCompare(b.s['School Name']));
  const nS=new Set(all.map(x=>x.s['EMIS Code'])).size, cur=curPeriod();
  const R=(S.receipts||[]).filter(r=>DECL[r.Module]&&(r.Module!=='Enrolment'||!r.Period||r.Period===cur));
  const latest={}; R.forEach(r=>{ const k=r['EMIS Code']+'|'+r.Module; if(!latest[k]||String(r['Submitted At'])>String(latest[k]['Submitted At'])) latest[k]=r; });
  const L=Object.values(latest), withD=L.filter(r=>r.Check), okD=L.filter(r=>r.Check==='OK');
  const k=(key,l,v,sub)=>`<button type="button" class="kpi kbtn ${f===key?'on':''}" data-ca="${key}"><div class="l">${l}</div><div class="v">${v}</div>${sub?`<div class="small muted">${sub}</div>`:''}</button>`;
  $('#view').innerHTML=`<div class="page-h"><div><h2>Data checks</h2><p>Signs that a school's figures may be incomplete or wrong · ${esc(cur)} · ${scopeText()}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="ckW">Copy list for WhatsApp</button><button class="btn" id="ckE">Export List</button><button class="btn" onclick="Promise.all([recLoad('Enrolment',true),recLoad('SchoolStaff',true),loadReceipts(true)]).then(drawChecks)">Refresh</button></div></div>
    <div class="kpis" style="grid-template-columns:repeat(5,1fr)">
      ${k('all','All issues',all.length,`${nS} school${nS===1?'':'s'}`)}
      ${k('decl','Head\'s count differs',all.filter(x=>x.area==='decl').length,`${okD.length} of ${withD.length} declared returns match`)}
      ${k('enrol','Enrolment',all.filter(x=>x.area==='enrol').length,'changes, missing or large classes')}
      ${k('staff','Staff list',all.filter(x=>x.area==='staff').length,'duplicates, missing details, PTR')}
      <div class="kpi"><div class="l">Returns with declared totals</div><div class="v">${L.length?Math.round(withD.length/L.length*100):0}%</div><div class="small muted">${withD.length} of ${L.length} latest receipts</div></div></div>
    <div class="card accent"><div class="card-h">${secT(f==='all'?'Issues to follow up':CHK_AREA[f],'Red = must be fixed · amber = please confirm with the school')}</div>
      <div class="tbl-wrap">${list.length?`<table class="t"><thead><tr><th>School</th><th>Circuit</th><th>Area</th><th>Check</th><th>Details</th></tr></thead><tbody>
        ${list.map(x=>`<tr><td><b>${esc(x.s['School Name'])}</b><div class="small muted">${esc(x.s['EMIS Code'])}${x.s.Phone?' · '+esc(x.s.Phone):''}</div></td><td>${esc(canonCircuit(x.s.Circuit))}</td>
          <td><span class="pill ${x.area==='decl'?'red':x.area==='enrol'?'blue':'amber'}">${esc(CHK_AREA[x.area])}</span></td>
          <td><span class="sevdot ${x.sev}"></span><b>${esc(x.issue)}</b></td><td class="small">${esc(x.detail)}</td></tr>`).join('')}</tbody></table>`
        :`<div class="empty">🎉 No issues found in the selected circuits.</div>`}</div></div>
    <p class="small muted" style="margin-top:12px">How this works: when heads submit Enrolment, the Staff list or BECE, they type the totals from their own registers and records. The portal compares those with the records entered. It also compares this count with the last one, looks for repeated Staff IDs and missing details, and flags very large classes and pupil–teacher ratios above 70.</p>`;
  $$('[data-ca]').forEach(b=>b.onclick=()=>{ S.chkArea=b.dataset.ca; drawChecks(); });
  $('#ckE').onclick=()=>csv([['EMIS Code','School','Circuit','Phone','Area','Severity','Check','Details'],...list.map(x=>[x.s['EMIS Code'],x.s['School Name'],canonCircuit(x.s.Circuit),x.s.Phone,CHK_AREA[x.area],x.sev==='red'?'Must fix':'Confirm',x.issue,x.detail])],'AAN_data_checks.csv');
  $('#ckW').onclick=()=>{ const by={}; list.forEach(x=>{ const c=canonCircuit(x.s.Circuit)||'—'; (by[c]=by[c]||[]).push(`• ${x.s['School Name']}: ${x.issue} — ${x.detail}`); });
    const txt=`*Data checks — ${cur}*\nPlease check these figures and resubmit:\n\n`+Object.keys(by).sort().map(c=>`_${c} Circuit_\n`+by[c].join('\n')).join('\n\n');
    navigator.clipboard.writeText(txt).then(()=>toast('List copied — paste it into WhatsApp.'),()=>openModal(`<h3>Copy this list</h3><textarea class="inp" rows="14">${esc(txt)}</textarea><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`)); };
}

const okDate = (d,m,y) => { const D=+d, M=+m, Y=+y; if(!D||!M||!Y) return false; const t=new Date(Y,M-1,D); return t.getMonth()===M-1&&t.getDate()===D; };
function ofCheck(sec){

  const secs=sec?[OF_SECTIONS.find(s=>s.k===sec)]:OF_SECTIONS;
  secs.forEach(S=>S.f.forEach(f=>{ if(f.sep||f.ro||!ofVisible(f)) return;
    if(f.d){ const [a,b,c]=dHs(f.d).map(h=>v[h]); const any=[a,b,c].some(x=>x!==''&&x!=null);
      if(f.req&&!any) err(dHs(f.d)[0],`${f.lab} is required.`); else if(any&&!okDate(a,b,c)) err(dHs(f.d)[0],`${f.lab}: choose a day, month and year that exist.`); return; }
    const x=String(v[f.h]??'').trim();
    if(f.req&&!x){ err(f.h,`${ofLabel(f.h)} is required.`); return; }
    if(f.t==='sel'&&x&&!ofOpts(f).some(o=>String(o)===x)) err(f.h,`${ofLabel(f.h)}: choose from the list.`); }));
  const on=k=>!sec||OF_SECTIONS.find(s=>s.k===sec).f.some(f=>f.h===k||(f.d&&dHs(f.d).includes(k)));
  const g=k=>String(v[k]??'').trim();
  if(on('Ghana Card Number')&&g('Ghana Card Number')&&!/^GHA-\d{9}-\d$/.test(g('Ghana Card Number').toUpperCase())) err('Ghana Card Number','Ghana Card Number must look like GHA-123456789-0 (15 characters).');
  ['Telephone Number','Emergency Contact Number'].forEach(k=>{ if(on(k)&&g(k)&&!/^0\d{9}$/.test(g(k))) err(k,`${k} must be 10 digits starting with 0, e.g. 0244123456.`); });
  if(on('Emergency Contact Number')&&g('Emergency Contact Number')&&g('Emergency Contact Number')===g('Telephone Number')) err('Emergency Contact Number','The emergency number must be different from your own number.');
  if(on('Email Address')&&g('Email Address')){ const em=g('Email Address'), dom=(em.split('@')[1]||'').toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(em)) err('Email Address','This e-mail address is not complete.');
    else if(EMAIL_TYPO[dom]) warn('Email Address',`Did you mean @${EMAIL_TYPO[dom]}?`); }
  if(on('NTC Registration Number')&&g('NTC Registration Number')){ const n=g('NTC Registration Number').toUpperCase();
    if(!ID_RULES['NTC Reg. No.'].re.test(n.replace(/\s/g,''))) warn('NTC Registration Number','Usual formats: PT/00001/20 or PT/000001/20, a provisional number such as GTLE/ENC/0001/01B, or N/A if you have none — please check.'); }
  if(on('SSNIT Number')&&g('SSNIT Number')&&!/^([A-Z]\d{12}|GHA-\d{9}-\d)$/.test(g('SSNIT Number').toUpperCase())) warn('SSNIT Number','Usual format is one letter and 12 digits (e.g. C078451239642) — please check.');
  const by=+v['Birth - Year'], fy=+v['First Appointment - Year'], py=+v['Posted to Present Station - Year'], ry=+v['Date on Current Rank - Year'], now=new Date().getFullYear();
  if(on('Birth - Year')&&by&&(now-by<18)) err('Birth - Day','Check your year of birth (age under 18).');
  if(on('Birth - Year')&&by&&(now-by>CONFIG.RETIRE_AGE)) warn('Birth - Day',`Your year of birth gives an age above ${CONFIG.RETIRE_AGE} — please check.`);
  if(on('First Appointment - Year')&&by&&fy&&fy<by+18) err('First Appointment - Day','First appointment is before age 18 — check the year.');
  if(on('Posted to Present Station - Year')&&fy&&py&&py<fy) err('Posted to Present Station - Day','You cannot be posted here before your first appointment.');

/* ---- the Regional template, filled ---- */
const colNum = L => L.split('').reduce((a,c)=>a*26+c.charCodeAt(0)-64,0);
function colLetter(n){ let s=''; n++; while(n){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
const xmlEsc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const OF_NUM = h => /( - (Day|Month|Year)|Year (Started|Completed)|^TTC Year|^SHS Year|JHS Year Completed)/.test(h);
function loadScriptOnce(src, test){ return test()?Promise.resolve():new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=()=>res(); s.onerror=()=>rej(new Error('Could not load the Excel tools. Check your internet connection.')); document.head.appendChild(s); }); }
// write values into one <row> of sheet XML, keeping each cell's style; formula cells keep the formula and get a cached value
function setCells(rowXml, r, vals, drop){
  Object.entries(vals).forEach(([col,val])=>{
    const ref=col+r, re=new RegExp(`<c r="${ref}"(?=[ >/])([^>]*?)(?:/>|>([\\s\\S]*?)</c>)`), m=rowXml.match(re);
    const attrs=(m?m[1]:'').replace(/\s*t="[^"]*"/,'').replace(/\s*\/$/,'');
    const has=val!==''&&val!=null, isNum=has&&typeof val==='number';
    let cell;
    if(m&&/<f[ >]/.test(m[2]||'')&&!(drop&&has&&drop.has(col))){ const f=(m[2].match(/<f[\s\S]*?<\/f>|<f[^>]*\/>/)||[''])[0]; cell=`<c r="${ref}"${attrs}${has&&!isNum?' t="str"':''}>${f}${has?`<v>${xmlEsc(val)}</v>`:''}</c>`; }
    else if(!has) cell=`<c r="${ref}"${attrs}/>`;
    else cell=isNum?`<c r="${ref}"${attrs}><v>${val}</v></c>`:`<c r="${ref}"${attrs} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(val)}</t></is></c>`;
    if(m) rowXml=rowXml.replace(m[0],cell);
    else { // keep cells in column order (Excel requires it)
      const want=colNum(col); let at=-1; const re2=/<c r="([A-Z]+)\d+"/g; let mm;
      while((mm=re2.exec(rowXml))){ if(colNum(mm[1])>want){ at=mm.index; break; } }
      rowXml=at>=0?rowXml.slice(0,at)+cell+rowXml.slice(at):rowXml.replace('</row>',cell+'</row>'); }
  });
  return rowXml;
}
function fillRows(xml, rowsVals){ // rowsVals: {rowNumber: {col: value}}
  return xml.replace(/<row\b[^>]*\br="(\d+)"[^>]*?(?:\/>|>[\s\S]*?<\/row>)/g,(m,r)=>{ const vals=rowsVals[r]; if(!vals) return m;
    if(m.endsWith('/>')) m=m.slice(0,-2)+'></row>'; return setCells(m,r,vals); });
}
const ofCellVal = (h,v) => { if(v===''||v==null) return ''; if(OF_NUM(h)&&/^\d+$/.test(String(v))) return +v; return String(v); };
async function officersXlsxFromTemplate(tpl, records, office){
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',()=>window.JSZip);
  const zip=await JSZip.loadAsync(tpl.data,{base64:true});
  const wbx=await zip.file('xl/workbook.xml').async('string'), rels=await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const pathOf=name=>{ const sh=[...wbx.matchAll(/<sheet\b[^>]*\/>/g)].map(x=>x[0]).find(t=>new RegExp(`name="${name}"`).test(t)); if(!sh) return null;
    const id=(sh.match(/r:id="([^"]+)"/)||[])[1]; const rel=[...rels.matchAll(/<Relationship\b[^>]*\/>/g)].map(x=>x[0]).find(t=>t.includes(`Id="${id}"`));
    const tg=(rel.match(/Target="([^"]+)"/)||[])[1]; return tg.startsWith('/')?tg.slice(1):'xl/'+tg; };
  const pO=pathOf('OFFICERS'), pD=pathOf('OFFICE DETAILS');
  if(!pO) throw new Error('The attached template has no OFFICERS sheet.');
  if(records.length>300) throw new Error('The template has room for 300 officers only.');
  const H=OFFDATA.H, rowsVals={};
  records.forEach((rec,i)=>{ const o={}; H.forEach((h,j)=>{ let v=rec[h]; if((v===''||v==null)&&office&&office[h]!=null) v=office[h]; o[colLetter(j)]=ofCellVal(h,v); }); rowsVals[i+2]=o; });
  zip.file(pO, fillRows(await zip.file(pO).async('string'), rowsVals));
  if(pD&&office){ const od={4:{C:office['Academic Year']},5:{C:office['Academic Term']},6:{C:office['Region']},7:{C:office['MMDA']},8:{C:office['MMDEO Status']},9:{C:office['MMDEO EMIS Code']||''},10:{C:office['MMDEO GhanaPost GPS']||''}};
    zip.file(pD, fillRows(await zip.file(pD).async('string'), od)); }
  let w=wbx; if(/<calcPr\b/.test(w)) w=w.replace(/<calcPr\b([^>]*?)\s*(\/?)>/,(m,at,sl)=>`<calcPr${at.replace(/\s*fullCalcOnLoad="[^"]*"/,'')} fullCalcOnLoad="1"${sl}>`); else w=w.replace(/(<\/definedNames>|<\/sheets>)(?![\s\S]*<\/definedNames>)/,'$1<calcPr fullCalcOnLoad="1"/>');
  zip.file('xl/workbook.xml', w);
  return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function officersXlsxPlain(records, office){
  const H=OFFDATA.H, wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Office details',''],...Object.entries(office||{})]), 'OFFICE DETAILS');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([H,...records.map(r=>H.map(h=>ofCellVal(h,(r[h]===''||r[h]==null)&&office?office[h]??'':r[h])))]), 'OFFICERS');
  return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function downloadOfficers(records, office, name){
  let tpl=null; try{ const t=await api('publicTabTemplate',{module:'Officers'}); if(t&&!t.none) tpl=t; }catch(e){}
  let blob;
  if(tpl){ try{ blob=await officersXlsxFromTemplate(tpl, records, office); }catch(e){ console.error(e); toast('The regional template could not be filled ('+e.message+') — a plain Excel copy was made instead.',true); } }
  if(!blob){ if(!window.XLSX) throw new Error('The Excel tools did not load. Check your internet connection and refresh.'); blob=officersXlsxPlain(records, office); }
  saveBlob(blob, name); toast('Downloaded '+name);
}

function retCheck(st){
  const E=[], err=(ref,m)=>E.push({ref,m}), g=k=>String(rv(k)).trim(), Ls=retLevels();
  const isInt=(v,max)=>/^\d+$/.test(v)&&Number(v)<=max;
  const ph=(ref,lab)=>{ const v=g(ref).replace(/\s/g,''); if(v&&!/^0\d{9}$/.test(v)) err(ref,`${lab}: 10 digits starting with 0, e.g. 0244123456.`); };
  const mail=(ref,lab)=>{ const v=g(ref); if(v&&!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v)) err(ref,`${lab}: e-mail address is not complete.`); };
  const req=(ref,lab)=>{ if(!g(ref)) err(ref,`${lab}: please answer.`); };
  const nums=(refs,lab,max,need)=>refs.forEach(r=>{ const v=g(r); if(v===''){ if(need) err(r,`${lab}: type a number (0 if none).`); } else if(!isInt(v,max)) err(r,`${lab}: whole number 0–${max}.`); });
  if(!st||st===1){ req('C7','Level of your school'); ['School Model','Affiliation Type','Ownership','Locality','Community'].forEach(k=>{ if(!String(R.P[k]||'').trim()) err('P:'+k,`${k==='Locality'?'Urban / rural':k}: please answer.`); });
    const em=String(R.P.Email||'').trim(); if(em&&!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(em)) err('P:Email','School e-mail is not complete.');
    req('C12','Religion of the school'); if(g('C12')==='Other') req('C13','Other religion'); if(['Christianity','Islam'].includes(g('C12'))){ req('C14','Denomination'); if(g('C14')==='Other') req('C15','Other denomination'); }
    ph('C18','Liaison officer mobile');
    if((g('D20')||g('E20'))&&!g('C20')) err('C20','Choose the year first.'); if(g('C20')&&g('D20')&&g('E20')&&!okDate(g('E20'),g('D20'),g('C20'))) err('C20','That date does not exist.');
    if(g('C21')&&(g('C21').split('-').length!==3)) err('C21','GhanaPost GPS looks like A2-2280-5526 (two hyphens).'); }
  if(!st||st===2){ [25,26,27].forEach(r=>ph('E'+r,'Assistant head telephone')); }
  if(!st||st===3){ Ls.forEach(L=>RET_ROWS[L].forEach(([r,l])=>{ nums(['C'+r,'D'+r],`${l} boys/girls`,5000,true); if(!g('F'+r)) err('F'+r,`${l}: multiple streams — Yes or No.`); if(g('F'+r)==='Yes'&&!g('G'+r)) err('G'+r,`${l}: how many streams?`);
      nums((L==='KG'?['H','I','J']:['H','I']).map(c=>c+r),`${l} furniture`,5000,false); })); }
  if(!st||st===4){ Ls.forEach(L=>RET_TT[L].forEach(([r,l])=>nums(['C'+r,'D'+r],`${l} trained teachers`,200,false)));
    nums(['C67','D67','C68','D68','C69','D69'],'Teachers and staff',200,true); nums(['C72','D72','C73','D73'],'ICT / French',200,false); nums(['C74','C75'],"Teachers' desks / chairs",1000,false); }
  if(!st||st===5){ req('C78','Vacancy to declare'); if(g('C78')==='Yes'){ const items=Ls.flatMap(L=>RET_VAC[L]); if(!items.some(([r])=>g('C'+r)==='Yes')) err('C78','Select Yes for at least one class or subject with a vacancy.'); }
    [[102,'KG'],[103,'Primary'],[104,'JHS']].filter(x=>Ls.includes(x[1])).forEach(([r,l])=>nums(['C'+r,'D'+r],`${l} classrooms`,100,true)); }
  if(!st||st===6){ ['C108','C112','C120','C121','C124','C125','C147',...RET_FAC.map(([r])=>'C'+r)].forEach(k=>req(k,'Facilities'));
    if(g('C108')==='Yes') nums(['C109','C110'],'Teachers living in accommodation',100,true);
    if(g('C112')==='Yes'){ req('C113','Water ownership'); req('C114','Water shared'); RET_WATER.forEach(([r,l])=>req('C'+r,l)); }
    if(g('C120')==='Yes') nums(['C122','C123'],'Toilet cubicles',200,true); if(g('C124')==='Yes') nums(['C126','C127'],'Urinal stations',200,true);
    if(g('C147')==='Yes'){ RET_ELEC.forEach(([r,l])=>req('C'+r,l)); if(!RET_ELEC.some(([r])=>g('C'+r)==='Yes')) err('C147','Select Yes for at least one electricity source.'); } }
  if(!st||st===7){ req('C130','Ongoing projects'); if(g('C130')==='Yes'&&!g('C132')) err('C132','Project 1: choose the project type.');
    if(g('C130')==='Yes') [132,133,134,135,136,137].forEach((r,i)=>{ if(g('C'+r)&&!g('F'+r)) err('F'+r,`Project ${i+1}: choose funding source 1.`); });
    RET_COORD.forEach(([r,l])=>{ req('C'+r,l); if(g('C'+r)==='Yes'){ req('D'+r,`${l} — full name`); ph('I'+r,`${l} contact`); mail('J'+r,l); } }); }
  return E;
}

async function retXlsxFromTemplate(tpl, item, office){
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',()=>window.JSZip);
  const zip=await JSZip.loadAsync(tpl.data,{base64:true});
  const wbx=await zip.file('xl/workbook.xml').async('string'), rels=await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const pathOf=name=>{ const sh=[...wbx.matchAll(/<sheet\b[^>]*\/>/g)].map(x=>x[0]).find(t=>new RegExp(`name="${name}"`).test(t)); if(!sh) return null;
    const id=(sh.match(/r:id="([^"]+)"/)||[])[1]; const rel=[...rels.matchAll(/<Relationship\b[^>]*\/>/g)].map(x=>x[0]).find(t=>t.includes(`Id="${id}"`));
    const tg=(rel.match(/Target="([^"]+)"/)||[])[1]; return tg.startsWith('/')?tg.slice(1):'xl/'+tg; };
  const pF=pathOf('FORM'), pU=pathOf('UPLOAD'); if(!pF) throw new Error('The attached template has no FORM sheet.');
  const A=Object.assign({}, item.A, retDerived(item.A), {C5:(office||{}).MMDA||item.A.C5||'', C6:item.school['EMIS Code']});
  const rows={}; Object.entries(A).forEach(([k,v])=>{ const m=k.match(/^([A-K])(\d+)$/); if(!m||v===''||v==null) return; (rows[m[2]]=rows[m[2]]||{})[m[1]]=/^\d+$/.test(String(v))&&!/^(C(6|11|13|15|16|17|18|21)|[CDE]2[5-7]|[DEGIJK]1(5[7-9]|6[0-5]))$/.test(k)?Number(v):String(v); });
  zip.file(pF, fillRows(await zip.file(pF).async('string'), rows));
  if(pU){ const vals=retUploadRow(item.A, item.P||{}, item.school, office), o={}; vals.forEach((v,j)=>{ o[colLetter(j)]=v; }); zip.file(pU, fillRows(await zip.file(pU).async('string'), {2:o})); }
  let w=wbx; if(/<calcPr\b/.test(w)) w=w.replace(/<calcPr\b([^>]*?)\s*(\/?)>/,(m,at,sl)=>`<calcPr${at.replace(/\s*fullCalcOnLoad="[^"]*"/,'')} fullCalcOnLoad="1"${sl}>`); else w=w.replace(/(<\/definedNames>|<\/sheets>)(?![\s\S]*<\/definedNames>)/,'$1<calcPr fullCalcOnLoad="1"/>');
  zip.file('xl/workbook.xml', w);
  return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* ============================== COMPILE & SEND ==============================

   Regional Education Office, GES Headquarters, the Municipal Assembly or any other stakeholder.
   • Data tabs (staff list, enrolment, furniture …): every school's records written into the tab's official template.
   • File requests: every school's uploaded Excel file merged, row by row, into the request's template.
   Filters: ownership (public / private), levels (basic / SHS) and the circuits in scope. */
const RECIPIENTS = ['Regional Education Office','GES Headquarters (National)','Municipal Assembly','Municipal Directorate (internal)','Other stakeholder'];

function tableLayout(wb, hints, preferSheet){

    const a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});

  const formulaCols=new Set(), prefilled=new Set(), xsheet=new Set();
  best.headers.forEach((h,j)=>{ const c=ws[XLSX.utils.encode_cell({r:best.hRow+1,c:j})]; if(c&&c.f){ if(/!/.test(c.f)) xsheet.add(j); else formulaCols.add(j); } else if(sval(first[j])) prefilled.add(j); });

}
// write rows (arrays of {colIndex:value}) into a sheet of the template, cloning the first data row for extra rows
async function writeTemplate(tplB64, layout, rows, extraHeaders){

    return setCells(x,r,vals[r],drop); });

function schoolsFromSheet(wb){
  let best=null; wb.SheetNames.forEach(n=>{ const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''});
    for(let i=0;i<Math.min(10,a.length);i++){ const sc=a[i].filter(h=>SCH_ALIAS[nk(h)]).length; if(sc>=2&&(!best||sc>best.sc)) best={sc,a,i}; } });
  if(!best) throw new Error('No school list found — the first row needs headings such as emisCode / EMIS Code and schoolName / School Name.');
  const H=best.a[best.i].map(h=>String(h).trim()), rows=[];
  best.a.slice(best.i+1).forEach(r=>{ if(!r.some(v=>String(v).trim())) return;
    const g={}; H.forEach((h,j)=>g[nk(h)]=String(r[j]??'').trim());
    const o={}; H.forEach((h,j)=>{ const k=SCH_ALIAS[nk(h)]; if(k&&String(r[j]??'').trim()&&!o[k]) o[k]=String(r[j]).trim(); });
    // second-cycle list: assistant heads and "Other" religion
    [['ahadm','Asst Head (Admin)'],['ahacd','Asst Head (Academic)'],['ahdom','Asst Head (Domestic)']].forEach(([p,k])=>{ const v=[g[p+'name'],g[p+'staffid']?'Staff ID '+g[p+'staffid']:'',phone10(g[p+'phone'])].filter(Boolean).join(' · '); if(v) o[k]=v; });
    if(/^other/i.test(o.Religion||'')&&g.religionother) o.Religion=g.religionother;
    if(o.Level){ const lv=/tvet|technical|vocational/i.test(o.Level)?['SHS']:parseLevels(o.Level); if(lv.length) o.Level=[...new Set(lv)].join('/'); }
    if(o.Circuit) o.Circuit=canonCircuit(o.Circuit);
    if(o.Ownership) o.Ownership=/priv/i.test(o.Ownership)?'Private':/pub|gov/i.test(o.Ownership)?'Public':o.Ownership;
    SCH_PHONES.forEach(k=>{ if(o[k]) o[k]=phone10(o[k]); });
    if(!o.Phone&&o['Head Phone']) o.Phone=o['Head Phone'];     // the phone the portal checks when a head submits without a password
    if(o['EMIS Code']) o['EMIS Code']=o['EMIS Code'].replace(/\s/g,'');
    if(o.Active) o.Active=/^n/i.test(o.Active)?'No':'Yes';
    rows.push(o); });
  return { rows, headers:H };
}

function canonCircuit(c){ const t=String(c||'').trim().replace(/\s+circuit$/i,''); if(!t) return ''; return CONFIG.CIRCUITS.find(x=>x.toLowerCase()===t.toLowerCase())||t; }
// read the levels from whatever is typed in the Level column: "KG/Primary/JHS", "Basic (KG, Primary & JHS)", "Basic", "JHS only", "SHS"…
function parseLevels(LV){ const x=String(LV||'').toLowerCase(), o=[];
  if(/creche|nursery|pre-?school/.test(x)) o.push('Nursery');
  if(/\bkg\b|kindergarten|\bk\.g\b/.test(x)) o.push('KG');
  if(/primary|\blp\b|\bup\b/.test(x)) o.push('Primary');
  if(/\bjhs\b|\bjss\b|junior\s*high/.test(x)) o.push('JHS');
  if(/\bshs\b|\bsss\b|\bshts?\b|senior\s*high|second\s*cycle/.test(x)) o.push('SHS');
  if(!o.length&&/\bbasic\b/.test(x)) o.push('KG','Primary','JHS');   // a "Basic" school runs KG, Primary and JHS
  return o; }
function levelsOf(s){ return parseLevels(s.Level); }
function flagsOf(s){
  const f=[], c=canonCircuit(s.Circuit);
  if(!c) f.push('nocircuit'); else if(!CONFIG.CIRCUITS.includes(c)) f.push('badcircuit');
  if(!levelsOf(s).length) f.push('nolevel');
  if(!String(s.Phone||'').trim()) f.push('nophone');
  if(!s['Last Login']) f.push('never');
  if(!isActive(s)) f.push('inactive');
  if(s['Sign In']==='No head Staff ID') f.push('nosid');
  return f;
}

}

function donut(segs, center, note){
  const tot=segs.reduce((a,s)=>a+s.n,0), R=42, C=2*Math.PI*R, live=segs.filter(s=>s.n), gap=live.length>1?2:0; let off=0;

      const a=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${Math.max(len-gap,.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${esc(s.k)}: ${s.n} (${Math.round(s.n/tot*100)}%)</title></circle>`;
      off+=len; return a; }).join('')
    : `<circle r="${R}" cx="60" cy="60" fill="none" stroke="#ecebe4" stroke-width="16"/>`;

/* ---- portal first review from the Submissions page ---- */
async function runCheck(sub){
  const f=await api('download',{id:sub['Submission ID']}), t=taskById(sub['Task ID'])||{};
  const res=autoCheck(await xlRead(new File([b64ToBlob(f.data,f.mime)], f.name||sub['File Name'])), {emis:String(sub['EMIS Code']), mod:t['Fills Tab']});
  const remarks=res.remarks.join('\n');
  await api('saveAutoCheck',{id:sub['Submission ID'], check:res.check, remarks});
  Object.assign(sub,{'Auto Check':res.check,'Auto Remarks':remarks}); return res;
}
async function checkSub(id){
  const sub=S.data.submissions.find(x=>x['Submission ID']===id); toast('Checking '+sub['File Name']+'…');
  try{ await runCheck(sub); renderStaff(); acView(id); }catch(e){ toast(e.message,true); }
}

async function checkAllSubs(){

}

function copyDefaulters(){

function exportComp(){
