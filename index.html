<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School File Submission Portal · Asante Akyem North</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d2f2a; --navy2:#14453d; --teal:#1a9c7a; --teal-bg:#dff4ec; --indigo:#4f46e5; --gold:#d4a52b; --gold2:#f3e2b3;
  --bg:#f5f4ef; --card:#fff; --line:#e6e1d6; --text:#1c2433; --muted:#5f6b7d;
  --green:#1f7a52; --green-bg:#e3f4ec; --red:#b8322a; --red-bg:#fbe7e5;
  --amber:#9a6412; --amber-bg:#fdf0d8; --blue:#23579a; --blue-bg:#e5eefa; --grey:#5f6b7d; --grey-bg:#eef0f3;
  --radius:12px; --shadow:0 1px 2px rgba(19,33,63,.06),0 4px 16px rgba(19,33,63,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hidden{display:none!important}

/* ---------- buttons, inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cfc7b6}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1405}
.btn.danger{color:var(--red)}
.btn.ok{color:var(--green)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.inp{width:100%;border:1px solid #d9d3c5;border-radius:10px;padding:11px 13px;background:#fff;outline:none}
.inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(19,33,63,.1)}
select.inp{padding:9px 12px}
.pw-wrap{position:relative}
.pw-wrap .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--muted);padding:6px}

/* ---------- pills ---------- */
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.pill.grey{background:var(--grey-bg);color:var(--grey)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:12px;color:var(--muted);margin:2px 4px 2px 0;background:#fff}

/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-hero{background:radial-gradient(circle at 10% 5%,#1d5c50 0,transparent 45%),var(--navy);color:#e8ecf5;padding:56px 72px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-hero::after{content:"";position:absolute;right:-160px;bottom:-160px;width:420px;height:420px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 60px rgba(255,255,255,.02)}
.brand-line{font-family:"Source Serif 4",serif;font-size:20px;color:#c7cfe0}
.brand-line b{color:var(--gold);font-weight:600}
.hero-text h1{font-size:54px;line-height:1.1;color:#fff}
.hero-text h1 em{font-style:normal;color:var(--gold)}
.hero-text p{max-width:470px;font-size:17px;color:#c7cfe0;margin-top:22px}
.hero-text p b{color:var(--gold)}
.hero-foot{font-size:14px;color:#aab4c9}
.hero-foot .caps{letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:8px;font-family:"Source Serif 4",serif}
.auth-main{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-card{width:100%;max-width:520px}
.auth-card h2{font-size:36px;margin-bottom:16px}
.note{border:1px solid #efe6cf;background:#fbf7ec;border-radius:12px;padding:12px 16px;color:var(--muted);font-size:14px}
.note b{color:var(--amber)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;border:1px solid var(--line);border-radius:12px;padding:5px;margin:22px 0 4px;background:#fff}
.seg button{border:0;background:none;padding:11px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.auth-card .submit{width:100%;justify-content:center;padding:14px;font-size:16px;margin-top:22px;border-radius:11px}
.help{font-size:13px;color:var(--muted);text-align:right;margin-top:8px}
.err{color:var(--red);font-size:14px;margin-top:12px;min-height:20px}
.demo{margin-top:22px;border:1px dashed #cdbf98;border-radius:12px;padding:12px 16px;font-size:13px;background:#fffdf6}
.demo table{border-collapse:collapse;width:100%;margin-top:6px}
.demo td{padding:3px 6px 3px 0;vertical-align:top}
.demo code{background:#f3eee0;padding:1px 5px;border-radius:4px;cursor:pointer}
.fab{position:fixed;right:24px;bottom:24px;z-index:20;box-shadow:0 8px 24px rgba(212,165,43,.35);border-radius:14px;padding:13px 22px;font-size:16px}
.pop{position:fixed;right:24px;bottom:86px;z-index:21;width:min(420px,calc(100vw - 32px));background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(19,33,63,.2);padding:18px;max-height:70vh;overflow:auto}
.pop h3{font-family:Inter,sans-serif;font-size:18px}
.pop .item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.pop .item b{display:block}

/* ---------- enrolment editor & wide table ---------- */
.eh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#egrid tr.cls-first td{border-top:2px solid var(--line)}
#egrid .gin{width:86px}
.wide-wrap{max-height:70vh;overflow:auto}
.wide-t{font-size:13px}
.wide-t th,.wide-t td{padding:7px 8px;white-space:nowrap}
.wide-t th.grp{text-align:center;border-left:1px solid var(--line);background:#f1f6f3;color:var(--text)}
.wide-t thead tr:first-child th{position:sticky;top:0;z-index:2}
.wide-t thead tr:nth-child(2) th{position:sticky;top:33px;z-index:2}
.wide-t .stick{position:sticky;left:0;background:#fff;z-index:1;min-width:190px;white-space:normal;box-shadow:1px 0 0 var(--line)}
.wide-t thead .stick{z-index:3;background:#faf8f3}
.wide-t td.tcol{background:#f7faf8;border-right:1px solid var(--line)}
.wide-t tfoot td{background:#faf8f3;border-top:2px solid var(--line);position:sticky;bottom:0}
/* ---------- receipts ---------- */
.receipt{border:1px solid var(--line);border-radius:14px;padding:20px;background:#fff;position:relative;overflow:hidden}
.receipt::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--gold),#6d63e8,var(--teal))}
.rc-h{display:flex;gap:12px;align-items:center}
.rc-h .mk{width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.rc-title{margin-top:16px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rc-no{font-family:ui-monospace,monospace;font-size:24px;font-weight:700;letter-spacing:.05em;color:var(--navy)}
.rc-t{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.rc-t td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.rc-t td:first-child{color:var(--muted);width:130px}
.rc-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:14px}
.rc-sum div{background:#f6f9f7;border:1px solid #e1ece6;border-radius:10px;padding:8px 10px}
.rc-sum span{display:block;font-size:12px;color:var(--muted)}
.rc-sum b{font-size:18px}
.rc-link{word-break:break-all;color:var(--text)}
.banner.ok{background:#e9f7f0;border-color:#b9e2cd;color:#155f40}
.banner.bad{background:var(--red-bg);border-color:#f0c2bd;color:var(--red)}
.kbtn{text-align:left;cursor:pointer;font:inherit;color:inherit}
.kbtn.on{border-color:var(--teal);box-shadow:inset 0 3px 0 var(--teal);background:#f3fbf8}
@media print{
  body *{visibility:hidden}
  #receipt,#receipt *{visibility:visible}
  #receipt{position:absolute;left:0;top:0;width:100%;border:0}
  .modal{position:static;background:none}
}
/* ---------- notices, modules ---------- */
.auth-col{width:100%;max-width:520px}
.notices{margin-top:26px;border:1px solid var(--line);background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.nb-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);background:#f7fbf9}
.nb-tabs{margin-left:auto;display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.nb-tabs button{border:0;background:none;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.nb-tabs button.on{background:var(--navy);color:#fff}
.nb-list{max-height:260px;overflow:auto}
.nb-i{padding:11px 14px;border-bottom:1px solid #f0ece2}
.nb-i:last-child{border-bottom:0}
.nb-t{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.upd{display:flex;gap:14px;align-items:flex-start;padding:14px 20px;border-bottom:1px solid #f0ece2}
.upd:last-child{border-bottom:0}
.grid-t .gin{width:96px;text-align:right;padding:7px 9px;border-radius:8px;margin-left:auto;display:block}
.grid-t tfoot td{background:#faf8f3;border-top:2px solid var(--line)}
.modal-card.wide{max-width:820px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:18px}
.g3 .donut{gap:16px}
.g3 .donut svg{width:118px;height:118px}
.nav-row{max-width:1320px;margin:0 auto;padding:0 0 10px}
.nav-row .nav{flex-wrap:wrap;overflow:visible}
/* ---------- app shell ---------- */
.top{background:var(--navy);color:#fff;padding:0 20px;position:sticky;top:0;z-index:30}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:62px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Source Serif 4",serif;font-size:16px;white-space:nowrap}
.logo .mk{width:34px;height:34px;border-radius:9px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:11px;font-family:Inter}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;color:#cfe3dd;font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.nav button:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav button.on{background:var(--teal);color:#fff}
.nav .nb{background:#e0443a;color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:inline-grid;place-items:center}
.right{display:flex;align-items:center;gap:8px;margin-left:auto}
.scope-badge{background:#fff;color:var(--text);border-radius:10px;padding:5px 12px;line-height:1.2;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.scope-badge small{display:block;font-size:10px;letter-spacing:.08em;color:var(--teal);font-weight:700;text-transform:uppercase}
.scope-badge b{font-size:13px}
.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.scopebar-wrap{max-width:1320px;margin:18px auto 0;padding:0 24px}
.scopebar{background:linear-gradient(90deg,#d6eefb,#def5ec);border:1px solid #a9d7ea;border-radius:16px;padding:10px}
.scope-in{background:rgba(255,255,255,.8);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:#8a8f99;display:inline-block;flex:none}
.serif{font-family:"Source Serif 4",serif;font-size:17px}
.scope-dd{position:relative}
.scope-btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid #8fd8bf;background:#fff;border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:14px}
.scope-btn .cnt{background:var(--teal);color:#fff;border-radius:999px;padding:0 8px;font-size:12px;font-weight:700}
.scope-btn .car{color:var(--muted)}
.scope-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:25;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(13,47,42,.18);padding:8px;min-width:270px}
.scope-menu label{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.scope-menu label:hover{background:#f2f8f5}
.sm-h{display:flex;justify-content:space-between;padding:4px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.lnk{border:0;background:none;color:var(--teal);font-weight:700;cursor:pointer;padding:0;font-size:13px}
.own{display:flex;align-items:center;gap:2px;margin-left:auto;background:#fff;border-radius:999px;padding:4px;border:1px solid var(--line)}
.own .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px;font-weight:700}
.own button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.own button.on{background:var(--navy2);color:#fff}
.subtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px;font-weight:600;cursor:pointer;font-size:14px}
.subtabs button.on{background:linear-gradient(90deg,var(--navy2),var(--teal));color:#fff;border-color:transparent}
.card.accent{position:relative;overflow:hidden}
.card.accent::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--gold),#6d63e8,var(--teal))}
.sec-t{display:flex;align-items:center;gap:8px;font-family:"Source Serif 4",serif;font-size:19px;font-weight:700}
.cap{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.donut{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.donut .dv{font-family:"Source Serif 4",serif;font-size:24px;font-weight:700;fill:var(--text)}
.dleg{flex:1;min-width:180px}
.dl{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px}
.dl i{width:10px;height:10px;border-radius:50%;flex:none}
.dl b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.blist{max-height:320px;overflow:auto;padding-right:6px}
.br{display:grid;grid-template-columns:150px 1fr 48px;gap:12px;align-items:center;padding:5px 0;font-size:13px}
.bk{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:9px;background:#ecebf3;border-radius:9px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:9px;min-width:6px}
.br b{text-align:right;font-variant-numeric:tabular-nums}
.att{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;margin-bottom:8px;cursor:pointer;text-align:left;font-size:14px}
.att:hover{border-color:#a9d9c8;background:#fbfdfc}
.att .cnt{min-width:42px;text-align:center;border-radius:999px;font-weight:700;font-size:12px;padding:2px 8px}
.cnt.bad{background:var(--red-bg);color:var(--red)} .cnt.ok{background:var(--green-bg);color:var(--green)}
.hero{display:inline-flex;gap:16px;align-items:center;border:1px solid #dcd9f6;background:linear-gradient(135deg,#f6f5ff,#fff);border-radius:14px;padding:18px 24px;box-shadow:inset 0 3px 0 #6d63e8}
.hero .ic{width:52px;height:52px;border-radius:12px;background:#5b54e0;color:#fff;display:grid;place-items:center}
.hero .n{font-family:"Source Serif 4",serif;font-size:34px;font-weight:700;color:#4b45c6;line-height:1}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:12px}
.cc{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;cursor:pointer;box-shadow:inset 0 3px 0 var(--teal);text-align:left;font:inherit;color:inherit}
.cc:hover{border-color:#a9d9c8}
.cc.on{border-color:var(--teal);background:#f1fbf7}
.cc .top2{display:flex;justify-content:space-between;align-items:center}
.cc .ic{width:40px;height:40px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center}
.cc .n{font-family:"Source Serif 4",serif;font-size:28px;font-weight:700}
.cc .chip2{display:inline-block;background:var(--teal-bg);color:#0f6a50;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin:12px 0 10px}
.cc .bar i{background:var(--teal)}
.banner{background:#fdf2e3;border:1px solid #f0d6ad;color:#7a4d0e;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:500}
.banner a{color:inherit;font-weight:700}
.wrap{max-width:1320px;margin:0 auto;padding:20px 24px 40px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h h2{font-size:28px}
.page-h p{margin:4px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-size:30px;font-weight:700;font-family:"Source Serif 4",serif;margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-family:Inter,sans-serif;font-size:16px}
.card-b{padding:18px 20px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- school task cards ---------- */
.tasks{display:grid;gap:18px}
.task-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.task-top h3{font-family:Inter,sans-serif;font-size:18px}
.task-desc{color:var(--muted);margin:8px 0 10px;white-space:pre-line}
.files{border-top:1px solid var(--line);margin-top:14px}
.file{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f0ece2}
.file:last-child{border-bottom:0}
.ficon{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;text-transform:uppercase}
.ficon.excel{background:#e3f4ec;color:#1f7a52}.ficon.pdf{background:#fbe7e5;color:#b8322a}.ficon.image{background:#efe7fb;color:#6b3fb0}
.ficon.word{background:#e5eefa;color:#23579a}.ficon.other{background:var(--grey-bg);color:var(--grey)}
.fmeta{flex:1;min-width:0}
.fmeta .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta .s{font-size:12px;color:var(--muted)}
.remark{font-size:13px;color:var(--red);margin-top:2px}
.fact{display:flex;gap:6px;flex-wrap:wrap}
.drop{margin-top:14px;border:2px dashed #d7cfbd;border-radius:12px;padding:18px;text-align:center;background:#fcfbf7;cursor:pointer;transition:.15s}
.drop.over{border-color:var(--gold);background:#fff8e6}
.drop b{color:var(--navy)}
.queue{margin-top:10px;font-size:14px}
.queue .q{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dotted var(--line)}
.up-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.up-row input{flex:1;min-width:200px}

/* ---------- tables ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters .inp{width:auto;min-width:150px}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:#faf8f3;white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid #f0ece2;vertical-align:top}
table.t tr:hover td{background:#fcfbf7}
.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:36px;text-align:center;color:var(--muted)}
.bar{height:9px;background:#eeeae0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px}
.prog-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid #f0ece2}
.prog-row:last-child{border-bottom:0}

/* ---------- modal & toast ---------- */
.modal{position:fixed;inset:0;background:rgba(15,22,40,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal-card{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-card h3{font-size:22px;margin-bottom:4px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;gap:6px;align-items:center;font-size:14px}
.temp{font-family:ui-monospace,monospace;font-size:24px;letter-spacing:.12em;background:#fbf7ec;border:1px solid #efe6cf;border-radius:10px;padding:12px;text-align:center;margin:14px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;z-index:60;transition:.25s;max-width:90vw;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.bad{background:var(--red)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:60px;text-align:center;color:var(--muted)}

@media (max-width:1500px){ .scope-badge{display:none} }
table.t th.num{text-align:right}
@media (max-width:1100px){ .g3{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(3,1fr)!important} }
@media (max-width:900px){
  .kpis{grid-template-columns:1fr 1fr!important}
  .auth{grid-template-columns:1fr}
  .auth-hero{padding:32px 20px}
  .hero-text h1{font-size:36px}
  .hero-text{margin:28px 0}
  .hero-foot{display:none}
  .kpis{grid-template-columns:1fr 1fr}
  .prog-row{grid-template-columns:1fr}
  .wrap{padding:16px}
  .top{padding:0 12px}
  .top-in{flex-wrap:wrap;gap:8px;padding:8px 0}
  .nav{order:3;flex-basis:100%}
  .nav-row .nav{flex-wrap:nowrap;overflow-x:auto}
  .nav-row{padding:0 0 8px}
  .scope-badge,.hide-sm,.logo .lt{display:none}
  .scopebar-wrap{padding:0 16px}
  .own{margin-left:0;width:100%}
  .own .lbl{display:none}
  .own button{flex:1;padding:6px 6px;font-size:12px}
  .scope-in{min-width:0}
  .g2{grid-template-columns:1fr}
  .subtabs{grid-template-columns:1fr 1fr}
  .br{grid-template-columns:110px 1fr 40px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spin"></span></div></div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toast" class="toast"></div>

<script>
/* =====================================================================
   SETTINGS — paste your Apps Script Web App URL below.
   Leave it empty ('') to run the built-in DEMO with sample data.
   ===================================================================== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxxShJUkv1cKrZGytLTTU4_ccKZ0zyTC4-HsfjSo-a_882QCYQRrkCuk3QmZC9VtkCxkA/exec',
  APP_NAME: 'School File Submission Portal',
  ORG_NAME: 'Asante Akyem North Municipal Education Directorate',
  REGION: 'Ashanti Region',
  MUNICIPALITY: 'Asante Akyem North',
  YEAR: '2026/2027',
  RETIRE_AGE: 60,     // compulsory retirement age in the public service
  // enrolment is counted more than once a term — keep the same list as CONFIG.ENROL_PERIODS in Code.gs
  ENROL_PERIODS: ['Term 1 – 1st count','Term 1 – 2nd count','Term 2 – 1st count','Term 2 – 2nd count','Term 3 – 1st count','Term 3 – 2nd count'],   // current academic year — keep the same as CONFIG.YEAR in Code.gs
  CIRCUITS: ['Agogo North','Agogo East','Agogo Central','Agogo West','Owerriman North','Owerriman South','Amantenaman','Ananekrom'],
  MAX_FILE_MB: 15
};

const TYPE_MAP = { excel:['xls','xlsx','xlsm','csv'], pdf:['pdf'], image:['jpg','jpeg','png','webp','heic','gif'], word:['doc','docx'], powerpoint:['ppt','pptx'], any:[] };
const TYPE_LABEL = { excel:'Excel', pdf:'PDF', image:'Photos', word:'Word', powerpoint:'PowerPoint', any:'Any file' };
const ROLE_LABEL = { ADMIN:'Administrator', EMIS_OFFICER:'EMIS Officer', CIRCUIT_SUPERVISOR:'Circuit Supervisor', DIRECTOR:'Director / Management', SCHOOL:'School' };
const LEVELS = ['Nursery','KG','Primary','JHS','SHS'];
const LEVEL_LABEL = { Nursery:'Creche / Nursery', Primary:'Primary (B1–B6)', JHS:'JHS (B7–B9)' };
const DEMO = !CONFIG.API_URL;

const S = { rec:{}, tq:{}, token:null, user:null, mustChange:false, loginKind:'school', tab:'home', homeTab:'snap', scope:null, own:'all', dir:{ q:'', circuit:'', level:'', flag:'', sel:new Set() }, data:null, home:null,
            f:{ task:'', circuit:'', status:'', q:'' }, comp:{ task:'', missing:true, circuit:'' }, schoolQ:'' };

/* ------------------------------ helpers ------------------------------ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(d){ if(!d) return '—'; const x=new Date(d); return isNaN(x)?esc(d):x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDT(d){ if(!d) return '—'; const x=new Date(d); return isNaN(x)?esc(d):x.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function fmtSize(kb){ kb=Number(kb)||0; return kb>=1024?(kb/1024).toFixed(1)+' MB':Math.max(1,Math.round(kb))+' KB'; }
const extOf = n => (String(n).toLowerCase().match(/\.([a-z0-9]+)$/)||[,''])[1];
function kindOf(e){ for(const k of ['excel','pdf','image','word']) if(TYPE_MAP[k].includes(e)) return k; return 'other'; }
function typeList(t){ return String(t||'any').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean); }
function allowedExts(t){ const l=typeList(t); if(!l.length||l.includes('any')) return null; return l.flatMap(k=>TYPE_MAP[k]||[]); }
function levelsMatch(tl, sl){ const t=String(tl||'All').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean); if(!t.length||t.includes('all')) return true; return String(sl||'').split(/[\/,;]/).map(x=>x.trim().toLowerCase()).some(x=>t.includes(x)); }
function dueInfo(t){
  if(t.Status!=='Open') return {cls:'grey',text:'Closed'};
  if(!t['Due Date']) return {cls:'blue',text:'No deadline'};
  const d=new Date(t['Due Date']+'T23:59:59'); const days=Math.ceil((d-new Date())/864e5);
  if(days<0) return {cls:'red',text:`Overdue · was due ${fmtDate(t['Due Date'])}`};
  if(days<=1) return {cls:'amber',text:days===0?'Due today':'Due tomorrow'};
  if(days<=5) return {cls:'amber',text:`Due in ${days} days`};
  return {cls:'blue',text:'Due '+fmtDate(t['Due Date'])};
}
function agg(subs){ if(!subs.length) return 'Not submitted'; if(subs.some(s=>s.Status==='Rejected')) return 'Rejected'; if(subs.every(s=>s.Status==='Accepted')) return 'Accepted'; return 'Submitted'; }
const PILL = {'Not submitted':'grey','Submitted':'blue','Accepted':'green','Rejected':'red','Open':'green','Closed':'grey','Yes':'green','No':'grey'};
const pill = s => `<span class="pill ${PILL[s]||'grey'}">${esc(s==='Submitted'?'Awaiting review':s)}</span>`;
const isLate = (sub, task) => task && task['Due Date'] && new Date(sub['Submitted At']) > new Date(task['Due Date']+'T23:59:59');
const can = { manage: r => ['ADMIN','EMIS_OFFICER'].includes(r), review: r => ['ADMIN','EMIS_OFFICER','CIRCUIT_SUPERVISOR'].includes(r) };

function toast(msg, bad){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':''); clearTimeout(t._h); t._h=setTimeout(()=>t.className='toast',3200); }
function openModal(html){ $('#modalCard').innerHTML=html; $('#modal').classList.remove('hidden'); const f=$('#modalCard input,#modalCard textarea,#modalCard select'); if(f) f.focus(); }
function closeModal(){ $('#modal').classList.add('hidden'); $('#modalCard').innerHTML=''; $('#modalCard').className='modal-card'; }
$('#modal').addEventListener('mousedown', e => { if(e.target.id==='modal' && !S.mustChange) closeModal(); });
function store(k,v){ try{ v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(sessionStorage.getItem(k)); }catch(e){ return null; } }
function csv(rows, name){
  const txt = rows.map(r=>r.map(v=>{ v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\n');
  saveBlob(new Blob(['﻿'+txt],{type:'text/csv'}), name);
}
function saveBlob(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); }
function b64ToBlob(b64, mime){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime||'application/octet-stream'}); }
const readB64 = file => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(new Error('Could not read '+file.name)); r.readAsDataURL(file); });

/* ------------------------------ API ------------------------------ */
async function api(action, payload={}){
  const body = Object.assign({ action, token:S.token }, payload);
  let j;
  if(DEMO){ j = await Mock.call(body); }
  else {
    const res = await fetch(CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body) });
    j = await res.json();
  }
  if(!j.ok){
    if(j.error==='SESSION_EXPIRED'){ signOut(true); throw new Error('Your session expired. Please sign in again.'); }
    throw new Error(j.error||'Something went wrong.');
  }
  return j.data;
}

/* ============================== LOGIN ============================== */
function renderLogin(){
  const school = S.loginKind==='school';
  $('#app').innerHTML = `
  <div class="auth">
    <aside class="auth-hero">
      <div class="brand-line"><b>GES Statistics</b> · ${esc(CONFIG.REGION)}</div>
      <div class="hero-text">
        <h1>School File<br><em>Submission</em><br>Portal</h1>
        <p>Heads of school sign in with your <b>EMIS code</b> to submit Excel returns, PDFs, photos, assessment records and other documents requested by the Municipal Directorate.</p>
      </div>
      <div class="hero-foot"><div>${esc(CONFIG.ORG_NAME)}</div><div class="caps">EMIS Unit</div></div>
    </aside>
    <main class="auth-main"><div class="auth-col">${S.verify?'<div id="verify" style="margin-bottom:22px"></div>':''}<div class="auth-card">
      <h2>Sign in</h2>
      ${S.deep&&(FORMS[S.deep]||S.deep==='files')?`<div class="banner ok" style="margin-bottom:12px">📝 You are opening the <b>${esc(FORMS[S.deep]||'File submissions')}</b> form. Sign in to continue.</div>`:''}
      <div class="note">ⓘ <b>${school?'Schools':'Directorate staff'}</b> · ${school?'Use your school\'s EMIS code and the password issued by the Municipal EMIS Office.':'Use the email address registered for you at the Directorate.'}</div>
      <div class="seg"><button type="button" data-k="school" class="${school?'on':''}">School / Headteacher</button><button type="button" data-k="staff" class="${school?'':'on'}">Directorate Staff</button></div>
      <form id="loginForm" autocomplete="on">
        <label class="f" for="lid">${school?'School EMIS code':'Email address'}</label>
        <input class="inp" id="lid" ${school?'inputmode="numeric" placeholder="e.g. 60101001"':'type="email" placeholder="name@ges.gov.gh"'} required>
        <label class="f" for="lpw">Password</label>
        <div class="pw-wrap"><input class="inp" id="lpw" type="password" required><button type="button" class="eye" onclick="const i=$('#lpw');i.type=i.type==='password'?'text':'password'">👁</button></div>
        <div class="help">Forgot password? Ask the Municipal EMIS Office to reset it.</div>
        <button class="btn primary submit" id="lbtn">Sign in</button>
        <div class="err" id="lerr"></div>
      </form>
      ${DEMO?`<div class="demo"><b>Demo mode</b> — sample data only, nothing is saved online. Click a login to fill it in (password <code>demo123</code>):
        <table>
          <tr><td>School</td><td><code data-fill="school|60101001">60101001</code> <code data-fill="school|60102003">60102003</code></td></tr>
          <tr><td>Staff</td><td><code data-fill="staff|admin@demo.gh">admin@demo.gh</code> <code data-fill="staff|emis@demo.gh">emis@demo.gh</code><br><code data-fill="staff|cs.agogo@demo.gh">cs.agogo@demo.gh</code> <code data-fill="staff|director@demo.gh">director@demo.gh</code></td></tr>
        </table></div>`:''}
    </div><div class="notices" id="notices"><div class="loading" style="padding:20px"><span class="spin"></span></div></div></div></main>
  </div>`;
  if(S._notices) drawNotices(); else loadNotices();
  if(S.verify) loadVerify();
  $$('.seg button').forEach(b => b.onclick = () => { S.loginKind=b.dataset.k; renderLogin(); });
  $$('[data-fill]').forEach(c => c.onclick = () => { const [k,id]=c.dataset.fill.split('|'); S.loginKind=k; renderLogin(); $('#lid').value=id; $('#lpw').value='demo123'; });
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const btn=$('#lbtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Signing in…'; $('#lerr').textContent='';
    try{
      const r = await api('login', { kind:S.loginKind, id:$('#lid').value, password:$('#lpw').value });
      S.token=r.token; S.user=r.user; S.mustChange=r.mustChange; store('fp_session',{token:r.token,user:r.user,mustChange:r.mustChange});
      S.tab=r.user.role==='SCHOOL'?'files':'home'; applyDeep(); S.homeTab='snap'; S.scope=null; S.rec={}; S.receipts=null; boot();
    }catch(err){ $('#lerr').textContent=err.message; btn.disabled=false; btn.textContent='Sign in'; }
  };
}

function signOut(silent){
  if(S.token && !silent) api('logout').catch(()=>{});
  S.token=null; S.user=null; S.data=null; S.rec={}; S.tq={}; S.receipts=null; S.scope=null; S.own='all'; S.dir.sel.clear(); S.home=null; S.mustChange=false; store('fp_session',null); closeModal(); renderLogin();
}

function changePwModal(forced){
  openModal(`<h3>${forced?'Set a new password':'Change password'}</h3>
    <p class="muted small">${forced?'You signed in with a temporary password. Choose your own password to continue.':'At least 6 characters.'}</p>
    <form id="cpf">
      <label class="f">Current password</label><input class="inp" type="password" id="cp0" required>
      <label class="f">New password</label><input class="inp" type="password" id="cp1" minlength="6" required>
      <label class="f">Confirm new password</label><input class="inp" type="password" id="cp2" minlength="6" required>
      <div class="err" id="cperr"></div>
      <div class="modal-actions">${forced?'<button type="button" class="btn" onclick="signOut()">Sign out</button>':'<button type="button" class="btn" onclick="closeModal()">Cancel</button>'}<button class="btn primary" id="cpb">Save password</button></div>
    </form>`);
  $('#cpf').onsubmit = async e => {
    e.preventDefault();
    if($('#cp1').value!==$('#cp2').value){ $('#cperr').textContent='The new passwords do not match.'; return; }
    $('#cpb').disabled=true;
    try{ await api('changePassword',{oldPassword:$('#cp0').value,newPassword:$('#cp1').value}); S.mustChange=false; store('fp_session',{token:S.token,user:S.user,mustChange:false}); closeModal(); toast('Password changed.'); }
    catch(err){ $('#cperr').textContent=err.message; $('#cpb').disabled=false; }
  };
}

function shell(tabs, withScope=true){
  const u=S.user, school=u.role==='SCHOOL';
  return `<header class="top"><div class="top-in">
      <div class="logo"><div class="mk">GES</div><span class="lt">AAN File Portal</span></div>
      <div class="right">
        <div class="scope-badge" id="scopeBadge">${school?`<small>EMIS ${esc(u.emis)}</small><b>${esc(u.name)} · ${esc(u.circuit||'')}</b>`:`<small>${esc(ROLE_LABEL[u.role])}</small><b>${esc(u.name)}</b>`}</div>
        <button class="btn sm" onclick="changePwModal()">Password</button>
        <button class="btn sm" onclick="signOut()">Sign out</button>
      </div>
    </div>
    ${tabs?`<div class="nav-row"><nav class="nav">${tabs.map(([k,l])=>`<button type="button" data-tab="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('')}</nav></div>`:''}
    </header>
    ${tabs&&withScope?'<div class="scopebar-wrap" id="scopebar"></div>':''}
    <main class="wrap" id="view"><div class="loading"><span class="spin"></span></div></main>`;
}

async function boot(){
  if(!S.token) return renderLogin();
  if(S.user.role==='SCHOOL'){ if(!schoolTabs().some(t=>t[0]===S.tab)) S.tab='files'; $('#app').innerHTML=shell(schoolTabs(),false); wireTabs(); await loadSchool(); bgUpdates(); }
  else { await loadStaff(); }
  if(S.mustChange) changePwModal(true);
}

/* ============================== SCHOOL ============================== */
async function loadSchool(){
  try{ S.home = await api('schoolHome'); if(S.tab==='files') renderSchool(); else renderSchoolTab(); }
  catch(e){ if(S.token) $('#view').innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
}

function renderSchool(){
  const {tasks, submissions} = S.home;
  const by = id => submissions.filter(s=>s['Task ID']===id).sort((a,b)=>String(b['Submitted At']).localeCompare(a['Submitted At']));
  const open = tasks.filter(t=>t.Status==='Open');
  const done = open.filter(t=>by(t['Task ID']).length).length;
  const rej = open.filter(t=>agg(by(t['Task ID']))==='Rejected').length;
  const order = [...tasks].sort((a,b)=> (a.Status===b.Status?0:a.Status==='Open'?-1:1) || String(a['Due Date']||'9').localeCompare(String(b['Due Date']||'9')));
  $('#view').innerHTML = `
    <div class="page-h"><div><h2>${esc(S.user.name)}</h2><p>Submit the files requested by the Directorate. You can upload several files for each item.</p></div></div>
    <div class="kpis">
      <div class="kpi"><div class="l">Open requests</div><div class="v">${open.length}</div></div>
      <div class="kpi"><div class="l">You have submitted</div><div class="v">${done}</div></div>
      <div class="kpi"><div class="l">Still to submit</div><div class="v" style="color:${open.length-done?'var(--amber)':'inherit'}">${open.length-done}</div></div>
      <div class="kpi"><div class="l">Returned for correction</div><div class="v" style="color:${rej?'var(--red)':'inherit'}">${rej}</div></div>
    </div>
    <div class="tasks">${order.length?order.map(t=>taskCard(t, by(t['Task ID']))).join(''):'<div class="card empty">No submissions have been requested from your school yet.</div>'}</div>`;
  order.forEach(t => wireUpload(t));
}

function taskCard(t, subs){
  const d=dueInfo(t), st=agg(subs), open=t.Status==='Open', ex=allowedExts(t['Allowed Types']);
  const max=Number(t['Max Files'])||0, full = max && subs.length>=max;
  return `<section class="card"><div class="card-b">
    <div class="task-top"><div><h3>${esc(t.Title)}</h3>
      <div style="margin-top:6px">${typeList(t['Allowed Types']).map(k=>`<span class="chip">${esc(TYPE_LABEL[k]||k)}</span>`).join('')}${max?`<span class="chip">Up to ${max} file${max>1?'s':''}</span>`:''}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${pill(st)}<span class="pill ${d.cls}">${esc(d.text)}</span></div></div>
    ${t.Description?`<div class="task-desc">${esc(t.Description)}</div>`:''}
    ${subs.length?`<div class="files">${subs.map(s=>fileRow(s,t,open)).join('')}</div>`:''}
    ${open && !full?`
      <div class="drop" data-drop="${esc(t['Task ID'])}">
        <input type="file" multiple class="hidden" data-inp="${esc(t['Task ID'])}" ${ex?`accept="${ex.map(e=>'.'+e).join(',')}"`:''}>
        <b>Click to choose files</b> or drag them here<div class="small muted">${ex?'Accepted: '+ex.map(e=>'.'+e).join(' '):'Any file type'} · max ${CONFIG.MAX_FILE_MB} MB each</div>
      </div>
      <div class="queue" data-q="${esc(t['Task ID'])}"></div>
      <div class="up-row hidden" data-up="${esc(t['Task ID'])}">
        <input class="inp" placeholder="Optional note to the Directorate" data-note="${esc(t['Task ID'])}">
        <button class="btn primary" data-go="${esc(t['Task ID'])}">⬆ Upload files</button>
      </div>`:(open&&full?`<p class="small muted" style="margin-top:12px">File limit reached. Delete a file to upload a replacement.</p>`:'')}
  </div></section>`;
}

function fileRow(s, t, open){
  const e=s['File Type']||extOf(s['File Name']);
  return `<div class="file"><div class="ficon ${kindOf(e)}">${esc(e.slice(0,4))}</div>
    <div class="fmeta"><div class="n" title="${esc(s['File Name'])}">${esc(s['File Name'])}</div>
      <div class="s">${fmtSize(s['Size KB'])} · ${fmtDT(s['Submitted At'])}${isLate(s,t)?' · <span style="color:var(--amber)">late</span>':''}${s.Note?' · “'+esc(s.Note)+'”':''}</div>
      ${s.Status==='Rejected'&&s.Remark?`<div class="remark">Returned: ${esc(s.Remark)}</div>`:''}
      ${s.Status==='Accepted'&&s.Remark?`<div class="small" style="color:var(--green)">${esc(s.Remark)}</div>`:''}
    </div>

const pending = {};
function wireUpload(t){
  const id=t['Task ID'], drop=$(`[data-drop="${id}"]`); if(!drop) return;
  const inp=$(`[data-inp="${id}"]`), ex=allowedExts(t['Allowed Types']);
  pending[id]=[];
  const add = files => {
    for(const f of files){
      const e=extOf(f.name);
      if(ex && !ex.includes(e)){ toast(`${f.name}: .${e} files are not accepted here.`, true); continue; }
      if(f.size > CONFIG.MAX_FILE_MB*1048576){ toast(`${f.name} is larger than ${CONFIG.MAX_FILE_MB} MB.`, true); continue; }
      if(!f.size){ toast(`${f.name} is empty.`, true); continue; }
      pending[id].push(f);
    }
    drawQueue(id);
  };
  drop.onclick = () => inp.click();
  inp.onchange = () => { add(inp.files); inp.value=''; };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); add(e.dataTransfer.files); };
  $(`[data-go="${id}"]`).onclick = () => doUpload(t);
}
function drawQueue(id){
  const q=pending[id];
  $(`[data-q="${id}"]`).innerHTML = q.map((f,i)=>`<div class="q"><span>${esc(f.name)} <span class="muted">(${fmtSize(f.size/1024)})</span></span><span data-st="${id}-${i}"><a href="#" onclick="pending['${id}'].splice(${i},1);drawQueue('${id}');return false">remove</a></span></div>`).join('');
  $(`[data-up="${id}"]`).classList.toggle('hidden', !q.length);
}
async function doUpload(t){
  const id=t['Task ID'], q=pending[id], btn=$(`[data-go="${id}"]`), note=$(`[data-note="${id}"]`).value;
  if(!q.length) return;
  btn.disabled=true; let ok=0;
  for(let i=0;i<q.length;i++){
    const cell=$(`[data-st="${id}-${i}"]`); cell.innerHTML='<span class="spin"></span> uploading…';
    btn.innerHTML=`<span class="spin"></span> Uploading ${i+1} of ${q.length}`;
    try{
      const data=await readB64(q[i]);
      await api('upload',{ taskId:id, fileName:q[i].name, mimeType:q[i].type, data, note });
      cell.innerHTML='<span style="color:var(--green)">✓ done</span>'; ok++;
    }catch(e){ cell.innerHTML=`<span style="color:var(--red)">✗ ${esc(e.message)}</span>`; }
  }
  toast(ok===q.length?`${ok} file${ok>1?'s':''} submitted.`:`${ok} of ${q.length} uploaded — check the errors.`, ok!==q.length);
  if(ok===q.length){ pending[id]=[]; await loadSchool(); }
  else { btn.disabled=false; btn.textContent='⬆ Upload files'; }
}

function enrolAgg(rows){ const o={B:sum(rows,'Boys'),G:sum(rows,'Girls')}; o.T=o.B+o.G; return o; }
const gpi = a => a.B?(a.G/a.B).toFixed(2):'—';
const OLD_CLASS = {P1:'B1',P2:'B2',P3:'B3',P4:'B4',P5:'B5',P6:'B6',JHS1:'B7',JHS2:'B8',JHS3:'B9'};
const canonClass = c => OLD_CLASS[c]||c;
const classOrder = c => { const i=CLASSES.findIndex(x=>x[0]===c); return i<0?99:i; };
const curPeriod = () => S.period||(S.periods||CONFIG.ENROL_PERIODS)[0];
const periodOf = r => r.Period||(S.periods||CONFIG.ENROL_PERIODS)[0];
// enrolment for the current collection round (used by Home, Staff PTR, Classrooms)
const enrolNow = () => scopedRecs('Enrolment').filter(r=>periodOf(r)===curPeriod());
const PERIODS = () => S.periods||CONFIG.ENROL_PERIODS;

/* ---- editor (schools, and Admin/EMIS Officer on a school's behalf) ---- */
function enrolStart(sch, period){
  const mine=(S.rec.Enrolment||[]).filter(r=>String(r['EMIS Code'])===String(sch.emis)&&periodOf(r)===period);
  let rows=mine.map(r=>({Class:r.Class, Stream:r.Stream||'', Boys:r.Boys, Girls:r.Girls}));
  if(!rows.length){ const lv=levelsOf({Level:sch.Level}); rows=CLASSES.filter(([,l])=>lv.length?lv.includes(l):l!=='Nursery'&&l!=='SHS').map(([c])=>({Class:c,Stream:'',Boys:'',Girls:''})); }
  return rows.sort((a,b)=>classOrder(a.Class)-classOrder(b.Class)||String(a.Stream).localeCompare(String(b.Stream)));
}
function enrolEditorHTML(sch, period){
  const E=S.eEdit, rows=E.rows, idx=PERIODS().indexOf(period);
  const prev=PERIODS().slice(0,idx).reverse().find(p=>(S.rec.Enrolment||[]).some(r=>String(r['EMIS Code'])===String(sch.emis)&&periodOf(r)===p));
  const mine=(S.rec.Enrolment||[]).filter(r=>String(r['EMIS Code'])===String(sch.emis)&&periodOf(r)===period);
  const last=mine.map(r=>r['Updated At']).filter(Boolean).sort().pop();
  const lastBy=last&&mine.find(r=>r['Updated At']===last)['Updated By'];
  const missing=CLASSES.filter(([c])=>!rows.some(r=>r.Class===c));
  const hasNursery=rows.some(r=>CLASSES.find(x=>x[0]===r.Class)?.[1]==='Nursery');
  let html=`<div class="eh"><span class="pill blue">${esc(S.year||CONFIG.YEAR)}</span><span class="pill amber">Round: ${esc(period)}</span>
      ${prev&&!mine.length?`<button class="btn sm" id="eCopy">Copy figures from “${esc(prev)}”</button>`:''}
      <span style="margin-left:auto"></span>
      ${!hasNursery?`<button class="btn sm" id="eNur">＋ Creche / Nursery classes</button>`:''}
      <select class="inp" id="eAdd" style="width:auto;padding:6px 10px"><option value="">＋ Add a class…</option>${missing.map(([c])=>`<option value="${c}">${esc(CLASS_LABEL(c))}</option>`).join('')}</select></div>
    <div class="tbl-wrap"><table class="t grid-t" id="egrid"><thead><tr><th>Class</th><th>Stream</th><th class="num">Male</th><th class="num">Female</th><th class="num">Total</th><th></th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const first=i===0||rows[i-1].Class!==r.Class, lastOfClass=i===rows.length-1||rows[i+1].Class!==r.Class, multi=rows.filter(x=>x.Class===r.Class).length>1;
    html+=`<tr data-i="${i}" class="${first?'cls-first':''}"><td>${first?`<b>${esc(CLASS_LABEL(r.Class))}</b><div class="small muted">${esc((CLASSES.find(x=>x[0]===r.Class)||[])[1]||'')}</div>`:''}</td>
      <td>${multi?`<input class="inp gin" style="width:64px;text-align:center" data-k="Stream" value="${esc(r.Stream)}" maxlength="3" aria-label="Stream">`:'<span class="muted small">single</span>'}</td>
      <td class="num"><input type="number" min="0" step="1" inputmode="numeric" class="inp gin" data-k="Boys" value="${esc(r.Boys)}" placeholder="0" aria-label="${esc(CLASS_LABEL(r.Class)+' '+r.Stream+' boys')}"></td>
      <td class="num"><input type="number" min="0" step="1" inputmode="numeric" class="inp gin" data-k="Girls" value="${esc(r.Girls)}" placeholder="0" aria-label="${esc(CLASS_LABEL(r.Class)+' '+r.Stream+' girls')}"></td>
      <td class="num"><b class="gt">0</b></td>
      <td style="white-space:nowrap">${lastOfClass?`<button class="btn sm" data-addst="${esc(r.Class)}" title="Split this class into streams A, B, …">＋ Stream</button>`:''}<button class="btn sm danger" data-rm="${i}" title="Remove">✕</button></td></tr>`;
  });
  html+=`</tbody><tfoot><tr><td colspan="2"><b>Total</b> <span class="small muted">(${new Set(rows.map(r=>r.Class)).size} classes · ${rows.length} streams/rows)</span></td><td class="num"><b id="eB">0</b></td><td class="num"><b id="eG">0</b></td><td class="num"><b id="eT">0</b></td><td></td></tr></tfoot></table></div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap"><span class="small muted">${last?`Last saved ${fmtDT(last)} by ${esc(lastBy)}`:`Not filled in yet for ${esc(period)}.`}</span><span style="margin-left:auto"></span>
      ${canEdit('Enrolment')?`<button class="btn primary" id="eSave">Save &amp; get receipt</button>`:''}</div>`;
  return html;
}
function wireEnrolEditor(sch, period, host, after){
  const E=S.eEdit, read=()=>$$('#egrid tbody tr').forEach(tr=>{ const r=E.rows[+tr.dataset.i]; $$('.gin',tr).forEach(i=>r[i.dataset.k]=i.dataset.k==='Stream'?i.value.toUpperCase().trim():i.value); });
  const redraw=()=>{ host.innerHTML=enrolEditorHTML(sch,period); wireEnrolEditor(sch,period,host,after); };
  const calc=()=>{ let B=0,G=0; $$('#egrid tbody tr').forEach(tr=>{ const b=num($('[data-k=Boys]',tr).value), g=num($('[data-k=Girls]',tr).value); B+=b; G+=g; $('.gt',tr).textContent=(b+g).toLocaleString(); });
    $('#eB').textContent=B.toLocaleString(); $('#eG').textContent=G.toLocaleString(); $('#eT').textContent=(B+G).toLocaleString(); };
  $$('#egrid .gin').forEach(i=>i.oninput=calc); calc();
  $$('[data-addst]').forEach(b=>b.onclick=()=>{ read(); const c=b.dataset.addst, same=E.rows.filter(r=>r.Class===c);
    if(same.length===1&&!same[0].Stream) same[0].Stream='A';
    const used=same.map(r=>r.Stream); const next='ABCDEFGH'.split('').find(x=>!used.includes(x))||String(same.length+1);
    const at=E.rows.lastIndexOf(same[same.length-1]); E.rows.splice(at+1,0,{Class:c,Stream:next,Boys:'',Girls:''}); redraw(); });
  $$('[data-rm]').forEach(b=>b.onclick=()=>{ read(); const r=E.rows[+b.dataset.rm]; E.rows.splice(+b.dataset.rm,1);
    const left=E.rows.filter(x=>x.Class===r.Class); if(left.length===1) left[0].Stream=''; redraw(); });
  const add=cs=>{ read(); cs.forEach(c=>{ if(!E.rows.some(r=>r.Class===c)) E.rows.push({Class:c,Stream:'',Boys:'',Girls:''}); }); E.rows.sort((a,b)=>classOrder(a.Class)-classOrder(b.Class)||String(a.Stream).localeCompare(String(b.Stream))); redraw(); };
  if($('#eNur')) $('#eNur').onclick=()=>add(['CRECHE','N1','N2']);
  $('#eAdd').onchange=e=>{ if(e.target.value) add([e.target.value]); };
  if($('#eCopy')) $('#eCopy').onclick=()=>{ const idx=PERIODS().indexOf(period); const prev=PERIODS().slice(0,idx).reverse().find(p=>(S.rec.Enrolment||[]).some(r=>String(r['EMIS Code'])===String(sch.emis)&&periodOf(r)===p));
    E.rows=enrolStart(sch,prev); redraw(); toast('Figures copied from '+prev+'. Check and correct them, then save.'); };
  const sv=$('#eSave'); if(!sv) return;
  sv.onclick=async()=>{
    read();
    const rows=E.rows.filter(r=>r.Class);
    for(const c of new Set(rows.map(r=>r.Class))){ const st=rows.filter(r=>r.Class===c);
      if(st.length>1){ st.forEach((r,i)=>{ if(!r.Stream) r.Stream='ABCDEFGH'[i]; }); if(new Set(st.map(r=>r.Stream)).size<st.length){ toast(`${CLASS_LABEL(c)}: each stream needs a different letter.`,true); return; } } }
    if(rows.some(r=>[r.Boys,r.Girls].some(v=>v!==''&&(Number(v)<0||!Number.isInteger(Number(v)))))){ toast('Use whole numbers of zero or more.',true); return; }
    sv.disabled=true; sv.innerHTML='<span class="spin"></span> Saving…';
    try{
      const res=await api('recSaveMany',{module:'Enrolment',replace:true,period,rows:rows.map(r=>({'EMIS Code':sch.emis,Year:S.year||CONFIG.YEAR,Period:period,Class:r.Class,Stream:r.Stream,Boys:num(r.Boys),Girls:num(r.Girls)}))});
      await recLoad('Enrolment',true); if(S.data) S.data.enrolment=(S.rec.Enrolment||[]).filter(r=>periodOf(r)===curPeriod());
      if(res&&res.receipt) (S.receipts=S.receipts||[]).push(res.receipt);
      S.eEdit=null; if(after) await after(); if(res&&res.receipt) showReceipt(res.receipt); else toast('Enrolment saved.');
    }catch(e){ toast(e.message,true); sv.disabled=false; sv.textContent='Save & get receipt'; }
  };
}

      ${byCirc.map(r=>`<tr><td><b>${esc(r.c)}</b></td>${r.lv.map(v=>`<td class="num">${v.toLocaleString()}</td>`).join('')}<td class="num">${r.B.toLocaleString()}</td><td class="num">${r.G.toLocaleString()}</td><td class="num"><b>${r.T.toLocaleString()}</b></td><td class="num">${gpi(r)}</td><td class="num">${r.rep}/${r.n}</td></tr>`).join('')}

function vStaffList(){
  if(S.staffKind==='retire') return vRetire();
  const kind=S.staffKind||'school', mod=kind==='school'?'SchoolStaff':'DirStaff';
  modView(kind==='school'?['SchoolStaff','Enrolment']:['DirStaff'],()=>{
  const all=kind==='school'?scopedRecs('SchoolStaff'):S.rec.DirStaff, fl=S.sf||(S.sf={cat:'',gen:''});
  const rows=all.filter(r=>(!fl.cat||r.Category===fl.cat)&&(!fl.gen||r.Gender===fl.gen));
  const T=all.filter(r=>r.Category==='Teaching'), M=all.filter(r=>r.Gender==='Male');
  const retire=all.filter(r=>{ const a=ageOf(r['Date of Birth']); return a!=null&&a>=59; });
  const m=can.manage(S.user.role);
  const last=MODS[mod].fields[7].k;
  const cols=[{k:'Full Name',h:'Name',v:r=>`<b>${esc(r['Full Name'])}</b>${r.Phone?`<div class="small muted">${esc(r.Phone)}</div>`:''}`},{k:'Gender'},{k:'Date of Birth',h:'Date of birth (age)'},{k:'Staff ID'},{k:'Rank',small:1},{k:'Qualification',small:1},{k:'Category'},{k:last,small:1},...(kind==='school'?schoolCols:[])];
  const rankRows=[...new Set(all.map(r=>r.Rank||'Not stated'))].map(k=>({k,n:all.filter(r=>(r.Rank||'Not stated')===k).length})).sort((a,b)=>b.n-a.n);
  const qualRows=[...new Set(all.map(r=>r.Qualification||'Not stated'))].map(k=>({k,n:all.filter(r=>(r.Qualification||'Not stated')===k).length})).sort((a,b)=>b.n-a.n);
  let circTable='';

    const enr=enrolNow();
    const rowsC=circuits().map(c=>{ const r=all.filter(x=>canonCircuit(x.Circuit)===c), t=r.filter(x=>x.Category==='Teaching'), n=r.filter(x=>x.Category!=='Teaching');

      ${rowsC.concat([{c:'Total',...S2,b:1}]).map(r=>`<tr ${r.b?'style="background:#faf8f3;font-weight:700"':''}><td><b>${esc(r.c)}</b></td><td class="num">${r.tm}</td><td class="num">${r.tf}</td><td class="num">${r.nm}</td><td class="num">${r.nf}</td><td class="num"><b>${r.tot}</b></td><td class="num">${r.pupils.toLocaleString()}</td><td class="num">${ptr(r)}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }
  $('#view').innerHTML=`
    <div class="page-h"><div><h2>Staff list</h2><p>${kind==='school'?'Staff at post in schools · '+scopeText():'Staff of the Municipal Education Directorate'}</p></div>
      ${staffToggle(kind)}</div>
    ${kpis([['Total staff',all.length.toLocaleString()],['Teaching',T.length.toLocaleString()],['Non-teaching',(all.length-T.length).toLocaleString()],['Male',M.length.toLocaleString()],['Female',all.filter(r=>r.Gender==='Female').length.toLocaleString()],['Aged 59+ (retiring soon)',retire.length,retire.length?'var(--amber)':'']])}
    ${circTable}
    <div class="g2"><div class="card"><div class="card-b"><div class="cap">By rank</div><div style="margin-top:10px">${barList(rankRows)}</div></div></div>
      <div class="card"><div class="card-b"><div class="cap">By qualification</div><div style="margin-top:10px">${barList(qualRows)}</div></div></div></div>
    <div class="card accent"><div class="card-h">${secT(kind==='school'?'School staff list':'Directorate staff list')}<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">${kind==='school'?linkBtn('SchoolStaff'):''}<button class="btn" id="stX">Export List</button><button class="btn" onclick="refreshMods(['${mod}'])">Refresh</button>${m?`<button class="btn primary" onclick="recModal('${mod}')">＋ Add staff</button>`:''}</div></div>
      ${dataTable('st'+kind,rows,cols,{edit:m, filters:`<select class="inp" id="sfC"><option value="">Teaching & non-teaching</option>${['Teaching','Non-teaching'].map(x=>`<option ${fl.cat===x?'selected':''}>${x}</option>`).join('')}</select>
        <select class="inp" id="sfG"><option value="">Any gender</option>${['Male','Female'].map(x=>`<option ${fl.gen===x?'selected':''}>${x}</option>`).join('')}</select>`})}</div>`;
  wireStaffToggle();
  $('#sfC').onchange=e=>{ fl.cat=e.target.value; vStaffList(); }; $('#sfG').onchange=e=>{ fl.gen=e.target.value; vStaffList(); };
  wireTable('st'+kind, mod);
  $('#stX').onclick=()=>exportRows(S['_t_st'+kind],[...MODS[mod].fields.map(f=>({k:f.k})),...(kind==='school'?[{k:'EMIS Code'},{k:'School Name'},{k:'Circuit',csv:r=>canonCircuit(r.Circuit)}]:[]),{k:'Age',csv:r=>ageOf(r['Date of Birth'])??''}],`AAN_${kind}_staff.csv`);
}); }

/* ---- BECE ---- */
function parseDate(v){
  if(!v) return ''; v=String(v).trim(); let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m && +m[2]<=12 && +m[1]<=31) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
function beceBulk(emis){
  openModal(`<h3>Paste candidates from Excel</h3>
    <p class="muted small">In Excel, select these columns in this order and copy: <b>Candidate name · Sex · Date of birth · Index number</b> (index number is optional). Paste below — one candidate per line. Sex can be M/F; dates like 14/03/2011.</p>
    <textarea class="inp" id="bk" rows="10" placeholder="Kwame Mensah&#9;M&#9;14/03/2011&#10;Ama Owusu&#9;F&#9;02/11/2010"></textarea>
    <div class="small" id="bkp" style="margin-top:8px"></div><div class="err" id="bkerr"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="bkb" disabled>Add candidates</button></div>`);
  $('#modalCard').classList.add('wide');
  let parsed=[];
  $('#bk').oninput=()=>{
    const errs=[];
    parsed=$('#bk').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map((l,i)=>{
      const c=l.split(/\t|;|,(?=\s*[MFmf]\b)|,(?=\s*\d)/).map(x=>x.trim());
      if(i===0 && /name|candidate/i.test(c[0]) && /sex|gender/i.test(c[1]||'')) return null;  // header row
      const sex=/^f/i.test(c[1]||'')?'Female':/^m/i.test(c[1]||'')?'Male':'', dob=parseDate(c[2]);
      if(!c[0]||!sex) errs.push(`Line ${i+1}: name and sex (M/F) are needed`);
      else if(c[2] && !dob) errs.push(`Line ${i+1}: date “${c[2]}” not understood — use dd/mm/yyyy`);
      return {'Candidate Name':c[0], Sex:sex, 'Date of Birth':dob, 'Index Number':c[3]||'', 'EMIS Code':emis, Year:S.year||CONFIG.YEAR};
    }).filter(Boolean);
    $('#bkp').textContent=parsed.length?`${parsed.length} candidate(s) read · ${parsed.filter(r=>r.Sex==='Male').length} boys, ${parsed.filter(r=>r.Sex==='Female').length} girls`:'';
    $('#bkerr').innerHTML=errs.slice(0,6).map(esc).join('<br>')+(errs.length>6?`<br>…and ${errs.length-6} more`:'');
    $('#bkb').disabled=!parsed.length||errs.length>0;
  };
  $('#bkb').onclick=async()=>{
    const b=$('#bkb'); b.disabled=true; b.innerHTML='<span class="spin"></span> Adding…';
    try{ await api('recSaveMany',{module:'BECE',rows:parsed}); await recLoad('BECE',true); closeModal();
      toast(`${parsed.length} candidates added. Click “Submit & get receipt” when the list is complete.`); S.rerender&&S.rerender(); }
    catch(e){ $('#bkerr').textContent=e.message; b.disabled=false; b.textContent='Add candidates'; }
  };
}
const AGE_BANDS = ['13 or younger','14','15','16','17','18 or older','No date of birth'];
function ageBand(d){ const a=ageOf(d); if(a==null) return 'No date of birth'; if(a<=13) return '13 or younger'; if(a>=18) return '18 or older'; return String(a); }
function vBECE(){ modView(['BECE'],()=>{
  const rows=scopedRecs('BECE'), sc=scoped(), jhs=sc.active.filter(hasJHS), m=can.manage(S.user.role);
  const pres=new Set(rows.map(r=>String(r['EMIS Code'])));

const ICON_SCHOOL = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M10 21v-5h4v5"/></svg>';
const LEVEL_COLOR = { Nursery:'#7a6a12', KG:'#2a78d6', Primary:'#d4741c', JHS:'#1a9c6e', SHS:'#b0337a' };
const STATUS_COLOR = { Accepted:'#1f7a52', Submitted:'#c58a12', Rejected:'#b8322a' };
const FLAG_LABEL = { nocircuit:'No circuit', badcircuit:'Circuit name not recognised', nolevel:'No level', nophone:'No phone number', never:'Never signed in', inactive:'Inactive' };

const isActive = s => String(s.Active).toLowerCase()!=='no';
const OWN = s => { const o=String(s.Ownership||'').toLowerCase(); return /priv/.test(o)?'Private':/pub|gov/.test(o)?'Public':''; };
function canonCircuit(c){ const t=String(c||'').trim().replace(/\s+circuit$/i,''); if(!t) return ''; return CONFIG.CIRCUITS.find(x=>x.toLowerCase()===t.toLowerCase())||t; }
function levelsOf(s){ return [...new Set(String(s.Level||'').split(/[\/,;]/).map(x=>{ x=x.trim().toLowerCase(); if(/^(creche|nursery|pre-?school)$/.test(x)) return 'Nursery'; if(/^(basic|lower primary|upper primary)$/.test(x)) return 'Primary'; return LEVELS.find(L=>L.toLowerCase()===x); }).filter(Boolean))]; }
function flagsOf(s){
  const f=[], c=canonCircuit(s.Circuit);
  if(!c) f.push('nocircuit'); else if(!CONFIG.CIRCUITS.includes(c)) f.push('badcircuit');
  if(!levelsOf(s).length) f.push('nolevel');
  if(!String(s.Phone||'').trim()) f.push('nophone');
  if(!s['Last Login']) f.push('never');
  if(!isActive(s)) f.push('inactive');
  return f;
}
function allCircuits(){
  if(S.user.role==='CIRCUIT_SUPERVISOR') return [canonCircuit(S.user.circuit)];
  const extra=[...new Set(S.data.schools.map(s=>canonCircuit(s.Circuit)).filter(c=>c&&!CONFIG.CIRCUITS.includes(c)))].sort();
  return [...CONFIG.CIRCUITS, ...extra];
}
const circuits = () => allCircuits().filter(c=>S.scope.has(c));
const hasOwnership = () => S.data.schools.some(s=>OWN(s));
function schoolIn(s){
  const c=canonCircuit(s.Circuit);
  const okC = c ? S.scope.has(c) : S.scope.size===allCircuits().length;
  return okC && (S.own==='all' || OWN(s)===S.own);
}
function scoped(){
  const schools=S.data.schools.filter(schoolIn);
  const set=new Set(schools.map(s=>String(s['EMIS Code'])));
  return { schools, active:schools.filter(isActive), subs:S.data.submissions.filter(x=>set.has(String(x['EMIS Code']))) };
}
const activeSchools = () => scoped().active;
const taskById = id => S.data.tasks.find(t=>t['Task ID']===id);
function taskProgress(t, circuit){
  const sch = activeSchools().filter(s=>levelsMatch(t.Levels,s.Level) && (!circuit||canonCircuit(s.Circuit)===circuit));
  const subs = S.data.submissions.filter(x=>x['Task ID']===t['Task ID']);
  const rows = sch.map(s=>{ const m=subs.filter(x=>String(x['EMIS Code'])===String(s['EMIS Code'])); return {s, m, st:agg(m), last:m.map(x=>x['Submitted At']).sort().pop()}; });
  return { rows, total:sch.length, done:rows.filter(r=>r.m.length).length, pending:rows.reduce((a,r)=>a+r.m.filter(x=>x.Status==='Submitted').length,0) };
}

/* ---- chart pieces ---- */
function donut(segs, center, note){
  const tot=segs.reduce((a,s)=>a+s.n,0), R=42, C=2*Math.PI*R, live=segs.filter(s=>s.n), gap=live.length>1?2:0; let off=0;
  const arcs = tot ? live.map(s=>{ const len=s.n/tot*C;
      const a=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${Math.max(len-gap,.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${esc(s.k)}: ${s.n} (${Math.round(s.n/tot*100)}%)</title></circle>`;
      off+=len; return a; }).join('')
    : `<circle r="${R}" cx="60" cy="60" fill="none" stroke="#ecebe4" stroke-width="16"/>`;
  return `<div class="donut"><svg viewBox="0 0 120 120" width="136" height="136" role="img" aria-label="${esc(segs.map(s=>s.k+' '+s.n).join(', '))}">${arcs}<text x="60" y="61" text-anchor="middle" dominant-baseline="middle" class="dv" style="font-size:${String(center).length>6?15:String(center).length>4?18:24}px">${esc(center)}</text></svg>
    <div class="dleg">${segs.map(s=>`<div class="dl"><i style="background:${s.c}"></i><span>${esc(s.k)}</span><b>${s.n.toLocaleString()} <span class="muted">(${tot?Math.round(s.n/tot*100):0}%)</span></b></div>`).join('')}
    ${note?`<div class="small muted" style="margin-top:6px">${note}</div>`:''}</div></div>`;
}
function barList(rows, color){
  const max=Math.max(1,...rows.map(r=>r.n));
  return `<div class="blist">${rows.map(r=>`<div class="br" title="${esc(r.k)}: ${r.n}"><span class="bk">${esc(r.k)}</span><span class="bt"><i style="width:${r.n/max*100}%;background:${color||'var(--indigo)'}"></i></span><b>${r.n.toLocaleString()}</b></div>`).join('')}</div>`;
}
const attn = (n,label,go) => `<button type="button" class="att" data-go="${go}"><span class="cnt ${n?'bad':'ok'}">${n.toLocaleString()}</span><span>${label}</span><span class="muted" style="margin-left:auto">›</span></button>`;
function wireGo(){
  $$('[data-go]').forEach(b=>b.onclick=()=>{
    const [tab,arg]=b.dataset.go.split(':');
    if(tab==='subs'){ S.f={task:'',status:arg||'',q:''}; }
    if(tab==='schools'){ S.dir.flag=arg||''; S.dir.circuit=''; S.dir.q=''; }
    if(tab==='comp'){ S.comp.missing=true; if(arg) S.comp.task=arg; }
    goTab(tab);
  });
}
const secT = (t, sub) => `<div class="sec-t"><span class="dot"></span>${esc(t)}</div>${sub?`<div class="small muted" style="margin:2px 0 0 15px">${sub}</div>`:''}`;

function homeCirc(sc, open){
  const rows=circuits().map(c=>{
    const sch=sc.active.filter(s=>canonCircuit(s.Circuit)===c), set=new Set(sch.map(s=>String(s['EMIS Code'])));
    const subs=sc.subs.filter(x=>set.has(String(x['EMIS Code'])));
    let tot=0, done=0; open.forEach(t=>{ const p=taskProgress(t,c); tot+=p.total; done+=p.done; });
    return { c, n:sch.length, lv:LEVELS.map(L=>sch.filter(s=>levelsOf(s).includes(L)).length), signed:sch.filter(s=>s['Last Login']).length,
             files:subs.length, wait:subs.filter(x=>x.Status==='Submitted').length, rate:tot?Math.round(done/tot*100):null };
  });
  const T=rows.reduce((a,r)=>({n:a.n+r.n,lv:a.lv.map((v,i)=>v+r.lv[i]),signed:a.signed+r.signed,files:a.files+r.files,wait:a.wait+r.wait}),{n:0,lv:[0,0,0,0],signed:0,files:0,wait:0});
  const rate=r=>r==null?'<span class="muted">—</span>':`<div style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><span class="bar" style="width:90px"><i style="width:${r}%;background:${r>=80?'var(--green)':r>=50?'var(--teal)':'var(--red)'}"></i></span><b>${r}%</b></div>`;
  return `<div class="card accent"><div class="card-h"><h3>Circuit comparison</h3><span class="small muted">Active schools · submission rate = schools that submitted ÷ schools asked, across open requests</span></div>
    <div class="tbl-wrap"><table class="t"><thead><tr><th>Circuit</th><th class="num">Schools</th>${LEVELS.map(L=>`<th class="num">${L}</th>`).join('')}<th class="num">Signed in</th><th class="num">Files</th><th class="num">Awaiting review</th><th class="num">Submission rate</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><b>${esc(r.c)}</b></td><td class="num">${r.n}</td>${r.lv.map(v=>`<td class="num">${v}</td>`).join('')}<td class="num">${r.signed}/${r.n}</td><td class="num">${r.files}</td><td class="num">${r.wait?`<span class="pill amber">${r.wait}</span>`:0}</td><td class="num">${rate(r.rate)}</td></tr>`).join('')}
    <tr style="background:#faf8f3"><td><b>Total</b></td><td class="num"><b>${T.n}</b></td>${T.lv.map(v=>`<td class="num"><b>${v}</b></td>`).join('')}<td class="num"><b>${T.signed}/${T.n}</b></td><td class="num"><b>${T.files}</b></td><td class="num"><b>${T.wait}</b></td><td></td></tr>
    </tbody></table></div></div>`;
}

        <td><div class="fact"><button class="btn sm" onclick="dl('${esc(s['Submission ID'])}')">Download</button>
          ${can.review(r)?`${s.Status!=='Accepted'?`<button class="btn sm ok" onclick="reviewModal('${esc(s['Submission ID'])}','Accepted')">Accept</button>`:''}${s.Status!=='Rejected'?`<button class="btn sm danger" onclick="reviewModal('${esc(s['Submission ID'])}','Rejected')">Return</button>`:''}`:''}</div></td></tr>`; }).join('')}

function liveSearch(sel, fn){
  const q=$(sel); if(!q) return;
  q.oninput=()=>{ clearTimeout(S._qt); S._qt=setTimeout(()=>{ fn(q.value); const n=$(sel); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },300); };
}
function exportSubs(){
  csv([['Uploaded','EMIS Code','School','Circuit','Level','Request','File','Size KB','Status','Reviewer','Remark','Note'],
    ...(S._subsList||[]).map(s=>[fmtDT(s['Submitted At']),s['EMIS Code'],s['School Name'],canonCircuit(s.Circuit),s.Level,s['Task Title'],s['File Name'],s['Size KB'],s.Status,s.Reviewer,s.Remark,s.Note])], 'submissions.csv');
}
function reviewModal(id, status){
  const s=S.data.submissions.find(x=>x['Submission ID']===id), acc=status==='Accepted';
  openModal(`<h3>${acc?'Accept file':'Return file to school'}</h3>
    <p class="muted"><b>${esc(s['School Name'])}</b> · ${esc(s['File Name'])}</p>
    <label class="f">${acc?'Comment (optional)':'What should the school correct?'}</label>
    <textarea class="inp" id="rvr" rows="3" placeholder="${acc?'e.g. Well done':'e.g. Enrolment totals for P4 do not add up. Correct and re-upload.'}"></textarea>
    <div class="err" id="rverr"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="rvb">${acc?'Accept':'Return to school'}</button></div>`);
  $('#rvb').onclick = async () => {
    const remark=$('#rvr').value.trim();
    if(!acc && !remark){ $('#rverr').textContent='Please tell the school what to fix.'; return; }
    $('#rvb').disabled=true;
    try{ await api('review',{id,status,remark}); Object.assign(s,{Status:status,Remark:remark,Reviewer:S.user.name,'Reviewed At':new Date().toISOString()}); closeModal(); toast(acc?'File accepted.':'File returned to school.'); renderStaff(); }
    catch(e){ $('#rverr').textContent=e.message; $('#rvb').disabled=false; }
  };
}

  const d=S.data, c=S.comp;

  const t=taskById(c.task);
  if(!t){ $('#view').innerHTML='<div class="card empty">No requests yet.</div>'; return; }
  const p=taskProgress(t);
  const rows=p.rows.filter(r=>!c.missing||!r.m.length).sort((a,b)=>canonCircuit(a.s.Circuit).localeCompare(canonCircuit(b.s.Circuit))||String(a.s['School Name']).localeCompare(b.s['School Name']));
  S._compRows=rows;
  $('#view').innerHTML=`
    <div class="card accent"><div class="card-h">${secT('Who has submitted',`${p.done} of ${p.total} schools have submitted · ${scopeText()}`)}
      <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="copyDefaulters()">Copy list for WhatsApp</button><button class="btn" onclick="exportComp()">Export List</button></div></div>
    <div class="card-h filters">
      <select class="inp" id="cTask">${d.tasks.map(x=>`<option value="${esc(x['Task ID'])}" ${x['Task ID']===c.task?'selected':''}>${esc(x.Title)}${x.Status==='Closed'?' (closed)':''}</option>`).join('')}</select>
      <div class="seg" style="margin:0;grid-template-columns:auto auto"><button type="button" data-m="1" class="${c.missing?'on':''}">Not submitted (${p.total-p.done})</button><button type="button" data-m="0" class="${c.missing?'':'on'}">All schools (${p.total})</button></div>
    </div>
    <div class="tbl-wrap">${rows.length?`<table class="t"><thead><tr><th>EMIS</th><th>School</th><th>Circuit</th><th>Level</th><th>Head / phone</th><th class="num">Files</th><th>Status</th><th>Last upload</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r.s['EMIS Code'])}</td><td><b>${esc(r.s['School Name'])}</b></td><td>${esc(canonCircuit(r.s.Circuit))}</td><td class="small">${esc(r.s.Level)}</td>
        <td class="small">${esc(r.s['Head Name'])}${r.s.Phone?`<br><a href="tel:${esc(r.s.Phone)}">${esc(r.s.Phone)}</a>`:''}</td><td class="num">${r.m.length}</td><td>${pill(r.st)}</td><td class="small">${r.last?fmtDT(r.last):'—'}</td></tr>`).join('')}
      </tbody></table>`:`<div class="empty">${c.missing?'🎉 Every school in scope has submitted.':'No schools match.'}</div>`}</div></div>`;
  $('#cTask').onchange=e=>{ c.task=e.target.value; vComp(); };
  $$('[data-m]').forEach(b=>b.onclick=()=>{ c.missing=b.dataset.m==='1'; vComp(); });
}
function copyDefaulters(){
  const t=taskById(S.comp.task); const miss=taskProgress(t).rows.filter(r=>!r.m.length);
  const byC={}; miss.forEach(r=>{ const k=canonCircuit(r.s.Circuit)||'—'; (byC[k]=byC[k]||[]).push(r.s['School Name']); });
  const txt=`*${t.Title}* — schools yet to submit (${miss.length})${t['Due Date']?'\nDeadline: '+fmtDate(t['Due Date']):''}\n\n`+Object.keys(byC).sort().map(c=>`_${c} Circuit_\n`+byC[c].sort().map((n,i)=>`${i+1}. ${n}`).join('\n')).join('\n\n');
  navigator.clipboard.writeText(txt).then(()=>toast('List copied. Paste it into WhatsApp.'),()=>{ openModal(`<h3>Copy this list</h3><textarea class="inp" rows="14">${esc(txt)}</textarea><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`); });
}
function exportComp(){
  const t=taskById(S.comp.task);
  csv([['EMIS Code','School','Circuit','Level','Head','Phone','Files','Status','Last upload'],...(S._compRows||[]).map(r=>[r.s['EMIS Code'],r.s['School Name'],canonCircuit(r.s.Circuit),r.s.Level,r.s['Head Name'],r.s.Phone,r.m.length,r.st,r.last?fmtDT(r.last):''])], `${t.Title.replace(/\W+/g,'_')}_status.csv`);
}

function taskModal(id){
  const t=id?taskById(id):{Levels:'All','Allowed Types':'excel,pdf',Status:'Open','Max Files':''};
  const lv=String(t.Levels||'All').split(',').map(x=>x.trim()); const ty=typeList(t['Allowed Types']);
  openModal(`<h3>${id?'Edit request':'New submission request'}</h3>
    <form id="tf">
      <label class="f">Title</label><input class="inp" id="tTitle" value="${esc(t.Title||'')}" placeholder="e.g. Term 1 SBA Assessment Records" required>
      <label class="f">Instructions to schools</label><textarea class="inp" id="tDesc" rows="3" placeholder="What exactly should be uploaded?">${esc(t.Description||'')}</textarea>
      <label class="f">Which schools?</label>
      <div class="checks"><label><input type="checkbox" value="All" data-lv ${lv.includes('All')?'checked':''}> All schools</label>${LEVELS.map(l=>`<label><input type="checkbox" value="${l}" data-lv ${lv.includes(l)?'checked':''}> ${l}</label>`).join('')}</div>
      <label class="f">Accepted file types</label>
      <div class="checks">${Object.keys(TYPE_LABEL).map(k=>`<label><input type="checkbox" value="${k}" data-ty ${ty.includes(k)?'checked':''}> ${TYPE_LABEL[k]}</label>`).join('')}</div>
      <div class="grid2">
        <div><label class="f">Deadline</label><input class="inp" type="date" id="tDue" value="${esc(t['Due Date']||'')}"></div>
        <div><label class="f">Max files per school</label><input class="inp" type="number" min="0" id="tMax" value="${esc(t['Max Files']||'')}" placeholder="No limit"></div>
      </div>
      <label class="f">Status</label><select class="inp" id="tStat"><option ${t.Status==='Open'?'selected':''}>Open</option><option ${t.Status==='Closed'?'selected':''}>Closed</option></select>
      <div class="err" id="terr"></div>
      <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="tb">${id?'Save changes':'Create request'}</button></div>
    </form>`);
  $$('[data-lv]').forEach(c=>c.onchange=()=>{ if(c.value==='All'&&c.checked) $$('[data-lv]').forEach(x=>{ if(x!==c) x.checked=false; }); else if(c.checked) $('[data-lv][value="All"]').checked=false; });
  $$('[data-ty]').forEach(c=>c.onchange=()=>{ if(c.value==='any'&&c.checked) $$('[data-ty]').forEach(x=>{ if(x!==c) x.checked=false; }); else if(c.checked) $('[data-ty][value="any"]').checked=false; });
  $('#tf').onsubmit=async e=>{
    e.preventDefault();
    const levels=$$('[data-lv]:checked').map(x=>x.value), types=$$('[data-ty]:checked').map(x=>x.value);
    if(!levels.length){ $('#terr').textContent='Choose which schools must submit.'; return; }
    if(!types.length){ $('#terr').textContent='Choose at least one file type.'; return; }
    $('#tb').disabled=true;
    try{ await api('saveTask',{task:{'Task ID':id||'',Title:$('#tTitle').value,Description:$('#tDesc').value,Levels:levels.join(','),'Allowed Types':types.join(','),'Due Date':$('#tDue').value,'Max Files':$('#tMax').value,Status:$('#tStat').value}});
      closeModal(); toast(id?'Request updated.':'Request created — schools can now upload.'); loadStaff(true); }
    catch(err){ $('#terr').textContent=err.message; $('#tb').disabled=false; }
  };
}
async function toggleTask(id){
  const t=taskById(id);
  try{ await api('saveTask',{task:Object.assign({},t,{Status:t.Status==='Open'?'Closed':'Open'})}); toast(t.Status==='Open'?'Request closed. Schools can no longer upload.':'Request reopened.'); loadStaff(true); }catch(e){ toast(e.message,true); }
}
async function openFolder(id){ const w=window.open('about:blank'); try{ const r=await api('taskFolder',{taskId:id}); w.location=r.url; }catch(e){ w.close(); toast(e.message,true); } }

async function showPw(kind, id, name){
  openModal(`<h3>Password</h3><p class="muted"><b>${esc(name)}</b> · ${esc(id)}</p><div class="temp" id="pwBox"><span class="spin"></span></div><p class="small muted" id="pwNote"></p>

  try{ const r=await api('revealPassword',{kind,id});
    if(!r.password){ $('#pwBox').textContent='—'; $('#pwNote').textContent='Not available: this password was set before password viewing was switched on. Use Reset password to issue a new one.'; return; }
    $('#pwBox').textContent=r.password; $('#pwNote').textContent=(r.mustChange?'This is a temporary password — they will be asked to change it at next sign-in. ':'This is the password they chose. ')+'This look-up has been recorded in the Activity log.';
    $('#pwCopy').disabled=false; $('#pwCopy').onclick=()=>navigator.clipboard.writeText(`${CONFIG.APP_NAME}\nLogin: ${id}\nPassword: ${r.password}\n${baseUrl()}`).then(()=>toast('Copied.'));

}
