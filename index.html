async function exportLogins(kind){
  try{ const list=await api('revealAll',{kind});
    csv([[kind==='staff'?'Email':'EMIS Code','Name','Circuit',kind==='staff'?'Role':'','Password','Temporary?'],...list.map(r=>[r.login,r.name,canonCircuit(r.circuit),r.role,r.password||'(reset needed)',r.mustChange?'Yes':'No'])], kind==='staff'?'AAN_staff_logins.csv':'AAN_school_logins.csv');
    toast('Logins exported. Keep this file safe — it contains passwords.');
  }catch(e){ toast(e.message,true); }
}
function exportDir(){
  const D=S.dir, rows=D.sel.size?S.data.schools.filter(s=>D.sel.has(String(s['EMIS Code']))):(S._dir||[]);
  csv([['EMIS Code','School Name','Level','Circuit','Ownership','Head Name','Phone','Email','Active','Last Login','Issues'],
    ...rows.map(s=>[s['EMIS Code'],s['School Name'],s.Level,canonCircuit(s.Circuit),OWN(s),s['Head Name'],s.Phone,s.Email,isActive(s)?'Yes':'No',s['Last Login']?fmtDT(s['Last Login']):'',flagsOf(s).map(k=>FLAG_LABEL[k]).join('; ')])],
    `AAN_schools_${D.sel.size?'selected':'list'}.csv`);
}
function schoolModal(emis){
  const s=emis?S.data.schools.find(x=>String(x['EMIS Code'])===String(emis)):{Active:'Yes'};
  const cur=canonCircuit(s.Circuit), opts=[...CONFIG.CIRCUITS, ...(cur&&!CONFIG.CIRCUITS.includes(cur)?[cur]:[])];
  openModal(`<h3>${emis?'Edit school':'Add school'}</h3><form id="sf">
    <div class="grid2"><div><label class="f">EMIS code</label><input class="inp" id="sE" value="${esc(s['EMIS Code']||'')}" required></div>
      <div><label class="f">Circuit</label><select class="inp" id="sC" required><option value="">Choose circuit…</option>${opts.map(c=>`<option ${cur===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
    <label class="f">School name</label><input class="inp" id="sN" value="${esc(s['School Name']||'')}" required>
    <label class="f">Level(s)</label><div class="checks">${LEVELS.map(l=>`<label><input type="checkbox" data-sl value="${l}" ${levelsOf(s).includes(l)?'checked':''}> ${l}</label>`).join('')}</div>
    <div class="grid2"><div><label class="f">Head's name</label><input class="inp" id="sH" value="${esc(s['Head Name']||'')}"></div>
      <div><label class="f">Phone</label><input class="inp" id="sP" value="${esc(s.Phone||'')}"></div></div>
    <div class="grid2"><div><label class="f">Ownership</label><select class="inp" id="sO"><option value="">—</option><option ${OWN(s)==='Public'?'selected':''}>Public</option><option ${OWN(s)==='Private'?'selected':''}>Private</option></select></div>
      <div><label class="f">Active</label><select class="inp" id="sA"><option ${isActive(s)?'selected':''}>Yes</option><option ${isActive(s)?'':'selected'}>No</option></select></div></div>
    <div class="err" id="serr"></div>
    <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="sb">Save</button></div></form>`);
  $('#sf').onsubmit=async e=>{
    e.preventDefault();
    if(!$$('[data-sl]:checked').length){ $('#serr').textContent='Tick at least one level.'; return; }
    $('#sb').disabled=true;
    const name=$('#sN').value, code=$('#sE').value;
    try{
      const r=await api('saveSchool',{school:{originalEmis:emis||'','EMIS Code':code,'School Name':name,Circuit:$('#sC').value,Level:$$('[data-sl]:checked').map(x=>x.value).join('/'),'Head Name':$('#sH').value,Phone:$('#sP').value,Ownership:$('#sO').value,Active:$('#sA').value,Email:s.Email||''}});
      await loadStaff(true);
      if(r&&r.tempPassword) showTemp(name, code, r.tempPassword); else { closeModal(); toast('School saved.'); }
    }catch(err){ $('#serr').textContent=err.message; $('#sb').disabled=false; }
  };
}
function showTemp(name, login, pw){
  openModal(`<h3>Login details</h3><p class="muted">Give these to <b>${esc(name)}</b>. They will be asked to set their own password when they first sign in.</p>
    <div class="small muted">Login: <b>${esc(login)}</b></div><div class="temp">${esc(pw)}</div>
    <div class="modal-actions"><button class="btn" id="cpyT">Copy</button><button class="btn primary" onclick="closeModal()">Done</button></div>`);
  $('#cpyT').onclick=()=>navigator.clipboard.writeText(`${CONFIG.APP_NAME}\nLogin: ${login}\nTemporary password: ${pw}`).then(()=>toast('Copied.'));
}
function resetPw(kind, id, name){
  openModal(`<h3>Reset password?</h3><p class="muted">A new temporary password will be created for <b>${esc(name)}</b>. Their old password will stop working.</p>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="rpb">Reset</button></div>`);
  $('#rpb').onclick=async()=>{ $('#rpb').disabled=true; try{ const r=await api('resetPassword',{kind,id}); showTemp(name,id,r.tempPassword); }catch(e){ closeModal(); toast(e.message,true); } };
}

    e.preventDefault(); $('#ub').disabled=true;
    const name=$('#uN').value, mail=$('#uE').value;

      const rec=REC.Officers.find(r=>normSid(r['Staff ID'])===id), dir=REC.DirStaff.find(r=>normSid(r['Staff ID'])===id); const dg=v=>String(v||'').replace(/\D/g,'').slice(-9);
      const onFile=rec?dg(rec['Telephone Number']):dir?dg(dir.Phone):''; if(onFile&&dg(req.phone)!==onFile) throw new Error('That phone number does not match the one on record for this Staff ID. Use the number you gave before, or ask the EMIS Officer.');
      const ticket='O'+Math.random().toString(36).slice(2); sess[ticket]={officer:rec?rec['Staff ID']:sid};
      let prefill=null; if(!rec&&dir){ const p=String(dir['Full Name']).split(/\s+/); prefill={'First Name':p[0],Surname:p.length>1?p[p.length-1]:'','Other Names':p.slice(1,-1).join(' '),Sex:dir.Gender,'Telephone Number':dir.Phone,'Current Rank':dir.Rank}; }
      return {ticket,staffId:rec?rec['Staff ID']:sid,record:rec?cp(rec):null,prefill,office:cp(OFFICE)}; },
    officerSubmit:req=>{ const t=sess[req.ticket]; if(!t||!t.officer) throw new Error('This form has expired.'); const d=req.data;
      const o={}; OFFDATA.H.forEach(h=>o[h]=d[h]??''); Object.assign(o,OFFICE,{'Staff ID':t.officer}); const nm=[o['First Name'],o['Other Names'],o.Surname].filter(Boolean).join(' ');
      let rec=REC.Officers.find(r=>normSid(r['Staff ID'])===normSid(t.officer)); const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let tl=''; for(let k=0;k<5;k++) tl+=c[Math.floor(Math.random()*c.length)];
      const no='AAN-'+ymd(Date.now()).slice(2).replace(/-/g,'')+'-'+tl;
      Object.assign(o,{'Receipt No':no,'Times Submitted':(rec?Number(rec['Times Submitted'])||1:0)+1,'Updated By':nm+' (self)','Updated At':iso(Date.now())});
      if(rec) Object.assign(rec,o); else { rec=Object.assign({'Record ID':'OFF'+(rid++),'EMIS Code':''},o); REC.Officers.push(rec); }
      const ds={'Full Name':nm,Gender:o.Sex,'Staff ID':t.officer,Rank:o['Current Rank'],Category:/non/i.test(o['Staff Status'])?'Non-teaching':'Teaching','Unit / Schedule':[o.Unit,o['Main Schedule']].filter(Boolean).join(' · '),Phone:o['Telephone Number']};
      const dr=REC.DirStaff.find(r=>normSid(r['Staff ID'])===normSid(t.officer)); if(dr) Object.assign(dr,ds); else REC.DirStaff.push(Object.assign({'Record ID':'DIR'+(rid++),'EMIS Code':''},ds));
      const r={'Receipt No':no,Module:'Officers',Form:'Education officers data',Year:YR,Period:'','EMIS Code':OFFICE['MMDEO EMIS Code'],'School Name':'Asante Akyem North Municipal Education Directorate',Circuit:'','Submitted By':nm+' (Staff ID '+t.officer+')',Role:'OFFICER','Submitted At':iso(Date.now()),Records:1,
        Summary:JSON.stringify([['Officer',nm],['Staff ID',t.officer],['Unit',o.Unit||'—'],['Schedule',o['Main Schedule']||'—'],['Current rank',o['Current Rank']||'—']])}; RCPT.push(r); return {receipt:cp(r),record:cp(rec)}; },
    logExport:req=>{ const s=need(req,['ADMIN','EMIS_OFFICER']); EXPORTS.push({Time:iso(Date.now()),By:s.name,What:req.what,Recipient:req.to,Schools:req.schools,Rows:req.rows}); return true; },
    exportLog:req=>{ need(req,['ADMIN','EMIS_OFFICER','DIRECTOR']); return cp(EXPORTS); },
    saveAutoCheck:req=>{ need(req,['ADMIN','EMIS_OFFICER','CIRCUIT_SUPERVISOR']); const r=subs.find(x=>x['Submission ID']===req.id); if(!r) throw new Error('File not found.'); r['Auto Check']=req.check; r['Auto Remarks']=req.remarks; return true; },
    review:req=>{ const s=need(req,['ADMIN','EMIS_OFFICER','CIRCUIT_SUPERVISOR']); const r=subs.find(x=>x['Submission ID']===req.id); if(!r||!scope(s,r)) throw new Error('File not found.');
      Object.assign(r,{Status:req.status,Remark:req.remark||'',Reviewer:s.name,'Reviewed At':iso(Date.now())}); return true; },
    saveTask:req=>{ const s=need(req,['ADMIN','EMIS_OFFICER']); const t=req.task; if(!String(t.Title||'').trim()) throw new Error('Give the request a title.');
      t['Fills Tab']=fillsM(t).join(','); t.Kind=['upload','form:SchoolReturn','form:Officers'].includes(t.Kind)?t.Kind:'upload'; t.Ownership=['All','Public','Private'].includes(t.Ownership)?t.Ownership:'All';
      const tp=req.template&&req.template.data?{'Template Name':req.template.name,'Template File ID':'tpl'}:req.removeTemplate?{'Template Name':'','Template File ID':''}:null;
      if(tp&&tp['Template Name']&&t['Task ID']) TPL[t['Task ID']]={name:req.template.name,mime:req.template.mime,data:req.template.data};
      const data={'Fills Tab':t['Fills Tab']||'',Kind:t.Kind,Ownership:t.Ownership,Title:t.Title.trim(),Description:t.Description||'',Levels:t.Levels||'All','Allowed Types':t['Allowed Types']||'any','Max Files':Number(t['Max Files'])||0,'Due Date':t['Due Date']||'',Status:t.Status};
      if(tp) Object.assign(data,tp);
      const ex=tasks.find(x=>x['Task ID']===t['Task ID']); if(ex){ Object.assign(ex,data); subs.forEach(x=>{ if(x['Task ID']===ex['Task ID']) x['Task Title']=data.Title; }); return ex['Task ID']; }
      const id='T'+Date.now().toString().slice(-8); tasks.push(Object.assign({'Task ID':id,'Created By':s.name,'Created At':iso(Date.now())},data)); return id; },
    taskFolder:()=>({url:'#'}),
    importSchools:req=>{ need(req,['ADMIN','EMIS_OFFICER']); const o={added:0,updated:0,unchanged:0,newHeads:0,skipped:[]};
      req.rows.forEach(x=>{ const r=schools.find(s=>s['EMIS Code']===x['EMIS Code']); if(!r){ if(!x['School Name']){ o.skipped.push(x['EMIS Code']+': no school name'); return; } schools.push(Object.assign({Active:'Yes','Last Login':''},x)); o.added++; return; }
        const ch=Object.keys(x).filter(k=>x[k]&&String(r[k]||'')!==String(x[k])); if(!ch.length){ o.unchanged++; return; }
        if(ch.includes('Head Staff ID')&&r['Head Staff ID']){ r.pw=null; r.pinSet=false; o.newHeads++; } ch.forEach(k=>r[k]=x[k]); o.updated++; }); return o; },
    saveSchool:req=>{ need(req,['ADMIN','EMIS_OFFICER']); const x=req.school; if(!x['EMIS Code']||!x['School Name']) throw new Error('EMIS code and school name are required.');
      const clash=schools.find(s=>s['EMIS Code']===x['EMIS Code']);
      if(x.originalEmis){ const r=schools.find(s=>s['EMIS Code']===x.originalEmis); if(clash&&clash!==r) throw new Error('Another school already uses that EMIS code.'); ['EMIS Code','School Name','Level','Circuit','Head Name','Phone','Active'].forEach(k=>r[k]=x[k]); return {}; }
      if(clash) throw new Error('EMIS code already exists.'); const pw=tmp(); schools.push(Object.assign({pw,must:true,'Last Login':''},x)); return {tempPassword:pw}; },
    saveUser:req=>{ need(req,['ADMIN']); const x=req.user; x.Email=String(x.Email).toLowerCase(); if(!x.Email||!x['Full Name']) throw new Error('Email and full name are required.');
      if(x.Role==='CIRCUIT_SUPERVISOR'&&!x.Circuit) throw new Error('Circuit supervisors need a circuit.');
      if(x.originalEmail){ const r=users.find(u=>u.Email===x.originalEmail); ['Email','Full Name','Role','Circuit','Phone','Staff ID','Active'].forEach(k=>r[k]=x[k]); return {}; }
      if(users.some(u=>u.Email===x.Email)) throw new Error('That email is already used.'); const pw=tmp(); users.push(Object.assign({pw,must:true},x)); return {tempPassword:pw}; },
    resetPassword:req=>{ need(req,['ADMIN','EMIS_OFFICER']); const r=req.kind==='school'?schools.find(s=>s['EMIS Code']===req.id):users.find(u=>u.Email===req.id); const pw=tmp(); r.pw=pw; r.must=true; return {tempPassword:pw}; }
  };
  return { call: body => new Promise(res => setTimeout(() => {
    try{ const fn=A[body.action]; if(!fn) throw new Error('Unknown action.'); res({ok:true,data:fn(body)}); }
    catch(e){ res({ok:false,error:e.message}); } }, 220)) };
})();

/* ------------------------------ start ------------------------------ */
function applyDeep(){
  if(!S.deep) return;
  if(S.user.role==='SCHOOL') S.tab=S.deep; else S.tab=STAFF_TAB_OF[S.deep]||'home';
  S.deep=null; try{ history.replaceState(null,'',baseUrl()); }catch(e){}
}
(function start(){
  const qp=new URLSearchParams(location.search); S.deep=qp.get('tab'); S.verify=qp.get('receipt');
  if(qp.has('return')){ try{ history.replaceState(null,'',baseUrl()); }catch(e){} S.token=null; renderLogin(); openReturnForm(); return; }
  if(qp.has('pioneers')){ try{ history.replaceState(null,'',baseUrl()); }catch(e){} S.token=null; renderLogin(); openPioneerForm(); return; }
  if(qp.has('officer')){ try{ history.replaceState(null,'',baseUrl()); }catch(e){} S.token=null; renderLogin(); openOfficerForm(); return; }
  if(qp.has('status')){ try{ history.replaceState(null,'',baseUrl()); }catch(e){} S.token=null; renderLogin(); statusModal(); return; }
  if(qp.has('submit')){ const id=qp.get('submit'); try{ history.replaceState(null,'',baseUrl()); }catch(e){} S.token=null; renderLogin(); openWizard(id||''); return; }
  const saved = DEMO ? null : load('fp_session');   // demo data resets on reload, so demo sessions do too
  if(saved && saved.token && !S.verify){ S.token=saved.token; S.user=saved.user; S.mustChange=saved.mustChange; S.mustSetPin=!!saved.mustSetPin; if(S.deep) applyDeep(); boot(); }
  else renderLogin();
})();
</script>
