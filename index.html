<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School File Submission Portal · Asante Akyem North</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#0d2f2a; --navy2:#14453d; --teal:#1a9c7a; --teal-bg:#dff4ec; --indigo:#4f46e5; --gold:#d4a52b; --gold2:#f3e2b3;
  --bg:#f5f4ef; --card:#fff; --line:#e6e1d6; --text:#1c2433; --muted:#5f6b7d;
  --green:#1f7a52; --green-bg:#e3f4ec; --red:#b8322a; --red-bg:#fbe7e5;
  --amber:#9a6412; --amber-bg:#fdf0d8; --blue:#23579a; --blue-bg:#e5eefa; --grey:#5f6b7d; --grey-bg:#eef0f3;
  --radius:12px; --shadow:0 1px 2px rgba(19,33,63,.06),0 4px 16px rgba(19,33,63,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hidden{display:none!important}

/* ---------- buttons, inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cfc7b6}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1405}
.btn.danger{color:var(--red)}
.btn.ok{color:var(--green)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.inp{width:100%;border:1px solid #d9d3c5;border-radius:10px;padding:11px 13px;background:#fff;outline:none}
.inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(19,33,63,.1)}
select.inp{padding:9px 12px}
.pw-wrap{position:relative}
.pw-wrap .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--muted);padding:6px}

/* ---------- pills ---------- */
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.pill.grey{background:var(--grey-bg);color:var(--grey)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:12px;color:var(--muted);margin:2px 4px 2px 0;background:#fff}

/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-hero{background:radial-gradient(circle at 10% 5%,#1d5c50 0,transparent 45%),var(--navy);color:#e8ecf5;padding:56px 72px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-hero::after{content:"";position:absolute;right:-160px;bottom:-160px;width:420px;height:420px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 60px rgba(255,255,255,.02)}
.brand-line{font-family:"Source Serif 4",serif;font-size:20px;color:#c7cfe0}
.brand-line b{color:var(--gold);font-weight:600}
.hero-text h1{font-size:54px;line-height:1.1;color:#fff}
.hero-text h1 em{font-style:normal;color:var(--gold)}
.hero-text p{max-width:470px;font-size:17px;color:#c7cfe0;margin-top:22px}
.hero-text p b{color:var(--gold)}
.hero-foot{font-size:14px;color:#aab4c9}
.hero-foot .caps{letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:8px;font-family:"Source Serif 4",serif}
.auth-main{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-card{width:100%;max-width:520px}
.auth-card h2{font-size:36px;margin-bottom:16px}
.note{border:1px solid #efe6cf;background:#fbf7ec;border-radius:12px;padding:12px 16px;color:var(--muted);font-size:14px}
.note b{color:var(--amber)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;border:1px solid var(--line);border-radius:12px;padding:5px;margin:22px 0 4px;background:#fff}
.seg button{border:0;background:none;padding:11px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.auth-card .submit{width:100%;justify-content:center;padding:14px;font-size:16px;margin-top:22px;border-radius:11px}
.help{font-size:13px;color:var(--muted);text-align:right;margin-top:8px}
.err{color:var(--red);font-size:14px;margin-top:12px;min-height:20px}
.demo{margin-top:22px;border:1px dashed #cdbf98;border-radius:12px;padding:12px 16px;font-size:13px;background:#fffdf6}
.demo table{border-collapse:collapse;width:100%;margin-top:6px}
.demo td{padding:3px 6px 3px 0;vertical-align:top}
.demo code{background:#f3eee0;padding:1px 5px;border-radius:4px;cursor:pointer}
.fab{position:fixed;right:24px;bottom:24px;z-index:20;box-shadow:0 8px 24px rgba(212,165,43,.35);border-radius:14px;padding:13px 22px;font-size:16px}
.pop{position:fixed;right:24px;bottom:86px;z-index:21;width:min(420px,calc(100vw - 32px));background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(19,33,63,.2);padding:18px;max-height:70vh;overflow:auto}
.pop h3{font-family:Inter,sans-serif;font-size:18px}
.pop .item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.pop .item b{display:block}

/* ---------- side menu, profile, chips ---------- */
.hamb{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;width:42px;height:42px;border-radius:11px;font-size:20px;cursor:pointer;flex:none}
.ybadge{display:flex;align-items:center;background:#fff;border-radius:12px;padding:6px 4px;font-weight:700;font-size:14px;white-space:nowrap}
.ybadge span{padding:0 10px}.ybadge span+span{border-left:1px solid var(--line)}
.yb-y{color:#4338ca}.yb-t{color:var(--green)}.yb-m{color:var(--amber)}
.avwrap{position:relative}
.avatar{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:#13213f;color:var(--gold);font-family:"Source Serif 4",serif;font-weight:700;cursor:pointer}
.avmenu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;color:var(--text);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.2);min-width:230px;padding:6px;z-index:40}
.avmenu .avh{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;flex-direction:column}
.avmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:15px}
.avmenu button:hover{background:#f4f6f5}.avmenu .danger{color:var(--red)}
.drawer-bg{position:fixed;inset:0;background:rgba(10,16,30,.45);backdrop-filter:blur(2px);z-index:45}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(330px,88vw);background:#13213f;color:#e8ecf5;z-index:46;transform:translateX(-102%);transition:transform .22s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dr-h{padding:24px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.dr-h b{display:block;font-family:"Source Serif 4",serif;font-size:22px}.dr-h span{color:var(--gold);font-size:14px}
.dr-list{flex:1;overflow:auto;padding:12px}
.dr-i{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:inherit;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left}
.dr-i:hover,.dr-g.on>.dr-i{background:rgba(255,255,255,.08)}
.dr-ic{width:24px;text-align:center}.dr-car{margin-left:auto;transition:.2s}
.dr-g.open .dr-car{transform:rotate(90deg)}
.dr-sub{display:none;margin:2px 0 6px 34px;border-left:1px solid rgba(255,255,255,.12)}
.dr-g.open .dr-sub{display:block}
.dr-sub button{display:block;width:100%;text-align:left;border:0;background:none;color:#c7cfe0;font:inherit;padding:8px 14px;cursor:pointer;border-radius:8px}
.dr-sub button:hover{color:#fff;background:rgba(255,255,255,.06)}
.dr-f{padding:16px;border-top:1px solid rgba(255,255,255,.08)}
.dr-f .btn{background:#2a1520;border-color:#5b2333;color:#ffb4b4;justify-content:center}
.chips-wrap{max-width:1320px;margin:14px auto 0;padding:0 24px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips .cap{margin-right:6px}
.chip-t{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px}
.chip-t.on{background:linear-gradient(135deg,#4f46e5,#6d63e8);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.xlbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.job p{margin:8px 0 14px}
/* ---------- quick submission ---------- */
.quick-cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;cursor:pointer;margin-bottom:22px;padding:16px 18px;border-radius:16px;
  background:linear-gradient(135deg,#f6d77a,var(--gold));color:#1b1405;box-shadow:0 10px 26px rgba(212,165,43,.35);font:inherit}
.quick-cta:hover{filter:brightness(1.03)}
.quick-cta .qi{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.55);display:grid;place-items:center;font-size:22px;flex:none}
.quick-cta b{display:block;font-size:17px}
.quick-cta .small{display:block;color:#4a3a10}
.quick-cta .qgo{margin-left:auto;font-size:28px;font-weight:700}
.modal-card.wiz{max-width:760px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:-4px 0 18px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--muted)}
.step span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--grey-bg)}
.step.on span{background:var(--navy);color:#fff}
.step.done span{background:var(--green);color:#fff}
.step.on small{color:var(--text);font-weight:700}
.qlist{display:grid;gap:10px;max-height:52vh;overflow:auto;padding:2px}
.qcard{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.qcard.sel{cursor:pointer}
.qcard.sel:hover,.qcard.sel:focus{border-color:var(--teal);background:#f6fcf9;outline:none}
.qcard .qt{font-size:17px}
.qcard .qgo{margin-left:auto;color:var(--teal);font-weight:700}
.inp.big{padding:13px 14px;font-size:17px}
.btn.big{padding:12px 20px;font-size:16px}
.drop.big{display:block;padding:30px 18px;border-width:2.5px}
.rc-sum div.str{grid-column:1/-1}
.rc-sum div.str b{font-size:14px;word-break:break-all}
/* ---------- enrolment editor & wide table ---------- */
.eh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#egrid tr.cls-first td{border-top:2px solid var(--line)}
#egrid .gin{width:86px}
.wide-wrap{max-height:70vh;overflow:auto}
.wide-t{font-size:13px}
.wide-t th,.wide-t td{padding:7px 8px;white-space:nowrap}
.wide-t th.grp{text-align:center;border-left:1px solid var(--line);background:#f1f6f3;color:var(--text)}
.wide-t thead tr:first-child th{position:sticky;top:0;z-index:2}
.wide-t thead tr:nth-child(2) th{position:sticky;top:33px;z-index:2}
.wide-t .stick{position:sticky;left:0;background:#fff;z-index:1;min-width:190px;white-space:normal;box-shadow:1px 0 0 var(--line)}
.wide-t thead .stick{z-index:3;background:#faf8f3}
.wide-t td.tcol{background:#f7faf8;border-right:1px solid var(--line)}
.wide-t tfoot td{background:#faf8f3;border-top:2px solid var(--line);position:sticky;bottom:0}
/* ---------- receipts ---------- */
.receipt{border:1px solid var(--line);border-radius:14px;padding:20px;background:#fff;position:relative;overflow:hidden}
.receipt::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--gold),#6d63e8,var(--teal))}
.rc-h{display:flex;gap:12px;align-items:center}
.rc-h .mk{width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.rc-title{margin-top:16px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rc-no{font-family:ui-monospace,monospace;font-size:24px;font-weight:700;letter-spacing:.05em;color:var(--navy)}
.rc-t{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.rc-t td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.rc-t td:first-child{color:var(--muted);width:130px}
.rc-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:14px}
.rc-sum div{background:#f6f9f7;border:1px solid #e1ece6;border-radius:10px;padding:8px 10px}
.rc-sum span{display:block;font-size:12px;color:var(--muted)}
.rc-sum b{font-size:18px}
.rc-link{word-break:break-all;color:var(--text)}
.banner.ok{background:#e9f7f0;border-color:#b9e2cd;color:#155f40}
.banner.bad{background:var(--red-bg);border-color:#f0c2bd;color:var(--red)}
.kbtn{text-align:left;cursor:pointer;font:inherit;color:inherit}
.kbtn.on{border-color:var(--teal);box-shadow:inset 0 3px 0 var(--teal);background:#f3fbf8}
@media print{
  body *{visibility:hidden}
  #receipt,#receipt *{visibility:visible}
  #receipt{position:absolute;left:0;top:0;width:100%;border:0}
  .modal{position:static;background:none}
}
/* ---------- notices, modules ---------- */
.auth-col{width:100%;max-width:520px}
.notices{margin-top:26px;border:1px solid var(--line);background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.nb-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);background:#f7fbf9}
.nb-tabs{margin-left:auto;display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.nb-tabs button{border:0;background:none;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.nb-tabs button.on{background:var(--navy);color:#fff}
.nb-list{max-height:260px;overflow:auto}
.nb-i{padding:11px 14px;border-bottom:1px solid #f0ece2}
.nb-i:last-child{border-bottom:0}
.nb-t{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.upd{display:flex;gap:14px;align-items:flex-start;padding:14px 20px;border-bottom:1px solid #f0ece2}
.upd:last-child{border-bottom:0}
.grid-t .gin{width:96px;text-align:right;padding:7px 9px;border-radius:8px;margin-left:auto;display:block}
.grid-t tfoot td{background:#faf8f3;border-top:2px solid var(--line)}
.modal-card.wide{max-width:820px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:18px}
.g3 .donut{gap:16px}
.g3 .donut svg{width:118px;height:118px}
.nav-row{max-width:1320px;margin:0 auto;padding:0 0 10px}
.nav-row .nav{flex-wrap:wrap;overflow:visible}
/* ---------- app shell ---------- */
.top{background:var(--navy);color:#fff;padding:0 20px;position:sticky;top:0;z-index:30}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:62px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Source Serif 4",serif;font-size:16px;white-space:nowrap}
.logo .mk{width:34px;height:34px;border-radius:9px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:11px;font-family:Inter}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;color:#cfe3dd;font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.nav button:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav button.on{background:var(--teal);color:#fff}
.nav .nb{background:#e0443a;color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:inline-grid;place-items:center}
.right{display:flex;align-items:center;gap:8px;margin-left:auto}
.scope-badge{background:#fff;color:var(--text);border-radius:10px;padding:5px 12px;line-height:1.2;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.scope-badge small{display:block;font-size:10px;letter-spacing:.08em;color:var(--teal);font-weight:700;text-transform:uppercase}
.scope-badge b{font-size:13px}
.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.scopebar-wrap{max-width:1320px;margin:18px auto 0;padding:0 24px}
.scopebar{background:linear-gradient(90deg,#d6eefb,#def5ec);border:1px solid #a9d7ea;border-radius:16px;padding:10px}
.scope-in{background:rgba(255,255,255,.8);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:#8a8f99;display:inline-block;flex:none}
.serif{font-family:"Source Serif 4",serif;font-size:17px}
.scope-dd{position:relative}
.scope-btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid #8fd8bf;background:#fff;border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:14px}
.scope-btn .cnt{background:var(--teal);color:#fff;border-radius:999px;padding:0 8px;font-size:12px;font-weight:700}
.scope-btn .car{color:var(--muted)}
.scope-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:25;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(13,47,42,.18);padding:8px;min-width:270px}
.scope-menu label{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.scope-menu label:hover{background:#f2f8f5}
.sm-h{display:flex;justify-content:space-between;padding:4px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.lnk{border:0;background:none;color:var(--teal);font-weight:700;cursor:pointer;padding:0;font-size:13px}
.own{display:flex;align-items:center;gap:2px;margin-left:auto;background:#fff;border-radius:999px;padding:4px;border:1px solid var(--line)}
.own .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px;font-weight:700}
.own button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.own button.on{background:var(--navy2);color:#fff}
.subtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px;font-weight:600;cursor:pointer;font-size:14px}
.subtabs button.on{background:linear-gradient(90deg,var(--navy2),var(--teal));color:#fff;border-color:transparent}
.card.accent{position:relative;overflow:hidden}
.card.accent::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--gold),#6d63e8,var(--teal))}
.sec-t{display:flex;align-items:center;gap:8px;font-family:"Source Serif 4",serif;font-size:19px;font-weight:700}
.cap{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.donut{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.donut .dv{font-family:"Source Serif 4",serif;font-size:24px;font-weight:700;fill:var(--text)}
.dleg{flex:1;min-width:180px}
.dl{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px}

<body>
<div id="app"><div class="loading"><span class="spin"></span></div></div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toast" class="toast"></div>

<script>
/* =====================================================================
   SETTINGS — paste your Apps Script Web App URL below.
   Leave it empty ('') to run the built-in DEMO with sample data.
   ===================================================================== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxxShJUkv1cKrZGytLTTU4_ccKZ0zyTC4-HsfjSo-a_882QCYQRrkCuk3QmZC9VtkCxkA/exec',
  APP_NAME: 'School File Submission Portal',
  ORG_NAME: 'Asante Akyem North Municipal Education Directorate',
  REGION: 'Ashanti Region',
  MUNICIPALITY: 'Asante Akyem North',
  YEAR: '2026/2027',
  TERM: 'Term 1',     // the term written in returns — change each term (used by the automatic first review)
  RETIRE_AGE: 60,     // compulsory retirement age in the public service
  // enrolment is counted more than once a term — keep the same list as CONFIG.ENROL_PERIODS in Code.gs
  ENROL_PERIODS: ['Term 1 – 1st count','Term 1 – 2nd count','Term 2 – 1st count','Term 2 – 2nd count','Term 3 – 1st count','Term 3 – 2nd count'],   // current academic year — keep the same as CONFIG.YEAR in Code.gs
  CIRCUITS: ['Agogo North','Agogo East','Agogo Central','Agogo West','Owerriman North','Owerriman South','Amantenaman','Ananekrom'],
  MAX_FILE_MB: 15
};

const TYPE_MAP = { excel:['xls','xlsx','xlsm','csv'], pdf:['pdf'], image:['jpg','jpeg','png','webp','heic','gif'], word:['doc','docx'], powerpoint:['ppt','pptx'], any:[] };
const TYPE_LABEL = { excel:'Excel', pdf:'PDF', image:'Photos', word:'Word', powerpoint:'PowerPoint', any:'Any file' };
const ROLE_LABEL = { ADMIN:'Administrator', EMIS_OFFICER:'EMIS Officer', CIRCUIT_SUPERVISOR:'Circuit Supervisor', DIRECTOR:'Director / Management', SCHOOL:'School' };
const LEVELS = ['Nursery','KG','Primary','JHS','SHS'];
const LEVEL_LABEL = { Nursery:'Creche / Nursery', Primary:'Primary (B1–B6)', JHS:'JHS (B7–B9)' };
const DEMO = !CONFIG.API_URL;

const S = { rec:{}, tq:{}, token:null, user:null, mustChange:false, loginKind:'school', tab:'home', homeTab:'snap', scope:null, own:'all', dir:{ q:'', circuit:'', level:'', flag:'', sel:new Set() }, data:null, home:null,
            f:{ task:'', circuit:'', status:'', q:'' }, comp:{ task:'', missing:true, circuit:'' }, schoolQ:'' };

/* ------------------------------ helpers ------------------------------ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(d){ if(!d) return '—'; const x=new Date(d); return isNaN(x)?esc(d):x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDT(d){ if(!d) return '—'; const x=new Date(d); return isNaN(x)?esc(d):x.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function fmtSize(kb){ kb=Number(kb)||0; return kb>=1024?(kb/1024).toFixed(1)+' MB':Math.max(1,Math.round(kb))+' KB'; }
const extOf = n => (String(n).toLowerCase().match(/\.([a-z0-9]+)$/)||[,''])[1];
function kindOf(e){ for(const k of ['excel','pdf','image','word']) if(TYPE_MAP[k].includes(e)) return k; return 'other'; }
function typeList(t){ return String(t||'any').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean); }
function allowedExts(t){ const l=typeList(t); if(!l.length||l.includes('any')) return null; return l.flatMap(k=>TYPE_MAP[k]||[]); }
function levelsMatch(tl, sl){ const t=String(tl||'All').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean); if(!t.length||t.includes('all')) return true; const L=parseLevels(sl).map(x=>x.toLowerCase()); return !L.length||L.some(x=>t.includes(x)); }
function dueInfo(t){
  if(t.Status!=='Open') return {cls:'grey',text:'Closed'};
  if(!t['Due Date']) return {cls:'blue',text:'No deadline'};
  const d=new Date(t['Due Date']+'T23:59:59'); const days=Math.ceil((d-new Date())/864e5);
  if(days<0) return {cls:'red',text:`Overdue · was due ${fmtDate(t['Due Date'])}`};
  if(days<=1) return {cls:'amber',text:days===0?'Due today':'Due tomorrow'};
  if(days<=5) return {cls:'amber',text:`Due in ${days} days`};
  return {cls:'blue',text:'Due '+fmtDate(t['Due Date'])};
}
function agg(subs){ if(!subs.length) return 'Not submitted'; if(subs.some(s=>s.Status==='Rejected')) return 'Rejected'; if(subs.every(s=>s.Status==='Accepted')) return 'Accepted'; return 'Submitted'; }
const PILL = {'Not submitted':'grey','Submitted':'blue','Accepted':'green','Rejected':'red','Open':'green','Closed':'grey','Yes':'green','No':'grey'};
const pill = s => `<span class="pill ${PILL[s]||'grey'}">${esc(s==='Submitted'?'Awaiting review':s)}</span>`;
const isLate = (sub, task) => task && task['Due Date'] && new Date(sub['Submitted At']) > new Date(task['Due Date']+'T23:59:59');
const can = { manage: r => ['ADMIN','EMIS_OFFICER'].includes(r), review: r => ['ADMIN','EMIS_OFFICER','CIRCUIT_SUPERVISOR'].includes(r) };

function toast(msg, bad){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':''); clearTimeout(t._h); t._h=setTimeout(()=>t.className='toast',3200); }
function openModal(html){ $('#modalCard').innerHTML=html; $('#modal').classList.remove('hidden'); const f=$('#modalCard input,#modalCard textarea,#modalCard select'); if(f) f.focus(); }
function closeModal(){ $('#modal').classList.add('hidden'); $('#modalCard').innerHTML=''; $('#modalCard').className='modal-card'; }
$('#modal').addEventListener('mousedown', e => { if(e.target.id==='modal' && !S.mustChange && !S.mustSetPin) closeModal(); });
function store(k,v){ try{ v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(sessionStorage.getItem(k)); }catch(e){ return null; } }
function csv(rows, name){
  const txt = rows.map(r=>r.map(v=>{ v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\n');
  saveBlob(new Blob(['﻿'+txt],{type:'text/csv'}), name);
}
function saveBlob(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); }
function b64ToBlob(b64, mime){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime||'application/octet-stream'}); }
const readB64 = file => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(new Error('Could not read '+file.name)); r.readAsDataURL(file); });

/* ------------------------------ API ------------------------------ */
async function api(action, payload={}){
  const body = Object.assign({ action, token:S.token }, payload);
  let j;
  if(DEMO){ j = await Mock.call(body); }
  else {
    let res, txt='';
    try{ res = await fetch(CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), cache:'no-store' }); txt = await res.text(); }
    catch(e){ throw new Error('Could not reach the server. Check your internet connection and try again.'); }
    try{ j = JSON.parse(txt); }
    catch(e){ console.error('['+action+'] server reply:', txt); throw new Error(`The server sent an unexpected reply to “${action}”. Make sure the latest Code.gs is deployed as a new version.`); }
  }
  if(!j || !j.ok){
    if(j && j.error==='SESSION_EXPIRED'){ signOut(true); throw new Error('Your session expired. Please sign in again.'); }
    if(j && j.error==='SET_PIN'){ S.mustSetPin=true; setPinModal(); throw new Error('Choose your PIN first.'); }
    throw new Error((j&&j.error)||'Something went wrong.');
  }
  if(!('data' in j)) { console.error('['+action+'] reply without data:', j); throw new Error(`The server returned no data for “${action}”. Make sure the latest Code.gs is deployed as a new version.`); }
  return j.data;
}

// error box with a Try again button (keeps the real message so problems can be reported)
function showErr(e, retry){
  const v=$('#view'); if(!v) return;
  v.innerHTML=`<div class="card" style="max-width:640px;margin:40px auto"><div class="card-b" style="text-align:center">

const pending = {};
function wireUpload(t){
  const id=t['Task ID'], drop=$(`[data-drop="${id}"]`); if(!drop) return;
  const inp=$(`[data-inp="${id}"]`), ex=allowedExts(t['Allowed Types']);
  pending[id]=[];
  const add = files => {
    for(const f of files){
      const e=extOf(f.name);
      if(ex && !ex.includes(e)){ toast(`${f.name}: .${e} files are not accepted here.`, true); continue; }
      if(f.size > CONFIG.MAX_FILE_MB*1048576){ toast(`${f.name} is larger than ${CONFIG.MAX_FILE_MB} MB.`, true); continue; }
      if(!f.size){ toast(`${f.name} is empty.`, true); continue; }
      pending[id].push(f);
      if(/\.(xlsx|xlsm|xls|csv)$/i.test(f.name)) autoCheckFile(f,{emis:S.user.emis, mod:t['Fills Tab']}).then(r=>{ f._ac=r; if(pending[id].includes(f)) drawQueue(id); }); else f._ac=null;
    }
    drawQueue(id);
  };
  drop.onclick = () => inp.click();
  inp.onchange = () => { add(inp.files); inp.value=''; };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); add(e.dataTransfer.files); };
  $(`[data-go="${id}"]`).onclick = () => doUpload(t);
}
function drawQueue(id){
  const q=pending[id];
  $(`[data-q="${id}"]`).innerHTML = q.map((f,i)=>`<div class="q"><span>${esc(f.name)} <span class="muted">(${fmtSize(f.size/1024)})</span></span><span data-st="${id}-${i}"><a href="#" onclick="pending['${id}'].splice(${i},1);drawQueue('${id}');return false">remove</a></span></div>${f._ac?acBox(f._ac,'Portal check of this file'):''}`).join('');
  $(`[data-up="${id}"]`).classList.toggle('hidden', !q.length);
}
async function doUpload(t){
  const id=t['Task ID'], q=pending[id], btn=$(`[data-go="${id}"]`), note=$(`[data-note="${id}"]`).value;
  if(!q.length) return;
  btn.disabled=true; let ok=0; const ids=[];
  for(let i=0;i<q.length;i++){
    const cell=$(`[data-st="${id}-${i}"]`); cell.innerHTML='<span class="spin"></span> uploading…';
    btn.innerHTML=`<span class="spin"></span> Uploading ${i+1} of ${q.length}`;
    try{
      const data=await readB64(q[i]);
      const f=q[i]; if(f._ac===undefined) f._ac=await autoCheckFile(f,{emis:S.user.emis, mod:t['Fills Tab']});
      const r=await api('upload',{ taskId:id, fileName:f.name, mimeType:f.type, data, note, autoCheck:(f._ac||{}).check||'', autoRemarks:((f._ac||{}).remarks||[]).join('\n') }); if(r&&r['Submission ID']) ids.push(r['Submission ID']);
      cell.innerHTML='<span style="color:var(--green)">✓ done</span>'; ok++;
    }catch(e){ cell.innerHTML=`<span style="color:var(--red)">✗ ${esc(e.message)}</span>`; }
  }
  toast(ok===q.length?`${ok} file${ok>1?'s':''} submitted.`:`${ok} of ${q.length} uploaded — check the errors.`, ok!==q.length);
  const fill=t['Fills Tab'];
  if(ok&&fill&&XL[fill]){ const xf=q.find(f=>/\.(xlsx|xlsm|xls|csv)$/i.test(f.name));
    if(xf){ try{ const P=xlParse(fill, await xlRead(xf), S.user.emis, true);
        if(P.rows.length){ await api('recSaveMany',{module:fill, replace:true, rows:P.rows.map(r=>Object.assign({},r,{'EMIS Code':S.user.emis,Year:S.year||CONFIG.YEAR}))}); delete S.rec[fill];
          try{ const rc=await api('recSubmit',{module:fill}); (S.receipts=S.receipts||[]).push(rc); }catch(e){}
          toast(`${P.rows.length} record(s) were filled into your ${FORMS[fill]||fill}.`); }
      }catch(e){ toast('Your file was received, but it could not be read into '+(FORMS[fill]||fill)+': '+e.message,true); } } }
  if(ok===q.length){ pending[id]=[]; await loadSchool();
    try{ const rc=await api('fileReceipt',{taskId:id, ids}); (S.receipts=S.receipts||[]).push(rc); showReceipt(rc); }catch(e){} }
  else { btn.disabled=false; btn.textContent='⬆ Upload files'; }
}

function fillAllModal(taskId){
  const t=taskById(taskId), def=t['Fills Tab']&&XL[t['Fills Tab']]?t['Fills Tab']:'SchoolStaff';
  const latest={}; S.data.submissions.filter(s=>s['Task ID']===taskId&&isXl(s)&&s.Status!=='Rejected').forEach(s=>{ const e=String(s['EMIS Code']); if(!latest[e]||String(s['Submitted At'])>String(latest[e]['Submitted At'])) latest[e]=s; });
  const list=Object.values(latest).sort((a,b)=>String(a['School Name']).localeCompare(b['School Name']));
  openModal(`<h3>Fill a tab from all files</h3><p class="muted small"><b>${esc(t.Title)}</b> · ${list.length} school(s) sent an Excel file (returned files are left out). Each school's latest file replaces that school's list.</p>
    <label class="f">Fill this tab</label><select class="inp" id="faM">${FILLABLE().map(k=>`<option value="${k}" ${k===def?'selected':''}>${esc(FORMS[k])}</option>`).join('')}</select>
    <label class="checks" style="margin-top:8px"><input type="checkbox" id="faSkip" checked> Skip schools that already have records in this tab</label>
    <div class="tbl-wrap" style="margin-top:10px;max-height:320px"><table class="t"><thead><tr><th>School</th><th>File</th><th>Result</th></tr></thead><tbody>
      ${list.map((s,i)=>`<tr><td><b>${esc(s['School Name'])}</b><div class="small muted">${esc(s['EMIS Code'])}</div></td><td class="small">${esc(s['File Name'])}</td><td class="small" id="fa${i}">—</td></tr>`).join('')}</tbody></table></div>
    <div class="err" id="faErr"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" id="faGo" ${list.length?'':'disabled'}>Fill ${list.length} school(s)</button></div>`);
  $('#modalCard').classList.add('wide');
  $('#faGo').onclick=async()=>{
    const b=$('#faGo'), mod=$('#faM').value; b.disabled=true; let ok=0, n=0;
    let have=new Set(); if($('#faSkip').checked){ try{ await recLoad(mod,true); have=new Set((S.rec[mod]||[]).map(r=>String(r['EMIS Code']))); }catch(e){} }
    for(let i=0;i<list.length;i++){ const s=list[i], c=$('#fa'+i); b.innerHTML=`<span class="spin"></span> ${i+1} of ${list.length}…`;
      if(have.has(String(s['EMIS Code']))){ c.innerHTML='<span class="muted">already filled — skipped</span>'; continue; }
      c.innerHTML='<span class="spin"></span>';
      try{ const P=await subToRows(s, mod); if(!P.rows.length) throw new Error('no rows found'+(P.errors[0]?' — '+P.errors[0]:''));
        await saveFromSub(s, mod, P); ok++; n+=P.rows.length; c.innerHTML=`<span style="color:var(--green)">✓ ${P.rows.length} record(s)</span>${P.errors.length?` <span class="muted">· ${P.errors.length} skipped</span>`:''}`; }
      catch(e){ c.innerHTML=`<span style="color:var(--red)">✗ ${esc(e.message)}</span>`; } }
    b.textContent='Done'; b.onclick=()=>{ closeModal(); renderStaff(); }; b.disabled=false;
    toast(`${ok} school(s) filled · ${n} record(s) saved to ${FORMS[mod]}.`);
  };
}

async function recLoad(mod, force){
  if(!force && S.rec[mod] && !(mod==='Enrolment'&&S._enPartial)) return S.rec[mod];
  const r=await api('recList', mod==='Enrolment'?{module:mod, period:'all'}:{module:mod});
  if(!r || !Array.isArray(r.rows)){ console.error('recList '+mod+' reply:', r); throw new Error(`The ${(MODS[mod]||{}).label||mod} data could not be loaded (unexpected server reply). Make sure the latest Code.gs is deployed as a new version.`); }
  if(mod==='Enrolment'){ r.rows.forEach(x=>{ x.Class=canonClass(x.Class); x.Level=(CLASSES.find(c=>c[0]===x.Class)||[])[1]||x.Level; }); S._enPartial=false; }
  S.rec[mod]=r.rows; S.year=r.year; if(r.period){ S.period=r.period; S.periods=r.periods; } return r.rows;
}
function scopedRecs(mod){
  const set=new Set(scoped().schools.map(s=>String(s['EMIS Code'])));
  return (S.rec[mod]||[]).filter(r=>{ const e=String(r['EMIS Code']||'').trim(); return e?set.has(e):true; });
}
function cell(k, r){
  const v=r[k];
  if(k==='Date of Birth'){ const a=ageOf(v); return v?`${fmtDate(v)}${a!=null?` <span class="muted">(${a})</span>`:''}`:'—'; }
  if(k==='Amount (GHS)') return v===''||v==null?'—':ghs(v);
  if(k==='Percent Complete') return `<div style="display:flex;align-items:center;gap:8px;min-width:110px"><span class="bar" style="flex:1"><i style="width:${Math.min(100,num(v))}%"></i></span><span class="small">${num(v)}%</span></div>`;
  if(['Status','Condition','Category'].includes(k)) return v?pill(v):'—';
  if(/Date|Completion/.test(k)) return v?fmtDate(v):'—';
  if(k==='Class') return esc(CLASS_LABEL(v));
  return v===''||v==null?'<span class="muted">—</span>':esc(v);
}

  const input = f => { const v=rec[f.k]??''; const a=`class="inp" data-f="${esc(f.k)}" ${f.req?'required':''}`;

    if(f.t==='area') return `<textarea ${a} rows="3">${esc(v)}</textarea>`;
    if(f.t==='date') return `<input type="date" ${a} value="${esc(String(v).slice(0,10))}">`;
    if(f.t==='num') return `<input type="number" min="0" step="any" ${a} value="${esc(v)}">`;
    return `<input ${a} value="${esc(v)}" placeholder="${esc(f.ph||'')}">`; };
  openModal(`<h3>${rec['Record ID']?'Edit':'Add'} — ${esc(M.label)}</h3><form id="rf">
    ${needSchool?`<label class="f">School${M.who==='optional'||M.who==='both'?' <span class="muted small">(leave blank for a Municipal-wide project)</span>':''}</label>
      <input class="inp" list="schList" id="rfS" value="${esc(emis)}" placeholder="Type school name or EMIS code" ${M.who==='school'?'required':''}>
      <datalist id="schList">${S.data.schools.map(s=>`<option value="${esc(s['EMIS Code'])}">${esc(s['School Name'])} · ${esc(canonCircuit(s.Circuit))}</option>`).join('')}</datalist>`:''}
    <div class="grid2">${M.fields.map(f=>`<div style="${f.t==='area'||f.k==='Notes'||f.k==='Project Title'||f.k==='Title'?'grid-column:1/-1':''}"><label class="f">${esc(f.k)}${f.req?' *':''}</label>${input(f)}</div>`).join('')}</div>
    <div class="err" id="rferr"></div>
    <div class="modal-actions">${rec['Record ID']?`<button type="button" class="btn danger" id="rfDel" style="margin-right:auto">Delete</button>`:''}<button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="rfb">Save</button></div></form>`);
  if(needSchool){ const i=$('#rfS'); i.addEventListener('input',()=>{ const m=S.data.schools.find(s=>(s['School Name']+'').toLowerCase()===i.value.toLowerCase()); if(m) i.value=m['EMIS Code']; }); }
  $('#rf').onsubmit=async e=>{
    e.preventDefault();
    const row={'Record ID':rec['Record ID']||''}; $$('[data-f]',$('#rf')).forEach(x=>row[x.dataset.f]=x.value);
    if(needSchool){ row['EMIS Code']=$('#rfS').value.trim();
      if(row['EMIS Code'] && !S.data.schools.some(s=>String(s['EMIS Code'])===row['EMIS Code'])){ $('#rferr').textContent='Choose a school from the list.'; return; } }
    if(row['Start Date']&&row['End Date']&&row['End Date']<row['Start Date']){ $('#rferr').textContent='End date is before the start date.'; return; }
    $('#rfb').disabled=true;
    try{ await api('recSave',{module:mod,row}); await recLoad(mod,true); closeModal(); toast('Saved.'); S.rerender&&S.rerender(); }
    catch(err){ $('#rferr').textContent=err.message; $('#rfb').disabled=false; }
  };
  if($('#rfDel')) $('#rfDel').onclick=()=>recDeleteAsk(mod, rec);
}

function wireGrid(mod, sch, after){
  const M=MODS[mod], tbl=$('#grid'); if(!tbl) return;
  const calc=()=>{ let tt=0; const tc={}; $$('tbody tr',tbl).forEach(tr=>{ let t=0; $$('.gin',tr).forEach(i=>{ const v=num(i.value); tc[i.dataset.c]=(tc[i.dataset.c]||0)+v; if(M.totalCols.includes(i.dataset.c)) t+=v; }); $('.gt',tr).textContent=t.toLocaleString(); tt+=t; });
    $$('[data-tc]',tbl).forEach(b=>b.textContent=(tc[b.dataset.tc]||0).toLocaleString()); $('#gtt').textContent=tt.toLocaleString(); };
  $$('.gin',tbl).forEach(i=>i.oninput=calc); calc();
  const b=$('#gsave'); if(!b) return;
  b.onclick=async()=>{
    const rows=$$('tbody tr',tbl).map(tr=>{ const o={'EMIS Code':sch.emis, Year:S.year||CONFIG.YEAR, [M.keyField]:tr.dataset.k}; $$('.gin',tr).forEach(i=>o[i.dataset.c]=num(i.value)); return o; });
    if($$('.gin',tbl).some(i=>i.value!==''&&(Number(i.value)<0||!Number.isFinite(Number(i.value))))){ toast('Use whole numbers of zero or more.',true); return; }
    b.disabled=true; b.innerHTML='<span class="spin"></span> Saving…';
    try{ const res=await api('recSaveMany',{module:mod,rows}); await recLoad(mod,true); if(mod==='Enrolment'&&S.data){ S.data.enrolment=S.rec.Enrolment; }
      if(res&&res.receipt) (S.receipts=S.receipts||[]).push(res.receipt);
      if(after) await after(); if(res&&res.receipt) showReceipt(res.receipt); else toast(M.label+' saved.'); }
    catch(e){ toast(e.message,true); b.disabled=false; b.textContent='Save'; }
  };
}

  S.tq=S.tq||{}; const q=(S.tq[key]||'').toLowerCase();
  const list=q?rows.filter(r=>cols.map(c=>r[c.k]).concat([r['School Name'],r['Circuit'],r['EMIS Code']]).join(' ').toLowerCase().includes(q)):rows;

async function loadNotices(){

    const items=r.updates.map(u=>({st:updState(u), type:u.Type||'Notice', title:u.Title, msg:u.Message, s:u['Start Date'], e:u['End Date']}))
      .concat(r.tasks.map(t=>({st:'Ongoing', type:'File request', title:t.Title, msg:'Upload in the portal under File submissions.', e:t['Due Date']})))
      .filter(x=>x.st!=='Past');

function enrolAgg(rows){ const o={B:sum(rows,'Boys'),G:sum(rows,'Girls')}; o.T=o.B+o.G; return o; }
const gpi = a => a.B?(a.G/a.B).toFixed(2):'—';
const OLD_CLASS = {P1:'B1',P2:'B2',P3:'B3',P4:'B4',P5:'B5',P6:'B6',JHS1:'B7',JHS2:'B8',JHS3:'B9'};
const canonClass = c => OLD_CLASS[c]||c;
const classOrder = c => { const i=CLASSES.findIndex(x=>x[0]===c); return i<0?99:i; };
const curPeriod = () => S.period||(S.periods||CONFIG.ENROL_PERIODS)[0];
const periodOf = r => r.Period||(S.periods||CONFIG.ENROL_PERIODS)[0];
// enrolment for the current collection round (used by Home, Staff PTR, Classrooms)
const enrolNow = () => scopedRecs('Enrolment').filter(r=>periodOf(r)===curPeriod());
const PERIODS = () => S.periods||CONFIG.ENROL_PERIODS;

/* ---- editor (schools, and Admin/EMIS Officer on a school's behalf) ---- */
function enrolStart(sch, period){
  const mine=(S.rec.Enrolment||[]).filter(r=>String(r['EMIS Code'])===String(sch.emis)&&periodOf(r)===period);
  let rows=mine.map(r=>({Class:r.Class, Stream:r.Stream||'', Boys:r.Boys, Girls:r.Girls}));
  if(!rows.length){ const lv=levelsOf({Level:sch.Level}); rows=CLASSES.filter(([,l])=>lv.length?lv.includes(l):l!=='Nursery'&&l!=='SHS').map(([c])=>({Class:c,Stream:'',Boys:'',Girls:''})); }
  return rows.sort((a,b)=>classOrder(a.Class)-classOrder(b.Class)||String(a.Stream).localeCompare(String(b.Stream)));
}
function enrolEditorHTML(sch, period){
  const E=S.eEdit, rows=E.rows, idx=PERIODS().indexOf(period);
  const prev=PERIODS().slice(0,idx).reverse().find(p=>(S.rec.Enrolment||[]).some(r=>String(r['EMIS Code'])===String(sch.emis)&&periodOf(r)===p));
  const mine=(S.rec.Enrolment||[]).filter(r=>String(r['EMIS Code'])===String(sch.emis)&&periodOf(r)===period);
  const last=mine.map(r=>r['Updated At']).filter(Boolean).sort().pop();
  const lastBy=last&&mine.find(r=>r['Updated At']===last)['Updated By'];
  const missing=CLASSES.filter(([c])=>!rows.some(r=>r.Class===c));
  const hasNursery=rows.some(r=>CLASSES.find(x=>x[0]===r.Class)?.[1]==='Nursery');
  let html=`<div class="eh"><span class="pill blue">${esc(S.year||CONFIG.YEAR)}</span><span class="pill amber">Round: ${esc(period)}</span>
      ${prev&&!mine.length?`<button class="btn sm" id="eCopy">Copy figures from “${esc(prev)}”</button>`:''}
      <span style="margin-left:auto"></span>
      ${!hasNursery?`<button class="btn sm" id="eNur">＋ Creche / Nursery classes</button>`:''}
      <select class="inp" id="eAdd" style="width:auto;padding:6px 10px"><option value="">＋ Add a class…</option>${missing.map(([c])=>`<option value="${c}">${esc(CLASS_LABEL(c))}</option>`).join('')}</select></div>
    <div class="tbl-wrap"><table class="t grid-t" id="egrid"><thead><tr><th>Class</th><th>Stream</th><th class="num">Male</th><th class="num">Female</th><th class="num">Total</th><th></th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const first=i===0||rows[i-1].Class!==r.Class, lastOfClass=i===rows.length-1||rows[i+1].Class!==r.Class, multi=rows.filter(x=>x.Class===r.Class).length>1;
    html+=`<tr data-i="${i}" class="${first?'cls-first':''}"><td>${first?`<b>${esc(CLASS_LABEL(r.Class))}</b><div class="small muted">${esc((CLASSES.find(x=>x[0]===r.Class)||[])[1]||'')}</div>`:''}</td>
      <td>${multi?`<input class="inp gin" style="width:64px;text-align:center" data-k="Stream" value="${esc(r.Stream)}" maxlength="3" aria-label="Stream">`:'<span class="muted small">single</span>'}</td>
      <td class="num"><input type="number" min="0" step="1" inputmode="numeric" class="inp gin" data-k="Boys" value="${esc(r.Boys)}" placeholder="0" aria-label="${esc(CLASS_LABEL(r.Class)+' '+r.Stream+' boys')}"></td>
      <td class="num"><input type="number" min="0" step="1" inputmode="numeric" class="inp gin" data-k="Girls" value="${esc(r.Girls)}" placeholder="0" aria-label="${esc(CLASS_LABEL(r.Class)+' '+r.Stream+' girls')}"></td>
      <td class="num"><b class="gt">0</b></td>
      <td style="white-space:nowrap">${lastOfClass?`<button class="btn sm" data-addst="${esc(r.Class)}" title="Split this class into streams A, B, …">＋ Stream</button>`:''}<button class="btn sm danger" data-rm="${i}" title="Remove">✕</button></td></tr>`;
  });
  html+=`</tbody><tfoot><tr><td colspan="2"><b>Total</b> <span class="small muted">(${new Set(rows.map(r=>r.Class)).size} classes · ${rows.length} streams/rows)</span></td><td class="num"><b id="eB">0</b></td><td class="num"><b id="eG">0</b></td><td class="num"><b id="eT">0</b></td><td></td></tr></tfoot></table></div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap"><span class="small muted">${last?`Last saved ${fmtDT(last)} by ${esc(lastBy)}`:`Not filled in yet for ${esc(period)}.`}</span><span style="margin-left:auto"></span>
      ${canEdit('Enrolment')?`<button class="btn primary" id="eSave">Save &amp; get receipt</button>`:''}</div>`;
  return html;
}
function wireEnrolEditor(sch, period, host, after){
  const E=S.eEdit, read=()=>$$('#egrid tbody tr').forEach(tr=>{ const r=E.rows[+tr.dataset.i]; $$('.gin',tr).forEach(i=>r[i.dataset.k]=i.dataset.k==='Stream'?i.value.toUpperCase().trim():i.value); });
  const redraw=()=>{ host.innerHTML=enrolEditorHTML(sch,period); wireEnrolEditor(sch,period,host,after); };
  const calc=()=>{ let B=0,G=0; $$('#egrid tbody tr').forEach(tr=>{ const b=num($('[data-k=Boys]',tr).value), g=num($('[data-k=Girls]',tr).value); B+=b; G+=g; $('.gt',tr).textContent=(b+g).toLocaleString(); });
    $('#eB').textContent=B.toLocaleString(); $('#eG').textContent=G.toLocaleString(); $('#eT').textContent=(B+G).toLocaleString(); };
  $$('#egrid .gin').forEach(i=>i.oninput=calc); calc();
  $$('[data-addst]').forEach(b=>b.onclick=()=>{ read(); const c=b.dataset.addst, same=E.rows.filter(r=>r.Class===c);
    if(same.length===1&&!same[0].Stream) same[0].Stream='A';
    const used=same.map(r=>r.Stream); const next='ABCDEFGH'.split('').find(x=>!used.includes(x))||String(same.length+1);
    const at=E.rows.lastIndexOf(same[same.length-1]); E.rows.splice(at+1,0,{Class:c,Stream:next,Boys:'',Girls:''}); redraw(); });
  $$('[data-rm]').forEach(b=>b.onclick=()=>{ read(); const r=E.rows[+b.dataset.rm]; E.rows.splice(+b.dataset.rm,1);
    const left=E.rows.filter(x=>x.Class===r.Class); if(left.length===1) left[0].Stream=''; redraw(); });
  const add=cs=>{ read(); cs.forEach(c=>{ if(!E.rows.some(r=>r.Class===c)) E.rows.push({Class:c,Stream:'',Boys:'',Girls:''}); }); E.rows.sort((a,b)=>classOrder(a.Class)-classOrder(b.Class)||String(a.Stream).localeCompare(String(b.Stream))); redraw(); };
  if($('#eNur')) $('#eNur').onclick=()=>add(['CRECHE','N1','N2']);
  $('#eAdd').onchange=e=>{ if(e.target.value) add([e.target.value]); };
  if($('#eCopy')) $('#eCopy').onclick=()=>{ const idx=PERIODS().indexOf(period); const prev=PERIODS().slice(0,idx).reverse().find(p=>(S.rec.Enrolment||[]).some(r=>String(r['EMIS Code'])===String(sch.emis)&&periodOf(r)===p));
    E.rows=enrolStart(sch,prev); redraw(); toast('Figures copied from '+prev+'. Check and correct them, then save.'); };
  const sv=$('#eSave'); if(!sv) return;
  sv.onclick=async()=>{
    read();
    const rows=E.rows.filter(r=>r.Class);
    for(const c of new Set(rows.map(r=>r.Class))){ const st=rows.filter(r=>r.Class===c);
      if(st.length>1){ st.forEach((r,i)=>{ if(!r.Stream) r.Stream='ABCDEFGH'[i]; }); if(new Set(st.map(r=>r.Stream)).size<st.length){ toast(`${CLASS_LABEL(c)}: each stream needs a different letter.`,true); return; } } }
    if(rows.some(r=>[r.Boys,r.Girls].some(v=>v!==''&&(Number(v)<0||!Number.isInteger(Number(v)))))){ toast('Use whole numbers of zero or more.',true); return; }
    const doSave=async declared=>{
    sv.disabled=true; sv.innerHTML='<span class="spin"></span> Saving…';
    try{

const SLEVELS = [['KG','KG'],['Primary','Primary'],['JHS','JHS'],['Head','Headteachers'],['None','Not stated / whole school']];
function staffLevel(r){
  const lt=String(r['Level Taught']||''), x=lt||String(r['Class / Subject / Schedule']||'')+' '+String(r['Classes Taught']||'');
  if(/head\s*teacher/i.test(lt)) return 'Head';
  if(/\bKG|kinder|nursery|creche/i.test(x)) return 'KG';
  if(/\bJHS|basic\s*[789]\b|\bB[789]\b|\bjs\s*[123]/i.test(x)) return 'JHS';
  if(/primary|basic\s*[1-6]\b|\bB[1-6]\b|\bP[1-6]\b|class\s*[1-6]\b/i.test(x)) return 'Primary';
  return 'None';
}

function parseDate(v){
  if(!v) return ''; v=String(v).trim(); let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(m && +m[2]<=12 && +m[1]<=31) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}

  const rd=new Date(b); rd.setFullYear(b.getFullYear()+CONFIG.RETIRE_AGE);

}

/* ============================== QUICK SUBMISSION (no sign-in) ==============================
   Step 1 choose the request · Step 2 your details · Step 3 choose the file(s) · Step 4 receipt */
const QW = {};
const QSTEPS = ['Choose what to submit','Your details','Choose your file','Receipt'];
function qwMe(){ try{ return JSON.parse(localStorage.getItem('qw_me')||'{}'); }catch(e){ return {}; } }
function qwRemember(o){ try{ localStorage.setItem('qw_me', JSON.stringify(o)); }catch(e){} }
async function openWizard(taskId, replaceId){
  Object.assign(QW,{replaceId:replaceId||null, step:1, task:null, tasks:null, err:'', ticket:null, info:null, files:[], ids:[], receipt:null, busy:false, decl:{}, imp:null});
  openModal('<div id="qw"></div>'); $('#modalCard').classList.add('wide','wiz'); drawWiz();
  try{ QW.tasks=await api('publicTasks'); }catch(e){ QW.err=e.message; }
  if(taskId&&QW.tasks){ const t=QW.tasks.find(x=>x['Task ID']===taskId); if(t){ QW.task=t; QW.step=2; } }
  drawWiz();
}
async function dlTemplate(taskId){

  try{ const f=await api('publicTemplate',{taskId}); saveBlob(b64ToBlob(f.data,f.mime), f.name); toast('Template downloaded — fill it in, save it, then upload it here.'); }
  catch(e){ toast(e.message,true); }
}
function qTaskCard(t, selectable){

    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">${typeList(t['Allowed Types']).map(k=>`<span class="chip">${esc(TYPE_LABEL[k]||k)}</span>`).join('')}

      ${QW.replaceId&&(i.files||[]).some(f=>f.id===QW.replaceId&&f.status!=='Rejected')?`<div class="banner" style="margin-bottom:10px">↻ Your corrected file will <b>replace</b> the file you just sent.</div>`:''}
      ${(i.files||[]).some(f=>f.status==='Rejected')?`<div class="banner bad" style="margin-bottom:10px">↻ Your new file will <b>replace</b> the returned file${(i.files||[]).filter(f=>f.status==='Rejected').length>1?'s':''} below — you don't need to delete anything.</div>`:''}

      <label class="drop big" id="qDrop"><input type="file" id="qIn" class="hidden" multiple ${ex?`accept="${ex.map(e=>'.'+e).join(',')}"`:''}>
        <div style="font-size:34px">📄</div><b>Tap here to choose your file</b><div class="small muted">or drag it here · ${ex?ex.map(e=>'.'+e).join(' '):'any file'} · up to ${CONFIG.MAX_FILE_MB} MB${max?` · up to ${max} file${max>1?'s':''}`:''}</div></label>
      <div class="queue" id="qQ">${QW.files.map((f,k)=>`<div class="q"><span>📎 ${esc(f.name)} <span class="muted">(${fmtSize(f.size/1024)})</span></span><span id="qs${k}">${QW.busy?'':`<a href="#" data-qrm="${k}">remove</a>`}</span></div>${f._ac===undefined?'':f._ac===null?'':acBox(f._ac,'Portal check of this file')+(f._ac.sev==='red'?'<div class="small" style="color:var(--red);margin:-4px 0 8px">Please correct the file and choose it again (tap “remove”), or submit it anyway — the EMIS Office will see these findings.</div>':'')}${f._ac===undefined&&/\.(xlsx|xlsm|xls|csv)$/i.test(f.name)?'<div class="small muted" style="margin:-2px 0 8px"><span class="spin"></span> Checking the file…</div>':''}`).join('')}</div>
      ${t['Fills Tab']&&DECL[t['Fills Tab']]?declHTML(t['Fills Tab'],'qw',QW.decl||{}):''}
      <label class="f">Message to the Directorate (optional)</label><input class="inp" id="qNote" value="${esc(QW.note||'')}">
      <div class="err" id="qErr"></div>
      <div class="modal-actions"><button type="button" class="btn" id="qBack" ${QW.busy?'disabled':''}>‹ Back</button><button class="btn primary big" id="qUp" ${QW.files.length&&!QW.busy?'':'disabled'}>⬆ Submit ${QW.files.length>1?QW.files.length+' files':'file'}</button></div>`;
  }
  if(st===4){
    body=`<div class="banner ok" style="font-size:16px;margin-bottom:14px">🎉 <b>Done! Your file has been received.</b> Keep this receipt — print it, save it as PDF or send it on WhatsApp.</div>
      ${QW.imp&&QW.imp.n?`<div class="banner ok" style="margin-bottom:14px">📊 ${QW.imp.n} record(s) were filled into your <b>${esc(FORMS[QW.imp.mod])}</b>.${QW.imp.errs&&QW.imp.errs.length?` ${QW.imp.errs.length} row(s) were skipped — the EMIS Office will follow up.`:''}</div>`:''}
      ${QW.imp&&QW.imp.err?`<div class="banner bad" style="margin-bottom:14px">Your file was received, but it could not be read into the portal: ${esc(QW.imp.err)}</div>`:''}
      ${QW.imp&&QW.imp.diff&&QW.imp.diff.length?`<div class="banner bad" style="margin-bottom:14px"><b>⚠ Your totals do not match the file</b><ul style="margin:6px 0 0 18px;padding:0">${QW.imp.diff.map(x=>`<li>${x}</li>`).join('')}</ul><div class="small" style="margin-top:4px">Add the missing rows to your Excel file and submit it again.</div></div>`:''}
      ${(QW.bad||[]).map(x=>acBox(x.ac,'Portal first review of '+x.name)+`<div style="margin:-4px 0 14px"><button type="button" class="btn sm primary" data-refix="${esc(x.id)}">⬆ Upload a corrected file now</button> <span class="small muted">It will replace ${esc(x.name)}. Otherwise the EMIS Office will review it with these findings.</span></div>`).join('')}
      ${qLoginHint()}
      ${receiptHTML(QW.receipt)}
      <div class="modal-actions no-print" style="flex-wrap:wrap"><button class="btn" id="qWa">Copy for WhatsApp</button><button class="btn" id="qPr">Print / Save as PDF</button><button class="btn" id="qAgain">Submit something else</button><button class="btn primary" onclick="closeModal()">Finish</button></div>`;
  }

  // wiring
  $$('[data-tpl]',el).forEach(b=>b.onclick=e=>{ e.stopPropagation(); b.dataset.fill?downloadTabTemplate(b.dataset.fill, QW.info&&QW.info.emis):dlTemplate(b.dataset.tpl); });
  $$('[data-qt]',el).forEach(c=>{ const go=()=>{ QW.task=QW.tasks.find(t=>t['Task ID']===c.dataset.qt); QW.step=2; drawWiz(); }; c.onclick=go; c.onkeydown=e=>{ if(e.key==='Enter') go(); }; });
  if($('#qBack')) $('#qBack').onclick=()=>{ QW.step--; if(QW.step===2){ QW.files=[]; } drawWiz(); };
  $$('[data-qh]',el).forEach(b=>b.onclick=()=>{ $$('[data-qh]',el).forEach(x=>x.classList.toggle('on',x===b)); });
  if(st===2) $('#qf').onsubmit=async e=>{
    e.preventDefault(); const b=$('#qGo'); b.disabled=true; b.innerHTML='<span class="spin"></span> Checking…'; $('#qErr').textContent='';
    const me={emis:$('#qE').value.trim(), phone:$('#qP').value.trim(), name:$('#qN').value.trim(), staffId:$('#qS').value.trim(), isHead:!$('[data-qh="0"].on')};
    try{ QW.info=await api('quickVerify',Object.assign({taskId:QW.task['Task ID']},me)); QW.ticket=QW.info.ticket; qwRemember(me); QW.step=3; drawWiz(); }

        if(ex&&!ex.includes(e)){ toast(`${f.name}: .${e} files are not accepted for this request.`,true); continue; }
        if(f.size>CONFIG.MAX_FILE_MB*1048576){ toast(`${f.name} is larger than ${CONFIG.MAX_FILE_MB} MB.`,true); continue; }

    d.ondrop=e=>{ e.preventDefault(); add(e.dataTransfer.files); };
    $$('[data-qrm]').forEach(a=>a.onclick=e=>{ e.preventDefault(); QW.files.splice(+a.dataset.qrm,1); QW.note=$('#qNote').value; drawWiz(); });
    $('#qNot').onclick=e=>{ e.preventDefault(); QW.step=2; QW.files=[]; drawWiz(); };

        const cell=$('#qs'+k); cell.innerHTML='<span class="spin"></span> sending…';
        try{ const data=await readB64(QW.files[k]); const f=QW.files[k]; if(f._ac===undefined) f._ac=await autoCheckFile(f,{emis:QW.info.emis, mod:QW.task['Fills Tab']});
          const r=await api('quickUpload',{ticket:QW.ticket,fileName:f.name,mimeType:f.type,data,note:QW.note,replaceId:k===0?QW.replaceId:undefined,autoCheck:(f._ac||{}).check||'', autoRemarks:((f._ac||{}).remarks||[]).join('\n')});
          if(r&&r['Submission ID']){ QW.ids.push(r['Submission ID']); if(f._ac&&f._ac.sev&&f._ac.sev!=='green') (QW.bad=QW.bad||[]).push({id:r['Submission ID'], name:f.name, ac:f._ac}); } cell.innerHTML='<span style="color:var(--green)">✓ sent</span>'; ok++; }
        catch(err){ cell.innerHTML=`<span style="color:var(--red)">✗ ${esc(err.message)}</span>`; }
      }
      QW.busy=false; QW.imp=null;
      const fill=QW.task['Fills Tab'];
      if(ok&&fill&&XL[fill]){ const xf=QW.files.find(f=>/\.(xlsx|xlsm|xls|csv)$/i.test(f.name));
        if(xf){ try{ const P=xlParse(fill, await xlRead(xf), QW.info.emis);
            if(P.rows.length){ const r=await api('quickImport',{ticket:QW.ticket, rows:P.rows.map(x=>Object.assign({},x,{Year:CONFIG.YEAR}))}); QW.imp={n:r.count, mod:fill, errs:P.errors};
              if(declared){ QW.imp.diff=declDiff(fill,declared,enteredOf(fill,P.rows)); } }
            else QW.imp={err:'No rows for your school were found in the file.'+(P.errors[0]?' '+P.errors[0]:'')};
          }catch(err){ QW.imp={err:err.message}; } } }
      if(!ok){ $('#qErr').textContent='Nothing was sent. Check the messages above and try again.'; $('#qUp').disabled=false; $('#qBack').disabled=false; return; }
      try{ QW.receipt=await api('quickFinish',{ticket:QW.ticket, ids:QW.ids, declared:QW.imp&&QW.imp.n?declared:undefined}); QW.step=4; drawWiz();
        if(ok<QW.files.length) toast(`${ok} of ${QW.files.length} files were sent. The receipt lists the ones received.`,true); }
      catch(err){ $('#qErr').textContent=err.message; }
    };
  }
  if(st===4){
    const r=QW.receipt, link=baseUrl()+'?receipt='+encodeURIComponent(r['Receipt No']);
    $('#qPr').onclick=()=>window.print();
    $('#qWa').onclick=()=>navigator.clipboard.writeText(`*Submission receipt ${r['Receipt No']}*\n${r.Form}\n${r['School Name']} · EMIS ${r['EMIS Code']}\n${parseSummary(r).map(([k,v])=>k+': '+v).join('\n')}\nSubmitted ${fmtDT(r['Submitted At'])}\nCheck: ${link}`).then(()=>toast('Copied — paste it into WhatsApp.'));

    $$('[data-refix]').forEach(b=>b.onclick=()=>{ QW.replaceId=b.dataset.refix; QW.files=[]; QW.bad=[]; QW.receipt=null; QW.imp=null; QW.step=3; drawWiz(); });

  }
}
const ST_LABEL={Submitted:'Waiting for review',Accepted:'Accepted',Rejected:'Returned — please correct'};

      <div><label class="f">School phone number</label><input class="inp big" id="stP" inputmode="tel" value="${esc(me.phone||'')}" placeholder="the number the EMIS Office has" required></div></div>
      <div class="err" id="stErr"></div>
      <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Close</button><button class="btn primary big" id="stGo">Show my files ›</button></div></form></div>`);

function drawStatus(r){
  const F=(r.files||[]).slice().sort((a,b)=>String(b['Submitted At']).localeCompare(String(a['Submitted At'])));

const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
const nk = h => String(h??'').toLowerCase().replace(/[^a-z0-9]/g,'');
const sval = v => v==null ? '' : (v instanceof Date ? v.toISOString().slice(0,10) : String(v).trim());
const phone10 = v => { let d=String(v??'').replace(/\D/g,''); if(d.length===9) d='0'+d; return d; };
function partsDate(y,m,d){
  const Y=parseInt(y); if(!Y) return '';
  let M=parseInt(m); if(isNaN(M)){ const i=MONTHS.findIndex(x=>x.startsWith(String(m||'').trim().toLowerCase().slice(0,3))); M=i>=0?i+1:1; }
  const D=parseInt(d)||1; return `${Y}-${String(M).padStart(2,'0')}-${String(D).padStart(2,'0')}`;
}
function cellDate(v){
  if(v==null||v==='') return '';
  if(v instanceof Date) return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  if(typeof v==='number'&&v>10000&&v<80000) return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  return parseDate(String(v))||'';
}
const sexOf = v => /^f/i.test(sval(v))?'Female':/^m/i.test(sval(v))?'Male':'';
function classCode(v){
  const t=sval(v).toLowerCase().replace(/[\s.]+/g,'');
  if(!t) return '';
  if(/^creche/.test(t)) return 'CRECHE';
  let m;
  if((m=t.match(/^(?:nursery|n)(\d)$/))) return 'N'+m[1];
  if((m=t.match(/^(?:kg|kindergarten)(\d)$/))) return 'KG'+m[1];
  if((m=t.match(/^(?:basic|b|primary|p|class)(\d)/))) return 'B'+m[1];
  if((m=t.match(/^(?:jhs|form)(\d)/))) return 'B'+(6+ +m[1]);
  if((m=t.match(/^shs(\d)/))) return 'SHS'+m[1];
  return CLASSES.some(c=>c[0]===sval(v).toUpperCase())?sval(v).toUpperCase():'';
}
function getter(row){ const m={}; Object.keys(row).forEach(k=>m[nk(k)]=row[k]); return (...names)=>{ for(const n of names){ const v=m[nk(n)]; if(v!=null&&v!=='') return v; } return ''; }; }

['Classrooms','Bungalows','BECE','Projects','Students','Transfers','SpecialNeeds','Scholarships'].forEach(mod=>{

        if(f.t==='date') v=cellDate(v); else if(f.k==='Sex') v=sexOf(v); else if(f.t==='num') v=v===''?'':num(v); else v=sval(v);

async function xlRead(file){
  if(!window.XLSX) throw new Error('The Excel reader did not load. Check your internet connection and refresh the page.');
  return XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
}
// find the sheet + header row that best matches the tab, then turn rows into records
function xlParse(mod, wb, forcedEmis, lenient){
  const spec=XL[mod]; let best=null;
  wb.SheetNames.forEach(n=>{ const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
    for(let i=0;i<Math.min(15,a.length);i++){ const h=a[i].map(sval), hs=h.map(nk); const score=spec.hints.filter(x=>hs.includes(nk(x))).length;
      if(score>=2&&(!best||score>best.score)) best={score,sheet:n,h,i,a}; } });
  if(!best) throw new Error(`This file does not look like the ${FORMS[mod]||mod} template — the column headings were not found. Download the template and copy your data into it.`);
  const out={sheet:best.sheet, rows:[], errors:[], byEmis:{}, raw:[], headers:best.h.filter(Boolean), score:best.score};
  best.a.slice(best.i+1).forEach((r,k)=>{
    const row={}; best.h.forEach((hh,j)=>{ if(hh) row[hh]=r[j]; });
    const g=getter(row), line=best.i+k+2;
    let rec; try{ rec=spec.map(g,row); }catch(e){ rec={_err:e.message}; }
    if(!rec) return;
    if(rec._err&&Object.keys(rec).length===1){ out.errors.push(`Row ${line}: ${rec._err}`); return; }
    const em=sval(g('School EMIS Code','EMIS Code','EMIS'));
    const emis=forcedEmis||em;
    if(forcedEmis&&em&&em!==String(forcedEmis)){
      if(lenient){ rec['EMIS Code']=String(forcedEmis); (out._other=out._other||[]).push({rec,line,em,row}); return; }
      out.errors.push(`Row ${line}: belongs to another school (EMIS ${em}) — skipped`); return; }
    if(!emis){ out.errors.push(`Row ${line}: no School EMIS Code`); return; }
    if(rec._err){ out.errors.push(`Row ${line}: ${rec._err}`); delete rec._err; if(mod!=='SchoolStaff') return; }
    rec['EMIS Code']=String(emis); out.rows.push(rec); out.raw.push({line,row}); (out.byEmis[emis]=out.byEmis[emis]||[]).push(rec);
  });
  // a school's own file where EVERY row carries a different EMIS code: the code was mistyped, so keep the rows.
  // If only some rows differ, they belong to other schools and are skipped.
  if(out._other){
    if(!out.rows.length){ out._other.forEach(o=>{ if(o.rec._err){ out.errors.push(`Row ${o.line}: ${o.rec._err}`); delete o.rec._err; } out.rows.push(o.rec); out.raw.push({line:o.line,row:o.row}); (out.byEmis[forcedEmis]=out.byEmis[forcedEmis]||[]).push(o.rec); }); out.warnEmis=out._other.length; }
    else out._other.forEach(o=>out.errors.push(`Row ${o.line}: belongs to another school (EMIS ${o.em}) — skipped`));
    delete out._other;
  }
  return out;
}

function rowsList(a){ if(a.length<=6) return a.join(', '); return a.slice(0,6).join(', ')+` and ${a.length-6} more`; }

function auditStaff(P, ctx){
  const R=[]; const add=(sev,text)=>R.push({sev,text});
  const bag={}; const hit=(key,line,extra)=>{ (bag[key]=bag[key]||{rows:[],ex:new Set()}).rows.push(line); if(extra!=null&&bag[key].ex.size<3) bag[key].ex.add(String(extra)); };
  const cols=STAFF_RULES.cols, L=STAFF_RULES.lists, D=STAFF_RULES.dep;
  const has=h=>P.headers.some(x=>nk(x)===nk(h));
  const seen={'Staff ID':{},'Ghana Card No.':{},'SSNIT No.':{},'NameDOB':{}};
  const thisYear=new Date().getFullYear();
  P.raw.forEach(({line,row})=>{
    const g=getter(row), v=h=>sval(g(h));
    // fixed values (drop-downs that must be one value for this collection)
    if(has('Academic Year')&&v('Academic Year')!==EXPECT['Academic Year']()) hit('year',line,v('Academic Year')||'blank');
    if(has('Term')&&normV(v('Term'))!==normV(EXPECT['Term']())) hit('term',line,v('Term')||'blank');
    if(has('MMDA')&&!MMDA_OK(v('MMDA'))) hit('mmda',line,v('MMDA')||'blank');
    if(has('Region')&&v('Region')&&!/ashanti/i.test(v('Region'))) hit('region',line,v('Region'));
    if(ctx.emis&&has('School EMIS Code')&&v('School EMIS Code')&&v('School EMIS Code')!==String(ctx.emis)) hit('emis',line,v('School EMIS Code'));
    // required
    const noId=has('Staff ID')&&!v('Staff ID')&&!v('Ghana Card No.');
    if(noId) hit('noid',line);
    REQUIRED_STAFF.forEach(h=>{ if(has(h)&&!v(h)&&!(noId&&h==='Ghana Card No.')) hit('req:'+h,line); });
    // drop-down values
    Object.keys(cols).forEach(h=>{ if(['Academic Year','Term','MMDA'].includes(h)) return; const x=v(h); if(!x) return;
      const ok=(L[cols[h]]||[]).some(o=>normV(o)===normV(x)); if(!ok) hit('dd:'+h,line,x); });
    // dependent drop-downs
    const lt=v('Level Taught'), ct=v('Classes Taught');
    if(lt&&ct){ const k='TL_'+lt.replace(/[ \/]/g,'_'); if(D[k]&&!ct.split(/\s*[,;]\s*/).every(c=>D[k].some(o=>normV(o)===normV(c)))) hit('dep:Classes Taught',line,ct); }
    [['Professional Qual Level','Highest Professional Qual'],['Academic Qual Level','Highest Academic Qual']].forEach(([lv,q])=>{ const a=v(lv), b=v(q); if(a&&b){ const k='QT_'+a.replace(/[ \/]/g,'_'); if(D[k]&&!D[k].some(o=>normV(o)===normV(b))) hit('dep:'+q,line,b); } });
    // ID formats
    Object.keys(ID_RULES).forEach(h=>{ let x=v(h); if(!x) return; if(/Phone/.test(h)){ const d=x.replace(/\D/g,''); if(d.length===9&&!x.startsWith('0')){ hit('zero:'+h,line,x); return; } x=d.length===x.replace(/[\s-]/g,'').length?d:x; }
      if(!ID_RULES[h].re.test(x.toUpperCase().replace(/\s/g,''))) hit('id:'+h,line,x); });
    // e-mail
    const em=v('Email Address');
    if(em){ const dom=(em.split('@')[1]||'').toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(em)) hit('mail',line,em);
      else if(EMAIL_TYPO[dom]) hit('mailtypo',line,`${em} → @${EMAIL_TYPO[dom]}`); }
    // duplicates inside the file
    ['Staff ID','Ghana Card No.','SSNIT No.'].forEach(h=>{ const x=v(h).toUpperCase().replace(/\s/g,''); if(!x) return; (seen[h][x]=seen[h][x]||[]).push(line); });
    const nd=normV([v('First Name'),v('Surname'),v('Birth: Year')].join('|')); if(v('First Name')) (seen.NameDOB[nd]=seen.NameDOB[nd]||[]).push(line);
    // dates and logic
    const by=parseInt(v('Birth: Year')), fy=parseInt(v('First Appt: Year')), py=parseInt(v('Posted: Year'));
    const bd=parseInt(v('Birth: Day')), bm=MONTHS.indexOf(normV(v('Birth: Month')));
    if(by&&bm>=0&&bd&&new Date(by,bm,bd).getMonth()!==bm) hit('baddate',line,`${bd} ${v('Birth: Month')} ${by}`);
    if(by){ const age=thisYear-by; if(age<18) hit('young',line,`${by}`); if(age>CONFIG.RETIRE_AGE) hit('old',line,`${by} (age ${age})`); }
    if(by&&fy&&fy<by+18) hit('appt',line,`born ${by}, appointed ${fy}`);
    if(fy&&py&&py<fy) hit('posted',line,`appointed ${fy}, posted ${py}`);
    const st=normV(v('Staff Status')), sc=normV(v('Main Schedule'));
    if(st==='teaching'&&sc==='support staff') hit('logic1',line);
    if(st==='non-teaching'&&sc==='classroom teaching') hit('logic2',line);
    if(sc==='classroom teaching'&&!v('Level Taught')) hit('nolevel',line);
    if(/jhs/i.test(lt)&&sc==='classroom teaching'&&!v('JHS Subjects')) hit('nosubj',line);
    if(normV(v('Has a Disability?'))==='yes'&&!v('Disability Type')) hit('dis',line);
    [['Disability Type','If Other: Specify Disability'],['Area of Specialization','If Other: Specify Area'],['Other Responsibility','If Other: Specify Responsibility'],['Highest Professional Qual','If Other: Specify Prof.'],['Highest Academic Qual','If Other: Specify Acad.']]
      .forEach(([a,b])=>{ if(/^other/i.test(v(a))&&!v(b)) hit('other:'+a,line); });
  });
  Object.entries(seen).forEach(([h,m])=>Object.entries(m).forEach(([x,ls])=>{ if(ls.length>1) hit(h==='NameDOB'?'dupname':'dup:'+h, ls.join(' & '), h==='NameDOB'?null:x); }));
  const T={ year:`Academic Year should be ${EXPECT['Academic Year']()}`, term:`Term should be ${EXPECT['Term']()}`, mmda:'MMDA should be Asante Akim North Municipal', region:'Region should be Ashanti Region',
    emis:`School EMIS Code differs from your school's code (${ctx.emis})`, noid:'no Staff ID and no Ghana Card number', mail:'e-mail address is not valid', mailtypo:'e-mail looks mistyped',
    baddate:'date of birth does not exist', young:'year of birth gives an age under 18', old:`year of birth gives an age over ${CONFIG.RETIRE_AGE} — should this person still be at post?`,
    appt:'first appointment before age 18', posted:'posted to this school before first appointment', logic1:'Staff Status is Teaching but Main Schedule is Support Staff',
    logic2:'Staff Status is Non-Teaching but Main Schedule is Classroom Teaching', nolevel:'Classroom Teaching but Level Taught is empty', nosubj:'JHS teacher without JHS Subjects',
    dis:'Has a Disability = Yes but Disability Type is empty', dupname:'same name and year of birth entered twice' };
  const label=k=>{ if(T[k]) return T[k]; const [a,h]=k.split(/:(.+)/);
    return a==='req'?`${h} is empty`:a==='dd'?`${h}: value not from the drop-down list`:a==='dep'?`${h} does not match the level chosen`:a==='id'?`${h}: wrong format (should be ${ID_RULES[h].eg})`
      :a==='zero'?`${h}: leading 0 missing (format the column as Text)`:a==='dup'?`${h} repeated`:a==='other'?`${h} is “Other” but not specified`:k; };
  const red=k=>/^(year|term|mmda|emis|dup|dupname|noid|baddate)/.test(k)||/^id:(Staff ID|Ghana Card)/.test(k)||/^req:(First Name|Surname|Sex|Staff Status)/.test(k);
  Object.entries(bag).sort((a,b)=>(red(b[0])-red(a[0]))||b[1].rows.length-a[1].rows.length).forEach(([k,o])=>{
    const ex=[...o.ex].filter(Boolean); add(red(k)?'red':'amber', `${label(k)} — row${o.rows.length>1?'s':''} ${rowsList(o.rows)}${ex.length?` (e.g. ${ex.map(x=>'“'+x+'”').join(', ')})`:''}`); });
  return R;
}
// check one Excel workbook against what the request expects
function autoCheck(wb, ctx){
  // which tab's template is this?
  let mod=ctx.mod&&XL[ctx.mod]?ctx.mod:null;
  if(!mod){ let best=0; Object.keys(XL).forEach(k=>{ try{ const P=xlParse(k,wb,ctx.emis,true); const sc=P.score||0; if(sc>best){ best=sc; mod=k; } }catch(e){} }); if(best<3) mod=null; }
  const cellsWithData=wb.SheetNames.reduce((a,n)=>a+XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}).flat().filter(x=>String(x).trim()!=='').length,0);
  if(!mod) return { check: cellsWithData<5?'Empty file':'Not checked', sev: cellsWithData<5?'red':'', remarks: cellsWithData<5?['The file is empty.']:[], rows:0 };
  let P; try{ P=xlParse(mod,wb,ctx.emis,true); }
  catch(e){ return { check:'Wrong file', sev:'red', remarks:[`This is not the ${FORMS[mod]||mod} template — the expected column headings were not found. Download the template from the portal and copy the data into it.`], rows:0, mod }; }
  if(!P.rows.length) return { check:'Empty template', sev:'red', remarks:[`The ${FORMS[mod]||mod} template was sent without any ${mod==='SchoolStaff'?'staff':'records'} entered (blank template).`], rows:0, mod };
  let items=[];
  if(mod==='SchoolStaff') items=auditStaff(P, ctx);
  P.errors.forEach(e=>items.push({sev:'amber',text:e}));
  if(mod==='Enrolment'){ const big=P.rows.filter(r=>r.Boys+r.Girls>90); if(big.length) items.push({sev:'amber',text:`very large class: ${big.map(r=>CLASS_LABEL(r.Class)+(r.Stream?' '+r.Stream:'')+' '+(r.Boys+r.Girls)).join(', ')}`}); }
  const n=items.length, nRed=items.filter(i=>i.sev==='red').length;
  const sum=mod==='SchoolStaff'?(()=>{ const t=P.rows.filter(r=>r.Category==='Teaching').length; return `${P.rows.length} staff (${t} teaching, ${P.rows.length-t} non-teaching)`; })():`${P.rows.length} record(s)`;
  return { check: n?`${n} issue${n>1?'s':''}`:'No issues', sev: nRed?'red':n?'amber':'green', remarks:[sum+'.',...items.map(i=>(i.sev==='red'?'❗ ':'• ')+i.text)], rows:P.rows.length, mod };
}
async function autoCheckFile(file, ctx){
  if(!/\.(xlsx|xlsm|xls|csv)$/i.test(file.name)||!window.XLSX) return null;
  try{ return autoCheck(await xlRead(file), ctx); }catch(e){ return { check:'Could not read', sev:'amber', remarks:['The portal could not open this Excel file: '+e.message], rows:0 }; }
}
const acPill = (c, sev) => c?`<span class="pill ${sev==='red'?'red':sev==='amber'?'amber':sev==='green'?'green':'grey'}" title="Portal first review">🔍 ${esc(c)}</span>`:'';
const acSev = c => !c?'':/wrong|empty|could not/i.test(c)?'red':/no issues/i.test(c)?'green':/issue/i.test(c)?'amber':'';
function acBox(res, heading){
  if(!res||!res.remarks||!res.remarks.length) return '';
  return `<div class="acbox ${res.sev||acSev(res.check)}"><div class="ach">🔍 <b>${esc(heading||'Portal first review')}:</b> ${esc(res.check)}</div><ul>${res.remarks.slice(0,14).map(r=>`<li>${esc(r)}</li>`).join('')}${res.remarks.length>14?`<li>…and ${res.remarks.length-14} more</li>`:''}</ul></div>`;
}

// download: the official template the Directorate attached, otherwise one the portal builds
async function downloadTabTemplate(mod, emis){
  if(mod==='Officers') return downloadOfficers([], (S.data&&S.data.office)||null, 'EDUCATION_OFFICERS_TEMPLATE.xlsx').catch(e=>toast(e.message,true));
  try{ const c=await api('publicTabTemplate',{module:mod}); if(c&&!c.none){ saveBlob(b64ToBlob(c.data,c.mime),c.name); toast('Template downloaded. Fill it in, save it, then upload it.'); return; } }catch(e){}
  if(!window.XLSX){ toast('The Excel tools did not load. Check your internet connection and refresh.',true); return; }
  const sch=emis?((S.data&&S.data.schools.find(s=>String(s['EMIS Code'])===String(emis)))||(S.user&&S.user.emis===emis?{'EMIS Code':emis,'School Name':S.user.name,Level:S.user.level}:null)):null;
  const spec=XL[mod], head=['School EMIS Code','School Name',...spec.cols], pre=[sch?sch['EMIS Code']:'', sch?sch['School Name']:''];
  let body=[];
  if(mod==='Enrolment'){ const lv=sch?levelsOf(sch):[]; body=CLASSES.filter(([,l])=>lv.length?lv.includes(l):l!=='SHS').map(([c])=>[...pre,CLASS_LABEL(c),'','','']); }
  else if(mod==='Furniture') body=FURN_ITEMS.map(i=>[...pre,i,'','','','']);
  else body=Array.from({length:40},()=>[...pre,...spec.cols.map(()=>'')]);
  const ws=XLSX.utils.aoa_to_sheet([head,...body]); ws['!cols']=head.map(h=>({wch:Math.max(12,String(h).length+2)})); ws['!freeze']={xSplit:2,ySplit:1};
  const help=[['HOW TO FILL — '+(FORMS[mod]||mod)],[''],['1. Fill one row per '+({Enrolment:'class or stream',Furniture:'item',SchoolStaff:'staff member'}[mod]||'record')+'.'],['2. Do not change the column headings in row 1.'],
    ['3. Keep the School EMIS Code on every row you fill.'],...(MODS[mod]&&MODS[mod].fields?MODS[mod].fields.filter(f=>f.t==='select').map(f=>[`${f.k}: choose one of — ${f.o.join(', ')}`]):[]),
    ...(mod==='Enrolment'?[['Class: KG 1, KG 2, B1 … B9 (JHS 1–3 = B7–B9), Creche, Nursery 1, Nursery 2. Add a row for each stream (A, B …).']]:[]),
    ['Dates: day/month/year, e.g. 14/03/2011.'],['4. Save the file, then upload it in the portal (Upload filled Excel, or Submit a file).']];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'DATA'); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(help),'HOW TO FILL');
  XLSX.writeFile(wb,`AAN_${(FORMS[mod]||mod).replace(/\W+/g,'_')}_TEMPLATE${sch?'_'+sch['EMIS Code']:''}.xlsx`);
  toast('Template downloaded. Fill it in, save it, then upload it.');
}
